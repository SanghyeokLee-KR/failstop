<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 03 시스템 구성</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ai: #C6C0F2;
    --ai-line: #8C84D0;
    --ok: #2DD196;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: radial-gradient(900px 600px at 40% 60%, rgba(121,167,250,.045), transparent 70%), var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; top: 150px; right: 130px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 52px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
  h1 .more { color: var(--ai); opacity: 0; transition: opacity .8s ease-out .5s; }
  .stage.out h1 .more { opacity: 1; }
  .tag { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-family: var(--sans); font-size: 22px; color: var(--ink-3); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; white-space: nowrap; cursor: pointer; transition: border-color .2s, color .2s; }
  .tag:hover { border-color: var(--card); color: var(--ink-2); }
  .tag:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .tag .mx { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* 최종 구성도 원본 보기 */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); }
  .fig::backdrop { background: rgba(8,10,15,.86); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .25s ease-out; }
  .fig .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 24px; font-size: 18px; color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); font-size: 19px; }
  .fig .bar .x { margin-left: auto; font-family: var(--sans); font-size: 17px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; }
  .fig .view { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 24px 24px; }
  .fig img { max-width: calc(100vw - 48px); max-height: calc(100vh - 80px); border-radius: 6px; background: #fff; cursor: zoom-in; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .fig.zoom .view { place-items: start; }
  .fig.zoom img { max-width: none; max-height: none; width: 2600px; cursor: zoom-out; }

  .dek { position: absolute; left: 130px; top: 218px; margin: 0; font-size: 23px; color: var(--ink-2); animation: fade .8s .3s ease-out both; }
  .legend {
    position: absolute; left: 130px; bottom: 52px;
    display: flex; gap: 36px; font-size: 22px; color: var(--ink-3);
  }
  .legend span { display: inline-flex; align-items: center; gap: 12px; }
  .legend svg { width: 44px; height: 10px; }

  svg.map { position: absolute; left: 0; top: 30px; width: 1920px; height: 1080px; }
  .zone { fill: none; stroke: #5A6B86; stroke-width: 1.5; stroke-dasharray: 3 8; }
  .zlbl { font-family: var(--sans); font-size: 22px; fill: var(--side); }
  .zlbl .m { font-family: var(--mono); font-size: 22px; fill: var(--ink-3); }
  .card { fill: rgba(255,255,255,.035); stroke: var(--card); stroke-width: 1.8; }
  .card.asg { fill: rgba(255,255,255,.02); }
  .tier { fill: none; stroke: #6A86BA; stroke-opacity: .75; stroke-width: 1.5; }
  .asgb { fill: rgba(121,167,250,.035); stroke: var(--brand); stroke-width: 1.6; stroke-dasharray: 7 6; }
  .notch { fill: var(--stage); }
  .tlbl { font-family: var(--sans); font-size: 22px; font-weight: 500; fill: var(--ink-2); }
  .tlbl .n { font-family: var(--mono); font-weight: 500; fill: var(--glow); }
  .albl { font-family: var(--sans); font-size: 22px; font-weight: 500; fill: var(--brand); }
  .card.ai { stroke: var(--ai-line); fill: rgba(198,192,242,.06); }
  .icon { fill: none; stroke: var(--glow); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .icon.ai { stroke: var(--ai); }
  .nm { font-family: var(--sans); font-size: 24px; font-weight: 600; fill: var(--ink); }
  .nm.c { text-anchor: middle; }
  .rl.c { text-anchor: middle; }
  .nm.ai { fill: var(--ai); }
  .rl { font-family: var(--sans); font-size: 22px; fill: var(--side); }
  .wire { fill: none; stroke: #6A86BA; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .wire.obs { stroke-dasharray: 4 7; stroke-opacity: .8; }
  .wire.ai { stroke: #A99FF0; stroke-dasharray: 12 7; stroke-width: 2.4; }
  .elbl { font-family: var(--sans); font-size: 22px; fill: var(--ink-3); }
  .elbl.ai { fill: #A9A2DE; }
  .elbl, .tlbl, .albl { paint-order: stroke; stroke: var(--stage); stroke-linejoin: round; }
  .elbl { stroke-width: 6px; } .tlbl, .albl { stroke-width: 8px; }
  .dot { fill: var(--glow); }

  .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s cubic-bezier(.45,.1,.2,1) forwards; }
  .wire.obs.draw, .wire.ai.draw { stroke-dasharray: none; }
  .show { opacity: 0; animation: fade .55s ease-out forwards; }

  /* 공개 장면: AI 서버와 범례의 'AI 판단 요청'은 온프레미스 틀과 함께 나타난다(처음 장면에서는 숨김) */
  #ai, .legend .lg-ai { opacity: 0; transition: opacity .7s ease-out 1s; }
  .stage.out #ai, .stage.out .legend .lg-ai { opacity: 1; }
  .later { opacity: 0; transition: opacity .7s ease-out 1s; }
  .stage.out .later { opacity: 1; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .draw { stroke-dashoffset: 0; } .show { opacity: 1; }
  }
</style>

<!-- 발표 노트(50초): → 한 번(장면 전환)은 노트 중간의 표시 지점에서 누른다. 역할마다 서버를 나눴다. 요청은 로드밸런서가 받아 거래 서버 1·2로 보낸다. 12개 마켓을 6개씩 나눠 거래 서버 1(BTC 등)과 2(ETH 등)가 각 마켓의 주문 순서를 정하는 리더를 맡고, 한 대가 멈추면 다른 한 대가 넘겨받는다. 조회가 몰리면 조회 서버가 Auto Scaling 그룹(0~1대)으로 붙는다(앱 계층 최소 2·최대 3). DB는 주 DB와 예비 DB 두 대이고, Patroni가 세 서버(주 DB·예비 DB·관제 서버)의 투표로 주 DB를 정해 자동 전환한다. 관제 서버는 관측·경보, 시장 봇(가상 거래자), 운영 보고를 맡는다. (→ 로 장면 전환) AI 판단은 AWS 밖 온프레미스 GPU 서버(DGX Spark, Ollama 로컬 LLM)에서 한다. 판단에 쓰는 지표를 외부 AI 서비스로 보내지 않기 위해서다. 단, 학교 AWS에서 보낸 Teams 보고의 요약은 Gemini였고, 판단 평가 수치(04-6)는 개발 PC RTX 4090에서 쟀다(질의 대비). 최종 구성도 버튼으로 전체 도면(v7)을 연다. 호스트명: 거래 서버 1·2 = app-1·app-2, 조회 서버 = app-3, 주·예비 DB = db-1·db-2, 관제 서버 = bot-1, AI 서버 = ai-1. -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  const fig = document.getElementById('fig');
  const closeFig = () => { fig.classList.remove('zoom'); if (fig.open) fig.close(); };
  document.getElementById('open-fig').addEventListener('click', e => { e.stopPropagation(); try { fig.showModal(); } catch (err) { fig.setAttribute('open', ''); } });
  document.getElementById('close-fig').addEventListener('click', e => { e.stopPropagation(); closeFig(); });
  document.getElementById('fig-img').addEventListener('click', e => { e.stopPropagation(); fig.classList.toggle('zoom'); });
  fig.addEventListener('click', e => { e.stopPropagation(); if (e.target === fig || e.target.classList.contains('view')) closeFig(); });
  fig.addEventListener('close', () => fig.classList.remove('zoom'));

  // 공개: 발표자가 → 를 누를 때만 AI 서버가 온프레미스로 옮겨 간다(저절로 넘어가지 않는다). ← 는 되돌림, R 은 처음부터.
  const out = () => stage.classList.contains('out');
  const reveal = () => stage.classList.add('out');
  const reset = () => stage.classList.remove('out');
  if (location.hash === '#last' || matchMedia('(prefers-reduced-motion: reduce)').matches) reveal();
  // 덱에서 → 는 공개, ← 는 되돌림. 더 넘길 단계가 없으면 false를 돌려 장을 넘긴다
  window.deckStep = d => { if (d > 0 && !out()) { reveal(); return true; } if (d < 0 && out()) { reset(); return true; } return false; };
  addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs();
    if (e.key === ' ' || e.key === 'ArrowRight') reveal();
    if (e.key === 'r' || e.key === 'R') reset();
  });
  stage.addEventListener('click', e => { if (e.target.id !== 'fs' && !e.target.closest('.tag') && !e.target.closest('dialog')) reveal(); });
})();
</script>
