name: ci-backend

# 백엔드 PR 게이트(하네스_CICD_IaC.md §2-2). ubuntu-latest는 Docker 내장이라 Testcontainers
# 무설정이고, ASCII 경로라 비ASCII 경로 + cp949 워커의 클래스패스 손상과
# 무관하게 gradlew build/test를 재현한다. 완료 게이트(gradlew build)의 재현 가능한 원천.
#
# 정본 §2-2의 paths는 구 모듈명(exchange-*)을 쓰지만 이 리포는 server/ 단일 트리(:engine·:app)라
# 실제 경로로 옮긴다. 코드가 정본과 어긋나면 정본을 먼저 고치는 원칙에 따라 후속 정본 개정 대상.
#
# observability 잡은 하네스 관측 산출물(prometheus 규칙·설정, grafana 대시보드)을 promtool·jq로
# 검증한다. paths가 워크플로 단위라 관측 산출물만 바뀐 PR도 build-test가 함께 돈다(빈도 낮아 수용).
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'harness/prometheus/**'
      - 'harness/grafana/dashboards/**'
      - '.github/workflows/ci-backend.yml'
  # main/develop push로도 돈다. cache-read-only가 main에서만 쓰기라, PR 전용 트리거로는 Gradle
  # 캐시가 영영 안 채워져 매 PR이 콜드 빌드가 된다. push(main)가 캐시를 채우고 PR이 읽는다.
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'harness/prometheus/**'
      - 'harness/grafana/dashboards/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # Testcontainers 통합테스트 포함, 폭주 시 상한
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 캐시는 setup-gradle 전담. PR은 읽기 전용(캐시 오염 방지, §2-2 캐시 규칙).
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 단위 + 통합(MigrationSmokeTest·InvariantVerifierIntegrationTest 포함). Testcontainers는
      # 러너 내장 Docker로 PG17을 기동한다. green = 완료 게이트 재현.
      # 정본 토폴로지(§2-1/§2-3)는 PR=단위+ArchUnit, main=integration(V3 T1~T6). 통합을
      # integration.yml(main)로 분리하려면 server 빌드에 integrationTest sourceSet·task가 선행한다.
      # 그 태스크가 서기 전까지는 build가 통합을 함께 돌려 완료 게이트를 유지한다.
      - run: ./gradlew build

  # 관측 산출물 게이트. 규칙 오타·깨진 대시보드는 빈 패널·불발 알람으로 조용히 실려 나가므로
  # 병합 전에 기계 검증한다. promtool은 컴포즈와 동일 핀(prom/prometheus:v3.13.0)의 도커
  # 이미지로 실행해 런타임과 같은 파서로 검사한다.
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # prometheus.yml의 rule_files가 /etc/prometheus/rules/*.yml 절대경로라, 컴포즈와 동일한
      # 마운트 형상(/etc/prometheus)으로 검사해야 규칙 파일 해석까지 함께 검증된다.
      # 이미지 기본 entrypoint가 prometheus 바이너리라 promtool은 entrypoint 교체로 실행한다.
      - name: promtool check config
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/harness/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.13.0
          check config /etc/prometheus/prometheus.yml

      - name: promtool check rules
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/harness/prometheus/rules:/etc/prometheus/rules:ro"
          prom/prometheus:v3.13.0
          check rules
          /etc/prometheus/rules/exchange-recording.yml
          /etc/prometheus/rules/exchange-alerts.yml

      # 규칙 문법 검사는 라벨 값을 보지 않는다. severity 이진 접기처럼 값 자체가 계약인
      # 규칙은 promtool 유닛 시험으로 별도로 고정한다. 시험 픽스처는 rules/ 글롭과
      # 충돌하지 않도록 tests/ 에 둔다. check config 와 같은 전체 디렉터리 마운트를 써서
      # 픽스처의 상대경로(../rules/exchange-alerts.yml)가 컨테이너 안에서도 그대로 풀리게 한다.
      - name: promtool test rules
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/harness/prometheus:/etc/prometheus:ro"
          prom/prometheus:v3.13.0
          test rules
          /etc/prometheus/tests/exchange-alerts.test.yml

      # 대시보드 JSON 최소 sanity: 유효 JSON + 최상위 panels 비어있지 않음. jq는 러너 내장.
      - name: grafana dashboards sanity
        run: |
          for f in harness/grafana/dashboards/*.json; do
            jq -e '(.panels | type) == "array" and (.panels | length) > 0' "$f" > /dev/null \
              || { echo "invalid dashboard: $f"; exit 1; }
            echo "ok: $f"
          done

      # 중복 키 검출. jq는 중복을 마지막 값으로 조용히 접어 위 검사를 통과시킨다. 실측
      # (2026-08-30): 패널 설명을 고치면서 옛 키를 지우지 않아 새 설명이 런타임에서
      # 버려졌는데 jq 검사와 Grafana 적재 모두 통과했다. 무음 소실이라 화면을 봐야만
      # 드러난다. 파서 수준에서 막는다.
      - name: grafana dashboards duplicate keys
        run: |
          python3 - <<'PY'
          import collections, glob, json, sys
          bad = 0
          def no_dup(pairs):
              dups = [k for k, n in collections.Counter(k for k, _ in pairs).items() if n > 1]
              if dups:
                  raise ValueError('duplicate keys: ' + ', '.join(dups))
              return dict(pairs)
          for f in sorted(glob.glob('harness/grafana/dashboards/*.json')):
              try:
                  json.load(open(f, encoding='utf-8'), object_pairs_hook=no_dup)
                  print('ok:', f)
              except ValueError as e:
                  print('FAIL:', f, e)
                  bad = 1
          sys.exit(bad)
          PY
