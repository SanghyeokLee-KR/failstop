name: image

# 배포용 컨테이너 이미지를 빌드해 GHCR에 올린다. 기획안 §10.6 워크플로 4종 중 이미지 빌드다.
#
# 왜 ci-backend.yml과 분리하는가. 그쪽은 빌드 검증이 목적이고 산출물을 남기지 않는다.
# 이 워크플로는 배포 대상을 만든다. 검증이 통과한 커밋만 이미지가 되도록 workflow_run으로
# 잇는다. 같은 잡에 합치면 검증 실패 커밋도 이미지가 올라간다.
#
# 왜 멀티 아키텍처인가. 배포 대상이 t4g 계열(AWS Graviton, ARM64)이다. amd64만 빌드하면
# EC2에서 exec format error로 컨테이너가 뜨지 않는다. 로컬 개발은 amd64라 둘 다 필요하다.
# app.jar는 아키텍처 독립이므로 차이는 베이스 이미지 레이어뿐이다.
# eclipse-temurin:21-jre가 amd64와 arm64/v8을 모두 낸다(실측 확인).

on:
  workflow_run:
    workflows: ["ci-backend"]
    types: [completed]
    branches: [main]
  # 수동 재빌드. 태그를 잃었거나 베이스 이미지 CVE 패치를 얹을 때 쓴다.
  workflow_dispatch:

concurrency:
  # 같은 브랜치의 이전 빌드를 취소한다. 이미지는 최신 커밋 것만 의미가 있다.
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # 선행 게이트. ci-backend가 실패한 커밋은 이미지로 만들지 않는다.
    # workflow_dispatch는 conclusion이 비어 있으므로 그 경우도 통과시킨다.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run은 기본이 기본 브랜치 HEAD라 트리거한 커밋을 명시해야 한다.
          # 이걸 빠뜨리면 검증한 커밋과 다른 코드로 이미지가 만들어진다.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # bootJar만 만든다. 테스트는 ci-backend가 이미 돌렸고 여기서 또 돌리면
      # 같은 커밋에 testcontainers가 두 번 뜬다.
      - name: build jar
        working-directory: server
        run: ./gradlew :app:bootJar --no-daemon

      # Dockerfile.app이 빌드 컨텍스트에 app.jar를 요구한다(COPY app.jar app.jar).
      # 컨텍스트를 harness/로 두므로 그 자리에 놓는다.
      - name: stage jar into build context
        run: |
          set -e
          jar=$(ls server/app/build/libs/*.jar | grep -v -- '-plain.jar$' | head -1)
          test -n "$jar" || { echo "::error::bootJar 산출물이 없다"; exit 1; }
          cp "$jar" harness/app.jar
          ls -la harness/app.jar

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/exchange-app
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: harness
          file: harness/Dockerfile.app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 배포는 태그가 아니라 digest로 고정한다. 태그는 재푸시로 내용이 바뀌어
      # 롤백 대상이 확정되지 않는다. deploy/.env의 APP_IMAGE에 이 값을 넣는다.
      - name: report digest
        run: |
          echo "### 배포용 이미지" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "APP_IMAGE=ghcr.io/${{ github.repository }}/exchange-app@${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # 멀티 아키텍처가 실제로 들어갔는지 확인한다. 한쪽만 올라가면 t4g에서
      # exec format error가 나는데 그 시점에는 이미 배포 중이다.
      - name: verify both architectures
        run: |
          set -e
          ref="ghcr.io/${{ github.repository }}/exchange-app@${{ steps.push.outputs.digest }}"
          got=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | python3 -c "import sys,json; m=json.load(sys.stdin); print(' '.join(sorted(x['platform']['architecture'] for x in m.get('manifests',[]) if x['platform']['os']=='linux')))")
          echo "아키텍처: $got"
          case "$got" in
            *amd64*) ;;
            *) echo "::error::amd64 매니페스트가 없다"; exit 1 ;;
          esac
          case "$got" in
            *arm64*) ;;
            *) echo "::error::arm64 매니페스트가 없다. t4g 노드에서 기동하지 않는다"; exit 1 ;;
          esac
