name: style-gate

on:
  pull_request:
    branches: [main, develop]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR 베이스 ref를 원격 추적 브랜치로 확정한다. fetch-depth:0만으로 origin/<base>가 안 잡히는
      # 러너 상태를 방어(게이트는 병합 차단이라 diff 기준점이 반드시 서야 한다).
      - name: fetch base ref
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      # PR에서 추가된 줄만 검사한다. 기존 문서는 순차 정리 대상(하네스_CICD_IaC.md 스타일 게이트 절).
      - name: collect added lines
        run: |
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" \
            -- . ':!*.html' ':!*.pdf' ':!*.svg' ':!*.lock' ':!*.jar' ':!package-lock.json' \
               ':!**/node_modules/**' ':!web/out/**' ':!web/.next/**' \
            | grep '^+' | grep -v '^+++' > added.txt || true
          wc -l added.txt

      - name: forbid dashes (U+2014, U+2013)
        run: |
          if grep -nP '\x{2014}|\x{2013}' added.txt; then
            echo "금지 문자 발견: em dash 또는 en dash. 쉼표나 마침표로 나눌 것."
            exit 1
          fi

      - name: forbid emoji
        run: |
          if grep -nP '[\x{1F000}-\x{1FAFF}]|[\x{2600}-\x{27BF}]|[\x{FE0F}]' added.txt; then
            echo "금지: 이모지."
            exit 1
          fi

      - name: forbid AI phrases and tool signatures
        run: |
          # 규칙 정의 파일은 금지 문구를 예시로 인용하므로 이 단계에서만 제외한다.
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" \
            -- . ':!*.html' ':!*.pdf' ':!*.svg' ':!*.lock' ':!*.jar' ':!package-lock.json' \
               ':!**/node_modules/**' ':!web/out/**' ':!web/.next/**' \
               ':!CLAUDE.md' ':!.github/CONTRIBUTING.md' ':!.github/PULL_REQUEST_TEMPLATE.md' \
               ':!.github/workflows/style.yml' ':!scripts/check-style.ps1' \
            | grep '^+' | grep -v '^+++' > added_phrase.txt || true
          if grep -nE 'Generated with|Co-Authored-By: Claude|물론입니다|해 드리겠습니다|드리겠습니다!|Here is the (completed|finalized|final) document|Now writing the completed|I hope this helps|Let me know if you|Certainly!' added_phrase.txt; then
            echo "금지: AI 어투 또는 도구 서명."
            exit 1
          fi

      - name: check commit messages
        run: |
          git log --format=%B "origin/${{ github.base_ref }}..HEAD" > commits.txt
          if grep -nP '\x{2014}|\x{2013}|[\x{1F000}-\x{1FAFF}]|[\x{2600}-\x{27BF}]' commits.txt; then
            echo "커밋 메시지에 금지 문자."
            exit 1
          fi
          # 규칙 3·6·7은 커밋 메시지에도 적용된다. 문구 검사를 추가한 줄 검사와 동일 패턴으로 강제한다.
          if grep -nE 'Generated with|Co-Authored-By: Claude|물론입니다|해 드리겠습니다|드리겠습니다!|Here is the (completed|finalized|final) document|Now writing the completed|I hope this helps|Let me know if you|Certainly!' commits.txt; then
            echo "커밋 메시지에 AI 어투 또는 도구 서명."
            exit 1
          fi
