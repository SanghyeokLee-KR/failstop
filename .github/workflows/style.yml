name: style-gate

on:
  pull_request:
    branches: [main, develop]

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR 베이스 ref를 원격 추적 브랜치로 확정한다. fetch-depth:0만으로 origin/<base>가 안 잡히는
      # 러너 상태를 방어(게이트는 병합 차단이라 diff 기준점이 반드시 서야 한다).
      - name: fetch base ref
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      # PR에서 추가된 줄만 검사한다. 기존 문서는 순차 정리 대상(하네스_CICD_IaC.md 스타일 게이트 절).
      - name: collect added lines
        run: |
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" \
            -- . ':!*.html' ':!*.pdf' ':!*.svg' ':!*.lock' ':!*.jar' ':!package-lock.json' \
               ':!**/node_modules/**' ':!web/out/**' ':!web/.next/**' ':!docs/archive/**' \
            | grep '^+' | grep -v '^+++' > added.txt || true
          wc -l added.txt

      - name: forbid dashes (U+2014, U+2013)
        run: |
          if grep -nP '\x{2014}|\x{2013}' added.txt; then
            echo "금지 문자 발견: em dash 또는 en dash. 쉼표나 마침표로 나눌 것."
            exit 1
          fi

      - name: forbid emoji
        run: |
          if grep -nP '[\x{1F000}-\x{1FAFF}]|[\x{2600}-\x{27BF}]|[\x{FE0F}]' added.txt; then
            echo "금지: 이모지."
            exit 1
          fi

      - name: forbid AI phrases and tool signatures
        run: |
          # 규칙 정의 파일은 금지 문구를 예시로 인용하므로 이 단계에서만 제외한다.
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" \
            -- . ':!*.html' ':!*.pdf' ':!*.svg' ':!*.lock' ':!*.jar' ':!package-lock.json' \
               ':!**/node_modules/**' ':!web/out/**' ':!web/.next/**' ':!docs/archive/**' \
               ':!CLAUDE.md' ':!.github/CONTRIBUTING.md' ':!.github/PULL_REQUEST_TEMPLATE.md' \
               ':!.github/workflows/style.yml' ':!scripts/check-style.ps1' \
            | grep '^+' | grep -v '^+++' > added_phrase.txt || true
          if grep -nE 'Generated with|Co-Authored-By: Claude|물론입니다|해 드리겠습니다|드리겠습니다!|Here is the (completed|finalized|final) document|Now writing the completed|I hope this helps|Let me know if you|Certainly!' added_phrase.txt; then
            echo "금지: AI 어투 또는 도구 서명."
            exit 1
          fi

      - name: check commit messages
        run: |
          git log --format=%B "origin/${{ github.base_ref }}..HEAD" > commits.txt
          if grep -nP '\x{2014}|\x{2013}|[\x{1F000}-\x{1FAFF}]|[\x{2600}-\x{27BF}]' commits.txt; then
            echo "커밋 메시지에 금지 문자."
            exit 1
          fi
          # 규칙 3·6·7은 커밋 메시지에도 적용된다. 문구 검사를 추가한 줄 검사와 동일 패턴으로 강제한다.
          if grep -nE 'Generated with|Co-Authored-By: Claude|물론입니다|해 드리겠습니다|드리겠습니다!|Here is the (completed|finalized|final) document|Now writing the completed|I hope this helps|Let me know if you|Certainly!' commits.txt; then
            echo "커밋 메시지에 AI 어투 또는 도구 서명."
            exit 1
          fi

  # 문서 링크 게이트도 전체 상태를 본다. 이동으로 깨진 인용은 추가된 줄이 아니라
  # "인용과 실재가 어긋난 현재 상태"다. 규약은 하네스_CICD_IaC.md 부록 U.
  doclinks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 로컬 검사와 같은 호출로 고정한다. -File은 스크립트 종료코드를 그대로 넘긴다.
      - name: check doc links
        run: pwsh -NoProfile -File scripts/check-doclinks.ps1
      - name: check document structure and AI entrypoints
        run: pwsh -NoProfile -File scripts/check-docs.ps1
      - name: test document checker
        run: pwsh -NoProfile -File scripts/tests/check-docs.Tests.ps1
      - name: check current architecture review
        run: pwsh -NoProfile -File scripts/check-adr-current.ps1
      - name: test current architecture checker
        run: pwsh -NoProfile -File scripts/tests/check-adr-current.Tests.ps1

  # 토큰 게이트는 diff가 아니라 전체 상태를 본다. 드리프트는 추가된 줄이 아니라
  # "선언과 소비가 어긋난 현재 상태"라서 범위가 다르다.
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: check design tokens
        run: node scripts/check-tokens.mjs
      # 카피 종결형 규칙은 평면마다 다르다(관리 콘솔 합니다체, 그 밖 명사형). 규칙 자체를 따로 시험한다
      - name: test copy tone rule
        run: node --test scripts/tests/copy-tone.test.mjs

  # 브라우저 게이트는 계산된 스타일과 배치를 본다. 토큰 게이트가 값과 소비 규칙을 정적으로
  # 지키는 동안에도 통과해버린 회귀가 있었다. 실제 렌더가 아니면 안 보이는 종류다.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # playwright 설치 훅이 chromium·firefox·webkit을 전부 받는다. 게이트는 chromium만 쓰므로
      # 훅을 끄고 다음 단계에서 하나만 받는다
      - name: install deps
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci
      - name: install chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      # 스크립트가 dev 서버를 직접 띄우고 끝나면 죽인다. 별도 기동 단계가 필요 없다
      - name: check browser invariants
        run: node scripts/check-browser.mjs
