name: ci-operations

on:
  pull_request:
    paths: ['deploy/**', 'harness/cstats/**', 'harness/grafana/dashboards/**', 'harness/prometheus/pg-queries.yaml', '.github/workflows/ci-operations.yml']
  push:
    branches: [main, 'codex/docs-linux-operations']
    paths: ['deploy/**', 'harness/cstats/**', 'harness/grafana/dashboards/**', 'harness/prometheus/pg-queries.yaml', '.github/workflows/ci-operations.yml']

permissions:
  contents: read

concurrency:
  group: ci-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF report runtime
        run: |
          python -m pip install -r deploy/reporting/requirements-test.txt
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Reporting, deployment and recovery checks
        run: |
          python -W error::ResourceWarning -m unittest discover -s deploy/reporting -p 'test_*.py' -v
          python -m unittest discover -s deploy/tests -p 'test_*.py' -v
          python -m unittest discover -s deploy/observability/tests -p 'test_*.py' -v
          python -m unittest discover -s deploy/backup -p test_backup.py -v
          python -m unittest discover -s deploy/lab -p 'test_*.py' -v
          python -m unittest discover -s deploy/linux/tests -p 'test_*.py' -v
          python -W error::ResourceWarning -m unittest discover -s deploy/console -p 'test_*.py' -v
          node --test deploy/console/test_ui.mjs
          bash deploy/linux/tests/test-linux.sh
      - name: Linux and missing-data alert rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/deploy/observability:/observability:ro"
          prom/prometheus:v3.13.0 test rules /observability/tests/linux-operations.test.yml
      - name: Teams routing configuration
        run: >-
          docker run --rm --entrypoint amtool
          -v "$PWD/deploy/observability:/observability:ro"
          prom/alertmanager:v0.34.0 check-config /observability/alertmanager.yml
      - name: Report query semantics
        run: |
          PYTHONPATH=deploy/reporting python -c 'import json; from test_scope import http_query_cases; print(json.dumps(http_query_cases()))' |
            docker run --rm -i --entrypoint promtool prom/prometheus:v3.13.0 test rules /dev/stdin
      - name: Grafana customer query semantics
        run: |
          PYTHONPATH=deploy/observability/tests python -c 'import json; from test_msp_queries import semantic_cases; print(json.dumps(semantic_cases()))' |
            docker run --rm -i --entrypoint promtool prom/prometheus:v3.13.0 test rules /dev/stdin
      - name: PostgreSQL metric semantics and exporter integration
        run: python deploy/observability/tests/test_pg_ops_metrics.py --docker docker -v
      - name: AWS target discovery alert rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/deploy/terraform:/terraform:ro"
          prom/prometheus:v3.13.0 check rules /terraform/discovery-alerts.yml

  infrastructure-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.9'
      - run: terraform -chdir=deploy/terraform fmt -check -recursive
      - run: terraform -chdir=deploy/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform validate
      - run: terraform -chdir=deploy/terraform test -no-color
      - run: python3 -m unittest discover -s deploy/terraform/tests -p test_bootstrap.py -v
      - run: node --test deploy/terraform/tests/static-routes.test.cjs
