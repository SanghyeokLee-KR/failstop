name: exchange-chaos

# 격리 다중 노드 토폴로지. 데모 스택과 컨테이너명·포트·볼륨·네트워크가 전부 분리된다.
# app→toxiproxy→postgres 상시 경유(E2 노드별 단절 주입점). api-1 리더/api-2 스탠바이가
# 동일 DB의 leader_lease를 경쟁한다. 봇 플릿은 엔진을 끈 별도 노드(외부 관점 관찰 주체).

x-app-image: &app-image ${CHAOS_APP_IMAGE:-exchange-chaos-app:local}

services:
  chaos-pg:
    image: postgres:17-alpine
    container_name: chaos-pg
    environment:
      POSTGRES_DB: ${CHAOS_PG_DB:-exchange}
      POSTGRES_USER: ${CHAOS_PG_USER:-exchange}
      POSTGRES_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
    # 좀비 커넥션이 leader_lease 행 잠금을 쥐면 승격이 막힌다(E2 실측). pause·disconnect는 RST를
    # 남기지 않아 기본값으로는 회수되지 않으므로 두 축을 함께 조인다. 사건 전말은 ADR 0004.
    command:
      - "postgres"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "idle_in_transaction_session_timeout=10s"
      - "-c"
      - "tcp_keepalives_idle=5"
      - "-c"
      - "tcp_keepalives_interval=2"
      - "-c"
      - "tcp_keepalives_count=3"
      # 노드마다 요청·리스·append 풀을 다 쥔 합이 ADR 0022 4단계(append 14)에서 기본 100 을 넘는다.
      # API 2x(32+2+14) + 봇 26 + chaos-admin 32 + exporter·표본기 6 = 160 에 예약 3과 대시보드 여유를 둔다.
      # scale 프로파일의 chaos-api-3 까지 풀 상한으로 세면 208 로 이 값을 넘는다. api-3 은 엔진이 꺼져 append
      # 풀로 접수하지 않으므로 그 몫을 헬스 검사가 여는 최소 유휴 2 로 세면 196 이다. 산식과 한계는 검증설계 §3.
      - "-c"
      - "max_connections=200"
    ports: ["55432:5432"]
    # 기본 64MiB 는 병렬 질의 워커의 공유 메모리에 모자란다. 데이터가 쌓인 뒤 하네스 불변식
    # 배치가 "could not resize shared memory segment ... No space left on device" 로 터졌다
    # (2026-09-23, trades 13만 행). 그 실패는 E4 의 사전 권위 run 을 막아 실험 자체를 세운다.
    shm_size: 256m
    volumes: ["chaos-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAOS_PG_USER:-exchange} -d ${CHAOS_PG_DB:-exchange}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [chaos-net]

  chaos-toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: chaos-toxiproxy
    ports: ["58474:8474"]     # admin API. 격리 스택이라 실험 스크립트 주입용으로 호스트 노출
    depends_on:
      chaos-pg: { condition: service_healthy }
    networks: [chaos-net]

  chaos-toxiproxy-init:
    image: curlimages/curl:8.11.0
    container_name: chaos-toxiproxy-init
    depends_on: [chaos-toxiproxy]
    volumes: ["./toxiproxy/populate.json:/populate.json:ro"]
    command: ["sh", "-c",
      "for i in $(seq 1 30); do curl -sf -XPOST chaos-toxiproxy:8474/populate -d @/populate.json && exit 0; sleep 1; done; exit 1"]
    restart: "no"
    networks: [chaos-net]

  # 리더 리스 보관소(2026-09-08). 거래 데이터는 chaos-pg 에 그대로 있고 리스 한 항목만 여기 있다.
  # 왜 갈랐나. 리스가 leader_lease 행이면 갱신이 곧 커밋이고, chaos-pg 는 synchronous_commit=on 이라
  # 동기 대상 standby 를 전부 잃으면 그 커밋이 멈춘다. 갱신이 함께 멈춰 리스가 만료되고, 커밋이
  # 풀리는 순간 fencing 이 리더를 끌어내렸다(harness/evidence/replication-fault-20260908/).
  # inMemory 로 띄운다. 리스는 재기동을 넘겨 보존할 값이 아니고, 컨테이너가 사는 동안만 유지되면
  # 된다. sharedDb 는 자격 증명별로 DB 파일이 갈리는 기본 동작을 끈다. 노드마다 다른 파일을 보면
  # 전원이 자기를 리더로 믿는다.
  chaos-dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: chaos-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    healthcheck:
      # 이 이미지에 curl 이 있다(확인함). 응답 코드는 400 이고 그것이 곧 살아 있다는 뜻이다.
      # DynamoDB 는 서명 없는 GET 을 거절하는데, 거절이 돌아온다는 것 자체가 준비 완료다.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000 && exit 0 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [chaos-net]

  chaos-api-1:
    image: *app-image
    container_name: chaos-api-1
    environment: &api-env
      # chaos-monkey 프로파일이 E8 assault 주입기(actuator /chaosmonkey)와 CB 프로브 평면을 로드한다.
      # 격리 chaos 스택 서빙 노드 한정. 데모(dev,bots)·prod·봇 노드는 이 프로파일을 활성화하지 않는다.
      # 운영 풀 상한(lock_timeout 2초·statement_timeout 3초)으로 돌리려면 CHAOS_SPRING_PROFILES 에
      # dev,chaos-monkey,prod-timeouts 를 준다(ADR 0034 S1). 비우면 dev,chaos-monkey 다(application.yml prod-timeouts 문서).
      SPRING_PROFILES_ACTIVE: ${CHAOS_SPRING_PROFILES:-dev,chaos-monkey}
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-toxiproxy:15432/exchange
      SPRING_DATASOURCE_USERNAME: ${CHAOS_PG_USER:-exchange}
      SPRING_DATASOURCE_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
      SPRING_FLYWAY_ENABLED: "true"
      EXCHANGE_HARNESS_ENABLED: "true"
      EXCHANGE_ENGINE_ENABLED: "true"
      EXCHANGE_ENGINE_LEASE_TTL: ${CHAOS_LEASE_TTL:-6s}
      EXCHANGE_ENGINE_LEASE_TICK_INTERVAL: ${CHAOS_LEASE_TICK:-2s}
      EXCHANGE_AUTH_MASTER_KEY_BASE64: ${CHAOS_MASTER_KEY_BASE64}
      # 서빙 노드는 dev 프로파일이라 주문 버킷이 계약 기본(100토큰/10s=20req/10s)이다. chaos-bots
      # 플릿은 계정당 다봇 고빈도라 이 한도에 429로 걸려 파킹되고, 카오스 중 부하 생성·자동 복구
      # 관찰이 무력화된다. 실험 부하 유지를 위해 서빙 노드의 주문 capacity를 상향한다(격리 스택 한정).
      EXCHANGE_ORDER_RATE_LIMIT_CAPACITY: "100000"
      # 공개 조회 IP 버킷(API 설계 §2-5)도 같은 사유로 상향한다. chaos-lb가 XFF를 붙이지 않아
      # LB 경유 트래픽 전량이 한 IP 버킷에 합류한다. 봇의 시장 데이터 조회는 계정 버킷으로
      # 우회되지 않아, 계약 기본 300토큰/10s면 앵커 조회가 상시 무효가 되고 실험 부하가 사라진다.
      EXCHANGE_PUBLIC_RATE_LIMIT_CAPACITY: "100000"
      # dev 기본 Hikari 풀 10은 E1 지연 주입에서 고갈돼 리더 리스 갱신까지 굶기고, 그러면 E1의
      # 비페일오버 전제가 깨진다. 서빙 노드 풀을 prod급으로 올려 §3 E1 기대대로 거동시킨다
      # (격리 스택 한정).
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "32"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "8"
      # 리더 리스 보관소. 기본은 postgres 라 종전 실험(e1~e9)의 조건이 그대로다. dynamodb 로
      # 켜려면 CHAOS_LEASE_PROVIDER=dynamodb 를 준다. 좌표는 코드에 없고 여기서만 들어온다.
      EXCHANGE_LEADER_LEASE_PROVIDER: ${CHAOS_LEASE_PROVIDER:-postgres}
      EXCHANGE_LEADER_LEASE_ENDPOINT: ${CHAOS_LEASE_ENDPOINT:-http://chaos-dynamodb:8000}
      EXCHANGE_LEADER_LEASE_REGION: ${CHAOS_LEASE_REGION:-ap-northeast-2}
      EXCHANGE_LEADER_LEASE_TABLE: ${CHAOS_LEASE_TABLE:-exchange-leader-lease}
      EXCHANGE_LEADER_LEASE_CLUSTER_ID: ${CHAOS_LEASE_CLUSTER_ID:-exchange-chaos}
      # 로컬 전용. 운영은 거짓으로 두고 테이블을 미리 만든다. 참이면 앱 롤에 CreateTable 이 필요하다.
      EXCHANGE_LEADER_LEASE_CREATE_TABLE_IF_MISSING: "true"
      # DynamoDB Local 은 서명만 검사하고 값은 보지 않는다. 실제 자격 증명이 아니다.
      AWS_ACCESS_KEY_ID: ${CHAOS_LEASE_ACCESS_KEY:-local}
      AWS_SECRET_ACCESS_KEY: ${CHAOS_LEASE_SECRET_KEY:-local}
    ports: ["18080:8080"]
    depends_on:
      chaos-pg: { condition: service_healthy }
      chaos-toxiproxy-init: { condition: service_completed_successfully }
      chaos-dynamodb: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1g, cpus: "1.0" } } }
    networks: [chaos-net]

  chaos-api-2:
    image: *app-image
    container_name: chaos-api-2
    environment:
      <<: *api-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-toxiproxy:25432/exchange
      SPRING_FLYWAY_ENABLED: "false"     # 마이그레이션은 api-1 단독. 스키마 확정 후 기동
    ports: ["28080:8080"]
    depends_on:
      chaos-api-1: { condition: service_healthy }
    # 스탠바이는 liveness로 판정한다. 팔로워는 설계상 readiness가 REFUSING_TRAFFIC(503)이라
    # readiness로 보면 정상 스탠바이가 영구 unhealthy가 되어 compose up --wait가 실패한다.
    # 컨테이너 기동 여부(프로세스 생존)와 트래픽 수용 여부(리더인가)는 다른 질문이다.
    # api-1은 readiness를 유지한다. 그 healthy가 flyway 완료·리더 승격을 보장해 api-2 기동을 순서 짓는다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1g, cpus: "1.0" } } }
    networks: [chaos-net]

  # 조회 전용 증설 노드. 조절기가 붙였다 뗀다. 기본 기동에 없다(profiles: scale).
  #
  # 엔진과 flyway를 끄는 것이 조회 전용의 성립 조건이다. 엔진을 켠 채 띄우면 기동 시
  # 리더 승격을 시도하고 리스 TTL만큼 소진한 뒤 거부당한다. 마이그레이션도 api-1 단독이다.
  #
  # 토식을 지나지 않는다. 이 노드는 카오스 주입 대상이 아니라 용량 시연 대상이다.
  # 토식을 태우면 DB 차단 실험이 증설 노드까지 끊어 두 실험이 서로를 깬다.
  #
  # AWS 조회 노드의 설정(prod,read 프로파일, ReadRoleFilter, 읽기 전용 풀 8 과 보조 풀 각 1)은 켜지 않았다.
  # api-1 환경을 물려받아 dev,chaos-monkey 프로파일과 풀 32/8, append 14, 리스 2 로 뜬다. LB 는 조회 경로만
  # 보내지만 38080 으로 직접 온 조회 밖 요청을 필터가 막지 않는다(주문은 엔진이 꺼져 저널 전에 503 이다).
  # 2026-09-23 증설 측정이 이 구성이라 바꾸면 그 측정과 조건이 달라진다.
  chaos-api-3:
    image: *app-image
    container_name: chaos-api-3
    environment:
      <<: *api-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-pg:5432/exchange
      SPRING_FLYWAY_ENABLED: "false"
      EXCHANGE_ENGINE_ENABLED: "false"
      EXCHANGE_HARNESS_ENABLED: "false"
    ports: ["38080:8080"]
    depends_on:
      chaos-api-1: { condition: service_healthy }
    # 조회 전용은 설계상 readiness가 REFUSING_TRAFFIC(503)이라 api-2와 같은 규약으로 liveness를 본다
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1g, cpus: "1.0" } } }
    profiles: [scale]
    networks: [chaos-net]

  chaos-lb:
    image: nginx:1.29
    container_name: chaos-lb
    # LB 설정 파일(하네스 CI/CD §3-3, ADR 0034 S5). 기본은 종전 nginx.conf 라 종전 실험의 조건이 그대로다. S5 관문 실행기만
    # 셸 변수 CHAOS_LB_CONF=./nginx/nginx.partition.conf 를 준 프로세스에서 파티션 업스트림 파일을 고른다. 셸 변수가
    # --env-file 보다 우선하므로 비밀 파일(.env.chaos)은 고치지 않는다.
    volumes: ["${CHAOS_LB_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro"]
    ports: ["58080:8080"]
    depends_on:
      chaos-api-1: { condition: service_healthy }
    restart: unless-stopped
    networks: [chaos-net]

  chaos-bots:
    image: *app-image
    container_name: chaos-bots
    environment:
      SPRING_PROFILES_ACTIVE: bots
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-pg:5432/exchange   # 시드 전용 직결(토식 무관)
      SPRING_DATASOURCE_USERNAME: ${CHAOS_PG_USER:-exchange}
      SPRING_DATASOURCE_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
      SPRING_FLYWAY_ENABLED: "false"
      EXCHANGE_ENGINE_ENABLED: "false"   # 봇 노드는 리더 경쟁에서 빠진다(승격 주체 오염 방지)
      EXCHANGE_AUTH_MASTER_KEY_BASE64: ${CHAOS_MASTER_KEY_BASE64}
      EXCHANGE_SIM_BASE_URL: http://chaos-lb:8080
      # 기본 10인 이유(2026-08-29 캘리브레이션 확정, harness.calibration_runs id=1). 노드의 주문
      # 커맨드 수용 천장이 약 40~42/s라 봇 40 OPS는 봇만으로 천장에 닿고, 그 대역에서는 외부
      # 주입이 대부분 429가 되어 확정치가 성립하지 않는다(검증설계 §2-4, 산술 유도).
      # 이 값은 봇 거버너 축이고 외부 k6 주입 축(STEADY_RATE·SPIKE_RATE)과는 별개다.
      EXCHANGE_SIM_TARGET_OPS: ${CHAOS_BOTS_OPS:-10}
    depends_on:
      chaos-api-1: { condition: service_healthy }
      chaos-lb: { condition: service_started }
    restart: unless-stopped        # 카오스 중에도 생존(외부 관점 자동 복구 관찰)
    deploy: { resources: { limits: { memory: 512m } } }
    networks: [chaos-net]

  # 알람 통지. Prometheus 가 발화만 하고 보내지는 못한다. 이것이 채팅으로 밀어낸다.
  # 웹훅 URL 은 secrets/discord_webhook_url 파일에서 읽는다. 그 파일은 커밋하지 않는다.
  # 파일이 없어도 기동은 된다(2026-09-10 실측: 파일 없이 Running, RestartCount 0).
  # 실패는 기동이 아니라 통지 시점에 난다. 수신 경로는 alertmanager.yml 에 배선돼
  # 있고 receiver 는 chat 하나다. 빠진 것은 그 파일의 값뿐이다.
  chaos-alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: chaos-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["59093:9093"]
    restart: unless-stopped
    profiles: [obs]
    networks: [chaos-net]

  # 데이터베이스 지표. 정본 13.4 한계 14 의 계층 프로브 축이다.
  #
  # 앱이 방출하는 것은 HikariCP 풀 상태까지다. 그 너머의 커넥션 점유와 트랜잭션
  # 처리량과 잠금은 DB 가 직접 내야 안다. 풀 대기가 0인데 느린 경우를 그 둘로 가른다.
  chaos-pg-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: chaos-pg-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://exchange:exchange@chaos-pg:5432/exchange?sslmode=disable"
      # 확장 질의. 기본 수집기가 내지 않는 복제 재생 지연과 WAL 생성 속도를 연다.
      # 재생 지연이 곧 그 순간의 RPO 다(failover-rpo-20260912). 플래그는 v0.17.1 에서
      # DEPRECATED 표기이나 동작한다. 새 수집기 틀로 옮기는 것은 별도 작업이다.
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pg-queries.yaml
    volumes:
      - ./prometheus/pg-queries.yaml:/etc/pg-queries.yaml:ro
    depends_on:
      chaos-pg: { condition: service_healthy }
    restart: unless-stopped
    profiles: [obs]
    networks: [chaos-net]

  # 컨테이너 자원. 앱 JVM 이 아니라 컨테이너 경계에서 잰다.
  #
  # JVM 이 내는 힙 사용량과 컨테이너가 실제로 쓰는 메모리는 다르다. 캡에 걸려 죽는
  # 것은 후자다. CPU 도 같다. 스로틀은 컨테이너 경계에서 일어난다.
  #
  # cAdvisor 를 쓰지 않는다. Docker Desktop(WSL2) 에서 컨테이너 메타데이터를 못 읽어
  # name 라벨이 붙은 시계열이 0건이었다(2026-09-09 실측). 도커 API 를 직접 읽으면
  # 그 계층을 지나지 않는다. 파일 머리 주석에 근거를 적었다.
  chaos-cstats:
    image: python:3.12-alpine
    container_name: chaos-cstats
    command: ["python", "/app/exporter.py"]
    volumes:
      - ./cstats/exporter.py:/app/exporter.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    profiles: [obs]
    networks: [chaos-net]

  # 외부 프로브. 진입 계층을 밖에서 찌른다(정본 13.4 한계 14).
  #
  # 봇은 chaos-lb 를 통과한다(EXCHANGE_SIM_BASE_URL). 그래서 로드밸런서가 죽으면
  # 봇 지표도 함께 무너진다. 종전 주석은 봇이 앱 안에서 돈다고 적었으나 사실이 아니다.
  # 밖에서 찌를 수단이 따로 필요한 이유는 다른 데 있다. 봇과 k6 는 둘 다 망 안에 있어
  # 진입 계층이 망 밖에서 보이는지를 재지 못한다.
  chaos-blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: chaos-blackbox
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    command: [--config.file=/etc/blackbox/blackbox.yml]
    restart: unless-stopped
    profiles: [obs]
    networks: [chaos-net]

  chaos-prometheus:
    image: prom/prometheus:v3.13.0
    container_name: chaos-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro     # 레코딩·알람 규칙(§5-3/§5-6)
    command: ["--storage.tsdb.retention.time=2h", "--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["59090:9090"]
    depends_on: [chaos-alertmanager]
    restart: unless-stopped
    profiles: [obs]
    networks: [chaos-net]

  chaos-grafana:
    image: grafana/grafana:13.1.0
    container_name: chaos-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # pg-proof 데이터소스 자격. 격리 하네스는 컴포즈 PG 계정을 읽기용으로 쓴다(§5-4 grafana_ro는 infra/ 대상)
      GF_PG_PROOF_USER: ${CHAOS_PG_USER:-exchange}
      GF_PG_PROOF_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["53001:3000"]
    depends_on: [chaos-prometheus]
    restart: unless-stopped
    profiles: [obs]
    networks: [chaos-net]

volumes:
  chaos-pgdata:

networks:
  # name 을 강제하지 않는다. 컴포즈가 프로젝트 접두를 붙여
  # exchange-chaos_chaos-net 이 된다. 접두를 벗기면 다른 프로젝트의 같은 이름과
  # 한 네트워크를 공유하게 되고, 그 상태에서 E5 분할 주입은 남의 컨테이너를 끊는다.
  chaos-net:
