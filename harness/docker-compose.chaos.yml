name: exchange-chaos

# 격리 다중 노드 토폴로지. 데모 스택과 컨테이너명·포트·볼륨·네트워크가 전부 분리된다.
# app→toxiproxy→postgres 상시 경유(E2 노드별 단절 주입점). api-1 리더/api-2 스탠바이가
# 동일 DB의 leader_lease를 경쟁한다. 봇 플릿은 엔진을 끈 별도 노드(외부 관점 관찰 주체).

x-app-image: &app-image ${CHAOS_APP_IMAGE:-exchange-chaos-app:local}

services:
  chaos-pg:
    image: postgres:17-alpine
    container_name: chaos-pg
    environment:
      POSTGRES_DB: ${CHAOS_PG_DB:-exchange}
      POSTGRES_USER: ${CHAOS_PG_USER:-exchange}
      POSTGRES_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
    # 좀비 커넥션이 leader_lease 행 잠금을 무한 보유하면 승격이 막힌다. E2 실측: 블랙홀된 구 리더의
    # 백엔드가 idle in transaction으로 2분 넘게 RowShareLock(FOR SHARE)을 쥐고, 스탠바이의
    # try_acquire_leader UPDATE가 그 뒤에서 대기해 클러스터가 리더 없이 정지했다. 토식을 풀자 즉시
    # 승격됐다. docker pause·network disconnect는 RST를 남기지 않아 PG가 클라이언트 사망을 인지하지
    # 못하고, 기본 idle_in_transaction_session_timeout=0(비활성)이라 회수되지 않는다. keepalive는
    # 리눅스 기본이 2시간이라 페일오버 시간 척도에 무의미하다. 두 축으로 회수 시간을 유계화한다.
    command:
      - "postgres"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "idle_in_transaction_session_timeout=10s"
      - "-c"
      - "tcp_keepalives_idle=5"
      - "-c"
      - "tcp_keepalives_interval=2"
      - "-c"
      - "tcp_keepalives_count=3"
    ports: ["55432:5432"]
    volumes: ["chaos-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHAOS_PG_USER:-exchange} -d ${CHAOS_PG_DB:-exchange}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [chaos-net]

  chaos-toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: chaos-toxiproxy
    ports: ["58474:8474"]     # admin API. 격리 스택이라 실험 스크립트 주입용으로 호스트 노출
    depends_on:
      chaos-pg: { condition: service_healthy }
    networks: [chaos-net]

  chaos-toxiproxy-init:
    image: curlimages/curl:8.11.0
    container_name: chaos-toxiproxy-init
    depends_on: [chaos-toxiproxy]
    volumes: ["./toxiproxy/populate.json:/populate.json:ro"]
    command: ["sh", "-c",
      "for i in $(seq 1 30); do curl -sf -XPOST chaos-toxiproxy:8474/populate -d @/populate.json && exit 0; sleep 1; done; exit 1"]
    restart: "no"
    networks: [chaos-net]

  chaos-api-1:
    image: *app-image
    container_name: chaos-api-1
    environment: &api-env
      # chaos-monkey 프로파일이 E8 assault 주입기(actuator /chaosmonkey)와 CB 프로브 평면을 로드한다.
      # 격리 chaos 스택 서빙 노드 한정. 데모(dev,bots)·prod·봇 노드는 이 프로파일을 활성화하지 않는다.
      SPRING_PROFILES_ACTIVE: dev,chaos-monkey
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-toxiproxy:15432/exchange
      SPRING_DATASOURCE_USERNAME: ${CHAOS_PG_USER:-exchange}
      SPRING_DATASOURCE_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
      SPRING_FLYWAY_ENABLED: "true"
      EXCHANGE_HARNESS_ENABLED: "true"
      EXCHANGE_ENGINE_ENABLED: "true"
      EXCHANGE_ENGINE_LEASE_TTL: ${CHAOS_LEASE_TTL:-6s}
      EXCHANGE_ENGINE_LEASE_TICK_INTERVAL: ${CHAOS_LEASE_TICK:-2s}
      EXCHANGE_AUTH_MASTER_KEY_BASE64: ${CHAOS_MASTER_KEY_BASE64}
      # 서빙 노드는 dev 프로파일이라 주문 버킷이 계약 기본(100토큰/10s=20req/10s)이다. chaos-bots
      # 플릿은 계정당 다봇 고빈도라 이 한도에 429로 걸려 파킹되고, 카오스 중 부하 생성·자동 복구
      # 관찰이 무력화된다. 실험 부하 유지를 위해 서빙 노드의 주문 capacity를 상향한다(격리 스택 한정).
      EXCHANGE_ORDER_RATE_LIMIT_CAPACITY: "100000"
      # 공개 조회 IP 버킷(API 설계 §2-5)도 같은 사유로 상향한다. chaos-lb는 XFF를 붙이지 않고
      # 서빙 노드의 신뢰 프록시는 루프백 전용이라, LB를 지나는 봇·k6 트래픽 전량이 chaos-lb
      # 컨테이너 IP 버킷 하나에 합류한다. 봇의 시장 데이터 조회는 계정 키가 없어 계정 버킷으로
      # 우회되지 않고 OPS 거버너 대상도 아니라, 계약 기본 300토큰/10s면 앵커 조회가 상시 무효가
      # 되고(MM) 발주가 통째로 건너뛰어져(taker) 실험 부하 자체가 사라진다. 상향은 이 스택의
      # 거동을 IP 버킷 도입 이전과 동일하게 유지한다(격리 스택 한정).
      EXCHANGE_PUBLIC_RATE_LIMIT_CAPACITY: "100000"
      # dev 프로파일은 Hikari 풀이 기본 10(prod는 32)이라, E1(pg 지연 200/100 downstream)에서 봇
      # 부하가 연결을 200ms+씩 점유해 풀을 고갈시키고, 리더 리스 갱신까지 굶겨 비페일오버 전제를
      # 깬다(실측: baseline 80req/s·활성1이 지연 주입 시 in-flight 17+로 풀 10 초과). 서빙 노드
      # 풀을 prod급으로 올려 §3 E1 기대(대기 증가·p99 상승·비페일오버)대로 거동시킨다(격리 스택 한정).
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "32"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "8"
    ports: ["18080:8080"]
    depends_on:
      chaos-pg: { condition: service_healthy }
      chaos-toxiproxy-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1g } } }
    networks: [chaos-net]

  chaos-api-2:
    image: *app-image
    container_name: chaos-api-2
    environment:
      <<: *api-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-toxiproxy:25432/exchange
      SPRING_FLYWAY_ENABLED: "false"     # 마이그레이션은 api-1 단독. 스키마 확정 후 기동
    ports: ["28080:8080"]
    depends_on:
      chaos-api-1: { condition: service_healthy }
    # 스탠바이는 liveness로 판정한다. 팔로워는 설계상 readiness가 REFUSING_TRAFFIC(503)이라
    # readiness로 보면 정상 스탠바이가 영구 unhealthy가 되어 compose up --wait가 실패한다.
    # 컨테이너 기동 여부(프로세스 생존)와 트래픽 수용 여부(리더인가)는 다른 질문이다.
    # api-1은 readiness를 유지한다. 그 healthy가 flyway 완료·리더 승격을 보장해 api-2 기동을 순서 짓는다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 1g } } }
    networks: [chaos-net]

  chaos-lb:
    image: nginx:1.29
    container_name: chaos-lb
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["58080:8080"]
    depends_on:
      chaos-api-1: { condition: service_healthy }
    restart: unless-stopped
    networks: [chaos-net]

  chaos-bots:
    image: *app-image
    container_name: chaos-bots
    environment:
      SPRING_PROFILES_ACTIVE: bots
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-pg:5432/exchange   # 시드 전용 직결(토식 무관)
      SPRING_DATASOURCE_USERNAME: ${CHAOS_PG_USER:-exchange}
      SPRING_DATASOURCE_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
      SPRING_FLYWAY_ENABLED: "false"
      EXCHANGE_ENGINE_ENABLED: "false"   # 봇 노드는 리더 경쟁에서 빠진다(승격 주체 오염 방지)
      EXCHANGE_AUTH_MASTER_KEY_BASE64: ${CHAOS_MASTER_KEY_BASE64}
      EXCHANGE_SIM_BASE_URL: http://chaos-lb:8080
      # 기본 10인 이유(2026-08-29 캘리브레이션 확정, harness.calibration_runs id=1). 노드의 주문
      # 커맨드 수용 천장이 약 40~42/s이고, 봇 10 OPS가 주문 9.4/s에 취소와 8개 마켓 호가 갱신을
      # 더하므로 봇 40 OPS는 봇만으로 천장에 닿는다(검증설계 §2-4, 실측이 아니라 산술 유도).
      # 그 대역에서는 외부 주입이 대부분 429가 되어 확정치 자체가 성립하지 않는다.
      # 봇 10 OPS일 때 외부 10 OPS가 429 0·주문 p95 29.1ms로 통과했다.
      # 이 값은 봇 거버너 축이다. 카오스 실험 config/*.env의 BASE_OPS·SPIKE_OPS와 같은 축이고,
      # 외부 k6 주입 축(load/config/*.env의 STEADY_RATE·SPIKE_RATE)과는 별개다.
      EXCHANGE_SIM_TARGET_OPS: ${CHAOS_BOTS_OPS:-10}
    depends_on:
      chaos-api-1: { condition: service_healthy }
      chaos-lb: { condition: service_started }
    restart: unless-stopped        # 카오스 중에도 생존(외부 관점 자동 복구 관찰)
    deploy: { resources: { limits: { memory: 512m } } }
    networks: [chaos-net]

  chaos-prometheus:
    image: prom/prometheus:v3.13.0
    container_name: chaos-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro     # 레코딩·알람 규칙(§5-3/§5-6)
    command: ["--storage.tsdb.retention.time=2h", "--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["59090:9090"]
    restart: unless-stopped
    profiles: [obs]
    networks: [chaos-net]

  chaos-grafana:
    image: grafana/grafana:13.1.0
    container_name: chaos-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # pg-proof 데이터소스 자격. 격리 하네스는 컴포즈 PG 계정을 읽기용으로 쓴다(§5-4 grafana_ro는 infra/ 대상)
      GF_PG_PROOF_USER: ${CHAOS_PG_USER:-exchange}
      GF_PG_PROOF_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["53001:3000"]
    depends_on: [chaos-prometheus]
    restart: unless-stopped
    profiles: [obs]
    networks: [chaos-net]

volumes:
  chaos-pgdata:

networks:
  chaos-net:
    name: chaos-net
