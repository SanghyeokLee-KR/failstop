# ADR 0034 S5 설계 3절 N5 의 비교 설정(폐기용 확인 전용, 저장소 설정이 아니다). 실행기가 @A@·@B@ 를 가짜 노드 이름으로 바꾼다.
# 한 파티션 업스트림의 모양만 바꿔 소유자(A)의 일시 503 이 그 파티션 쓰기를 얼마나 막는지 잰다.
#   mf1  1차 A max_fails=1, 백업 B max_fails=0   (harness exchange_write 와 같은 모양)
#   mf2  1차 A max_fails=2, 백업 B max_fails=0   (초안 exchange_p0 와 같은 모양)
#   mf3  1차 A max_fails=3, 백업 B max_fails=0
#   inv  1차 B max_fails=1, 백업 A max_fails=0   (평소 소유자를 백업에 두는 뒤집은 모양)
#   rr   A·B 모두 max_fails=1 라운드로빈         (deploy/nginx-edge.conf.template exchange_write 와 같은 모양)
# accel 은 소유자가 아닌 노드가 421 + X-Accel-Redirect(이름 붙은 location)로 넘길 때 메서드·바디가 보존되고 실패로 세지 않는지 본다.
worker_processes 1;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    log_format cmp '$request_method $uri st=$status ups="$upstream_addr" ust="$upstream_status" hint="$http_x_exchange_market"';
    access_log /var/log/nginx/access.log cmp;

    upstream mf1 { zone mf1 64k; server @A@:8080 resolve max_fails=1 fail_timeout=2s; server @B@:8080 resolve backup max_fails=0; }
    upstream mf2 { zone mf2 64k; server @A@:8080 resolve max_fails=2 fail_timeout=2s; server @B@:8080 resolve backup max_fails=0; }
    upstream mf3 { zone mf3 64k; server @A@:8080 resolve max_fails=3 fail_timeout=2s; server @B@:8080 resolve backup max_fails=0; }
    upstream inv { zone inv 64k; server @B@:8080 resolve max_fails=1 fail_timeout=2s; server @A@:8080 resolve backup max_fails=0; }
    upstream rr  { zone rr 64k;  server @A@:8080 resolve max_fails=1 fail_timeout=2s; server @B@:8080 resolve max_fails=1 fail_timeout=2s; }

    # accel_first 는 A 1차·B 백업이다. A 의 421 이 실패로 세어지면 다음 요청이 곧바로 B 로 가고, 세어지지 않으면 다시 A 를 거친다.
    upstream accel_first { zone accel_first 64k; server @A@:8080 resolve max_fails=1 fail_timeout=2s; server @B@:8080 resolve backup max_fails=0; }
    upstream accel_other { zone accel_other 64k; server @B@:8080 resolve max_fails=1 fail_timeout=2s; }

    server {
        listen 8080;
        location ~ ^/(mf1|mf2|mf3|inv|rr)/ {
            proxy_pass http://$1;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
        location /accel/ {
            proxy_pass http://accel_first;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
        location @accel_other {
            proxy_pass http://accel_other;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
    }
}
