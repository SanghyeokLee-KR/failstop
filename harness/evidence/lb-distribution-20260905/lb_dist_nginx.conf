# 정본 deploy/nginx-edge.conf.template 의 upstream·location 규약을 그대로 옮긴 검증본.
# TLS·ACME·도메인만 뺐다. 분산 정책(least_conn)과 쓰기 분리(limit_except GET)는 동일하다.
worker_processes 1;
events { worker_connections 4096; }
http {
    access_log /var/log/nginx/access.log combined;
    upstream exchange_leader { server chaos-api-1:8080; }
    upstream exchange_read {
        least_conn;
        server chaos-api-1:8080  max_fails=1 fail_timeout=2s;
        server chaos-api-2:8080 max_fails=1 fail_timeout=2s;
    }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 80;
        location /ws/ {
            proxy_pass http://exchange_read;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # 쓰기는 리더 단독. 팔로워로 보내면 단일 라이터 구조상 거부된다.
        location ~ ^/api/v1/(orders|transfers) {
            limit_except GET { proxy_pass http://exchange_leader; }
            proxy_pass http://exchange_read;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location / {
            proxy_pass http://exchange_read;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
