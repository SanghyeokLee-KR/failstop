# ADR 0034 S4 설계 3절 N 확인용 nginx 설정 틀. 실행기(nginx-probe.sh)가 @A@·@B@ 를 가짜 노드 컨테이너 이름으로 바꾼다.
# harness_write 는 harness/nginx/nginx.conf 의 exchange_write 와 같은 줄이다(1차 max_fails=1 fail_timeout=2s, 백업 max_fails=0).
# edge_write 는 deploy/nginx-edge.conf.template 의 exchange_write 와 같은 줄이다(두 노드 모두 max_fails=1 fail_timeout=2s, 백업 없음).
# 두 location 의 proxy_next_upstream 과 tries 는 harness/nginx/nginx.conf:69-70 과 같다. 어느 노드를 거쳤는지 응답 머리에 싣는다.
worker_processes 1;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream harness_write {
        zone harness_write 64k;
        server @A@:8080 resolve max_fails=1 fail_timeout=2s;
        server @B@:8080 resolve backup max_fails=0;
    }

    upstream edge_write {
        zone edge_write 64k;
        server @A@:8080 resolve max_fails=1 fail_timeout=2s;
        server @B@:8080 resolve max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8080;

        location /harness/ {
            proxy_pass http://harness_write;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }

        location /edge/ {
            proxy_pass http://edge_write;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Status $upstream_status always;
        }
    }
}
