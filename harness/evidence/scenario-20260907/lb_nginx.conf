# 정본 deploy/nginx-edge.conf.template 의 upstream·location 규약을 옮긴 시나리오용 설정.
# 2번 노드는 down 으로 시작한다. 증설 시점에 그 표시만 지우고 reload 한다.
worker_processes 1;
events { worker_connections 8192; }
http {
    access_log off;
    upstream exchange_leader { server ex-app:8080; keepalive 64; }
    upstream exchange_read {
        least_conn;
        server ex-app:8080  max_fails=1 fail_timeout=2s;
        server ex-app2:8080 max_fails=1 fail_timeout=2s;
        keepalive 128;
    }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 80;
        location /ws/ {
            proxy_pass http://exchange_read;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
        # 쓰기는 리더 단독. 단일 라이터 구조라 팔로워로 보내면 순서가 깨진다.
        location ~ ^/api/v1/(orders|transfers) {
            limit_except GET { proxy_pass http://exchange_leader; }
            proxy_pass http://exchange_read;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://exchange_read;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
