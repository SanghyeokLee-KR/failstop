# 폐기용 확인 N2. simple 모드 팔로워 흉내: /ws/ 핸드셰이크는 업그레이드 전에 503 과 Retry-After 로 거절하고 조회는 받는다.
events {}
http { server { listen 8080;
  location /ws/ { add_header X-Backend follower always; add_header Retry-After 5 always; return 503; }
  location /api/ { add_header X-Backend follower always; return 200 "follower\n"; }
} }
