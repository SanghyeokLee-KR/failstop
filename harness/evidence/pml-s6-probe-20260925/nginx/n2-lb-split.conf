# 폐기용 확인 N2-B. 고친 배포 엣지 모양: /ws/ 만 upstream exchange_ws 를 쓰고 /api/ 는 exchange_read 를 쓴다. 서버 줄은 같다.
events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream exchange_read { zone exchange_read 64k; least_conn;
    server pml6-probe-leader:8080 resolve max_fails=1 fail_timeout=2s;
    server pml6-probe-follower:8080 resolve max_fails=1 fail_timeout=2s; }
  upstream exchange_ws { zone exchange_ws 64k; least_conn;
    server pml6-probe-leader:8080 resolve max_fails=1 fail_timeout=2s;
    server pml6-probe-follower:8080 resolve max_fails=1 fail_timeout=2s; }
  log_format up '$request_uri $status up=$upstream_addr ups=$upstream_status';
  server { listen 8080; access_log /dev/stdout up;
    location /ws/ { proxy_pass http://exchange_ws; proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
      proxy_next_upstream error timeout http_503; proxy_next_upstream_tries 2; }
    location /api/ { proxy_pass http://exchange_read; proxy_http_version 1.1;
      proxy_next_upstream error timeout http_502 http_503 non_idempotent; proxy_next_upstream_tries 2; }
  }
}
