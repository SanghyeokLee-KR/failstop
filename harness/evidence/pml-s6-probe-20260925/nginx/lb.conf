# 폐기용 확인. S6 중계 오버레이의 /ws/ 배선 후보(least_conn, 503 다음 업스트림).
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream ws_any { least_conn;
    server pml-probe-ngx-a:8080 max_fails=1 fail_timeout=2s;
    server pml-probe-ngx-b:8080 max_fails=1 fail_timeout=2s; }
  log_format up '$status up=$upstream_addr ups=$upstream_status';
  server { listen 8080; access_log /dev/stdout up;
    location /ws/ { proxy_pass http://ws_any; proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade;
      proxy_next_upstream error timeout http_503; proxy_next_upstream_tries 2; proxy_connect_timeout 2s; }
  }
}
