# ASG 시나리오용 로드밸런서. 2026-09-08.
#
# 종전 판과 다른 점 하나. upstream server 에 resolve 를 붙이고 zone 과 resolver 를 짝지었다.
# resolve 가 없으면 nginx 는 기동 시점에 이름을 풀고 실패하면 통째로 뜨지 않는다. ASG 는
# 노드가 오가므로 그 제약을 그대로 두면 축소 직후 reload 가 LB 를 죽인다.
# A/B 실측(2026-09-08): 없는 호스트 하나로 nginx -t 를 돌리면 resolve 있음은 통과,
# 없음은 [emerg] host not found in upstream 이다.
worker_processes auto;
events { worker_connections 8192; }

http {
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # 쓰기. 매칭엔진이 단일 라이터라 이 업스트림은 절대 늘리지 않는다.
    upstream exchange_write {
        zone exchange_write 64k;
        server ex-app:8080 resolve max_fails=1 fail_timeout=2s;
    }

    # 조회. ASG 대상이다. 3번 노드는 항상 선언해 두고 down 토글로 넣고 뺀다.
    # resolve 덕분에 ex-app3 컨테이너가 없어도 이 설정이 기동한다.
    upstream exchange_read {
        zone exchange_read 64k;
        least_conn;
        server ex-app:8080  resolve max_fails=1 fail_timeout=2s;
        server ex-app2:8080 resolve max_fails=1 fail_timeout=2s;
        server ex-app3:8080 resolve max_fails=1 fail_timeout=2s down;
    }

    server {
        listen 80;

        location /ws/ {
            proxy_pass http://exchange_read;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location ~ ^/api/v1/(orders|transfers) {
            limit_except GET { proxy_pass http://exchange_write; }
            proxy_pass http://exchange_read;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        location / {
            proxy_pass http://exchange_read;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
