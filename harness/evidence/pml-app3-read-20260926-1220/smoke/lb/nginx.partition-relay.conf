worker_processes 1;
events { worker_connections 4096; }

# 파티션 리더 모드(P3) LB(ADR 0034 S7, docs/reference/architecture/마켓분할_리더_S7_설계.md 4-9).
# 중계 LB(nginx.relay.conf, S6)에 파티션 LB(nginx.partition.conf, S5)의 파티션 업스트림 둘, 두 맵, 주문 쓰기 location 을 더한 파일이다.
# 두 원본을 고치지 않고 따로 둔다. P3 오버레이(harness/docker-compose.p3.yml)가 중계 오버레이 뒤에 겹쳐 chaos-lb 에 이 파일을 마운트한다.
# 접근 로그는 파티션 형식 하나다(ups=시도한 업스트림, ust=상태 목록). exchange_write·exchange_read·exchange_any·exchange_ws 블록과
# 조회·호가·티커·/ws/·기본 location 은 nginx.relay.conf 와, 파티션 블록·맵·주문 location 은 nginx.partition.conf 와 줄 단위로 같다
# (harness/scale/test_nginx_p3_conf.py 가 대조한다). 라우팅은 서버 안전성의 근거가 아니다.

http {
    # WebSocket 업그레이드 전달용. 이것이 없으면 STOMP CONNECT가 LB에서 일반 HTTP로 다뤄져
    # 핸드셰이크가 깨지고 WS 임계가 표본 없이 통과한다. 실측은 검증설계 §2-4 WS 구독 축에 둔다.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker 내장 DNS. upstream의 resolve와 짝이다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # combined 형식 뒤에 시도한 업스트림과 상태, 힌트, 선검사 표식을 덧붙인다. 앞부분이 combined 와 같아
    # S4b 의 LB 판정 정규식("(POST|DELETE) /api/v1/orders... HTTP/x" 500 )이 그대로 맞는다.
    log_format partition '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'ups="$upstream_addr" ust="$upstream_status" hint="$http_x_exchange_market" '
                         'route="$upstream_http_x_exchange_route" rt=$request_time';
    access_log /var/log/nginx/access.log partition;

    # 쓰기 경로. api-1을 1차, api-2를 백업으로 둔다. 초기 리더=api-1(먼저 기동해 부트스트랩
    # 리스 선점)과 트래픽 경로를 일치시키고, api-1 kill 시 백업(api-2, 승격한 신 리더)으로 넘어간다.
    # 이 블록은 페일오버 실측(E4·E5·E7)의 전제라 바이트 단위로 보존한다.
    upstream exchange_write {
        # resolve가 없으면 기동 시점 IP가 굳어 컨테이너 재생성 후 죽은 IP를 계속 두드린다(zone이
        # 전제 조건). 교환 조건·실측·미규명 사항은 검증설계 §3 LB 배선에 둔다.
        zone exchange_write 64k;
        server chaos-api-1:8080 resolve max_fails=1 fail_timeout=2s;
        # 백업은 퇴출하지 않는다(max_fails=0). 팔로워의 정상 503이 실패로 계상돼 백업이 스스로
        # 빠지면 1차가 흔들릴 때 살아 있는 업스트림이 0이 된다. A/B 실측은 검증설계 §3 LB 배선.
        server chaos-api-2:8080 resolve backup max_fails=0;
    }

    # 조회 경로. 증설의 단위다. AWS 토폴로지의 조회 타겟그룹과 같은 자리이고(ADR 0027·0030),
    # 여기 들어오는 것은 DB에서 완결되는 조회뿐이다. 호가·티커는 아래 exchange_any 로 간다.
    upstream exchange_read {
        zone exchange_read 64k;
        # 대수가 늘 때 실부하를 따라가야 평균 사용률이 실제로 나뉜다. 라운드로빈은
        # 연결 수명이 다른 조회에서 한 노드에 쏠린다.
        least_conn;
        server chaos-api-1:8080 resolve max_fails=1 fail_timeout=2s;
        server chaos-api-2:8080 resolve max_fails=1 fail_timeout=2s;
        # 조절기가 토글하는 줄. down은 반드시 세미콜론 직전 마지막 토큰이어야 한다.
        # asg_controller.Balancer.set_down의 정규식이 그 위치에서만 잡는다.
        server chaos-api-3:8080 resolve max_fails=1 fail_timeout=2s;
    }

    # 호가·티커 REST(중계 오버레이 전용). 중계 모드에서는 그 마켓을 쥐지 않은 노드가 중계 미러로 답하므로(API§4-A-2) 쓰기
    # 경로에 묶어 둘 이유가 없다. api-3 은 넣지 않는다. 조회 노드는 호가·티커와 WS 에 404 다.
    upstream exchange_any {
        zone exchange_any 64k;
        least_conn;
        server chaos-api-1:8080 resolve max_fails=1 fail_timeout=2s;
        server chaos-api-2:8080 resolve max_fails=1 fail_timeout=2s;
    }

    # WS(중계 오버레이 전용). 중계 모드에서는 어느 앱 노드든 모든 마켓의 게시를 받는다(노드 단위 중계). 중계가 끊긴 노드는
    # 핸드셰이크를 업그레이드 전에 503 으로 거절하고, 이 배선이 다른 노드로 넘긴 뒤 약 2초 그 노드를 건너뛴다
    # (harness/evidence/pml-s6-probe-20260925/ N1). 실패 표시는 블록마다 따로라 블록을 나눠 호가·티커 REST 분산에 번지지 않게 한다(N2).
    upstream exchange_ws {
        zone exchange_ws 64k;
        least_conn;
        server chaos-api-1:8080 resolve max_fails=1 fail_timeout=2s;
        server chaos-api-2:8080 resolve max_fails=1 fail_timeout=2s;
    }

    # 파티션 쓰기 경로(ADR 0034 결정 2·3). 1차는 그 파티션의 선호 소유자(p0 는 api-1, p1 은 api-2), 백업은 다른 노드다.
    # 백업을 퇴출하지 않는 이유는 exchange_write 와 같다. 1차의 max_fails 를 2 로 두는 이유는 설계 4-6 이다. 소유자가 DB 가
    # 흔들린 직후 낸 503 한 건으로는 빼지 않고, 죽었거나 소유자가 아니면(선검사 503) 두 번째 실패에서 뺀다.
    # 실패 계수는 업스트림 블록마다 따로라 한 파티션의 503 이 다른 파티션과 힌트 없는 요청의 경로를 바꾸지 않는다.
    upstream exchange_p0 {
        zone exchange_p0 64k;
        server chaos-api-1:8080 resolve max_fails=2 fail_timeout=2s;
        server chaos-api-2:8080 resolve backup max_fails=0;
    }

    upstream exchange_p1 {
        zone exchange_p1 64k;
        server chaos-api-2:8080 resolve max_fails=2 fail_timeout=2s;
        server chaos-api-1:8080 resolve backup max_fails=0;
    }

    # 마켓 힌트(X-Exchange-Market, 서명 밖)에서 파티션 업스트림을 고른다. 대응은 market_lease_partition 의 시드(V48,
    # ADR 0034 결정한 값 3)와 같고 harness/scale/test_nginx_partition_conf.py 가 대조한다. 목록에 없거나 힌트가 없으면
    # 종전 쓰기 경로다. 같은 이름의 헤더가 둘 이상이면 nginx 가 값을 이어 붙여 목록에 없게 되므로 종전 쓰기 경로로 가고,
    # 앱의 선검사가 400 으로 돌려보낸다.
    map $http_x_exchange_market $exchange_market_upstream {
        default     exchange_write;
        KRW-BTC     exchange_p0;
        KRW-XRP     exchange_p0;
        KRW-DOGE    exchange_p0;
        KRW-TRX     exchange_p0;
        KRW-DOT     exchange_p0;
        KRW-AVAX    exchange_p0;
        KRW-ETH     exchange_p1;
        KRW-SOL     exchange_p1;
        KRW-ADA     exchange_p1;
        KRW-LINK    exchange_p1;
        KRW-MATIC   exchange_p1;
        KRW-ATOM    exchange_p1;
    }

    # 주문 쓰기(POST·DELETE)만 파티션으로 가른다. 주문 조회(GET)는 어느 노드든 DB 에서 답하므로 종전 쓰기 경로에 둔다.
    map $request_method $exchange_order_upstream {
        default     exchange_write;
        POST        $exchange_market_upstream;
        DELETE      $exchange_market_upstream;
    }

    server {
        listen 8080;

        # DB에서 완결되는 조회만 증설 단위로 보낸다(ADR 0027 최초 구현안).
        # 주문 쓰기는 아래 주문 location 이 파티션 업스트림으로, 주문 조회는 기본 location 이 쓰기 경로로 보낸다.
        location ~ ^/api/v1/(markets|trades|candles) {
            proxy_pass http://exchange_read;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            # 조회는 멱등이라 다음 업스트림으로 넘겨도 부작용이 없다
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # 호가·티커 REST. 쓰기가 아니라 넘겨도 부작용이 없다. 비소유 노드는 미러 조건이 안 되면 DB 집계와 seq 0 을 낸다
        location ~ ^/api/v1/(orderbook|ticker)$ {
            proxy_pass http://exchange_any;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 2;
        }

        # 주문 쓰기의 파티션 라우팅. 재시도 규칙은 기본 location 과 같다(주문은 client_order_id 멱등, 취소는 종결 주문 재취소
        # 멱등). 선검사의 503 은 아무것도 쓰지 않은 거절이라 다른 노드로 넘겨도 한 번의 효과다.
        location ~ ^/api/v1/orders(/|$) {
            proxy_pass http://$exchange_order_upstream;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        # WebSocket. 거절(503)은 업그레이드 전에 나므로 다음 노드로 넘길 수 있다. 업그레이드 뒤의 끊김(1013)은 넘기지 않고
        # 클라이언트 재연결이 맡는다. 읽기 시한은 기본 location 과 같게 둔다(STOMP 하트비트 10초가 연결을 살린다)
        location /ws/ {
            proxy_pass http://exchange_ws;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_next_upstream error timeout http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        location / {
            proxy_pass http://exchange_write;
            proxy_set_header Host $host;
            # 업그레이드에는 HTTP/1.1이 필요하다. 기본 1.0은 Connection 헤더를 전달하지 않는다.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # non_idempotent가 없으면 POST 재시도가 빠져, 구 리더가 팔로워로 재합류한 동안 주문
            # 쓰기가 503을 그대로 받는다. 재시도 안전 근거는 client_order_id 멱등(API§7-6).
            # 전방 결합(공유 NonceStore)과 실측은 검증설계 §3 LB 배선·E7'에 둔다.
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
