# 시연 스택의 DB 계층을 Patroni 엄격 동기(ADR 0036)로 바꾸는 오버레이. PostgreSQL 두 대(chaos-db-1·2) + etcd 세 표 +
# 노드별 HAProxy 사이드카다. 설계는 docs/reference/architecture/DB_자동전환_Patroni_설계.md 3절, 검증한 값은 harness/patroni/ 실험
# 스택(E-P1~E-P6)과 같다. 종전 DB(chaos-pg 한 대 + 비동기 대기 DB chaos-pg-standby)는 async-db 프로파일로 빼서 compose 가
# 건드리지 않게 하고, 컨테이너와 볼륨(exchange-chaos_chaos-pgdata)은 멈춘 채 그대로 둔다.
#
# 기동과 전환은 스크립트로 한다. 직접 부를 때는 파일 순서와 env 파일 셋을 지킨다(상대 경로는 첫 파일의 폴더 harness/ 기준이다).
#   처음 한 번 전환    pwsh -NoProfile -File C:\dev\exchange\harness\scripts\demo-patroni-migrate.ps1
#   재부팅 뒤 올리기    pwsh -NoProfile -File C:\dev\exchange\harness\scripts\demo-obs-up.ps1
#   장애 시연·초기화    pwsh -NoProfile -File C:\dev\exchange\harness\scripts\demo-db-failover.ps1 -Action run|kill|return|reset|status
#   docker compose -p exchange-chaos -f harness/docker-compose.chaos.yml -f harness/docker-compose.demo-obs.yml \
#     -f harness/docker-compose.demo-report.yml -f harness/docker-compose.demo-bots.yml -f harness/docker-compose.demo-patroni.yml \
#     --env-file harness/patroni/.env.patroni --env-file harness/.env.chaos --env-file harness/demo/obs.local/obs.env --profile obs ...
# env 파일은 셋 다 필요하다. .env.patroni 는 Patroni 계정·REST 비밀번호, .env.chaos 는 앱 계정, obs.env 는 수집기 계정이다.
# .env.patroni 를 맨 앞에 두어 이름이 겹쳐도 카오스 스택 값이 이긴다. 비밀 값은 이 파일에 적지 않는다.
#
# 되돌리기(종전 비동기 DB 로)는 harness/scripts/demo-patroni-migrate.ps1 머리 주석에 있다. 이 오버레이를 빼고 올리면 된다.
#
# 이름. 노드 라벨과 Patroni 멤버 이름은 AWS 개인 계정 계획의 호스트 이름(db-1, db-2, bot-1; ADR 0036, 설계 9-2 (b))을 따른다.
# 컨테이너 이름은 카오스 스택 규약(chaos-*)이다. 어느 노드가 Primary 인지는 이름이나 배치 라벨이 아니라 recovery 지표
# (pg_wal_position_in_recovery)와 Patroni /cluster 가 정한다(ADR 0032).
#
# 자원. DB 두 노드는 학교 AWS 와 같은 2코어·2GiB 상한이다(2026-09-27 사용자 결정). 나머지는 실험 스택의 상한과 같다.

x-demo-etcd: &demo-etcd
  image: quay.io/coreos/etcd:v3.5.34@sha256:2c029095680c13c2b36116cc3935e1b0cddc0f5af78004457fd863616d8d072b
  restart: unless-stopped
  # CPU 상한을 낮게 두지 않는다. 상한은 CFS 할당량이라 짧은 폭주에서 스로틀 지연을 만들고 etcd 는 그 지연에 리더 교체로 반응한다.
  cpus: 1
  mem_limit: 256m
  healthcheck:
    test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "--command-timeout=2s", "endpoint", "health"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s
  networks: [chaos-net]

x-demo-etcd-env: &demo-etcd-env
  ETCD_DATA_DIR: /etcd-data
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
  ETCD_LISTEN_METRICS_URLS: http://0.0.0.0:2381
  ETCD_INITIAL_CLUSTER: etcd-1=http://chaos-etcd-1:2380,etcd-2=http://chaos-etcd-2:2380,etcd-3=http://chaos-etcd-3:2380
  # 데이터가 볼륨에 있으면 etcd 는 이 값을 보지 않고 기존 클러스터로 다시 붙는다.
  ETCD_INITIAL_CLUSTER_STATE: new
  ETCD_INITIAL_CLUSTER_TOKEN: exchange-chaos-demo
  ETCD_QUOTA_BACKEND_BYTES: "536870912"
  ETCD_AUTO_COMPACTION_MODE: periodic
  ETCD_AUTO_COMPACTION_RETENTION: 1h

x-demo-db: &demo-db
  image: exchange-patroni-db:local
  # PID 1 을 tini 에 맡긴다. postmaster(또는 Patroni)가 PID 1 이면 컨테이너 안 도구가 남긴 고아가 신호로 끝나기만 해도 크래시 재시작이
  # 나고 커밋을 기다리던 행이 복제 없이 보인다(설계 3-6, 사전 확인 Q2).
  init: true
  # 재부팅 뒤 스스로 다시 뜬다. docker kill 로 끈 노드는 Docker 가 다시 띄우지 않는다(2026-09-27 확인: kill 뒤 RestartCount 0).
  # 그래서 장애 시연에서 옛 Primary 가 돌아오는 시점은 스크립트(demo-db-failover.ps1)나 사람이 정한다.
  restart: unless-stopped
  shm_size: 256m
  stop_grace_period: 30s
  cpus: 2
  mem_limit: 2g
  memswap_limit: 2g
  depends_on:
    chaos-etcd-1: { condition: service_started }
    chaos-etcd-2: { condition: service_started }
    chaos-etcd-3: { condition: service_started }
  healthcheck:
    # PostgreSQL 이 돌고 있으면 200(Primary·Standby 모두). 역할은 HAProxy 가 /primary 로 가른다.
    test: ["CMD", "/opt/patroni/bin/python", "-c",
           "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=2)"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 20s

x-demo-db-env: &demo-db-env
  PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:?harness/patroni/.env.patroni 가 필요하다}
  PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:?harness/patroni/.env.patroni 가 필요하다}
  PATRONI_RESTAPI_USERNAME: ${PATRONI_RESTAPI_USERNAME:?harness/patroni/.env.patroni 가 필요하다}
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:?harness/patroni/.env.patroni 가 필요하다}
  # post_bootstrap.sh 가 첫 부트스트랩 때 한 번 쓴다. 앱 계정은 종전 chaos-pg 와 같은 계정·비밀번호라 앱 설정을 바꾸지 않는다.
  EXCHANGE_DB_USER: ${CHAOS_PG_USER:-exchange}
  EXCHANGE_DB_PASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
  # 수집기 계정은 학교 AWS 와 같은 failstop_monitor 다(pg-queries.yaml 의 '수집 계정 제외'가 이 이름을 본다).
  EXCHANGE_MONITOR_USER: failstop_monitor
  EXCHANGE_MONITOR_PASSWORD: ${DEMO_MONITOR_PASSWORD:?harness/demo/obs.local/obs.env 가 필요하다}

x-demo-haproxy: &demo-haproxy
  image: haproxy:3.0.27-alpine@sha256:30860bc97b3a4b1e48011ce0687d4ba1e4711344af8480c4bec85e3ff8411fee
  # 실험 스택과 같은 설정이다. 서버 이름 db-1·db-2 와 주소 db-N-app(아래 DB 의 망 별칭)을 그대로 쓴다.
  volumes: ["./patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
  restart: unless-stopped
  cpus: 0.25
  mem_limit: 64m
  networks: [chaos-net]

services:
  # ===== 합의 저장소. etcd 세 표(db-1, db-2, bot-1 역할, ADR 0036 결정 2) =====
  chaos-etcd-1:
    <<: *demo-etcd
    container_name: chaos-etcd-1
    environment:
      <<: *demo-etcd-env
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://chaos-etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://chaos-etcd-1:2380
    volumes: ["chaos-etcd-1-data:/etcd-data"]

  chaos-etcd-2:
    <<: *demo-etcd
    container_name: chaos-etcd-2
    environment:
      <<: *demo-etcd-env
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://chaos-etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://chaos-etcd-2:2380
    volumes: ["chaos-etcd-2-data:/etcd-data"]

  chaos-etcd-3:
    <<: *demo-etcd
    container_name: chaos-etcd-3
    environment:
      <<: *demo-etcd-env
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://chaos-etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://chaos-etcd-3:2380
    volumes: ["chaos-etcd-3-data:/etcd-data"]

  # ===== DB 두 노드(Patroni 4.1.5 + PostgreSQL 17.11, 이미지 harness/patroni/Dockerfile) =====
  # Patroni REST(8008)는 호스트 루프백에만 연다. 장애 시연 스크립트와 관측기가 /cluster 를 읽는다.
  chaos-db-1:
    <<: *demo-db
    container_name: chaos-db-1
    hostname: chaos-db-1
    environment:
      <<: *demo-db-env
      PATRONI_NAME: db-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: chaos-db-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: chaos-db-1:5432
    volumes:
      - ./patroni/patroni.demo.yml:/patroni/patroni.yml:ro
      - chaos-db-1-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:18008:8008"]
    networks:
      chaos-net: { aliases: [db-1-app] }

  chaos-db-2:
    <<: *demo-db
    container_name: chaos-db-2
    hostname: chaos-db-2
    environment:
      <<: *demo-db-env
      PATRONI_NAME: db-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: chaos-db-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: chaos-db-2:5432
    volumes:
      - ./patroni/patroni.demo.yml:/patroni/patroni.yml:ro
      - chaos-db-2-data:/var/lib/postgresql/data
    ports: ["127.0.0.1:28008:8008"]
    networks:
      chaos-net: { aliases: [db-2-app] }

  # ===== 노드별 HAProxy 사이드카(설계 3-4). /primary 가 200 인 DB 로만 보낸다. 통계·지표 8404 는 호스트 루프백에 연다 =====
  chaos-haproxy-1:          # app-1(chaos-api-1)
    <<: *demo-haproxy
    container_name: chaos-haproxy-1
    ports: ["127.0.0.1:18404:8404"]

  chaos-haproxy-2:          # app-2(chaos-api-2)
    <<: *demo-haproxy
    container_name: chaos-haproxy-2
    ports: ["127.0.0.1:28404:8404"]

  chaos-haproxy-3:          # app-3(chaos-api-3, 조회 전용 증설 노드. AWS 에서는 조회 ASG 인스턴스마다 하나)
    <<: *demo-haproxy
    container_name: chaos-haproxy-3
    ports: ["127.0.0.1:38404:8404"]

  chaos-haproxy-b:          # bot-1(봇, 관리 평면, 백업, 도구, 조정기)
    <<: *demo-haproxy
    container_name: chaos-haproxy-b
    ports: ["127.0.0.1:48404:8404"]

  # 스크립트와 조정기(capacity_reconciler.py --pg-container chaos-db-toolbox)가 docker exec 로 쓰는 psql 도구.
  # chaos-haproxy-b 를 거쳐 현재 Primary 에 붙는다. 전환 때 덤프·복원도 여기서 돌린다(CPU 2).
  chaos-db-toolbox:
    image: exchange-patroni-db:local
    container_name: chaos-db-toolbox
    init: true
    entrypoint: ["sleep", "infinity"]
    environment:
      PGHOST: chaos-haproxy-b
      PGPORT: "5000"
      PGDATABASE: ${CHAOS_PG_DB:-exchange}
      PGUSER: ${CHAOS_PG_USER:-exchange}
      PGPASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
    depends_on: [chaos-haproxy-b]
    restart: unless-stopped
    cpus: 2
    mem_limit: 512m
    networks: [chaos-net]

  # DB 수준 ACK 기록기(설계 8-1, harness/scale/ack_recorder.py). 장애 시연 스크립트가 dbfail 프로파일로 띄우고 멈춤 파일로 끝낸다.
  # 대상은 post_bootstrap.sh 가 만든 실험 전용 DB infra_probe 의 ack_probe 다. 거래 스키마를 건드리지 않는다.
  chaos-db-ackrec:
    image: exchange-patroni-db:local
    container_name: chaos-db-ackrec
    init: true
    profiles: [dbfail]
    entrypoint: ["/opt/patroni/bin/python", "/ackrec/ack_recorder.py"]
    command: ["run", "--out", "/out/ackrec.jsonl", "--stop-file", "/out/ackrec.stop"]
    environment:
      PGHOST: chaos-haproxy-b
      PGPORT: "5000"
      PGDATABASE: infra_probe
      PGUSER: ${CHAOS_PG_USER:-exchange}
      PGPASSWORD: ${CHAOS_PG_PASSWORD:-exchange}
    volumes:
      - ./scale/ack_recorder.py:/ackrec/ack_recorder.py:ro
      - ${DEMO_FAILOVER_OUT:-./demo/patroni.local/ackrec}:/out
    depends_on: [chaos-haproxy-b]
    restart: "no"
    cpus: 0.5
    mem_limit: 128m
    networks: [chaos-net]

  # ===== 수집기. 두 노드 모두 학교 AWS 와 같은 pg-queries.yaml 에 Patroni 질의 둘(pg_syncrep_waiters, pg_nonmember_walsenders)을
  # 붙인 파일을 쓴다. 그 파일은 demo-patroni-migrate.ps1·demo-obs-up.ps1 이 harness/demo/patroni.local/ 에 만든다 =====
  chaos-db-1-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: chaos-db-1-exporter
    environment: &demo-exporter-env
      DATA_SOURCE_URI: "chaos-db-1:5432/exchange?sslmode=disable"
      DATA_SOURCE_USER: failstop_monitor
      DATA_SOURCE_PASS: ${DEMO_MONITOR_PASSWORD:-}
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pg-queries.yaml
    volumes: ["./demo/patroni.local/pg-queries.yaml:/etc/pg-queries.yaml:ro"]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    profiles: [obs]
    networks: [chaos-net]

  chaos-db-2-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: chaos-db-2-exporter
    environment:
      <<: *demo-exporter-env
      DATA_SOURCE_URI: "chaos-db-2:5432/exchange?sslmode=disable"
    volumes: ["./demo/patroni.local/pg-queries.yaml:/etc/pg-queries.yaml:ro"]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    profiles: [obs]
    networks: [chaos-net]

  # ===== 거래 앱·봇의 DB 연결을 자기 HAProxy 로 바꾸고 patroni 프로파일(쓰기 가능 탐지, append 풀 소켓 제한 6초)을 켠다 =====
  # 프로파일은 종전 시연 값(dev,chaos-monkey)에 patroni 만 더한다. E-P 실험은 prod-timeouts 까지 켰다(설계 8-1). 같은 조건으로
  # 보려면 DEMO_PATRONI_SPRING_PROFILES=dev,chaos-monkey,prod-timeouts,patroni 를 준다. 토식(chaos-toxiproxy)은 지나지 않는다.
  chaos-api-1:
    environment:
      SPRING_PROFILES_ACTIVE: ${DEMO_PATRONI_SPRING_PROFILES:-dev,chaos-monkey,patroni}
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-haproxy-1:5000/exchange
    depends_on: !override
      chaos-haproxy-1: { condition: service_started }
      chaos-dynamodb: { condition: service_healthy }

  chaos-api-2:
    environment:
      SPRING_PROFILES_ACTIVE: ${DEMO_PATRONI_SPRING_PROFILES:-dev,chaos-monkey,patroni}
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-haproxy-2:5000/exchange

  chaos-api-3:
    environment:
      SPRING_PROFILES_ACTIVE: ${DEMO_PATRONI_SPRING_PROFILES:-dev,chaos-monkey,patroni}
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-haproxy-3:5000/exchange

  # 봇 노드의 상태 발행·명령 점유도 쓰기다. 거래 일시 중단 동안 새로 시작하지 않게 탐지를 켠다(DB 설계 §5.4-f 6, 실험 스택과 같다).
  chaos-bots:
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-haproxy-b:5000/exchange
      EXCHANGE_WRITE_AVAILABILITY_ENABLED: "true"

  # 논리 백업은 현재 Standby 에서 받는다. 스크립트가 BACKUP_HOSTS 가운데 pg_is_in_recovery() 가 참인 노드를 고른다(없으면 Primary).
  # pg_dump 는 일반 연결이라 '*' 아래에서 동기 대기 서버가 되지 않는다(ADR 0036 결정 3 의 복제 연결 규칙과 무관).
  chaos-db-backup:
    environment:
      PGHOST: chaos-db-2
      BACKUP_HOSTS: chaos-db-1 chaos-db-2
    depends_on: !override
      chaos-db-1: { condition: service_started }
      chaos-db-2: { condition: service_started }

  # ===== 종전 DB 계층은 async-db 프로파일로 뺀다. 컨테이너·볼륨은 지우지 않는다(되돌리기 자료) =====
  chaos-pg:
    profiles: !override [async-db]
  chaos-pg-standby:
    profiles: !override [async-db]
  chaos-pg-exporter:
    profiles: !override [async-db]
  chaos-pg-standby-exporter:
    profiles: !override [async-db]
  # 토식은 종전 실험(E1·E2 등)의 DB 경로라 남겨 두되 chaos-pg 에 매이지 않게 한다. 시연 앱은 토식을 지나지 않는다.
  chaos-toxiproxy:
    depends_on: !reset []

  # ===== 관측 =====
  # DB 관련 수집 잡(postgres, blackbox-icmp, blackbox-tcp)과 Patroni·etcd·HAProxy 잡을 Patroni 판으로 바꾼다. 같은 컨테이너 경로를
  # 덮으므로 docker-compose.demo-obs.yml 이 마운트한 비동기 판(db-async.yml)을 대신한다.
  chaos-prometheus:
    volumes:
      - ./prometheus/demo-scrape/db-patroni.yml:/etc/prometheus/demo-scrape/db.yml:ro

  # 증명 대시보드의 DB 직조회 데이터 소스(pg-proof)가 chaos-pg 를 보므로 현재 Primary(chaos-haproxy-b)로 바꾼 파일을 겹친다.
  chaos-grafana:
    volumes:
      - ./grafana/provisioning-patroni/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro

volumes:
  chaos-etcd-1-data:
  chaos-etcd-2-data:
  chaos-etcd-3-data:
  chaos-db-1-data:
  chaos-db-2-data:
