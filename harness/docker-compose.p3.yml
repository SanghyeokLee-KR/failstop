# P3(파티션 리더 모드) 오버레이(ADR 0034 S7, 마켓분할_리더_S7_설계 4-9). 기본 파일과 중계 오버레이 뒤에 겹친다.
#   docker compose -p exchange-pml -f harness/docker-compose.chaos.yml -f harness/docker-compose.relay.yml \
#     -f harness/docker-compose.p3.yml --env-file harness/.env.chaos ...
# 실험 실행기는 직접 부르지 않고 lib.ps1 의 Set-P3Overlay 가 CHAOS_COMPOSE_OVERLAYS 를 relay;p3 순서로 채운다(up.ps1 -P3,
# adr0022-stage5-chaos.ps1 -P3, s7-p3-gate.ps1). P3 에서는 두 노드가 모두 마켓 절반만 쥐므로 WS 는 중계에만 기댄다(설계 2-9).
# 그래서 이 파일은 중계 오버레이 없이 쓰지 않는다.
#
# 순서가 중요하다. compose 는 같은 컨테이너 경로의 마운트를 뒤 파일 것으로 바꾸므로 순서가 바뀌면 chaos-lb 가 nginx.relay.conf 로
# 뜬다(harness/evidence/pml-s7-probe-20260925/ C7). 실행기(Test-P3Overlay)가 뜬 뒤 마운트 원본을 확인한다.
#
# 서비스를 더하지 않는다. 모드 자체는 DB 가 정한다(leader_protocol). 이 파일만 겹치고 전환 도구(protocol_latch.py transition
# --target 3)를 부르지 않으면 두 노드는 P2 로 뜨고 선호 설정은 뜻이 없다(LeaderPartitionProperties). DynamoDB 리스 보관소와는
# 함께 쓰지 못한다(LeaseStoreConfig 가 기동을 멈춘다).
#
# JDBC 주소는 기본 파일의 Toxiproxy 주소(api-1 15432, api-2 25432)를 그대로 두고 ApplicationName 만 붙인다. Q8 의 pgrowlocks 표본이
# pg_stat_activity.application_name 으로 잠금을 쥔 노드를 가른다. 두 앱은 Toxiproxy 를 거쳐 붙어 client_addr 로는 가를 수 없다.
# 세 연결 풀(요청, append, 리스)은 같은 DataSourceProperties 에서 나오므로 모두 이 이름을 쓴다. 주소를 바꾸면 E2(Q6)의 절단이
# 그 노드에 닿지 않는다. 비밀 값은 없다.
services:
  chaos-api-1:
    environment:
      EXCHANGE_LEADER_PARTITION_PREFERRED: matching-p0
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-toxiproxy:15432/exchange?ApplicationName=chaos-api-1
  chaos-api-2:
    environment:
      EXCHANGE_LEADER_PARTITION_PREFERRED: matching-p1
      SPRING_DATASOURCE_URL: jdbc:postgresql://chaos-toxiproxy:25432/exchange?ApplicationName=chaos-api-2
  # 파티션 업스트림과 /ws/ 중계를 합친 LB 설정(nginx.partition-relay.conf, 설계 4-9). 중계 오버레이의 같은 대상 마운트를 대신한다.
  chaos-lb:
    volumes: ["./nginx/nginx.partition-relay.conf:/etc/nginx/nginx.conf:ro"]
