# WebSocket 노드 단위 중계 브로커 설정(ADR 0034 S6, S6 설계 4-2·4-19). 폐기용 실험 스택(exchange-pml)의 중계 오버레이와
# 서버 Testcontainers 시험이 같은 파일을 쓴다. 계정과 비밀 값은 환경 변수(RABBITMQ_DEFAULT_USER, RABBITMQ_DEFAULT_PASS)로만
# 넣는다. 이 파일에 적지 않는다.

# 컨테이너 밖(앱 노드)에서 붙는다. 기본값은 guest 계정만 루프백으로 묶으므로 지정 계정에는 영향이 없다.
loopback_users = none

# AMQP 수신은 열지 않는다. 앱 노드는 STOMP 61613 으로만 붙는다.
listeners.tcp = none
stomp.listeners.tcp.1 = 61613

default_vhost = exchange
stomp.default_vhost = exchange

# 계정 권한을 봉투 토픽 교환기와 구독 큐로 좁힌다. STOMP /topic 구독은 이름이 stomp-subscription- 으로 시작하는 큐를 만든다.
default_permissions.configure = ^stomp-subscription-.*$
default_permissions.write = ^(amq\.topic|stomp-subscription-.*)$
default_permissions.read = ^(amq\.topic|stomp-subscription-.*)$

# 메모리 경보 수위는 절대값이다. 컨테이너 한도 320MiB 와 AWS bot-1 의 MemoryMax=320M 에 같은 수위를 둬 로컬 실험이
# AWS 와 같은 수위를 잰다. 몰아 넣기에서 169MiB 까지 오른 확인(pml-s6-probe-20260925 R10·R10b)보다 높게 둔다.
vm_memory_high_watermark.absolute = 192MiB
disk_free_limit.absolute = 256MiB

log.console.level = warning
