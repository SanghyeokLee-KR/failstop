# 외부 프로브 모듈. 정본 13.4 한계 14 를 닫는다.
#
# 봇은 앱 안에서 도는 스레드라 내부 경로만 왕복한다. 진입 계층이 죽어도 봇 지표는
# 정상으로 보인다. 밖에서 찌르는 프로브가 있어야 로드밸런서와 콘텐츠 전송 네트워크
# 구간의 고장을 잡는다(정본 7.10 말미).
#
# 로컬 하네스에서는 프로브가 같은 도커 네트워크 안에 있다. 곧 "완전 외부" 가 아니다.
# 상시면에서는 이 프로브를 봇 노드에 두므로 앱 노드 밖이기는 하나 VPC 안이다.
# VPC 밖 프로브는 별도 소요이고 아직 없다. 이 한계를 알고 읽어야 한다.

modules:
  # 진입 계층 생존. 2xx 면 성공이다.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      valid_status_codes: [200]
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4

  # 조회 대상 그룹 헬스. readiness 가 아니라 read 를 본다.
  #
  # readiness 는 쓰기를 받을 수 있는가를 답하므로 팔로워가 503 을 낸다. 진입 계층의
  # 생존을 재는 데 그 값을 쓰면 팔로워가 있는 정상 상태를 고장으로 읽는다.
  http_read_health:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      method: GET
      preferred_ip_protocol: ip4

  # TCP 계층. HTTP 가 죽었는지 포트 자체가 죽었는지를 가른다.
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4

  # 네트워크 계층 도달. 포트와 무관하게 호스트에 패킷이 닿는가만 본다.
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
