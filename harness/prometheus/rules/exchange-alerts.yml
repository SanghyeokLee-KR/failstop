# 알람 규칙(하네스_CICD_IaC.md §5-6). 격리 하네스 스택은 Alertmanager를 생략하고
# Prometheus 네이티브 알람으로 평가한다. 발화 상태는 ALERTS 시계열과 /alerts로 조회 가능해
# 기계 판정(임계 초과 시 pending→firing)이 성립한다. 알림 라우팅(contact point)은
# 정본 infra/ 토폴로지의 Grafana 통합 얼럿이 맡는다(§5-6). 하네스 축약 사유는 README 참조.
#
# 원천 메트릭은 전부 서버 실등록분(체결·지연·리더·원장·불변식·페일오버 + 스냅샷 4종
# exchange_snapshot_{captured,dropped,persist_failed}_total·_last_persisted_seq +
# 백프레셔·거부 2종 exchange_sequencer_queue_size·exchange_orders_rejected_total{reason}).
# DuplicateFill(exchange_duplicate_fills_total)은 서버
# 미등록이라 제외한다. 중복 체결 검출은 exchange_invariant_violations{check_name="TRADE_SEQ_DUP"}
# (C08)이 DB 원본으로 방어하므로 InvariantViolation 알람이 커버한다.
groups:
  - name: exchange.alerts
    interval: 10s
    rules:
      - alert: LedgerImbalance
        expr: max(abs(exchange_ledger_imbalance)) > 0
        for: 0s
        labels:
          severity: critical
          check: ASSET_CONSERVATION
        annotations:
          summary: "원장 자산 총합이 0이 아니다(자산 보존 위반)"
          description: "max(abs(exchange_ledger_imbalance))={{ $value }}. 항상 0이어야 한다. 즉시 정지·조사."

      - alert: InvariantViolation
        expr: max by (check_name, severity) (exchange_invariant_violations) > 0
        for: 30s
        labels:
          severity: "{{ $labels.severity }}"
        annotations:
          summary: "불변식 위반: {{ $labels.check_name }}"
          description: "check_name={{ $labels.check_name }} 위반행={{ $value }}. §5-6 C-카탈로그 심각도로 라우팅."

      - alert: OrderP99SloBreach
        expr: exchange:order_latency:p99_1m > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "주문 지연 p99가 500ms SLO 초과"
          description: "exchange:order_latency:p99_1m={{ $value }}s. 거부는 늘어도 무결성은 방어가 원칙."

      - alert: FailoverRtoExceeded
        expr: max(exchange_failover_downtime_seconds) > 30
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "페일오버 RTO 30s 목표 초과"
          description: "exchange_failover_downtime_seconds={{ $value }}s. 목표 <30s(API§7-4)."

      - alert: LeaderAbsent
        expr: absent(exchange_leader_is_leader == 1)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "리더 부재 15s 초과"
          description: "exchange_leader_is_leader==1 시계열 소멸. 승격 지연·양쪽 스탠바이 의심."

      # 스냅샷 파이프라인 경보(SnapshotCapture, 서버 실등록 4종). 정확성은 무손실이라
      # 무결성 계열(critical)이 아니라 복구 준비도 저하(warning)로 둔다. 지속되면 채택
      # 스냅샷이 낡아 복구가 저널 seq 0 전량 재생으로 폴백하고 RTO가 저널 크기에 비례한다.
      # 데모 저널이 작아 전량 재생이 우연히 RTO를 통과해도 이 경보가 스냅샷 경로 회귀를 드러낸다.
      - alert: SnapshotPersistFailed
        expr: rate(exchange_snapshot_persist_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 영속화 실패(복구 tail 상한 무력화 위험)"
          description: "instance={{ $labels.instance }} persist_failed rate={{ $value }}/s. 워커 INSERT 실패가 지속되면 채택 가능 스냅샷이 낡아 복구가 저널 전량 재생으로 폴백한다."

      - alert: SnapshotDropped
        expr: rate(exchange_snapshot_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 캡처 드롭(유계 큐 포화·인코딩 실패)"
          description: "instance={{ $labels.instance }} dropped rate={{ $value }}/s. 정확성은 무손실이나 채택 스냅샷 간격이 벌어져 tail 재생이 길어진다."

      - alert: SnapshotStalled
        expr: |
          changes(exchange_snapshot_last_persisted_seq[5m]) == 0
          and rate(exchange_snapshot_captured_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 영속화 정지(캡처 진행, seq 전진 없음)"
          description: "instance={{ $labels.instance }} last_persisted_seq가 5분 창에서 전진 0회인데 캡처는 큐잉 중. 워커 스레드 정체·영속화 지속 실패. 복구가 저널 전량 재생으로 폴백해 RTO가 저널 크기에 비례한다. 비리더는 캡처 rate 0이라 발화하지 않는다."

      # 시퀀서 백프레셔(§5-2 P4). 라이터 유계 큐 용량은 65536(ArrayBlockingQueue, EngineProperties
      # 기본값). 큐가 가득 차면 접수가 백프레셔 거부(rate_limited)로 떨어진다. 임계는 용량의 1/8
      # (8192)로, 포화 전 선행 경보다. 단일 라이터가 정상이면 큐는 2초 스크레이프 간 0 근처로 배수되므로
      # 1분 평균이 용량 1/8을 지속 초과하면 도착률이 배수율을 앞선다는 뜻이다. 무결성이 아니라 처리량
      # 저하 신호라 warning. exchange:sequencer_queue:avg1m은 리더 노드 큐의 1분 이동평균(레코딩 규칙).
      - alert: SequencerQueueBackpressure
        expr: exchange:sequencer_queue:avg1m > 8192
        for: 1m
        labels:
          severity: warning
          component: sequencer
        annotations:
          summary: "시퀀서 라이터 큐 백프레셔(포화 선행 경보)"
          description: "sequencer_queue avg1m={{ $value }} > 8192(용량 65536의 1/8). 도착률이 단일 라이터 배수율을 앞선다. 지속되면 큐 포화로 접수가 rate_limited 거부로 폴백한다."

      # 비rate_limited 거부 급증(§5-2 거부율). rate_limited(429)는 폭주 시 설계상 부하 차단 경로라
      # E3·E6 스파이크(3000/s)에서 정상 발화하므로 과알림 방지 위해 제외한다("거부는 늘어도 무결성은
      # 방어" 원칙, §5-6). 남는 사유(domain_rejected 422·bad_request 400·forbidden 403·payload 413)의
      # 급증은 클라이언트·마켓 설정 이상 신호다. 임계 10/s는 캘리브레이션 스파이크 도착률 3000/s의
      # 0.33%. 잔여 사유는 정상 부하에서 0 근처가 기대값이라 낮은 임계로 조기 검출한다.
      # exchange:orders_rejected:rate1m은 reason 유지 레코딩 규칙이라 {reason!="rate_limited"}로 거른다.
      - alert: OrderRejectSpike
        expr: exchange:orders_rejected:rate1m{reason!~"rate_limited|insufficient_funds|invalid_price|invalid_volume|over_max_order|under_min_order"} > 10
        for: 2m
        labels:
          severity: warning
          component: order-gateway
        annotations:
          summary: "주문 거부 급증(reason={{ $labels.reason }})"
          description: "reason={{ $labels.reason }} 거부율={{ $value }}/s > 10. 정상 부하 도메인 거부(rate_limited·insufficient_funds·invalid_price·invalid_volume·over/under_max/min_order)는 제외했으므로, 잔여 사유(account_suspended·admin_forbidden·out_of_scope·client_order_id_required·invalid_parameter) 급증은 클라이언트 버그·인증 이상을 시사한다."
