# 알람 규칙(하네스_CICD_IaC.md §5-6). 격리 하네스는 Alertmanager 없이 Prometheus 네이티브
# 알람으로 평가한다. ALERTS 시계열과 /alerts로 기계 판정이 성립한다. 알림 라우팅은 정본
# infra/ 토폴로지의 Grafana 통합 얼럿이 맡는다.
# 중복 체결은 서버 미등록 지표 대신 InvariantViolation(TRADE_SEQ_DUP)이 커버한다.
groups:
  - name: exchange.alerts
    interval: 10s
    rules:
      - alert: LedgerImbalance
        expr: max(abs(exchange_ledger_imbalance)) > 0
        for: 0s
        labels:
          severity: critical
          check: ASSET_CONSERVATION
        annotations:
          summary: "원장 자산 총합 위반"
          metric: "imbalance"
          value: "{{ $value }}"
          threshold: "> 0"
          duration: "0s"
          dashboard: "① 체결 무결성 증명 (proof-integrity)"
          runbook: "기획안 §7.4 장애 대응 절차"

      - alert: InvariantViolation
        expr: max by (check_name, severity) (exchange_invariant_violations) > 0
        for: 30s
        labels:
          severity: "{{ $labels.severity }}"
        annotations:
          summary: "불변식 위반: {{ $labels.check_name }}"
          metric: "violations"
          value: "{{ $value }} rows"
          threshold: "> 0"
          duration: "30s"
          dashboard: "① 체결 무결성 증명 (proof-integrity)"
          runbook: "기획안 §12.3 · 검증설계 §5-6 C-카탈로그"

      - alert: OrderP99SloBreach
        expr: exchange:order_latency:p99_1m > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "주문 지연 p99 SLO 초과"
          metric: "p99"
          value: "{{ $value }}s"
          threshold: "> 0.5s"
          duration: "2m"
          dashboard: "③ 부하·SLO (proof-load-slo)"
          runbook: "기획안 §7.8 부하 구간과 고부하 대응"

      - alert: FailoverRtoExceeded
        expr: max(exchange_failover_downtime_seconds) > 30
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "페일오버 RTO 목표 초과"
          metric: "downtime"
          value: "{{ $value }}s"
          threshold: "> 30s"
          duration: "0s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "기획안 §7.4 · API §7-4"

      - alert: LeaderAbsent
        expr: absent(exchange_leader_is_leader == 1)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "리더 부재"
          metric: "leader"
          value: "not detected"
          threshold: "absent 15s"
          duration: "15s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "기획안 §7.4 장애 대응 절차"

      - alert: RecoverableStandDownRepeating
        expr: increase(exchange_leader_recoverable_standdown_total[5m]) > 2
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "승격 재생 실패 반복"
          metric: "standdown 5m"
          value: "{{ $value }}"
          threshold: "> 2"
          duration: "0s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "기획안 §7.4 · DB 설계 §5.4"

      - alert: SnapshotPersistFailed
        expr: rate(exchange_snapshot_persist_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 영속화 실패"
          metric: "persist_failed"
          value: "{{ $value }}/s"
          threshold: "> 0"
          duration: "1m"
          dashboard: "④ 시스템 (proof-system)"
          runbook: "기획안 §7.5 백업과 복구"

      - alert: SnapshotDropped
        expr: rate(exchange_snapshot_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 캡처 드롭"
          metric: "dropped"
          value: "{{ $value }}/s"
          threshold: "> 0"
          duration: "1m"
          dashboard: "④ 시스템 (proof-system)"
          runbook: "기획안 §7.5 백업과 복구"

      - alert: SnapshotStalled
        expr: |
          changes(exchange_snapshot_last_persisted_seq[5m]) == 0
          and rate(exchange_snapshot_captured_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 영속화 정지"
          metric: "seq advance 5m"
          value: "0"
          threshold: "= 0"
          duration: "2m"
          dashboard: "④ 시스템 (proof-system)"
          runbook: "기획안 §7.5 백업과 복구"

      - alert: SequencerQueueBackpressure
        expr: exchange:sequencer_queue:avg1m > 50
        for: 1m
        labels:
          severity: warning
          component: sequencer
        annotations:
          summary: "시퀀서 큐 백프레셔"
          metric: "queue avg1m"
          value: "{{ $value }}"
          threshold: "> 50"
          duration: "1m"
          dashboard: "③ 부하·SLO (proof-load-slo)"
          runbook: "기획안 §7.8 부하 구간과 고부하 대응"

      - alert: OrderRejectSpike
        expr: exchange:orders_rejected:rate1m{reason!~"rate_limited|insufficient_funds|invalid_price|invalid_volume|over_max_order|under_min_order"} > 1
        for: 2m
        labels:
          severity: warning
          component: order-gateway
        annotations:
          summary: "주문 거부 급증"
          metric: "reject rate ({{ $labels.reason }})"
          value: "{{ $value }}/s"
          threshold: "> 1/s"
          duration: "2m"
          dashboard: "③ 부하·SLO (proof-load-slo)"
          runbook: "기획안 §7.4 장애 대응 절차"

      - alert: BotFleetDown
        expr: up{job="chaos-bots"} == 0
        for: 30s
        labels:
          severity: warning
          component: bots
        annotations:
          summary: "봇 플릿 스크레이프 불가"
          metric: "up"
          value: "0"
          threshold: "= 0"
          duration: "30s"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "기획안 §7.9 침묵 판정"

      - alert: TradeSilence
        expr: (sum(rate(exchange_trades_total[2m])) or vector(0)) == 0 and on() (max(up{job="exchange-api"}) == 1)
        for: 1m
        labels:
          severity: warning
          component: bots
        annotations:
          summary: "체결 침묵"
          metric: "trade rate 2m"
          value: "0 TPS"
          threshold: "= 0 TPS"
          duration: "1m"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "기획안 §7.9 침묵 판정"
