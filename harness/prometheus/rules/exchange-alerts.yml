# 알람 규칙(하네스_CICD_IaC.md §5-6). 격리 하네스는 Alertmanager 없이 Prometheus 네이티브
# 알람으로 평가한다. ALERTS 시계열과 /alerts로 기계 판정이 성립한다. 알림 라우팅은 정본
# infra/ 토폴로지의 Grafana 통합 얼럿이 맡는다.
# 중복 체결은 서버 미등록 지표 대신 InvariantViolation(TRADE_SEQ_DUP)이 커버한다.
groups:
  - name: exchange.alerts
    interval: 10s
    rules:
      - alert: LedgerImbalance
        expr: max(abs(exchange_ledger_imbalance)) > 0
        for: 0s
        labels:
          severity: critical
          check: ASSET_CONSERVATION
        annotations:
          summary: "원장 자산 총합이 0이 아니다(자산 보존 위반)"
          description: "max(abs(exchange_ledger_imbalance))={{ $value }}. 항상 0이어야 한다. 즉시 정지·조사."

      - alert: InvariantViolation
        expr: max by (check_name, severity) (exchange_invariant_violations) > 0
        for: 30s
        labels:
          severity: "{{ $labels.severity }}"
        annotations:
          summary: "불변식 위반: {{ $labels.check_name }}"
          description: "check_name={{ $labels.check_name }} 위반행={{ $value }}. §5-6 C-카탈로그 심각도로 라우팅."

      - alert: OrderP99SloBreach
        expr: exchange:order_latency:p99_1m > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "주문 지연 p99가 500ms SLO 초과"
          description: "exchange:order_latency:p99_1m={{ $value }}s. 거부는 늘어도 무결성은 방어가 원칙."

      - alert: FailoverRtoExceeded
        expr: max(exchange_failover_downtime_seconds) > 30
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "페일오버 RTO 30s 목표 초과"
          description: "exchange_failover_downtime_seconds={{ $value }}s. 목표 <30s(API§7-4)."

      - alert: LeaderAbsent
        expr: absent(exchange_leader_is_leader == 1)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "리더 부재 15s 초과"
          description: "exchange_leader_is_leader==1 시계열 소멸. 승격 지연·양쪽 스탠바이 의심."

      # 회복 가능 반납 반복은 재생 불가 신호다. 리더가 잠깐씩 존재해 LeaderAbsent가
      # 발화하지 않으므로 별도 축이 필요하다. E2 페일오버 1회의 정상 상한은 1이다.
      # 임계를 > 2로 둔 것은 increase() 외삽 오차 흡수용이고 상한이 2라는 뜻이 아니다.
      # 델타를 직접 재는 E2 실험 게이트는 외삽이 없어 상한 1을 그대로 쓴다(CICD §5-2).
      - alert: RecoverableStandDownRepeating
        expr: increase(exchange_leader_recoverable_standdown_total[5m]) > 2
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "승격 재생 실패 반복(회복 가능 반납 5분 2회 이상)"
          description: "instance={{ $labels.instance }} 5분 증가={{ $value }}(외삽 추정치라 실증분보다 크다). exchange_leader_epoch 계단과 대조해 승격·반납 루프인지 확인한다."

      # 스냅샷 파이프라인 경보(SnapshotCapture, 서버 실등록 4종). 정확성은 무손실이라
      # 무결성 계열(critical)이 아니라 복구 준비도 저하(warning)로 둔다. 지속되면 채택
      # 스냅샷이 낡아 복구가 저널 seq 0 전량 재생으로 폴백하고 RTO가 저널 크기에 비례한다.
      # 데모 저널이 작아 전량 재생이 우연히 RTO를 통과해도 이 경보가 스냅샷 경로 회귀를 드러낸다.
      - alert: SnapshotPersistFailed
        expr: rate(exchange_snapshot_persist_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 영속화 실패(복구 tail 상한 무력화 위험)"
          description: "instance={{ $labels.instance }} persist_failed rate={{ $value }}/s. 워커 INSERT 실패가 지속되면 채택 가능 스냅샷이 낡아 복구가 저널 전량 재생으로 폴백한다."

      - alert: SnapshotDropped
        expr: rate(exchange_snapshot_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 캡처 드롭(유계 큐 포화·인코딩 실패)"
          description: "instance={{ $labels.instance }} dropped rate={{ $value }}/s. 정확성은 무손실이나 채택 스냅샷 간격이 벌어져 tail 재생이 길어진다."

      - alert: SnapshotStalled
        expr: |
          changes(exchange_snapshot_last_persisted_seq[5m]) == 0
          and rate(exchange_snapshot_captured_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 영속화 정지(캡처 진행, seq 전진 없음)"
          description: "instance={{ $labels.instance }} last_persisted_seq가 5분 창에서 전진 0회인데 캡처는 큐잉 중. 워커 스레드 정체·영속화 지속 실패. 복구가 저널 전량 재생으로 폴백해 RTO가 저널 크기에 비례한다. 비리더는 캡처 rate 0이라 발화하지 않는다."

      # 시퀀서 백프레셔(§5-2 P4). 라이터 유계 큐 용량은 65536(ArrayBlockingQueue, EngineProperties
      # 기본값). 큐가 가득 차면 접수가 백프레셔 거부(rate_limited)로 떨어진다. 임계는 용량이 아니라
      # 실측에서 유도한다(아래). 단일 라이터가 정상이면 큐는 2초 스크레이프 간 0 근처로 배수되므로
      # 1분 평균이 임계를 지속 초과하면 도착률이 배수율을 앞선다는 뜻이다. 무결성이 아니라 처리량
      # 저하 신호라 warning. exchange:sequencer_queue:avg1m은 리더 노드 큐의 1분 이동평균(레코딩 규칙).
      # 임계 50의 유도(2026-09-03 실측, harness/evidence/gateoff-20260903-2vcpu/ 5·6회차).
      # 종전 8192는 용량 65536의 1/8이라는 산술로 잡은 값이고 관측 근거가 없었다. 두 방향
      # 모두에서 닿지 않는다. 게이트가 켜져 있으면 in-flight 상한이 큐를 1~3에 묶고, 꺼져
      # 있으면 큐가 8192에 닿기 전에 노드가 먼저 죽는다(2 vCPU 실측 최대 236).
      # 재유도는 avg1m 기준이다(이 알람이 쓰는 축). 게이트 OFF 계단에서
      # 정상 구간 주문 20/s(p95 1.6초)의 avg1m 최대가 29, 열화 시작 26/s(p95 4.7초)가 93이다.
      # 둘 사이를 갈라 50으로 잡는다. 정상 구간에서 오발화하지 않고, 응답이 쓸 수 없게 되는
      # 구간에서는 발화한다. 게이트 ON 주행의 큐는 1~3이라 평시 오발화 여지가 없다.
      - alert: SequencerQueueBackpressure
        expr: exchange:sequencer_queue:avg1m > 50
        for: 1m
        labels:
          severity: warning
          component: sequencer
        annotations:
          summary: "시퀀서 라이터 큐 백프레셔(포화 선행 경보)"
          description: "sequencer_queue avg1m={{ $value }} > 50(실측 재유도. 정상 20 OPS 29, 열화 26 OPS 93). 도착률이 단일 라이터 배수율을 앞선다. 지속되면 응답 지연이 초 단위로 오른다. 수용 게이트가 켜져 있는지 먼저 확인한다."

      # 비rate_limited 거부 급증. 429는 설계상 부하 차단 경로라 제외한다. 스파이크 창에서는
      # 주입 상한 100 req/s와 노드 수용 천장 40~42/s의 차가 설계대로 전량 429가 된다.
      # 임계 1/s의 유도는 CICD §5-2 미방출 항목의 exchange.orders.rejected 항에 둔다.
      - alert: OrderRejectSpike
        expr: exchange:orders_rejected:rate1m{reason!~"rate_limited|insufficient_funds|invalid_price|invalid_volume|over_max_order|under_min_order"} > 1
        for: 2m
        labels:
          severity: warning
          component: order-gateway
        annotations:
          summary: "주문 거부 급증(reason={{ $labels.reason }})"
          description: "reason={{ $labels.reason }} 거부율={{ $value }}/s > 1(확정 스파이크 상한 100 req/s의 1%). 정상 부하 도메인 거부(rate_limited·insufficient_funds·invalid_price·invalid_volume·over/under_max/min_order)는 제외했으므로, 잔여 사유(account_suspended·admin_forbidden·out_of_scope·client_order_id_required·invalid_parameter) 급증은 클라이언트 버그·인증 이상을 시사한다."
