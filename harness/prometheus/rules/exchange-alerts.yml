# 알람 규칙(하네스_CICD_IaC.md §5-6). 격리 하네스는 Alertmanager 없이 Prometheus 네이티브
# 알람으로 평가한다. ALERTS 시계열과 /alerts로 기계 판정이 성립한다. 알림 라우팅은 정본
# infra/ 토폴로지의 Grafana 통합 얼럿이 맡는다.
# 중복 체결은 서버 미등록 지표 대신 InvariantViolation(TRADE_SEQ_DUP)이 커버한다.
# runbook 의 기획안 절 번호와 절 제목은 2026-09-09 전면 재작성판 `제출_20260901/기획안_원본.md`
# 의 축어 인용이다. 종전 판의 "§7.4 장애 대응 절차"·"§7.8 부하 구간과 고부하 대응"·"§12.3"
# 은 새 정본에 대응 절이 없어, 각 알람이 보는 대상을 정의한 절로 재배정했다.
# 미결. 새 정본에 장애 대응 절차 절이 없고 저장소에 운영 런북 문서도 없다. 아래 runbook 은
# 판정 근거와 복구 절차 설계를 가리킬 뿐 당직자용 조치 카드가 아니다. 그 문서의 작성 주체와
# 위치는 아직 정하지 않았다.
groups:
  - name: exchange.alerts
    interval: 10s
    rules:
      - alert: LedgerImbalance
        expr: max(abs(exchange_ledger_imbalance)) > 0
        for: 0s
        labels:
          severity: critical
          check: ASSET_CONSERVATION
        annotations:
          summary: "원장 자산 총합 위반"
          metric: "imbalance"
          value: "{{ $value }}"
          threshold: "> 0"
          duration: "0s"
          dashboard: "① 체결 무결성 증명 (proof-integrity)"
          runbook: "기획안 §10.2 무결 판정 · 검증설계 §5-3 복구 리컨실리에이션 런북 R5"

      - alert: InvariantViolation
        # 위반 체크의 등급(CRITICAL·HIGH·WARN, InvariantCheck.Severity)을 이 파일의 다른 알람과 같은
        # critical·warning 이진 어휘로 접는다. Alertmanager critical 경로 매처가 소문자 정확히 일치라
        # 접지 않으면 CRITICAL 체크 위반이 치명 경로(10s·1h)를 못 타고 기본 경로(30s·4h)로만 간다.
        expr: label_replace(label_replace(max by (check_name, severity)
          (exchange_invariant_violations) > 0,
          "severity", "critical", "severity", "CRITICAL"),
          "severity", "warning", "severity", "HIGH|WARN")
        for: 30s
        labels:
          severity: "{{ $labels.severity }}"
        annotations:
          summary: "불변식 위반: {{ $labels.check_name }}"
          metric: "violations"
          value: "{{ $value }} rows"
          threshold: "> 0"
          duration: "30s"
          dashboard: "① 체결 무결성 증명 (proof-integrity)"
          runbook: "기획안 §10.2 무결 판정 · 검증설계 §4-1 체크 카탈로그"

      - alert: OrderP99SloBreach
        expr: exchange:order_latency:p99_1m > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "주문 지연 p99 SLO 초과"
          metric: "p99"
          value: "{{ $value }}s"
          threshold: "> 0.5s"
          duration: "2m"
          dashboard: "③ 부하·SLO (proof-load-slo)"
          runbook: "기획안 §7.3 어느 계층이 병목인지 어떻게 아는가 · §7.5 스케일링 실행 주체"

      - alert: FailoverRtoExceeded
        expr: max(exchange_failover_downtime_seconds) > 30
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "페일오버 RTO 목표 초과"
          metric: "downtime"
          value: "{{ $value }}s"
          threshold: "> 30s"
          duration: "0s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "기획안 §6.5 리더 임차와 세대 번호 · 검증설계 §5-3 복구 리컨실리에이션 런북 R0~R7 · API §7-4 SLO"

      - alert: LeaderAbsent
        expr: absent(exchange_leader_is_leader == 1)
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "리더 부재"
          metric: "leader"
          value: "not detected"
          threshold: "absent 15s"
          duration: "15s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "기획안 §6.5 리더 임차와 세대 번호 · 검증설계 §5-3 복구 리컨실리에이션 런북 R0~R7"

      - alert: RecoverableStandDownRepeating
        expr: increase(exchange_leader_recoverable_standdown_total[5m]) > 2
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "승격 재생 실패 반복"
          metric: "standdown 5m"
          value: "{{ $value }}"
          threshold: "> 2"
          duration: "0s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "기획안 §6.5 리더 임차와 세대 번호 · DB 설계 §5.4"

      # ADR 0034 S4 파티션 경보 셋(하네스 CI/CD §5-6, S4 설계 4-16). 학교 배포 규칙에는 넣지 않는다(P1, 결정한 값 19).
      # 차단 게이지에는 node 태그가 없어 스크레이프 대상 라벨 instance 로 노드를 가른다. 운영자가 원인을 본 뒤
      # /actuator/partitions 로 풀거나 재기동한다.
      - alert: PartitionBreakerOpen
        expr: max by (instance, partition) (exchange_partition_breaker_open) == 1
        for: 0s
        labels:
          severity: critical
          component: leader
        annotations:
          summary: "파티션 차단: {{ $labels.instance }} 가 {{ $labels.partition }} 의 후보에서 빠짐"
          metric: "partition_breaker_open"
          value: "{{ $value }}"
          threshold: "== 1"
          duration: "0s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "DB 설계 §5.4-c 10 차단기 · S4 설계 4-7 · /actuator/partitions reset_breaker"

      # 모든 노드가 그 파티션을 쥐지 않은 상태다. 노드가 모두 죽어 시계열이 없는 경우는 LeaderAbsent 가 잡는다.
      # P2 에서는 파티션이 하나라 LeaderAbsent 와 함께 뜬다.
      - alert: PartitionLeaderAbsent
        expr: max by (partition) (exchange_leader_is_leader) == 0
        for: 15s
        labels:
          severity: critical
          component: leader
        annotations:
          summary: "파티션 리더 부재: {{ $labels.partition }}"
          metric: "leader_is_leader"
          value: "{{ $value }}"
          threshold: "== 0"
          duration: "15s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "DB 설계 §5.4-c · 차단기로 두 노드가 모두 빠졌는지 PartitionBreakerOpen 과 함께 본다"

      # 강등한 파티션의 fresh 재구성이 되풀이해 실패한다. 격리된 옛 리더(E5)는 복귀 전까지 실패가 정상이다.
      - alert: PartitionRebuildFailing
        expr: increase(exchange_partition_rebuild_seconds_count{outcome="failure"}[5m]) > 3
        for: 0s
        labels:
          severity: warning
          component: leader
        annotations:
          summary: "파티션 재구성 반복 실패: {{ $labels.instance }} {{ $labels.partition }}"
          metric: "partition_rebuild_failure 5m"
          value: "{{ $value }}"
          threshold: "> 3"
          duration: "0s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "DB 설계 §5.4-c 5 fresh 재구성 · S4 설계 4-6"

      # 정산이 일시 DB 오류(55P03·57014·40P01·40001)를 재시도 제한(시도 4회 또는 경과 5초) 안에서 흡수하지 못했다.
      # 그 마켓 라이터가 멈추고 그 파티션이 강등했다는 뜻이라 한 번이어도 알린다(ADR 0034 S1, S4 부터 파티션 단위).
      # 카운터는 앱을 재기동해야 0 이 되므로 1 이상인 동안 발생 상태로 둔다. 재시도로 흡수한 경합은 transient_retries 로만 보고 알리지 않는다.
      # 학교 배포 규칙(deploy/linux/reporting/school-alerts.yml)의 같은 이름 경보와 같은 조건이다.
      - alert: SettlementTransientRetryExhausted
        expr: exchange_settlement_transient_exhausted_total > 0
        for: 0s
        labels:
          severity: critical
          component: settlement
        annotations:
          summary: "정산 일시 DB 오류 재시도 소진 · 노드 강등"
          metric: "transient_exhausted"
          value: "{{ $value }}"
          threshold: "> 0"
          duration: "0s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "DB 설계 §5.4 정산 sink 오류 분류 · ADR 0034 결정 8"

      # ADR 0034 S3(접수 시점 예약) 경보 셋. 학교 배포 규칙은 P1 이라 세 지표가 0 이다. 모드를 올리는 배포(S8)에서
      # 같은 이름으로 옮긴다(S3 설계 4-16).
      - alert: SettlementInsufficientFunds
        expr: increase(exchange_settlement_insufficient_funds_total[5m]) > 0
        for: 0s
        labels:
          severity: critical
          component: settlement
        annotations:
          summary: "정산 시점 잔고 부족(23514) · 라이터 정지"
          metric: "settlement_insufficient_funds"
          value: "{{ $value }}"
          threshold: "증가 > 0"
          duration: "0s"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "DB 설계 §5.1 P2 정산 규칙 · S3 설계 4-8 · P2 에서는 버그 신호"

      - alert: ReservationUnsettledStale
        expr: max(exchange_reservation_unsettled_oldest_seconds) > 60
        for: 2m
        labels:
          severity: warning
          component: settlement
        annotations:
          summary: "정산 전 예약이 60초 넘게 정산되지 않음(정산 정체·재적재 막힘)"
          metric: "reservation_unsettled_oldest"
          value: "{{ $value }}s"
          threshold: "> 60s"
          duration: "2m"
          dashboard: "② 자동 복구 증명 (proof-recovery)"
          runbook: "S3 설계 4-16 · 하네스 검증설계 §4-1 C14 정산 전 예약 항"

      - alert: OrderIntakeDeadlock
        expr: increase(exchange_order_append_transient_total{sqlstate="40P01"}[5m]) > 0
        for: 0s
        labels:
          severity: warning
          component: intake
        annotations:
          summary: "접수 append 교착(40P01) · 정산 잠금 계획 뒤에는 결함 신호"
          metric: "order_append_transient_40P01"
          value: "{{ $value }}"
          threshold: "증가 > 0"
          duration: "0s"
          dashboard: "④ 시스템 (proof-system)"
          runbook: "DB 설계 §5.0 v2.54 잠금 계획 · S3 설계 4-13·4-14"

      - alert: SnapshotPersistFailed
        expr: rate(exchange_snapshot_persist_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 영속화 실패"
          metric: "persist_failed"
          value: "{{ $value }}/s"
          threshold: "> 0"
          duration: "1m"
          dashboard: "④ 시스템 (proof-system)"
          runbook: "기획안 §7.9 백업과 복구"

      - alert: SnapshotDropped
        expr: rate(exchange_snapshot_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 캡처 드롭"
          metric: "dropped"
          value: "{{ $value }}/s"
          threshold: "> 0"
          duration: "1m"
          dashboard: "④ 시스템 (proof-system)"
          runbook: "기획안 §7.9 백업과 복구"

      - alert: SnapshotStalled
        expr: |
          changes(exchange_snapshot_last_persisted_seq[5m]) == 0
          and rate(exchange_snapshot_captured_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: snapshot
        annotations:
          summary: "스냅샷 영속화 정지"
          metric: "seq advance 5m"
          value: "0"
          threshold: "= 0"
          duration: "2m"
          dashboard: "④ 시스템 (proof-system)"
          runbook: "기획안 §7.9 백업과 복구"

      - alert: SequencerQueueBackpressure
        expr: exchange:sequencer_queue:avg1m > 50
        for: 1m
        labels:
          severity: warning
          component: sequencer
        annotations:
          summary: "시퀀서 큐 백프레셔"
          metric: "queue avg1m"
          value: "{{ $value }}"
          threshold: "> 50"
          duration: "1m"
          dashboard: "③ 부하·SLO (proof-load-slo)"
          runbook: "기획안 §7.3 어느 계층이 병목인지 어떻게 아는가 · §7.5 스케일링 실행 주체"

      - alert: OrderRejectSpike
        expr: exchange:orders_rejected:rate1m{reason!~"rate_limited|insufficient_funds|invalid_price|invalid_volume|over_max_order|under_min_order"} > 1
        for: 2m
        labels:
          severity: warning
          component: order-gateway
        annotations:
          summary: "주문 거부 급증"
          metric: "reject rate ({{ $labels.reason }})"
          value: "{{ $value }}/s"
          threshold: "> 1/s"
          duration: "2m"
          dashboard: "③ 부하·SLO (proof-load-slo)"
          runbook: "기획안 §7.3 어느 계층이 병목인지 어떻게 아는가 · §7.5 스케일링 실행 주체"

      - alert: BotFleetDown
        expr: up{job="chaos-bots"} == 0
        for: 30s
        labels:
          severity: warning
          component: bots
        annotations:
          summary: "봇 플릿 스크레이프 불가"
          metric: "up"
          value: "0"
          threshold: "= 0"
          duration: "30s"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "기획안 §7.10 침묵 판정"

      - alert: TradeSilence
        expr: (sum(rate(exchange_trades_total[2m])) or vector(0)) == 0 and on() (max(up{job="exchange-api"}) == 1)
        for: 1m
        labels:
          severity: warning
          component: bots
        annotations:
          summary: "체결 침묵"
          metric: "trade rate 2m"
          value: "0 TPS"
          threshold: "= 0 TPS"
          duration: "1m"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "기획안 §7.10 침묵 판정"

      # WS 동시 연결이 상한에 다가간다. 상한 자체는 노드를 지키지만 그 지점부터 신규 접속이
      # 거절되므로 사용자에게는 접속 불가로 보인다. 증설 판단 신호다.
      - alert: WsConnectionsNearLimit
        expr: max(exchange_admission_in_flight{scope="ws"}) / max(exchange_admission_limit{scope="ws"}) > 0.8
        for: 2m
        labels:
          severity: warning
          component: ws
        annotations:
          summary: "WS 동시 연결이 상한의 80% 초과"
          metric: "admission in_flight / limit (scope=ws)"
          value: "> 80%"
          threshold: "> 80%"
          duration: "2m"
          dashboard: "인프라 상세 (msp-infra)"
          runbook: "하네스 CICD·IaC §3-3 WS 동시연결 예산. 노드 증설 또는 앱 메모리 상향"

      # 상한에 걸려 실제로 거절이 나간다. 위 경고를 지나쳐 사용자가 접속하지 못하는 상태다.
      - alert: WsConnectionsRejected
        expr: sum(rate(exchange_admission_rejected_total{scope="ws"}[2m])) > 0
        for: 1m
        labels:
          severity: critical
          component: ws
        annotations:
          summary: "WS 신규 접속 거절 발생"
          metric: "admission rejected rate 2m (scope=ws)"
          value: "> 0/s"
          threshold: "> 0/s"
          duration: "1m"
          dashboard: "인프라 상세 (msp-infra)"
          runbook: "하네스 CICD·IaC §3-3. 거절은 노드를 지키는 정상 동작이고 대응은 증설이다"

      # ADR 0034 S6 WebSocket 중계 경보 셋(하네스 CI/CD §5-6, S6 설계 4-17). 중계 지표는 broker 모드 노드만 등록하므로 simple 모드
      # 스택에서는 시계열이 없어 뜨지 않는다. 브로커가 멈춰도 REST 는 그대로라 critical 로 두지 않는다. exchange_ws_gate_open 에는
      # 경보를 걸지 않는다. simple 모드 두 노드 배치의 팔로워는 늘 0 이 정상이다.
      - alert: WsRelayDisconnected
        expr: min by (instance) (exchange_ws_relay_connected) == 0
        for: 1m
        labels:
          severity: warning
          component: ws
        annotations:
          summary: "WS 중계 연결 끊김: {{ $labels.instance }}"
          metric: "ws_relay_connected(pub·sub 최솟값)"
          value: "{{ $value }}"
          threshold: "== 0"
          duration: "1m"
          dashboard: "인프라 상세 (msp-infra)"
          runbook: "S6 설계 4-11·9절. 브로커 생존과 계정을 본다. 모든 마켓을 쥐지 않은 노드는 5초 뒤부터 WS 를 거절한다"

      # 중계 불능이라 그 노드가 WS 세션을 닫고 핸드셰이크를 503 으로 거절하는 중이다. link_down 은 구독 연결 끊김,
      # owner_silent 는 유효한 리스를 쥔 소유 노드의 하트비트 부재(발행 막힘, 메모리 경보)다.
      - alert: WsRelayDegraded
        expr: max by (instance) (exchange_ws_relay_degraded) == 1
        for: 1m
        labels:
          severity: warning
          component: ws
        annotations:
          summary: "WS 중계 불능으로 WS 수용 중단: {{ $labels.instance }}"
          metric: "ws_relay_degraded(link_down·owner_silent 최댓값)"
          value: "{{ $value }}"
          threshold: "== 1"
          duration: "1m"
          dashboard: "인프라 상세 (msp-infra)"
          runbook: "API 설계 §5-6 · S6 설계 4-11. cause 태그로 구독 연결과 소유 노드 발행을 가른다"

      # 중계 봉투를 버린다. 받는 노드의 클라이언트는 결번으로 REST 재동기화한다(API 설계 §5-2).
      - alert: WsRelayDropping
        expr: increase(exchange_ws_relay_dropped_total[5m]) > 100
        for: 0s
        labels:
          severity: warning
          component: ws
        annotations:
          summary: "WS 중계 봉투 버림: {{ $labels.instance }} {{ $labels.reason }}"
          metric: "ws_relay_dropped 5m"
          value: "{{ $value }}"
          threshold: "> 100"
          duration: "0s"
          dashboard: "인프라 상세 (msp-infra)"
          runbook: "S6 설계 4-4·9절. queue_full·write_timeout 은 브로커 쪽 막힘, stale 은 발행 지연, malformed 는 위조나 판 불일치다"

      # 진입 계층 생존. 앱이 멀쩡해도 사용자가 못 들어오는 상태를 잡는다.
      #
      # 봇 지표로는 이 구간이 안 보인다. 봇은 앱 안에서 돌아 내부 경로만 왕복한다.
      # 정본 7.10 말미가 그 한계를 적고 13.4 항목 14 가 프로브 부재를 등재했다.
      - alert: EdgeProbeDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 30s
        labels:
          severity: critical
          component: edge
        annotations:
          summary: "외부 프로브 실패. 진입 계층에서 사용자가 막힌다"
          metric: "probe_success (blackbox-http)"
          value: "0"
          threshold: "== 0"
          duration: "30s"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "정본 7.3 이 계층별 병목 판정을 규정한다. 앱 지표가 정상인데 이 알람이 울리면 진입 계층이다. 로드밸런서와 웹 서빙을 먼저 본다"

      # 진입은 살아 있으나 느리다. 회색 장애의 진입 계층 판이다.
      - alert: EdgeProbeSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 2
        for: 2m
        labels:
          severity: warning
          component: edge
        annotations:
          summary: "외부 프로브 응답 2초 초과"
          metric: "probe_duration_seconds (blackbox-http)"
          value: "> 2s"
          threshold: "> 2s"
          duration: "2m"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "정본 7.3 판정표를 따른다. 앱 응답 분위수가 정상인데 이것만 느리면 진입 계층이다"

      # 계층 프로브(CLAUDE.md §19). 같은 호스트의 L3·L4·L7 결과로 고장 계층을 가른다.
      # 아래 계층이 실패하면 위 계층도 따라 실패하므로 alertmanager.yml 억제 규칙이 host 기준으로 위를 누른다.
      - alert: ProbeL3Unreachable
        expr: probe_success{layer="l3"} == 0
        for: 30s
        labels:
          severity: warning
          component: network
        annotations:
          summary: "L3 도달 실패. 호스트에 패킷이 닿지 않는다"
          metric: "probe_success (blackbox-icmp)"
          value: "0"
          threshold: "== 0"
          duration: "30s"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "네트워크 분리, 컨테이너 부재, 이름 해석 실패를 본다. 같은 host 의 L4·L7 알람은 억제된다"

      - alert: ProbeL4ConnectFailed
        expr: probe_success{layer="l4"} == 0
        for: 30s
        labels:
          severity: warning
          component: transport
        annotations:
          summary: "L4 연결 실패. 호스트에는 닿지만 포트가 연결을 받지 않는다"
          metric: "probe_success (blackbox-tcp)"
          value: "0"
          threshold: "== 0"
          duration: "30s"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "L3 가 정상인데 이것만 실패하면 리스너, 프로세스, 프록시 계층이다. 같은 host 의 L7 알람은 억제된다"

      - alert: ProbeL7Failed
        expr: probe_success{layer="l7"} == 0
        for: 30s
        labels:
          severity: warning
          component: application
        annotations:
          summary: "L7 응답 실패. 연결은 되지만 응답이 정상이 아니다"
          metric: "probe_success (blackbox-http-node)"
          value: "0"
          threshold: "== 0"
          duration: "30s"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "L3·L4 가 정상인데 이것만 실패하면 응용 계층이다. 일시 정지, 의존 DB 단절, 헬스 그룹 DOWN 을 본다"

      # 복제 축. 임계를 정해야 하는 알람은 일부러 넣지 않았다.
      #
      # 재생 지연이 얼마를 넘으면 나쁜지가 지금 이 계측으로 답하려는 질문 자체다. 값을 모르는
      # 채로 임계를 적으면 22절이 금지하는 지어낸 수치가 정본에 들어간다. 지연 임계 알람은
      # exchange:replica_replay_delay:seconds 의 실측 분포가 쌓인 뒤에 건다.
      #
      # 아래 둘은 임계가 아니라 이진 고장이라 지금 걸 수 있다.
      - alert: ReplicationNotStreaming
        expr: pg_replication_client_sent_replay_bytes{state!="streaming"} > -1
        for: 2m
        labels:
          severity: warning
          component: db
        annotations:
          summary: "복제가 streaming 이 아닌 상태로 2분"
          metric: "pg_replication_client_sent_replay_bytes{state}"
          value: "{{ $labels.state }}"
          threshold: "state != streaming"
          duration: "2m"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "재생이 멈추면 그만큼이 승격 시 유실량이다. docs/operations/DB_수동_페일오버.md 2-3"
      - alert: ReplicationSyncStateUnexpected
        expr: pg_replication_client_sent_replay_bytes{sync_state!="async"} > -1
        for: 1m
        labels:
          severity: warning
          component: db
        annotations:
          summary: "복제 모드가 async 가 아니다"
          metric: "pg_replication_client_sent_replay_bytes{sync_state}"
          value: "{{ $labels.sync_state }}"
          threshold: "sync_state != async"
          duration: "1m"
          dashboard: "MSP 종합 (msp-overview)"
          runbook: "ADR 0024 는 상시면을 비동기로 규정한다. 동기로 떠 있으면 정책과 배선이 갈렸다"
