# 레코딩 규칙. 대시보드·알람이 같은 식을 공유한다(하네스_CICD_IaC.md §5-3).
# 원천 메트릭은 서버 실등록 7종 중 trades·order.latency. histogram_quantile은
# exchange.order.latency Timer의 publishPercentileHistogram + 500ms SLO 경계 버킷에 의존한다
# (MarketDataPublisher.fillTimer). le="0.5" 버킷 직독으로 보간 없는 SLO 판정.
groups:
  - name: exchange.recording
    interval: 5s
    rules:
      - record: exchange:trades_per_second:rate1m
        expr: sum(rate(exchange_trades_total[1m]))
      - record: exchange:order_latency:p99_1m
        expr: histogram_quantile(0.99, sum by (le) (rate(exchange_order_latency_seconds_bucket[1m])))
      - record: exchange:order_latency:p95_1m
        expr: histogram_quantile(0.95, sum by (le) (rate(exchange_order_latency_seconds_bucket[1m])))
      - record: exchange:slo_500ms_ratio_1m
        expr: |
          sum(rate(exchange_order_latency_seconds_bucket{le="0.5"}[1m]))
          / sum(rate(exchange_order_latency_seconds_count[1m]))
      # 스냅샷 캡처 파이프라인 rate. SnapshotCapture의 FunctionCounter 3종(_total)을 대시보드·
      # 알람이 공유한다. 드롭·영속화 실패 급증이 채택 스냅샷을 낡게 만들어 복구가 저널 전량
      # 재생으로 폴백하는 회귀를 rate 상승으로 포착한다.
      - record: exchange:snapshot_captured:rate1m
        expr: sum(rate(exchange_snapshot_captured_total[1m]))
      - record: exchange:snapshot_dropped:rate1m
        expr: sum(rate(exchange_snapshot_dropped_total[1m]))
      - record: exchange:snapshot_persist_failed:rate1m
        expr: sum(rate(exchange_snapshot_persist_failed_total[1m]))
      # 주문 거부율(reason 유지). 대시보드 ③와 OrderRejectSpike가 공유한다.
      # reason은 ApiException.name() 유한 집합이라 by(reason) 카디널리티가 유계다.
      - record: exchange:orders_rejected:rate1m
        expr: sum by (reason) (rate(exchange_orders_rejected_total[1m]))
      # 단일 라이터 큐 깊이 1분 이동평균. 큐 게이지는 스크레이프 시점 queue.size() 표본이라
      # 순간 튐이 크다. avg_over_time으로 평활해 대시보드 ③와 SequencerQueueBackpressure가 공유한다.
      # max()로 리더 노드를 취한다(비리더 라이터는 유휴라 큐 0).
      - record: exchange:sequencer_queue:avg1m
        expr: max(avg_over_time(exchange_sequencer_queue_size[1m]))
