global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 격리 하네스는 dev 프로파일(8080 /actuator/prometheus)로 노출한다. 정본 §5-3의 admin 포트
# 9404 분리는 prod 토폴로지 규약이고, 이 스택의 api 노드는 dev 노출이라 8080을 스크레이프한다.
rule_files:
  - /etc/prometheus/rules/*.yml

# 발화한 알람을 보낼 곳. 이 절이 없으면 규칙이 발화해도 아무 데도 가지 않는다.
# 종전에 통지 경로가 0건이던 원인이 여기 부재였다.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['chaos-alertmanager:9093']

scrape_configs:
  - job_name: exchange-api
    metrics_path: /actuator/prometheus
    scrape_interval: 2s                 # 핵심 잡 고해상도. 페일오버 창을 2초 격자로 포착(§5-3)
    static_configs:
      - targets: ['chaos-api-1:8080', 'chaos-api-2:8080']
        labels: { stack: chaos, customer: exchange, service: api }

  # 봇 플릿 텔레메트리. 부하·주문 발행률·재전송을 페일오버 창과 함께 관측한다(§7 데모 재현).
  # 전제: bots 프로파일이 동일 포트(8080)에 /actuator/prometheus를 노출한다(server application.yml bots 문서).
  - job_name: chaos-bots
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chaos-bots:8080']
        labels: { stack: chaos, customer: exchange, service: bots }

  # 외부 프로브(정본 13.4 한계 14). blackbox 가 대상을 찌르고 프로메테우스가 결과를 긁는다.
  #
  # 대상은 사람이 실제로 지나는 경로다. 웹 정적 서빙과 API 진입이다. 앱 노드를 직접
  # 찌르지 않는다. 그건 exchange-api 잡이 이미 한다. 이 잡의 값은 진입 계층이 죽어
  # 앱은 멀쩡한데 사용자가 못 들어오는 상태를 잡는 데 있다.
  #
  # 조회 헬스는 read 경로를 쓴다. readiness 를 쓰면 팔로워의 정상 거절을 고장으로 읽는다.
  - job_name: blackbox-http
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://chaos-web:80/
          - http://chaos-lb:8080/actuator/health/read
        labels: { stack: chaos, customer: exchange, service: edge }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: chaos-blackbox:9115

  # 계층 프로브(CLAUDE.md §19). 같은 호스트를 L3 도달, L4 연결, L7 응답으로 따로 찔러 고장 계층을 가른다.
  # host 라벨은 세 잡에서 같은 값이 되도록 대상 주소에서 뽑는다. Alertmanager 억제 규칙이 이 라벨로 묶는다.
  # 진입 경로 판정은 위 blackbox-http 잡이 따로 소유한다. 아래 L7 잡은 호스트 단위 짝을 채우려고 둔다.
  - job_name: blackbox-icmp
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [icmp]
    static_configs:
      - targets: [chaos-lb, chaos-api-1, chaos-api-2, chaos-toxiproxy, chaos-pg]
        labels: { stack: chaos, customer: exchange, service: probe, layer: l3 }
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: '(?:https?://)?([^:/]+).*'
        target_label: host
      - target_label: __address__
        replacement: chaos-blackbox:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [tcp_connect]
    static_configs:
      - targets: [chaos-lb:8080, chaos-api-1:8080, chaos-api-2:8080, chaos-toxiproxy:15432, chaos-toxiproxy:25432, chaos-pg:5432]
        labels: { stack: chaos, customer: exchange, service: probe, layer: l4 }
    relabel_configs: *probe_relabel

  # 조회 헬스를 본다. readiness 는 팔로워가 정상으로 503 을 내므로 계층 고장과 섞인다.
  - job_name: blackbox-http-node
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [http_read_health]
    static_configs:
      - targets:
          - http://chaos-lb:8080/actuator/health/read
          - http://chaos-api-1:8080/actuator/health/read
          - http://chaos-api-2:8080/actuator/health/read
        labels: { stack: chaos, customer: exchange, service: probe, layer: l7 }
    relabel_configs: *probe_relabel

  # 데이터베이스 지표. 앱이 못 내는 축이다.
  - job_name: postgres
    static_configs:
      - targets: ["chaos-pg-exporter:9187"]
        labels: { stack: chaos, customer: exchange, service: db }

  # 컨테이너 자원. 이름은 cAdvisor 표준명이고 대시보드가 쓰는 container_* 는
  # exchange-recording.yml 이 이 원천에서 유도한다. 대시보드를 고치지 않기 위해
  # 어댑터를 규칙 층에 뒀다.
  - job_name: cstats
    static_configs:
      - targets: ["chaos-cstats:9200"]
        labels: { stack: chaos, customer: exchange, service: infra }
