# 로컬 MSP 시연용 Prometheus 설정. harness/docker-compose.demo-obs.yml 이 chaos-prometheus 에 겹칠 때만 쓴다.
#
# 기본 prometheus.yml 의 상위 집합이다. 기본 파일의 잡 이름과 기존 라벨(stack·customer·service)은 그대로 두고
# 학교 AWS 수집 규약(deploy/linux/observability/prometheus.yml)과 같은 이름의 라벨을 더한다.
#   environment=local-lab, account=local   AWS 는 aws·school 이다. 로컬 값을 aws 로 적지 않는다. local-lab 은
#                                      보고 서비스(deploy/reporting, install.py --environment local-lab|aws)와 같은 값이다.
#   role·node                          AWS 와 같은 역할 이름. chaos-api-1 → app-1(app), chaos-api-2 → app-2(app),
#                                      chaos-api-3 → app-3(reader, 떠 있을 때만), Docker 호스트 → docker-host(host).
#                                      DB 는 아래 DB 수집 파일이 정한다. 비동기 판은 chaos-pg → db-primary(data),
#                                      chaos-pg-standby → db-standby(standby), Patroni 판은 chaos-db-1 → db-1(data),
#                                      chaos-db-2 → db-2(standby)이고 Patroni 판의 role 은 부트스트랩 때의 배치 라벨일 뿐이다.
#                                      실제 Primary·Standby 는 pg_wal_position_in_recovery 로 가른다(ADR 0032).
#   job                                exchange-api, postgres, linux-host, blackbox-http 는 AWS 와 같은 이름이다.
# 기본 파일을 바꾸면 이 파일도 같이 맞춘다. harness/scripts/demo-obs-up.ps1 이 기동 전에 기본 파일의 잡이 모두
# 이 파일과 DB 수집 파일에 있는지 확인한다.
#
# DB 계층에 딸린 잡(postgres, blackbox-icmp, blackbox-tcp. Patroni 판은 patroni·etcd·haproxy 도)은 이 파일에 두지 않고
# /etc/prometheus/demo-scrape/db.yml 에서 읽는다. docker-compose.demo-obs.yml 이 비동기 판(demo-scrape/db-async.yml)을,
# docker-compose.demo-patroni.yml 이 같은 경로에 Patroni 판(demo-scrape/db-patroni.yml)을 마운트한다. 두 판이 같은 잡 이름을
# 쓰므로 한 번에 한 판만 읽힌다.
#
# 기본 파일과 다른 점은 넷이다.
#   1. exchange-api 에 honor_labels 를 켠다. 앱의 리더 지표 두 개가 node="exchange" 를 스스로 내는데, 대상
#      라벨 node=app-1 이 이기면 그 라벨이 exported_node 로 밀려 증명 대시보드(02-recovery)의 범례가 바뀐다.
#   2. blackbox-http 의 웹 입구를 chaos-web:80 대신 브라우저가 실제로 들어오는 http://host.docker.internal:3000/
#      으로 찌른다. 시연 배치에서 3000 번은 chaos-admin-gw 가 받아 호스트 3001 의 Next.js 개발 서버로 넘기고,
#      chaos-web(full·web 프로파일)은 뜨지 않는다. 뜨지 않는 컨테이너를 찌르면 기록 규칙
#      exchange:msp_probe_success:ratio5m 이 항상 0 이 된다. 기본 prometheus.yml 은 여전히 chaos-web:80 을 본다.
#   3. 잡을 더한다. postgres 에 대기 DB exporter(DB 수집 파일), 새 linux-host(Docker 호스트 node_exporter), 조회 노드
#      chaos-api-3 을 DNS 로 찾는 잡, MSP 서비스 경로 세 칸(웹 입구·정적 자산·LB)의 검사 대상, 관리 평면의
#      관제센터 지표(exchange-admin, AWS 와 같은 모양).
#   4. 시연 부하 경보(demo-rules/)를 더 읽는다. 카오스 실험 규칙(rules/)은 그대로다.
#
# 로컬 노드는 컨테이너라 노드마다 node_exporter 가 없다. 호스트 지표는 Docker 호스트(Docker Desktop VM) 한 대의
# 실측이고 모든 노드가 그 디스크를 함께 쓴다. 컨테이너별 CPU·메모리·네트워크는 cstats 가 재고, 여기서
# 고객 역할 컨테이너에만 node·role 을 붙인다. 다른 이름의 지표를 node_* 로 바꾸어 만들지 않는다.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# rules/ 는 카오스 실험 규칙(기본 설정과 같다). demo-rules/ 는 시연 부하 경보로, 이 오버레이만 마운트한다.
rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/demo-rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['chaos-alertmanager:9093']

# DB 계층 수집 잡. 어느 판인지는 compose 오버레이의 마운트가 정한다(머리 주석).
scrape_config_files:
  - /etc/prometheus/demo-scrape/db.yml

scrape_configs:
  - job_name: exchange-api
    metrics_path: /actuator/prometheus
    scrape_interval: 2s
    honor_labels: true
    static_configs:
      - targets: ['chaos-api-1:8080']
        labels: { stack: chaos, customer: exchange, service: api, environment: local-lab, account: local, role: app, node: app-1 }
      - targets: ['chaos-api-2:8080']
        labels: { stack: chaos, customer: exchange, service: api, environment: local-lab, account: local, role: app, node: app-2 }

  # 조회 전용 노드(app-3). 조정기(harness/asg/capacity_reconciler.py --sd-file)가 붙였다 뗄 때 대상 파일을 함께 고치므로
  # 조회 업스트림에 들어 있고 떠 있을 때만 대상이 된다. AWS 의 ASG 인스턴스를 서비스 검색으로 등록하는 것과 같은 자리다.
  # 종전에는 DNS 로 찾았다(dns_sd). 멈춘 컨테이너 이름에 도커 DNS 가 NXDOMAIN 대신 시간 초과를 돌려주는 때가 있고
  # Prometheus 는 조회 실패 때 이전 대상을 유지해, 멈춘 app-3 의 up=0 이 남아 보고서가 '수집 대상 7/8 응답'이 됐다
  # (2026-09-27 17:3x). 파일은 harness/demo/prometheus-sd.local/ 에 있고 docker-compose.demo-obs.yml 이 폴더째 마운트한다.
  # Docker Desktop 바인드 마운트는 파일 변경 통지가 오지 않아 refresh_interval 로 주기 읽기를 한다.
  # job 은 exchange-api 로 맞춘다. node 는 대상 이름의 번호로 정한다(chaos-api-3 → app-3).
  - job_name: exchange-api-reader
    metrics_path: /actuator/prometheus
    scrape_interval: 2s
    honor_labels: true
    file_sd_configs:
      - files: [/etc/prometheus/demo-sd/*.json]
        refresh_interval: 5s
    relabel_configs:
      - target_label: job
        replacement: exchange-api
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: 'chaos-api-([0-9]+):[0-9]+'
        target_label: node
        replacement: app-$1
      - { target_label: stack, replacement: chaos }
      - { target_label: customer, replacement: exchange }
      - { target_label: service, replacement: api }
      - { target_label: environment, replacement: local-lab }
      - { target_label: account, replacement: local }
      - { target_label: role, replacement: reader }

  - job_name: chaos-bots
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chaos-bots:8080']
        labels: { stack: chaos, customer: exchange, service: bots }

  # 관리 평면(chaos-admin)의 관제센터 지표. 학교 AWS 의 exchange-admin 잡과 같은 모양이다(AWS 는 bot-1 의 루프백 8081).
  # 로컬은 chaos-admin 이 컨테이너 망 전용 평문 8081 로 관리 지표를 연다(호스트에 공개하지 않는다). 그 포트를 열기 전에는
  # 이 대상이 down 이다. role=observability 라 MSP 화면의 고객 자원 집계(app|reader|data|standby|probe|host)에 들어가지 않는다.
  # instance 를 고정 이름으로 바꿔 수집 주소가 바뀌어도 시계열이 하나로 남게 한다. 규칙이 게이지의 마지막 값을 7일 쓴다.
  - job_name: exchange-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['chaos-admin:8081']
        labels: { customer: exchange, environment: local-lab, account: local, role: observability, node: bot-1, service: admin }
    relabel_configs:
      - target_label: instance
        replacement: exchange-admin
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'exchange_ops_threshold|exchange_msp_.*'
        action: keep

  # MSP 서비스 경로의 세 칸을 로컬의 같은 역할로 찌른다. 셋 다 role=probe 라 '외부 접속' 칸은 세 대상의 최솟값이다.
  #   service=edge        브라우저가 들어오는 웹 입구. 호스트 3000 → chaos-admin-gw → Next.js 개발 서버
  #   service=cloudfront  정적 웹 전달. 같은 입구의 정적 자산(/icon.svg). 개발 서버와 정적 export(web/out) 모두에 있다
  #   service=alb         조회 경로 로드밸런서 chaos-lb 의 /actuator/health/read
  # 프로브는 같은 도커 망 안에서 나가므로 VPC 밖 외부 관점은 아니다(blackbox.yml 머리 주석과 같은 한계).
  - job_name: blackbox-http
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://chaos-lb:8080/actuator/health/read
        labels: { stack: chaos, customer: exchange, service: edge }
      - targets: [http://host.docker.internal:3000/]
        labels: { stack: chaos, customer: exchange, service: edge, environment: local-lab, account: local, role: probe }
      - targets: [http://host.docker.internal:3000/icon.svg]
        labels: { stack: chaos, customer: exchange, service: cloudfront, environment: local-lab, account: local, role: probe }
      - targets: [http://chaos-lb:8080/actuator/health/read]
        labels: { stack: chaos, customer: exchange, service: alb, environment: local-lab, account: local, role: probe }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: chaos-blackbox:9115

  # blackbox-icmp(L3)·blackbox-tcp(L4) 는 대상에 DB 경로가 들어 있어 DB 수집 파일로 옮겼다. L7 은 앱·LB 만 본다.
  - job_name: blackbox-http-node
    metrics_path: /probe
    scrape_interval: 10s
    params:
      module: [http_read_health]
    static_configs:
      - targets:
          - http://chaos-lb:8080/actuator/health/read
          - http://chaos-api-1:8080/actuator/health/read
          - http://chaos-api-2:8080/actuator/health/read
        labels: { stack: chaos, customer: exchange, service: probe, layer: l7 }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: '(?:https?://)?([^:/]+).*'
        target_label: host
      - target_label: __address__
        replacement: chaos-blackbox:9115

  # postgres 잡(DB exporter)도 DB 수집 파일에 있다.

  # Docker 호스트 한 대의 node_exporter. 파일시스템·inode·디스크 I/O·백업 textfile 을 읽는다.
  # 모든 노드 컨테이너가 이 호스트의 /var/lib(ext4) 한 디스크를 함께 쓴다. role=host 는 로컬에만 있는 값이라
  # 로컬 판 대시보드(harness/grafana/build-local-msp.py)의 역할 정규식에 host 를 더한다.
  - job_name: linux-host
    static_configs:
      - targets: ["chaos-node-exporter:9100"]
        labels: { stack: chaos, customer: exchange, service: infra, environment: local-lab, account: local, role: host, node: docker-host }

  # 컨테이너 자원. 기본 라벨에 environment·account 만 더하고, 고객 역할 컨테이너에만 node·role 을 붙인다.
  # 그 밖의 컨테이너(관측·봇·프록시·etcd·HAProxy 등)는 역할이 없어 MSP 화면에 잡히지 않는다.
  # DB 는 두 판의 이름을 함께 적는다. 떠 있지 않은 컨테이너는 계열이 없어 규칙이 남아도 값이 생기지 않는다.
  # Patroni 판의 role(chaos-db-1 data, chaos-db-2 standby)은 부트스트랩 배치 라벨이다(머리 주석).
  - job_name: cstats
    static_configs:
      - targets: ["chaos-cstats:9200"]
        labels: { stack: chaos, customer: exchange, service: infra, environment: local-lab, account: local }
    metric_relabel_configs:
      - { source_labels: [name], regex: chaos-api-1, target_label: node, replacement: app-1 }
      - { source_labels: [name], regex: chaos-api-1, target_label: role, replacement: app }
      - { source_labels: [name], regex: chaos-api-2, target_label: node, replacement: app-2 }
      - { source_labels: [name], regex: chaos-api-2, target_label: role, replacement: app }
      - { source_labels: [name], regex: chaos-api-3, target_label: node, replacement: app-3 }
      - { source_labels: [name], regex: chaos-api-3, target_label: role, replacement: reader }
      - { source_labels: [name], regex: chaos-pg, target_label: node, replacement: db-primary }
      - { source_labels: [name], regex: chaos-pg, target_label: role, replacement: data }
      - { source_labels: [name], regex: chaos-pg-standby, target_label: node, replacement: db-standby }
      - { source_labels: [name], regex: chaos-pg-standby, target_label: role, replacement: standby }
      - { source_labels: [name], regex: chaos-db-1, target_label: node, replacement: db-1 }
      - { source_labels: [name], regex: chaos-db-1, target_label: role, replacement: data }
      - { source_labels: [name], regex: chaos-db-2, target_label: node, replacement: db-2 }
      - { source_labels: [name], regex: chaos-db-2, target_label: role, replacement: standby }
