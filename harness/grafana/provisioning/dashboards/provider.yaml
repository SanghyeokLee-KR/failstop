apiVersion: 1

# 파일 프로비저닝. UI 편집 잠금, 변경은 파일 수정으로만(§5-4 allowUiUpdates:false).
providers:
  - name: exchange-proof
    orgId: 1
    folder: 증명
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
