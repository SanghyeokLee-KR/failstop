# 로컬 관리 관문(chaos-admin-gw). 학교 AWS 앱 Nginx의 관리 경로(deploy/linux/app/nginx-admin.conf)와 같은 모양이다.
#
# 브라우저는 http://localhost:3000 한 출처만 본다. 거래 웹은 호스트 3001의 Next.js 개발 서버로, 관리 API는
# chaos-admin(8443 mTLS)으로 넘긴다. 같은 출처라 관리 API에 CORS 사전 요청이 생기지 않는다. 교차 출처로
# 8443을 직접 부르면 브라우저가 사전 요청(OPTIONS)에 클라이언트 인증서를 싣지 않아 TLS 단계에서 끊긴다.
#
# 운영자 PC에 인증서를 설치하지 않는다. 로그인 비밀번호는 이 관문의 htpasswd만 확인하고 관리 서버로 넘기지
# 않으며(Authorization 제거), 관리 서버와는 관문이 데모 운영자 인증서로 내부 mTLS를 맺는다.
# 준비물(PEM·htpasswd)은 harness/scripts/demo-admin-gw-init.sh 가 harness/demo/admin-gw.local/ 에 만든다.

limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;

    # 로그인. POST 한 가지만 받고 비밀번호는 여기서 확인한 뒤 지운다
    location = /admin/v1/session {
        limit_except POST { deny all; }
        limit_req zone=admin_login burst=3 nodelay;
        limit_req_status 429;
        auth_basic "Exchange operator (local demo)";
        auth_basic_user_file /etc/nginx/admin-gw/admin.htpasswd;
        proxy_set_header Authorization "";
        include /etc/nginx/admin-gw-upstream.conf;
    }

    # 로그인 뒤의 관리 API. 세션 경로의 변형은 막는다(AWS와 같다)
    location ^~ /admin/v1/ {
        if ($uri ~ "^/admin/v1/session") { return 404; }
        include /etc/nginx/admin-gw-upstream.conf;
    }

    # 거래 웹과 관리 화면(Next.js 개발 서버). 개발 서버의 HMR 웹소켓도 같이 넘긴다
    location / {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
