# 거래 웹 정적 서빙. trailingSlash 미설정 빌드라 라우트가 /admin -> admin.html로 떨어지므로
# .html 폴백을 명시한다. SPA 폴백은 쓰지 않는다. 없는 경로가 200이 되어 404 화면이 사라진다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 해시 파일명이라 영구 캐시가 안전하다. 재배포는 파일명이 바뀐다.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
        # HTML은 캐시하지 않는다. 데모 중 재배포가 즉시 반영돼야 한다.
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
