# 거래 웹 정적 서빙(compose.yaml chaos-web). Next.js output:"export" 산출물을 그대로 낸다.
#
# trailingSlash 미설정 빌드라 라우트가 /admin -> admin.html 형태로 떨어진다. 기본 nginx는
# /admin을 디렉터리로 보고 admin/index.html을 찾다 실패하므로 .html 폴백을 명시한다.
# 순서가 중요하다. $uri(정확 파일) -> $uri.html(라우트) -> $uri/(디렉터리) -> 404.
#
# SPA 폴백(모든 경로를 index.html로)은 쓰지 않는다. 정적 export는 라우트마다 실제 HTML이
# 있어 폴백이 오히려 없는 경로를 200으로 만들고, 그러면 404 화면이 영영 안 보인다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 해시 파일명이라 영구 캐시가 안전하다. 재배포는 파일명이 바뀐다.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
        # HTML은 캐시하지 않는다. 데모 중 재배포가 즉시 반영돼야 한다.
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
