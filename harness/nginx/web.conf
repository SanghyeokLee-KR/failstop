# 거래 웹 정적 서빙. trailingSlash 미설정 빌드라 라우트가 /admin -> admin.html로 떨어지므로
# .html 폴백을 명시한다. SPA 폴백은 쓰지 않는다. 없는 경로가 200이 되어 404 화면이 사라진다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 관리 API 와 하네스와 actuator 는 라우팅하지 않는다. 외부 노출 대상이 아니다.
    # AWS 평면의 edge 계약과 같다(deploy/nginx-edge.conf.template).
    #
    # 막는 것은 관리 API(/admin/v1/)이지 관리 화면(/admin/bots 등)이 아니다. 화면은 정적
    # 산출물이고 그 자체로는 권한을 갖지 않는다. 종전 규칙은 ^/admin/ 이라 화면까지 404 였고
    # 그래서 관리자 모드에 들어갈 수 없었다(실측 2026-09-08).
    location ~ ^/(admin/v1|harness|actuator)/ {
        return 404;
    }

    # API 와 WebSocket 을 같은 오리진으로 받는다. 정본 6.7 이 NEXT_PUBLIC_API_BASE 를 빈
    # 문자열로 규정하고 AWS 평면에서는 CloudFront 2 오리진이 그 역할을 한다(ADR 0011).
    # 로컬 데모에서 이 프록시가 그 자리를 대신한다. 없으면 브라우저가 API 를 교차 출처로
    # 부르게 되고 CORS 에 막힌다. 실측 2026-09-08: 시세·차트·WS 전부 차단됐다.
    location /api/ {
        proxy_pass http://chaos-lb:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    # heartbeat 10s/10s 라 idle 타임아웃이 발생하지 않는다.
    location /ws/ {
        proxy_pass http://chaos-lb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 해시 파일명이라 영구 캐시가 안전하다. 재배포는 파일명이 바뀐다.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ /404.html;
        # HTML은 캐시하지 않는다. 데모 중 재배포가 즉시 반영돼야 한다.
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
