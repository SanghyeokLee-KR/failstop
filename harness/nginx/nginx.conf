worker_processes 1;
events { worker_connections 4096; }

http {
    # api-1을 1차, api-2를 백업으로 둔다. 초기 리더=api-1(먼저 기동해 부트스트랩 리스 선점)과
    # 트래픽 경로를 일치시키고, api-1 kill 시 백업(api-2, 승격한 신 리더)으로 넘어간다.
    upstream exchange_api {
        server chaos-api-1:8080 max_fails=1 fail_timeout=2s;
        server chaos-api-2:8080 backup;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://exchange_api;
            proxy_set_header Host $host;
            # 리더 아님(503)·연결 실패·타임아웃 시 즉시 다음 업스트림으로 재시도.
            # non_idempotent가 없으면 nginx는 POST를 재시도하지 않는다(기본 규약). 그러면 이
            # 재시도는 조회에만 걸리고 정작 리더가 필요한 주문 쓰기는 팔로워의 503을 그대로
            # 클라이언트에 돌려준다. 구 리더가 팔로워로 재합류해 살아 있는 동안(E5 복귀, E7
            # unpause, kill 후 재기동) 1차 업스트림이 계속 503을 내는데 nginx는 그 노드를
            # 죽은 것으로 보지 않으므로, 백업 승계도 일어나지 않아 쓰기가 통째로 막힌다(실측:
            # E4 직후 api-1을 되살리자 POST /orders 전량 503, GET /orderbook은 200).
            # 주문 재시도는 안전하다. 접수 전 게이트에서 거절된 요청이라 상태 변화가 없고,
            # 설령 도달했더라도 client_order_id 멱등(uq_orders_client, C07')이 이중 접수를 막는다.
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
