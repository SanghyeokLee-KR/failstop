worker_processes 1;
events { worker_connections 4096; }

http {
    # WebSocket 업그레이드 전달용. Upgrade 헤더가 있으면 Connection: upgrade, 없으면 close다.
    # 이것이 없으면 STOMP CONNECT가 LB에서 일반 HTTP로 다뤄져 핸드셰이크가 깨진다.
    # 실측(2026-08-29): 같은 프로브가 api-1 직접은 249kB 수신·재동기화 실패 0인데
    # LB 경유는 972B·실패 4건이었다. 검증설계 §2-2의 ws_seq_gap·ws_epoch_resync_fail
    # 임계 둘이 표본 없이 통과하던 원인이다.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker 내장 DNS. upstream의 resolve와 짝이다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # api-1을 1차, api-2를 백업으로 둔다. 초기 리더=api-1(먼저 기동해 부트스트랩 리스 선점)과
    # 트래픽 경로를 일치시키고, api-1 kill 시 백업(api-2, 승격한 신 리더)으로 넘어간다.
    upstream exchange_api {
        # resolve가 없으면 nginx는 기동 시점 IP를 굳히고 다시 보지 않는다. 컨테이너를 재생성하면
        # IP가 바뀌어 LB가 죽은 IP를 계속 두드리고, 사람이 reload해야 풀린다. 노드를 되살리는
        # E4·E5·E7마다 새는 자리다. 실측 수치는 검증설계 §2-4 5항에 둔다. resolve는 1.27.3부터
        # 오픈소스에 열린 기능이고(이미지 1.29) zone이 전제 조건이다.
        # 교환 조건: 이름 미해결의 실패 양식이 기동 실패에서 런타임 502로 바뀐다. chaos-lb에
        # healthcheck가 없어 데모 진입 조건인 "전 서비스 healthy"가 이 상태를 통과시킨다. 대응
        # 위치는 harness/docker-compose.chaos.yml의 chaos-lb이며 이 파일 소관이 아니다.
        #
        # 검증(2026-08-29). api-1 정지, 다른 컨테이너가 172.18.0.11 선점, 재기동으로 .12 이동.
        # reload 없이 워커가 새 IP를 잡았다(워커 03:39:06 기동 후 교체 없음, /proc/net/tcp에
        # 172.18.0.12:8080 ESTABLISHED). 창 전체 관측: 봇 트래픽(172.18.0.7)이 05:26:11~05:26:19,
        # 05:26:38~05:26:45 두 구간에서 5xx 147건(502 143·503 4). 오류 로그도 147건이고 no live
        # upstreams 143건이 502와 1:1, 나머지 4건은 구 IP .11 connect 거부다. 같은 창에서 GET 200은
        # 평소 속도를 유지했고 끊긴 것은 쓰기다(api-1 StartedAt 05:26:40, 오류 종료 05:26:45).
        # 05:28:09~05:28:16 프로브 200회 전량 200은 복구 후 정상성 확인이지 창 관측이 아니다.
        # 피어 집합 교체 과도 구간의 쓰기가 왜 살아 있는 백업으로 흡수되지 않는지는 미규명이고,
        # 규명 전까지 이 설정으로 5xx 0을 주장하지 않는다.
        zone exchange_api 64k;
        server chaos-api-1:8080 resolve max_fails=1 fail_timeout=2s;
        # 백업은 퇴출하지 않는다(max_fails=0). 팔로워가 쓰기에 내는 503은 정상 거동인데
        # proxy_next_upstream이 실패로 계상해 정상 백업이 스스로 빠지고, 이후 1차가 잠깐만
        # 흔들려도 살아 있는 업스트림이 0이 돼 읽기까지 502가 된다. 실측(2026-08-29, smoke):
        # 기본값 no live upstreams 44,050건·http_req_failed 9.61%·임계 4종 실패, max_fails=0은
        # 568건·0.89%·임계 2종 실패. 페일오버는 유지된다. 1차 퇴출 기제(max_fails=1)는 그대로고,
        # 백업이 진짜 죽으면 요청 단위 실패가 나되 업스트림 집합이 비지는 않는다.
        server chaos-api-2:8080 resolve backup max_fails=0;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://exchange_api;
            proxy_set_header Host $host;
            # 업그레이드에는 HTTP/1.1이 필요하다. 기본 1.0은 Connection 헤더를 전달하지 않는다.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # 리더 아님(503)·연결 실패·타임아웃 시 즉시 다음 업스트림으로 재시도.
            # non_idempotent가 없으면 nginx는 POST를 재시도하지 않는다(기본 규약). 그러면 이
            # 재시도는 조회에만 걸리고 정작 리더가 필요한 주문 쓰기는 팔로워의 503을 그대로
            # 클라이언트에 돌려준다. 구 리더가 팔로워로 재합류해 살아 있는 동안(E5 복귀,
            # E7 unpause, kill 후 재기동) 내내 해당한다.
            # 실측 1회(2026-08-18, E4 직후 chaos-api-1 재기동): POST /api/v1/orders 전량 503,
            # GET /api/v1/orderbook은 200, 체결 정지. non_idempotent 추가 후 reload만으로 POST
            # 201 전환, 20초에 체결 599건 재개. 그 관측에서 백업 승계가 안 보인 이유는 백업도
            # 함께 퇴출돼 있었기 때문이다(2026-08-29 대량 관측으로 확인, 위 upstream 주석).
            # 주문 재시도는 안전하다. 접수 전 게이트에서 거절된 요청이라 상태 변화가 없고,
            # 도달했더라도 client_order_id 멱등(API§7-6 동일 키·내용 동일 시 200 replay,
            # uq_orders_client 강제)이 이중 접수를 막는다. tries 2라 증폭도 2회로 묶인다.
            # 전방 결합: NonceStore가 공유 저장소(M2 Redis)로 바뀌면 이 재시도가 등록된 nonce를
            # 재생해 401이 되고, 401은 k6 expectedStatuses 밖이라 가용성 실패로 계상된다.
            # 그때 이 설정과 검증설계 §3 E7' 오류율 예산을 함께 재검토한다.
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
