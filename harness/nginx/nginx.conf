worker_processes 1;
events { worker_connections 4096; }

http {
    # Docker 내장 DNS. upstream의 resolve와 짝이다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # api-1을 1차, api-2를 백업으로 둔다. 초기 리더=api-1(먼저 기동해 부트스트랩 리스 선점)과
    # 트래픽 경로를 일치시키고, api-1 kill 시 백업(api-2, 승격한 신 리더)으로 넘어간다.
    upstream exchange_api {
        # resolve가 없으면 nginx는 기동 시점에 이름을 IP로 굳히고 다시 보지 않는다. 컨테이너를
        # 재생성하면 IP가 바뀌므로(docker start는 유지, compose up 재생성은 변경) LB가 죽은 IP를
        # 계속 두드린다. 1차가 통째로 죽은 것으로 계상되고, 백업만 남은 상태에서 팔로워의 정상
        # 503이 겹치면 전 요청 502가 된다.
        # 실측(2026-08-29): E4로 api-1 kill 후 재기동한 뒤 502 10,239건·no live upstreams 9,528건.
        # nginx -s reload 한 번으로 0이 됐다. 사람이 reload를 기억해야 하는 설계라 카오스 실험
        # 중에 반드시 새는 자리다. E4·E5·E7이 전부 노드를 되살리는 실험이다.
        # resolve는 nginx 1.27.3부터 오픈소스에 열렸다(이미지 1.29). zone이 전제 조건이다.
        # 검증(2026-08-29): api-1을 정지하고 다른 컨테이너가 그 IP를 선점하게 한 뒤 재기동해
        # 172.18.0.11에서 .12로 이동시켰다. reload 없이 LB 경유 200회 전부 성공, 5xx 0건.
        # 교정 전 같은 상황이 502 폭주였다.
        zone exchange_api 64k;
        server chaos-api-1:8080 resolve max_fails=1 fail_timeout=2s;
        # 백업은 퇴출하지 않는다(max_fails=0). 팔로워는 쓰기에 503을 내는 것이 정상 거동인데
        # proxy_next_upstream이 http_503을 실패로 계상하므로, 기본값이면 정상 백업이 스스로
        # 퇴출된다. 그 뒤 1차 노드가 잠깐이라도 흔들리면 살아 있는 업스트림이 하나도 남지
        # 않아 nginx가 전 요청에 502를 낸다. 팔로워가 읽기로 답할 수 있는 요청까지 막힌다.
        #
        # 실측(2026-08-29, smoke 프로파일). 기본값: no live upstreams 44,050건·
        # http_req_failed 9.61%·임계 4종 실패. max_fails=0: 568건·0.89%·임계 2종 실패.
        # 재조회와 멱등 규약 임계가 통과로 돌아섰다.
        #
        # 페일오버는 손상되지 않는다. 1차 노드 퇴출 기제(max_fails=1)는 그대로고, 백업이
        # 퇴출되지 않으므로 승격 대기 창에서 오히려 트래픽이 유지된다. 백업이 진짜 죽으면
        # 연결 오류로 요청 단위 실패가 나되 업스트림 집합이 비지는 않는다.
        server chaos-api-2:8080 resolve backup max_fails=0;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://exchange_api;
            proxy_set_header Host $host;
            # 리더 아님(503)·연결 실패·타임아웃 시 즉시 다음 업스트림으로 재시도.
            # non_idempotent가 없으면 nginx는 POST를 재시도하지 않는다(기본 규약). 그러면 이
            # 재시도는 조회에만 걸리고 정작 리더가 필요한 주문 쓰기는 팔로워의 503을 그대로
            # 클라이언트에 돌려준다. 구 리더가 팔로워로 재합류해 살아 있는 동안(E5 복귀,
            # E7 unpause, kill 후 재기동) 내내 해당한다.
            # 실측 1회(2026-08-18, E4 직후 chaos-api-1 재기동): POST /api/v1/orders 전량 503,
            # GET /api/v1/orderbook은 200, 체결 정지. non_idempotent 추가 후 reload만으로 POST
            # 201 전환, 20초에 체결 599건 재개. 그 관측에서는 백업 승계가 일어나지 않았는데,
            # 503이 max_fails에 계상돼 노드가 내려갔어야 한다는 서술(DB§9 v2.29)과 어긋난다.
            # 어느 기제가 맞는지는 1회 관측으로 단정하지 않는다. 교정 타당성은 기제와 무관하다.
            # 2026-08-29 보강: 백업 퇴출이 실재함을 대량 관측으로 확인했다(위 upstream 주석).
            # 그 관측에서 백업 승계가 안 보였던 이유가 이것이다. 백업도 함께 퇴출돼 있었다.
            # 재시도가 켜지면 어느 쪽이든 POST가 신 리더로 넘어가기 때문이다.
            # 주문 재시도는 안전하다. 접수 전 게이트에서 거절된 요청이라 상태 변화가 없고,
            # 도달했더라도 client_order_id 멱등(API§7-6 동일 키·내용 동일 시 200 replay,
            # uq_orders_client 강제)이 이중 접수를 막는다. tries 2라 증폭도 2회로 묶인다.
            # 전방 결합: NonceStore가 공유 저장소(M2 Redis)로 바뀌면 이 재시도가 등록된 nonce를
            # 재생해 401이 되고, 401은 k6 expectedStatuses 밖이라 가용성 실패로 계상된다.
            # 그때 이 설정과 검증설계 §3 E7' 오류율 예산을 함께 재검토한다.
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
