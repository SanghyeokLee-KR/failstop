# 관문 → 관리 평면 내부 mTLS. deploy/linux/app/nginx-admin-upstream.conf 와 같은 항목이고 주소·이름만 로컬 값이다.
# 서버 인증서 SAN은 admin.exchange.local, localhost, 127.0.0.1 이다(server/config/admin-demo/admin-server.p12).
proxy_pass https://chaos-admin:8443;
proxy_ssl_certificate /etc/nginx/admin-gw/gateway.crt;
proxy_ssl_certificate_key /etc/nginx/admin-gw/gateway.key;
proxy_ssl_trusted_certificate /etc/nginx/admin-gw/ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_server_name on;
proxy_ssl_name admin.exchange.local;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto http;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Operator-Cn "";
proxy_connect_timeout 3s;
# AI 상담은 모델 응답(최대 30초)과 근거 수집을 기다린다. AWS 판(30초)보다 넉넉히 둔다
proxy_read_timeout 60s;
proxy_buffering off;
