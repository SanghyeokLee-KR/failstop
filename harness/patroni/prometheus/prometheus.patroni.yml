# Patroni 실험 스택 전용 스크레이프 설정(Patroni 설계 7-3). 알림 경로(Alertmanager)는 두지 않는다. 경보는 발화만 하고
# 조치를 자동 실행하지 않는다(하네스 CI/CD §5-6).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # 거래 앱. 쓰기 가능 상태·게이트 거절·확정 응답 보류가 여기서 나온다. 전환 창을 2초 격자로 본다.
  - job_name: exchange-api
    metrics_path: /actuator/prometheus
    scrape_interval: 2s
    static_configs:
      - targets: ['patroni-api-1:8080', 'patroni-api-2:8080']
        labels: { stack: patroni, service: api }

  - job_name: exchange-bots
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['patroni-bots:8080']
        labels: { stack: patroni, service: bots }

  # Patroni REST /metrics. 역할, 동기 Standby, 타임라인, 복제 위치, failsafe 가 나온다. 앱 망 주소로 읽어 DB 한 대를
  # DB 망에서만 떼도(E-P3b) 표본이 끊기지 않는다.
  - job_name: patroni
    metrics_path: /metrics
    static_configs:
      - targets: ['db-1-app:8008', 'db-2-app:8008']
        labels: { stack: patroni, service: db }

  # etcd 는 메트릭 전용 리스너(2381)로 읽는다. DB 망에만 있다.
  - job_name: etcd
    static_configs:
      - targets: ['patroni-etcd-1:2381', 'patroni-etcd-2:2381', 'patroni-etcd-3:2381']
        labels: { stack: patroni, service: etcd }

  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets: ['patroni-haproxy-1:8404', 'patroni-haproxy-2:8404', 'patroni-haproxy-b:8404']
        labels: { stack: patroni, service: haproxy }

  - job_name: postgres
    static_configs:
      - targets: ['patroni-pg-exporter-1:9187', 'patroni-pg-exporter-2:9187']
        labels: { stack: patroni, service: db }
