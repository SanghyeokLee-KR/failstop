# 앱·봇 노드의 로컬 HAProxy 사이드카(Patroni 설계 3-4). 현재 Primary 한 곳으로만 보낸다.
# Primary 판정은 Patroni REST 의 /primary 다. 엄격 모드에서 동기 Standby 가 없어도 리더는 200 을 내므로 조회는 계속 Primary 로 간다.
# 조회 전용 리스너(/replica)는 두지 않는다. 앱은 조회를 Standby 로 보내지 않는다.
global
    maxconn 1000
    log stdout format raw local0 notice

defaults
    mode tcp
    log global
    retries 2
    timeout connect 2s
    # HikariCP 의 최대 수명(30분)보다 길게 둔다. 짧으면 쓰고 있는 풀 연결을 HAProxy 가 끊는다.
    timeout client 35m
    timeout server 35m
    timeout check 1s

# Docker 내장 DNS. DB 컨테이너가 다시 뜨거나 망에 다시 붙어 주소가 바뀌어도 따라간다(E-P3).
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s

frontend stats
    mode http
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s

listen pg_write
    bind *:5000
    option httpchk
    http-check send meth OPTIONS uri /primary
    http-check expect status 200
    # 1초 간격 두 번에 내린다. 내려간 노드로 열린 세션을 끊어 앱 풀이 강등 중인 옛 Primary 에 붙은 채 남지 않게 한다.
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    # 앱 망(patroni-app)의 주소로 붙는다. DB 를 DB 망에서만 떼면 복제·etcd 에서는 떨어지고 앱에서는 닿는 비대칭 분할이 된다(E-P3b).
    server db-1 db-1-app:5432 check port 8008
    server db-2 db-2-app:5432 check port 8008
