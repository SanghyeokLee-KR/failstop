<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 장애 보고 전달</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --edge: #7D8BA5;
    --wire: #6A7489;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ai: #C6C0F2;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --ease: cubic-bezier(.45,0,.25,1);
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .6s 0s var(--ease) both; }
  .title .tag { margin-left: auto; }
  .title .env { margin-left: 14px; animation: fade .6s .25s var(--ease) both; }
  .tag { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; white-space: nowrap; }
  .tag img { width: 26px; height: 26px; }
  button.tag { font-family: var(--sans); background: transparent; cursor: pointer; }
  .tag .mx { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-left: 2px; }
  .dek { position: absolute; left: 130px; right: 130px; top: 232px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .6s .15s var(--ease) both; }

  /* 위 띠: 사람이 실제로 받는 것 세 가지(Teams 카드 → 보고서 1쪽 → 보고서 2쪽). 흐름이 아니라 차례라 칸 사이 화살표는 없다(04-5와 같은 띠).
     → 한 번에 한 칸이 파랗게 켜지고 아래 카드가 그 실제 화면으로 바뀐다. 무대 x130 ~ 1790, y300 ~ 376, 칸 사이 30 */
  .areas { position: absolute; left: 130px; top: 300px; width: 1660px; height: 76px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
  .area { display: grid; grid-template-columns: 36px 1fr; column-gap: 14px; align-items: center; padding: 0 16px; box-sizing: border-box; height: 76px; border-radius: 12px; background: #1E2638; border: 2.5px solid var(--edge); transition: opacity .35s var(--ease); }
  .area svg { width: 36px; height: 36px; fill: none; stroke: var(--glow); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .area b { display: block; font-size: 24px; font-weight: 600; line-height: 30px; color: var(--ink); }
  .area span { display: block; font-size: 22px; line-height: 28px; color: var(--ink-2); white-space: nowrap; }
  .stage:not([data-step="0"]) .area:not(.on) { opacity: .45; }
  /* 켜졌다 꺼진 칸이 등장 움직임(rise)을 처음부터 다시 돌지 않게, 열림 뒤에는 꺼진 칸의 움직임을 끈다 */
  .stage:not([data-step="0"]) .area:not(.on) { animation: none; }
  .stage:not(.inst) .area.on { animation: lit .3s var(--ease) both; }
  .area.on { border-color: var(--brand); border-width: 3px; }

  /* 아래 카드: 왼쪽은 실제 화면 발췌, 오른쪽은 같은 번호의 설명. 작은 원본 글자는 발췌 영역별로 확대한다.
     번호 상자 색의 뜻은 이 장 안에서 고정: 노랑 경보 사실, 파랑 사람이 할 일 · 기록, 초록 끝낼 조건, 라벤더 AI · 자동, 회색 점선 확인 못 한 자료.
     흰 문서 위에서도 보이게 상자 바깥에 어두운 2px 띠와 색 고리를 둘렀다 */
  .card { position: absolute; left: 130px; top: 404px; width: 1660px; height: 596px; box-sizing: border-box; background: #0B1019; border: 2px solid var(--line); border-radius: 14px; }
  .card .shot { position: absolute; left: 20px; top: 20px; width: 1044px; height: 552px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
  .card .side { position: absolute; left: 1100px; top: 20px; width: 536px; height: 552px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .stage[data-step="1"] .card .side { gap: 20px; }
  .card .side::before { content: ''; position: absolute; left: -18px; top: 24px; bottom: 24px; width: 1px; background: var(--line); }
  .ex { position: relative; flex: none; overflow: visible; }
  .ex .clip { position: absolute; inset: 0; overflow: hidden; border-radius: 8px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
  /* 원본 한 쪽에서 필요한 부분만 보인다. 큰 그림을 자식으로 넣지 않고 배경으로 잘라, 창 밖으로 나가는 요소가 없게 한다 */
  .ex .clip { background-repeat: no-repeat; }
  .mk { position: absolute; box-sizing: border-box; border: 3px solid var(--c); border-radius: 8px; box-shadow: 0 0 0 2px #0B1019, 0 0 0 6px color-mix(in srgb, var(--c) 30%, transparent); }
  .mk.dash { border-style: dashed; }
  .mk b, .an .no { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #0B1019; font-family: var(--mono); font-size: 22px; font-weight: 700; font-style: normal; }
  .mk b { position: absolute; right: -17px; top: calc(50% - 17px); }
  .an { display: grid; grid-template-columns: 34px 1fr; column-gap: 16px; align-items: start; }
  .an .no { margin-top: 1px; }
  .an h3 { margin: 0; font-size: 26px; font-weight: 600; line-height: 36px; color: var(--ink); }
  .an p { margin: 2px 0 0; font-size: 22px; line-height: 32px; color: var(--ink-2); word-break: keep-all; text-wrap: balance; }
  .side .hd { font-size: 22px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }
  .side .ft { padding-top: 18px; border-top: 1px solid var(--line); font-size: 22px; line-height: 32px; color: var(--ink-3); word-break: keep-all; }
  .side .ft i { font-style: normal; color: var(--fc, var(--ink-2)); font-weight: 600; margin-right: 10px; }
  .report-context { position: absolute; left: 130px; right: 130px; top: 1020px; display: flex; align-items: baseline; justify-content: space-between; gap: 24px; font-size: 20px; color: var(--ink-3); }
  .report-context strong { font-size: 24px; font-weight: 500; color: var(--ink-2); }

  /* 열린 모습: 두 갈래 도면(기본 경보는 보고 서비스와 따로 Teams로, 근거 보고는 보고 서비스를 거쳐)과 보내는 때 */
  .route { width: 1044px; height: 552px; overflow: visible; }
  .route text { font-family: var(--sans); }
  .route .tile .bx { fill: #1E2638; stroke: var(--edge); stroke-width: 2.5; }
  .route .tile.ai .bx { stroke: var(--ai); stroke-dasharray: 10 6; }
  .route .nm { font-size: 24px; font-weight: 600; fill: var(--ink); }
  .route .sb { font-size: 22px; fill: var(--ink-2); }
  .route .lb { font-size: 22px; fill: var(--ink-2); }
  .route .ln { fill: none; stroke-width: 3; stroke-linejoin: round; }
  .route .ic { fill: none; stroke: var(--glow); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .route .msg rect.bg { fill: #10151F; stroke: #2E3848; stroke-width: 1.5; }
  .side .md { display: grid; grid-template-columns: 34px 1fr; column-gap: 16px; }
  .side .md .dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--c); box-sizing: border-box; display: grid; place-items: center; }
  .side .md .dot i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .side .md h3 { margin: 0; font-size: 26px; font-weight: 600; line-height: 34px; }
  .side .md p { margin: 2px 0 0; font-size: 22px; line-height: 32px; color: var(--ink-2); word-break: keep-all; }

  /* 단계에 들어설 때만 움직인다(04-5와 같은 박자). 앞 카드 내용(복사본)이 0 ~ 0.3초에 사라지고, 새 화면이 0.3초부터 0.4초에 나타나며,
     번호 상자와 같은 번호의 설명이 0.9초부터 0.4초 간격, 끝 줄은 마지막 번호 0.4초 뒤. inst(← · #last)는 움직임 없이 */
  .card.go .ex, .card.go .side .hd { animation: fade .4s var(--ease) .3s both; }
  .card.go .mk { animation: mark .3s var(--ease) var(--at) both; }
  .card.go .an, .card.go .ft { animation: fade .3s var(--ease) var(--at) both; }
  .card .ghost { position: absolute; inset: 0; pointer-events: none; animation: leave .3s var(--ease) both; }
  .card .ghost * { animation: none !important; }

  /* 열릴 때(약 1.7초): 제목 → 부제 → 칩, 띠 세 칸(0.35 · 0.55 · 0.75초), 카드와 도면(1.1초) */
  .bd { animation: rise .6s var(--ease) backwards; }
  .b1 { animation-delay: .35s; } .b2 { animation-delay: .55s; } .b3 { animation-delay: .75s; } .b4 { animation-delay: 1.1s; }

  .stage.inst *, .stage.inst *::before, .stage.inst *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }
  .stage.done h1, .stage.done .dek, .stage.done .title .env, .stage.done .bd { animation: none !important; }

  /* 원본 보기(E 키 도구): Teams 카드 전체와 보고서 1쪽 · 2쪽 원본을 나란히 */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); outline: none; }
  .fig::backdrop { background: rgba(8,10,15,.95); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .35s var(--ease); }
  .fig .bar { flex: none; display: flex; align-items: center; gap: calc(16px * var(--k, 1)); padding: calc(14px * var(--k, 1)) calc(24px * var(--k, 1)); font-size: calc(22px * var(--k, 1)); color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .fig .bar .cap { color: var(--ink-2); min-width: 0; white-space: normal; text-wrap: balance; }
  .fig .bar button { margin-left: auto; flex: none; font-family: var(--sans); font-size: calc(22px * var(--k, 1)); color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: calc(5px * var(--k, 1)) calc(12px * var(--k, 1)); cursor: pointer; }
  .fig .view { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; gap: calc(24px * var(--k, 1)); padding: 0 calc(24px * var(--k, 1)) calc(24px * var(--k, 1)); }
  .fig figure { margin: 0; }
  .fig figcaption { margin: 0 0 calc(6px * var(--k, 1)); font-size: calc(22px * var(--k, 1)); color: var(--ink-2); }
  .fig figure img { display: block; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes mark { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }
  @keyframes lit { from { border-color: var(--edge); border-width: 2.5px; } to { border-color: var(--brand); border-width: 3px; } }
  @keyframes leave { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage" data-step="0">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">보고 전달</span></div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>장애 보고 전달</h1>
    <button class="tag orig" id="open-fig" type="button" aria-haspopup="dialog"><img src="assets/tint/ui-file-check-side.svg" alt="">원본 보기<svg class="mx" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button>
    <span class="env"><img src="assets/tint/ui-device-desktop-side.svg" alt="">개발 PC, 로컬 Docker</span>
  </div>
  <p class="dek">서비스 영향과 담당자의 확인 사항, 사건을 종결할 조건까지 근거와 함께 전달합니다.</p>

  <div class="areas" id="areas"></div>
  <div class="card bd b4" id="card" aria-live="polite"><div class="shot" id="shot"></div><div class="side" id="side"></div></div>
  <div class="report-context"><span>보고 원본 · 로컬 Docker · 2026.09.28 00:06 KST</span><strong>경보 해제 뒤에도, 담당자 확인은 남습니다.</strong></div>

  <dialog class="fig" id="fig" tabindex="-1" aria-label="보고 원본">
    <div class="bar"><b>보고 원본</b><span class="cap">로컬 Docker의 해제 보고, 앱 계층 CPU 높음. Teams 카드와 PDF 1쪽·2쪽</span><button id="close-fig" type="button">닫기 (Esc)</button></div>
    <div class="view" id="fig-view"></div>
  </dialog>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  $('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // 띠 아이콘(tabler 선 아이콘). Teams 로고는 보라라 AI 라벤더와 헷갈리지 않게 선 아이콘으로
  const IC = {
    teams: '<path d="M3 7h10v10h-10l0 -10"/><path d="M6 10h4"/><path d="M8 10v4"/><path d="M8.104 17c.47 2.274 2.483 4 4.896 4a5 5 0 0 0 5 -5v-7h-5"/><path d="M18 18a4 4 0 0 0 4 -4v-5h-4"/><path d="M13.003 8.83a3 3 0 1 0 -1.833 -1.833"/><path d="M15.83 8.36a2.5 2.5 0 1 0 .594 -4.117"/>',
    p1: '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2"/><path d="M9 15l2 2l4 -4"/>',
    p2: '<path d="M4 19l16 0"/><path d="M4 15l4 -6l4 2l4 -5l4 4"/>',
  };
  const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
  const C = { warn: 'var(--warm)', do: 'var(--brand)', done: 'var(--ok)', ai: 'var(--ai)', miss: 'var(--ink-3)' };

  // 실제 화면 세 장. 캡처 원본은 assets/report(Teams 카드 766×957, PDF 1400×1980, 로컬 실습의 해제 보고).
  // cuts 는 보일 부분 [x, y, w, h](원본 좌표), k 는 배율, marks 는 [x, y, w, h, 색, 점선](원본 좌표), an 은 같은 번호의 설명, ft 는 끝 줄 [굵은 말, 글, 색]
  const STEPS = [
    null,
    { k: 'teams', name: 'Teams 카드', sub: '상태·영향·담당자 확인',
      img: 'assets/report/teams-card.png', W: 766, H: 957, scale: 1, cuts: [[0, 16, 766, 552]], alt: 'Teams 카드: 앱 계층 CPU 높음 해제, P3 담당자 확인 필요, 대상 · 발생 · 해제 · 영향, 담당자 조치와 완료 조건',
      marks: [[18, 74, 730, 50, 'warn'], [18, 134, 730, 42, 'do'], [18, 186, 730, 180, 'warn'], [18, 376, 730, 186, 'done']],
      an: [['경보 상태', 'CPU 경보는 해제<br>후속 점검은 아직 남아 있음'], ['대응 우선순위', 'P3 · 담당자 확인 필요<br>수집 근거와 정해진 규칙으로 판정'], ['서비스 영향', '5xx 응답 0.38건/초 관측<br>영향받은 사용자·지속 시간은 미확인'], ['담당자가 할 일', '실패한 요청의 경로·영향을 확인하고<br>처리 결과를 기록']],
      ft: ['전달', '보고를 먼저 저장하고, 일시적 전송 오류는 재시도', 'var(--brand)'] },
    { k: 'p1', name: '보고서 1쪽', sub: '우선순위·조치 기록·종결 조건',
      img: 'assets/report/report-p1.png', W: 1400, H: 1980, scale: .831, cuts: [[76, 386, 824, 120, 1.26], [76, 1740, 628, 114, 1.26]], alt: '보고서 1쪽 발췌: 01 대응 우선순위 P3 담당자 확인 필요, 05 운영 기록 및 종결 관리의 자동 조치·종결 기준 줄',
      marks: [[82, 392, 812, 108, 'do'], [82, 1746, 616, 48, 'ai'], [82, 1798, 616, 48, 'done']],
      an: [['해제 뒤에도 P3인 이유', '5xx 응답 관측<br>백업 예약·격리 복원 근거 미확인'], ['자동 조치 기록', '이 보고에 집계된 자동 실행은 없음<br>운영자 승인 조치와는 구분'], ['담당자가 종결할 조건', '서비스 영향과 필수 근거를 확인하고<br>처리 결과를 남긴 뒤 종결']],
      ft: ['기준', 'P1~P4는 대응 권고 등급이며, SLA와 별도', 'var(--brand)'] },

  let step = 0;

<!-- 발표 노트(시간 미지정):
[첫 화면 · 전달 흐름]
조치가 끝난 뒤에는 담당자에게 확인할 내용도 남겨야 합니다. 그래서 경보에 서비스 영향과 후속 점검 사항을 붙여 Teams로 전달하도록 만들었습니다.
기본 경보는 AI 분석을 기다리지 않고 먼저 전달합니다. 보고 서비스는 직전 15분의 근거를 모아 상세 보고를 만들고, AI 분석에 실패해도 확인된 사실은 보고하도록 했습니다.

[→ 1 · Teams 카드]
여기 보이는 건 로컬 실습에서 CPU 경보가 해제된 뒤에 만든 실제 보고입니다.
경보는 해제됐지만, 아래에는 P3, 담당자 확인이 필요하다고 남아 있습니다. 수집한 지표에 서버 오류 응답이 있었고, 영향받은 사용자와 지속 시간은 아직 확인하지 못했기 때문입니다.
그래서 담당자가 실패한 요청의 경로와 영향을 확인하고 결과를 남기도록, 할 일과 완료 조건을 카드에 함께 적었습니다.

[→ 2 · 보고서 1쪽]
보고서를 열면 우선순위의 근거와 조치 기록, 종결 조건을 볼 수 있습니다. 이 보고에서는 백업 예약과 격리 복원 결과도 확인이 필요했습니다.
제가 중요하게 본 건, 경보가 사라졌다는 이유만으로 사건을 끝내지 않는 겁니다. 담당자가 서비스 영향과 필요한 근거를 확인하고 처리 결과를 남긴 뒤에 종결하도록 기준을 잡았습니다.

[→ 3 · 보고서 2쪽]
두 번째 쪽에는 판단에 사용한 실측값을 남깁니다. 요청이 처리되고 응답 시간이 짧게 나와도, 오류 응답이 함께 있었는지까지 확인할 수 있습니다.
확인하지 못한 로그나 백업 자료는 그대로 '자료 없음'으로 남겼습니다. 다음 담당자가 무엇을 더 확인해야 하는지 알 수 있게 한 겁니다.
이제 실제 서비스에서 부하와 장애에 대응하는 과정을 영상으로 보여드리겠습니다.

발표 동작: 첫 화면에서 전달 흐름을 설명한 뒤 →를 한 번씩 누른다. 번호 강조가 나타나면 해당 근거를 짚는다. 보고서 숫자를 전부 읽지 않는다. 원본 전체는 질문을 받았을 때 E → '원본 보기'로 열고 Esc로 닫는다. 화면의 보고는 2026-09-28 로컬 실습 자료이며, 다음 AWS 영상의 보고라고 소개하지 않는다.

질문 때:
- 학교 AWS에서도? 2026-09-20 학교 bot-1에 같은 보고 서비스를 설치했고, Standby 정지·앱 정지·128MiB 시험 디스크 경보의 발생·해제 보고가 전송됐다(증거본 2026-09-20_백업_복구_보고). 그때 분석은 Gemini였고 압축한 근거만 보냈다(원본 로그·거래 데이터·비밀 값은 보내지 않음). 화면의 보고는 이후 붙인 온프레미스 분석기(Ollama)로 개발 PC에서 만든 것이다.
- CPU 경보인데 왜 DB 백업 확인? 판정은 경보 하나가 아니라 수집 시점의 필수 근거 전체를 본다. 이 원본에는 5xx 응답 관측과 백업의 다음 예약 실행·격리 복원 결과 미확인이 P3 근거로 적혀 있다. 백업 실패가 확인됐다는 뜻은 아니다(deploy/reporting/README.md).
- '자동 조치 없음'은 아무 조치도 안 했다는 뜻인가? 아니다. 이 칸은 보고 서비스에 수집된 해당 구간의 자동 모드 실행·되돌림 기록을 센다. 운영자 승인 실행과 구분하며, 모든 운영 조치가 0건이었다는 근거로 쓰지 않는다. 실제 실행 내역은 관제센터의 조치 기록으로 확인한다.
- P1~P4는 SLA인가? 아니다. 대응 권고 등급이고 PDF에 'SLA와 별도'라고 적혀 있다.
- Teams가 실패하면? 두 번 오면? SQLite에 먼저 저장하고 429·408·5xx·연결 실패는 최대 6번 시도한다(대기 최대 1시간). 영구 실패는 dead로 남는다. 같은 묶음의 반복 알림은 한 보고로 모이고, 정확히 한 번 전달은 보장하지 않으므로 보고 ID로 구분한다.
- 보고 서비스나 AI가 죽으면? 기본 경보는 보고 서비스와 별도인 Alertmanager의 Teams 경로로 전송한다. AI 분석 실패 시에는 사실 보고를 만든다. Teams 자체 장애까지 전달을 보장하는 구조는 아니다.
- 5xx 0.38건/초는? 이 보고의 마지막 표본에서 관측한 초당 오류 응답 수다. 0.38%가 아니며, CPU 경보가 원인이라고 단정하지 않는다. 같은 조회 구간에 다른 장애 시험이 있었을 가능성은 있지만, 원인은 별도 로그로 확인해야 한다.
- 수집 응답 9/9개와 P95 1ms이면 정상 아닌가? 지표 수집 성공은 서비스 정상과 다르다. P95 하나만으로 오류 응답이나 사용자 영향을 배제할 수도 없다. 각 표본의 시각·대상·집계 범위를 확인해야 한다.
- 원본 범위는? 2026-09-28 로컬 Docker 실습의 해제 보고다. 조회 구간은 23:51~00:06 KST, CPU 경보는 00:03 발생·00:05 해제, 보고 기준은 00:06이다. 이 페이지에서는 기존 원본을 보존해 발췌했으며 현재 AWS 상태나 이후 촬영한 영상의 수치로 취급하지 않는다. 원본 2쪽에는 디스크·DB·수집 응답 추이도 있으며, 발표에서는 P3 판정과 직접 연결되는 요청·오류 표를 확대한다. -->
