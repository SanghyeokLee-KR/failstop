<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-1 부하·장애 시험</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ai: #C6C0F2;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
    /* 위 색을 섞어 만든 면과 선 */
    --box: color-mix(in srgb, var(--card) 24%, var(--stage));
    --wire: color-mix(in srgb, var(--card) 80%, var(--glow));
    --hit: color-mix(in srgb, var(--warm) 16%, var(--stage));
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; transform: translate(-50%, -50%) scale(.5); background: var(--stage); overflow: hidden; }
  .head { position: absolute; left: 130px; right: 130px; top: 64px; height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both; }
  .title .env { margin-left: auto; }
  .dek { position: absolute; left: 130px; top: 236px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .8s .3s ease-out both; }

  /* 장면 표시: 두 시험의 횟수와 기간을 늘 보이고, 지금 장면만 채워 밝힌다 */
  .tabs { position: absolute; left: 130px; right: 130px; top: 312px; display: flex; gap: 18px; animation: fade .6s .4s ease-out both; }
  .tab { display: flex; align-items: baseline; gap: 14px; padding: 10px 20px; border: 1.5px solid transparent; border-radius: 10px; color: var(--ink-4); transition: border-color .3s, color .3s, background .3s; }
  .tab b { font-size: 25px; font-weight: 600; }
  .tab span { font-size: 22px; }
  .tab em { font-style: normal; font-family: var(--mono); font-size: 25px; font-weight: 500; margin-left: 6px; }
  .tab em small { font-family: var(--sans); font-size: 22px; font-weight: 500; margin-left: 2px; }
  .stage[data-scene="0"] .tab.t0 em, .stage[data-scene="1"] .tab.t1 em { color: var(--ink-2); }
  .stage[data-scene="0"] .tab.t0, .stage[data-scene="1"] .tab.t1 { border-color: var(--ink-2); color: var(--ink); background: color-mix(in srgb, var(--card) 40%, var(--stage)); }

  /* 왼쪽: 세로 구성(위에서 아래로 요청이 흐름). 부하 장면은 막힌 곳(노랑)과 고친 곳(초록), 장애 장면은 멈춘 칸(빨강)과 이어받은 칸(초록) */
  .mini { animation: fade .5s .5s ease-out both; }
  .th { animation: fade .5s .5s ease-out both; }
  .mini { position: absolute; left: 90px; top: 404px; width: 440px; height: 320px; overflow: visible; }
  .mini text { font-family: var(--sans); }
  .mini .box { fill: var(--box); stroke: var(--card); stroke-width: 1.6; transition: stroke .3s, fill .3s; }
  .mini .box.test { stroke: var(--warm); stroke-dasharray: 8 6; }
  .mini .nm { font-size: 24px; font-weight: 600; fill: var(--ink); }
  .mini .sb { font-size: 22px; fill: var(--ink-3); }
  .mini .sb.say { font-size: 24px; font-weight: 600; fill: var(--warm); }
  .mini .sb.say.bad { fill: var(--bad); }
  .mini .sb.say.ok { fill: var(--ok); }
  .mini .wire { fill: none; stroke: var(--wire); stroke-width: 2.4; transition: stroke .3s, stroke-width .3s; }
  .mini .wire.hot { stroke: var(--bad); stroke-width: 20; }
  .mini .dot { fill: var(--glow); }
  .mini g.n.hit .box { stroke: var(--warm); stroke-width: 2.6; fill: var(--hit); animation: ping .7s ease-out; }
  .mini g.n.down .box { stroke: var(--bad); stroke-width: 2.6; fill: color-mix(in srgb, var(--bad) 14%, var(--stage)); animation: ping .7s ease-out; }
  .mini g.n.back .box { stroke: var(--ok); stroke-width: 2.6; fill: color-mix(in srgb, var(--ok) 12%, var(--stage)); }
  .mini g.n-tx { transition: opacity .4s; }
  .stage[data-scene="1"] .mini g.n-tx { transition-delay: .6s; }
  .stage[data-scene="0"] .mini g.n-tx { opacity: 0; }
  /* 부하 장면에서는 DB가 거래 서버 바로 아래에 붙는다. 장애 장면으로 넘어가면 DB가 내려가고 그 자리에 Toxiproxy가 끼어든다(첫째 장의 끼어들기와 같은 동작) */
  .mini g.n-db { transition: transform .5s cubic-bezier(.2,.7,.2,1); }
  .stage[data-scene="0"] .mini g.n-db { transform: translateY(-60px); }
  .stage[data-scene="1"] .mini g.n-db { transition-delay: .25s; }
  /* 두 대 표시: 장애 장면에서 한 칸이 멈추고 다른 칸이 이어받는다 */
  .mini .mv { fill: none; stroke: var(--ink); stroke-width: 3.6; marker-end: url(#mvh); stroke-dasharray: 60; stroke-dashoffset: 60; opacity: 0; }
  .mini .mv.on { opacity: 1; animation: drawmv .6s .2s forwards; }
  .mini .mvh { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes drawmv { to { stroke-dashoffset: 0; } }
  .mini .pair { opacity: 0; transition: opacity .3s; }
  .stage[data-scene="1"] .mini .pair { opacity: 1; transition-delay: .6s; }
  .mini .pair rect { fill: var(--stage); stroke: var(--ink-3); stroke-width: 1.6; transition: stroke .3s, fill .3s; }
  .mini .pair .dn rect { stroke: var(--bad); fill: color-mix(in srgb, var(--bad) 20%, var(--stage)); }
  .mini .pair .up rect { stroke: var(--ok); fill: color-mix(in srgb, var(--ok) 20%, var(--stage)); }
  .mini .pair text { font-size: 24px; font-weight: 600; fill: var(--ink-2); text-anchor: middle; }
  .mini .pair .dn text { fill: var(--bad); }
  .mini .pair .up text { fill: var(--ok); }
  /* 부하 장면의 줄 번호: 막힌 칸에 쌓이고 결론 때도 남는다 */
  .mini .no { opacity: 0; transition: opacity .3s; }
  .mini .no.on { opacity: 1; }
  .mini .no circle { fill: var(--stage); stroke: var(--ink-2); stroke-width: 1.6; }
  .mini .no text { font-size: 22px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
  .stage[data-scene="1"] .mini .no { display: none; }

  /* 오른쪽: 장면마다 표 한 장. 나가는 표는 빨리 사라지고 들어오는 표는 그 뒤에 */
  .pane { position: absolute; left: 580px; right: 130px; top: 404px; height: 580px; transition: opacity .4s .22s; }
  .stage[data-scene="0"] .pane.p1, .stage[data-scene="1"] .pane.p0 { opacity: 0; pointer-events: none; transition: opacity .18s; }
  .th, .tr { display: grid; align-items: center; column-gap: 24px; }
  .p0 .th, .p0 .tr { grid-template-columns: 520px 330px 1fr; }
  .p1 .th, .p1 .tr { grid-template-columns: 520px 1fr; }
  .p1 .tr { height: 88px; }
  .th { height: 36px; border-bottom: 1px solid var(--line); font-size: 22px; color: color-mix(in srgb, var(--ink-2) 60%, var(--ink-3)); }
  .tr { height: 88px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); opacity: 0; transition: opacity .4s; }
  .tr.on { opacity: 1; }
  .tr.on.dim { opacity: .6; }
  /* 지금 줄: 왼쪽에 중립색 띠(빨강·초록은 왼쪽 그림의 상태에만 쓴다) */
  .tr { position: relative; }
  .tr::before { content: ''; position: absolute; left: -18px; top: 18px; bottom: 18px; width: 5px; border-radius: 3px; background: var(--ink-2); opacity: 0; transition: opacity .3s, background .3s; }
  .tr.cur::before { opacity: 1; }
  /* 부하 줄 번호: 왼쪽 그림의 번호와 같다. 지금 줄은 채운 원 */
  .tr .rn { position: absolute; left: -58px; top: 50%; width: 32px; height: 32px; margin-top: -16px; box-sizing: border-box; border-radius: 50%; border: 1.6px solid var(--ink-2); display: grid; place-items: center; font-size: 22px; font-weight: 600; color: var(--ink); background: var(--stage); transition: background .3s, color .3s; }

  .tr .c { transition: opacity .35s, transform .45s cubic-bezier(.2,.7,.2,1); }
  .tr.fix .c2 { transition-delay: .15s; }
  .tr.res .c3 { transition-delay: .3s; }
  .p1 .tr.res .c3 { transition-delay: 0s; }
  .tr .c2, .tr .c3 { opacity: 0; transform: translateX(-8px); }
  .tr.fix .c2, .tr.res .c3 { opacity: 1; transform: none; }
  .tr b { display: block; font-size: 25px; font-weight: 600; line-height: 1.25; }
  .p0 .tr .c2 b { font-weight: 500; color: var(--ink-2); }
  .p0 .tr .c1 small { color: var(--ink-2); }
  .tr small { display: block; font-size: 22px; color: color-mix(in srgb, var(--ink-2) 60%, var(--ink-3)); line-height: 1.35; }
  /* 부하: 그 단계에서 고치기 전 대비 배수 */
  .gain { display: flex; align-items: center; gap: 22px; }
  .gain .x { font-family: var(--sans); font-size: 40px; font-weight: 700; color: var(--ok); letter-spacing: -.01em; }
  /* 장애: 회차 수는 회색, 결과는 0~30초 막대(막대 끝 점선이 목표 30초) */
  .runs { font-family: var(--mono); font-size: 25px; color: var(--ink-3); white-space: nowrap; text-align: right; }
  .runs small { display: inline; font-family: var(--sans); font-size: 22px; margin-left: 2px; }
  .rto { display: grid; grid-template-columns: 1fr 120px; align-items: center; column-gap: 24px; }
  .rto .ax { position: relative; height: 16px; border-radius: 8px; background: color-mix(in srgb, var(--card) 35%, transparent); }
  .rto .ax::after { content: ''; position: absolute; right: 0; top: -36px; bottom: -36px; border-right: 2px dashed var(--ink-3); }
  .rto .ax i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 8px; background: color-mix(in srgb, var(--glow) 65%, var(--stage)); transition: width 1.4s linear, background .3s; }
  .tr.done .rto .ax i { background: var(--ok); }
  /* 숫자는 막대 오른쪽 한 열에 오른쪽 정렬. 막대가 다 자라면 초록으로 나타난다 */
  .rto b.cnt { text-align: right; font-size: 30px; font-weight: 700; color: var(--ok); opacity: 0; white-space: nowrap; transition: opacity .3s; }
  .tr.done .rto b.cnt { opacity: 1; }
  .th .rh { display: grid; grid-template-columns: 1fr 120px; column-gap: 24px; }
  .th .rb { display: flex; justify-content: space-between; }
  .th .g30 { padding-right: 8px; border-right: 2px dashed var(--ink-3); }

  /* 결론: 마지막 줄 다음에 나온다. 두 장면에서 같은 자리 */
  .end { position: relative; margin: 24px 0 0; padding: 18px 32px; border-radius: 12px; font-size: 36px; font-weight: 500; line-height: 1.4; word-break: keep-all; border: 1.5px solid var(--card); background: color-mix(in srgb, var(--card) 18%, transparent); opacity: 0; transform: translateY(8px); transition: opacity .5s, transform .5s cubic-bezier(.2,.7,.2,1); }
  .end.on { opacity: 1; transform: none; }
  .end b { font-weight: 700; color: var(--ok); }

  .stage.instant * { transition-duration: 0s !important; transition-delay: 0s !important; }

  .fs { position: absolute; right: 130px; top: 20px; font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; opacity: 0; transition: opacity .3s, color .3s; }
  .stage:hover .fs { opacity: 1; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ping { from { stroke-width: 8; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .dot { display: none; } }
</style>

 두 대가 함께 내려가 이어받을 서버가 없으므로 이어받기가 아니라 재시작 복구 시간이라 표에서 뺐다(질문이 나오면 말한다). 셋째 줄 멈춤은 E7 28회(최장 13.378초, E7-20260926-033213), 넷째 줄 단절은 E5 17회(최장 11.125초, E5-20260926-034816)다. 숫자는 막대 오른쪽 한 열에 있고, 이어받은 쪽은 왼쪽 그림의 2번·예비 칩이 초록으로 보여 준다(DB 줄은 방법 칸에 '→ 예비 승격'). 축은 30초, 끝의 점선이 목표다(harness/evidence/chaos-runs 판정 파일의 failover.rtoSeconds 최댓값).  네 배수를 곱한 누적값은 재지 않았으므로(20260924.md 89·111행 'main 대비 누적 처리율'은 재지 않음) 말하지 않는다. 결론에서 왼쪽 그림은 부하 장면이면 줄 번호가 남고 DB의 1에서 거래 서버의 2·3·4로 가는 화살표가 그려지며(병목이 옮겨 감), 장애 장면이면 평상 상태로 돌아간다. 둘째 줄 '거래 서버 강제 종료'에는 재시작(E4)과 두 대 동시 재시작(COLD)이 들어 있으니 말로 덧붙인다. 왼쪽 그림 맨 위는 시장 봇(운영)과 k6(시험, 노란 점선)를 나눠 그렸다. 호가창 캐시는 호가 표시 경로에만 걸려 있고 체결·잔고·주문 접수 판정은 이 값을 쓰지 않는다(gateoff-20260903-2vcpu/README.md 970~971행). 질문 대비: 남은 병목은 DB 커밋이다. 두 거래 서버는 같은 주 DB에 커밋하므로 처리량은 늘지 않는다(ADR 0034 82행: 185/s에서 DB CPU 238.5%·앱 143.5%, 과도 상태 표본, accept-concurrency-20260913/README.md 121·137행). 그래서 몰릴 때 늘리는 것은 조회 서버다(03 설계 방향과 같은 말). 말할 거리: "k6로 부하를 올려 가며 어디서 먼저 막히는지 봤습니다. 처음엔 호가 집계 쿼리가 DB 시간의 3분의 2를 먹고 있어 1초 캐시를 넣었더니 처리량이 두 배가 됐습니다. 그다음엔 DB 연결을 거의 안 쓰고 한 줄로 기록하고 있어 마켓별로 나눴고, 기록 대기와 잠금도 하나씩 풀었습니다. 끝까지 남은 병목은 DB 커밋이라, 거래 서버를 늘려도 주문 처리량은 그대로입니다. 그래서 몰릴 때는 조회 서버를 늘리도록 설계했습니다."
장면 2(장애): Toxiproxy로 거래 서버의 DB 연결에 지연(200ms, 흔들림 100ms, 120초. harness/config/e1-pg-latency.env 26~28행)과 끊김(응답 없는 블랙홀 25초, e2.env 14~15행)을 넣고, Docker로 서버를 강제 종료·재시작·멈춤·네트워크 단절했다. 종류별: 늦추기 E1 23, 끊기 E2 28, 강제 종료·재시작 E4 31 + 주문 폭주 중 종료 E6 17 + 두 대 동시 재시작 COLD 6 = 54, 멈춤·네트워크 단절 E7 28 + E5 17 = 45, DB 장애 29(Patroni 실험 20: 주 DB 종료·격리, 예비 DB 정지·일시정지, etcd 정지, 느린 연결 E-P7은 Toxiproxy 3000ms, 재초기화 등. 시연 도구 9). 결과 막대: 판정 파일의 failover.rtoSeconds 최댓값이며 '영향받은 마켓의 다시 첫 체결까지'(S7 README 11행). E2 13.472, E4·E6·COLD 중 COLD 15.892, E7·E5 중 E7 13.378초. 목표 30초(e2.env RTO_TARGET_SEC, S7 README 11행). DB 줄은 예비 DB 승격 시각의 최댓값 27.7초다. 승격 시각이 기록된 14회(E-P1 22.75, E-P3a 27.27, E-P3b 27.68, E-P5 23.18·22.98, 시연 9회 20.867~27.044, demo-patroni-failover-*/DBFAIL-*.result.json promote_s)의 범위는 20.9~27.7초, 상한 30초(patroni-20260925-1015/README.md 36행). 29회 가운데 나머지는 예비 DB 정지·etcd 정지처럼 승격이 없는 실험이거나 시간 축이 무효인 회차다. 질문 대비: E1은 지연을 넣어도 거래 서버가 그대로여야 통과다. FAIL 5회는 판정 파일상 오류율은 0이고 지연 중에 리더 epoch가 바뀐 회차(metrics.epochStable false: 09-13 세 회차, 09-25 두 회차)다. 09-13은 코드를 고친 뒤(2a818b6) 통과했고, 09-25의 두 실패는 같은 이미지의 앞뒤 회차가 통과해 간헐 실패로 남아 있다. E7 FAIL 1회(pml-s3-gate-20260924-0830 run2, E7-20260924-092349)는 재개 시간이 기록되지 않아 rtoOk false다. 시연 9회는 재합류 비교 도구 결함 등으로 판정이 FAIL 3·미판정 6이지만 승격 시간은 기록돼 있다. 말할 거리: "장애는 Toxiproxy로 DB 연결을 늦추거나 끊고, Docker로 서버를 죽이거나 멈춰서 만들었습니다. 179번 만들었고, 거래 서버가 멈추면 14초 안에 다시 체결됐고, 주 DB가 멈추면 28초 안에 예비 DB가 자동으로 승격했습니다. 목표는 30초였습니다." 주의: 28초는 승격 시각이다. 엄격 동기라 주문 재개는 옛 DB가 예비로 다시 붙은 뒤(E-P1 66.14초, 06-2 장)이므로 '주문이 28초에 이어졌다'고 말하지 않는다. -->

  const FAULT = [
    ['DB 연결 끊기', 'Toxiproxy · 1번 서버만', 28, 13.5, '13.5초', '2번이 이어받음', 'tx', '연결 끊음'],
    ['거래 서버 강제 종료', 'Docker · 주문 폭주 중에도', 48, 12.9, '12.9초', '2번이 이어받음', 'app', '강제 종료'],
    ['거래 서버 멈춤', 'Docker · 한 대 일시정지', 28, 13.4, '13.4초', '2번이 이어받음', 'app', '멈춤'],
    ['네트워크 단절', 'Docker · 한 대를 망에서 분리', 17, 11.1, '11.1초', '2번이 이어받음', 'app', '단절'],
    ['주 DB 장애', 'Docker · 주 DB 중지 → 예비 승격', 29, 27.7, '27.7초', '예비 DB 승격', 'db', '주 DB 정지'],
  ];

  LOAD.forEach(([what, why, fix, how, a, b], i) => {
    const r = document.createElement('div'); r.className = 'tr'; r.id = 'l' + i;
    r.innerHTML = `<span class="rn">${i + 1}</span><div class="c c1"><b>${what}</b><small>${why}</small></div>`
      + `<div class="c c2"><b>${fix}</b></div>`
      + `<div class="c c3 gain"><div class="x">×${(b / a).toFixed(1)}</div></div>`;
    $('rows0').appendChild(r);
  });
  FAULT.forEach(([what, how, n, max, res, who], i) => {
    const r = document.createElement('div'); r.className = 'tr'; r.id = 'f' + i;
    r.innerHTML = `<div class="c c1"><b>${what}</b><small>${how}</small></div>`
      + `<div class="c c3 rto"><div class="ax"><i data-w="${(max / 30 * 100).toFixed(1)}"></i></div><b class="cnt">${res}</b></div>`;
    $('rows1').appendChild(r);
  });

  // ---- 왼쪽 그림 표시: 글은 밝힌 상자의 둘째 줄에 쓴다 ----
  const NODES = { app: 'm-app', tx: 'm-tx', db: 'm-db' };
  const SUB = {};
  Object.entries(NODES).forEach(([k, id]) => { SUB[k] = $(id).querySelector('.sb').textContent; });
  const clearMini = () => {
    Object.entries(NODES).forEach(([k, id]) => { const g = $(id); g.classList.remove('hit', 'down', 'back'); const t = g.querySelector('.sb'); t.textContent = SUB[k]; t.classList.remove('say', 'bad', 'ok'); });
    ['a1', 'a2', 'd1', 'd2'].forEach(id => $(id).classList.remove('dn', 'up'));
    $('w-ad').classList.remove('hot');
  };
  const say = (key, txt, tone) => { const t = $(NODES[key]).querySelector('.sb'); t.textContent = txt; t.classList.remove('bad', 'ok'); t.classList.add('say'); if (tone) t.classList.add(tone); };
  // 밝히기 전에 한 번 계산시켜, 같은 칸을 다시 밝혀도 깜빡임이 새로 돈다
  const hit = key => { const g = $(NODES[key]); g.getBoundingClientRect(); g.classList.add('hit'); };

  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const frames = [];
  const stop = () => { timers.forEach(clearTimeout); timers.length = 0; frames.forEach(cancelAnimationFrame); frames.length = 0; };

  // 막대와 그 끝의 숫자. dur(초)를 주면 그 시간 동안 일정한 속도로 자란다(장애 동안 흐르는 시간). 숫자는 다 자란 뒤에 나타난다
  const barOn = (r, on, dur) => r.querySelectorAll('.ax i').forEach(i => {
    i.style.transitionDuration = dur ? dur + 's, .3s' : '';
    i.style.width = on ? i.dataset.w + '%' : '0%';
  });
  // 부하: 왼쪽에 막힌 칸과 무엇이 막혔는지 → 오른쪽 줄(병목, 고친 것, 배수)
  const spot = i => LOAD[i][6] + (LOAD[i][8] ? '+선' : '');
  const miniLoad = (i, fresh) => { const key = LOAD[i][6], g = $(NODES[key]); if (fresh) g.getBoundingClientRect(); g.classList.add('down'); say(key, LOAD[i][7], 'bad'); if (LOAD[i][8]) $('w-ad').classList.add('hot'); };
  function rowLoad(i) { miniLoad(i, true); at(250, () => $('l' + i).classList.add('on', 'fix', 'res')); }
  // 장애: 장애 이름과 멈춘 칸(빨강)과 함께 막대가 값 10초당 1초 속도로 자라고, 다 자라면 끝의 숫자가 초록, 0.25초 뒤 왼쪽 칸이 이어받음
  // 왼쪽 그림은 칸 테두리와 1번·2번(주·예비) 칩 색만 바꾼다. 누가 이어받았는지는 표의 숫자 옆에 쓴다
  const downFault = i => {
    const key = FAULT[i][6];
    if (key === 'tx') $('m-tx').classList.add('hit');
    $(key === 'db' ? 'm-db' : 'm-app').classList.add('down'); $(key === 'db' ? 'd1' : 'a1').classList.add('dn');
  };
  const upFault = i => {
    const db = FAULT[i][6] === 'db', g = $(db ? 'm-db' : 'm-app');
    g.classList.remove('down'); g.classList.add('back'); $(db ? 'd2' : 'a2').classList.add('up');
    $('m-tx').classList.remove('hit');
  };
  const miniFault = i => { downFault(i); upFault(i); };
  function rowFault(i) {
    const r = $('f' + i), dur = FAULT[i][3] / 10;
    downFault(i); r.classList.add('on');
    at(150, () => { r.classList.add('fix', 'res'); barOn(r, true, dur); });
    at(150 + dur * 1000, () => { r.classList.add('done'); upFault(i); });
  }
  const endLoad = () => {};
  const endFault = () => {};

  // ---- 단계: 장면마다 줄이 → 한 번에 하나씩(지금 줄만 밝게), 마지막 → 에 결론(모두 밝게). 장면에 들어가면 첫 줄은 바로 나온다 ----
  const SC = [
    { rows: LOAD, row: rowLoad, mini: miniLoad, end: endLoad, pre: 'l', box: 'end0', lead: 600 },
    { rows: FAULT, row: rowFault, mini: miniFault, end: endFault, pre: 'f', box: 'end1', lead: 0 },
  ];
  let scene = 0, k = 1;   // k: 보이는 줄 수(줄 수 + 1이면 결론까지)
  function render(sc, kk, animate) {
    stop(); scene = sc; k = kk; stage.dataset.scene = sc; clearMini();
    LOAD.forEach((_, i) => $('no' + i).classList.toggle('on', sc === 0 && i < kk));
    stage.classList.toggle('instant', !animate);
    SC.forEach((S, s) => {
      S.rows.forEach((_, i) => { const r = $(S.pre + i); r.classList.remove('on', 'fix', 'res', 'done', 'dim', 'cur'); barOn(r, false); });
      $(S.box).classList.remove('on');
      if (s !== sc) return;
      const n = S.rows.length;
      for (let i = 0; i < Math.min(kk, n); i++) {
        const r = $(S.pre + i), cur = i === kk - 1;
        if (kk <= n) r.classList.add(cur ? 'cur' : 'dim');
        if (cur && animate) { if (kk === 1) at(S.lead, () => S.row(i)); else S.row(i); continue; }
        r.classList.add('on', 'fix', 'res', 'done'); barOn(r, true);
        if (cur) S.mini(i);
      }
      if (kk > n) { S.end(); $(S.box).classList.add('on'); }
    });
    if (!animate) requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
  }

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (location.hash === '#last') render(1, FAULT.length + 1, false);
  else { render(0, 0, false); if (!reduce) setTimeout(() => render(0, 1, true), 300); else render(0, 1, false); }
  window.deckStep = d => {
    const n = SC[scene].rows.length;
    if (d > 0) {
      if (k <= n) { render(scene, k + 1, !reduce); return true; }
      if (scene === 0) { render(1, 0, !reduce); return true; }
      return false;
    }
    if (d < 0) {
      if (k > (scene === 0 ? 1 : 0)) { render(scene, k - 1, false); return true; }
      if (scene === 1) { render(0, LOAD.length + 1, false); return true; }
      return false;
    }
    return false;
  };
  if (window.parent === window) addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });
})();
</script>
