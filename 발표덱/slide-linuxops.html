<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-5 리눅스 서버 운영</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --edge: #7D8BA5;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --ease: cubic-bezier(.45,0,.25,1);
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .6s 0s var(--ease) both; }
  .title .tag { margin-left: auto; }
  .title .env { margin-left: 14px; animation: fade .6s .25s var(--ease) both; }
  .tag { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; white-space: nowrap; }
  .tag img { width: 26px; height: 26px; }
  button.tag { font-family: var(--sans); background: transparent; cursor: pointer; }
  .tag .mx { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-left: 2px; }
  .dek { position: absolute; left: 130px; right: 130px; top: 232px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .6s .15s var(--ease) both; }

  /* 위 띠: 다섯 분야(계정·권한 → 서비스 → 로그 → 네트워크 → 디스크). 흐름이 아니라 차례라 칸 사이 화살표는 없다.
     → 한 번에 한 칸이 파랗게 켜지고 아래 카드가 그 분야의 명령 · 출력으로 바뀐다(04-6 AI 관제와 같은 띠 + 카드 꼴).
     좌표는 무대 x130 ~ 1790, y300 ~ 376. 칸은 폭 308 · 높이 76, 사이 30 */
  .areas { position: absolute; left: 130px; top: 300px; width: 1660px; height: 76px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 30px; }
  .area { display: grid; grid-template-columns: 36px 1fr; column-gap: 14px; align-items: center; padding: 0 16px; box-sizing: border-box; height: 76px; border-radius: 12px; background: #1E2638; border: 2.5px solid var(--edge); transition: opacity .35s var(--ease); }
  .area svg { width: 36px; height: 36px; fill: none; stroke: var(--glow); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .area b { display: block; font-size: 24px; font-weight: 600; line-height: 30px; color: var(--ink); }
  .area span { display: block; font-size: 22px; line-height: 28px; color: var(--ink-2); white-space: nowrap; }
  .stage:not([data-step="0"]) .area:not(.on) { opacity: .45; }
  /* 켜졌다 꺼진 칸이 등장 움직임(rise)을 처음부터 다시 돌지 않게, 열림 뒤에는 꺼진 칸의 움직임을 끈다 */
  .stage:not([data-step="0"]) .area:not(.on) { animation: none; }
  .stage:not(.inst) .area.on { animation: lit .3s var(--ease) both; }
  .area.on { border-color: var(--brand); border-width: 3px; }

  /* 아래 카드: 왼쪽은 명령 출력·설정 파일의 발췌, 오른쪽은 같은 번호의 설명이다. 뺀 부분은 … 로 표시한다.
     설정·조치는 하늘색, 시험·확인은 노랑, 실제 장애는 빨강, 결과는 흰색으로 구분한다.
     시험의 차단이 의도대로 동작했으면 오른쪽에 초록색 '차단 확인'으로 표시한다.
     터미널 틀은 단계마다 같은 자리(무대 y440)와 같은 크기(1044×520)라 단계가 바뀌어도 눈이 자리를 다시 찾지 않는다 */
  .card { position: absolute; left: 130px; top: 404px; width: 1660px; height: 596px; box-sizing: border-box; background: #0B1019; border: 2px solid var(--line); border-radius: 14px; }
  .card .shot { position: absolute; left: 20px; top: 20px; width: 1044px; height: 552px; display: grid; place-items: start center; }
  .card .side { position: absolute; left: 1100px; top: 20px; width: 536px; height: 552px; box-sizing: border-box; padding-top: 16px; display: flex; flex-direction: column; justify-content: flex-start; gap: 24px; }
  .card .side::before { content: ''; position: absolute; left: -18px; top: 24px; bottom: 24px; width: 1px; background: var(--line); }

  .term { position: relative; margin-top: 16px; width: 1044px; height: 520px; box-sizing: border-box; border-radius: 10px; background: #05070B; border: 1px solid #222A37; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
  .term .tb { display: flex; align-items: center; gap: 14px; height: 44px; box-sizing: border-box; padding: 0 18px; border-bottom: 1px solid #1B2230; font-size: 22px; color: var(--ink-3); }
  .term .tb i { display: inline-flex; gap: 7px; }
  .term .tb i::before, .term .tb i::after, .term .tb i em { content: ''; display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: #2A3242; }
  .term .tb b { font-weight: 600; color: var(--ink-2); }
  .term .body { position: relative; padding: 16px 26px 18px; }
  /* 줄 높이 40, 22px 글자. 상자는 줄 안쪽(위아래 3px)에 그려 붙은 두 상자 사이가 6px 뜬다 */
  .term .ln { height: 40px; line-height: 40px; font-family: var(--mono); font-size: 22px; white-space: pre; color: var(--ink-2); }
  .term .ln.c, .term .ln.k { color: var(--ink); }
  .term .ln.c::before { content: '$ '; color: var(--ok); }
  .term .ln.m { color: var(--ink-3); }
  .tg { position: absolute; left: 12px; right: 12px; box-sizing: border-box; border: 3px solid var(--c); border-radius: 8px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 12%, transparent); }
  .tg.test { border-style: dashed; }
  /* 번호 원은 상자 오른쪽 변 가운데(04-6과 같은 꼴). 줄 글은 오른쪽 여백 안에서 끝나 원에 가리지 않는다 */
  .tg b, .side .row .n { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #0B1019; font-family: var(--mono); font-size: 22px; font-weight: 700; font-style: normal; }
  .tg b { position: absolute; right: -17px; top: calc(50% - 17px); }

  .side .row { display: grid; grid-template-columns: 34px 110px 1fr; column-gap: 12px; align-items: start; }
  .side .row .n { margin-top: 1px; }
  .side .row .k { line-height: 36px; color: var(--c); font-size: 22px; font-weight: 700; white-space: nowrap; }
  .side .row p { margin: 0; font-size: 24px; line-height: 36px; color: var(--ink); word-break: keep-all; text-wrap: balance; }
  .side .row p .pl { display: inline-block; margin-right: 10px; padding: 0 12px; height: 34px; line-height: 30px; box-sizing: border-box; border-radius: 17px; border: 2px solid var(--v); background: color-mix(in srgb, var(--v) 14%, transparent); color: var(--v); font-size: 22px; font-weight: 700; vertical-align: 1px; }
  .side .row.result p { font-size: 27px; font-weight: 600; line-height: 38px; text-wrap: initial; }
  .side .row.result .verdict { display: block; margin-bottom: 10px; }
  .side .row.result p small { display: block; margin-top: 8px; font-size: 22px; line-height: 30px; font-weight: 400; color: var(--ink-2); }
  .side .hd { display: flex; align-items: baseline; gap: 14px; height: 44px; box-sizing: border-box; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .side .hd b { font-size: 28px; font-weight: 600; color: var(--ink); }
  .side .hd span { font-size: 22px; color: var(--ink-3); }

  /* 첫 화면은 다섯 분야의 확인 결과를 먼저 보여 주고, 오른쪽에는 학교 EC2의 역할을 남긴다. */
  .ov { width: 100%; padding: 0 24px; box-sizing: border-box; }
  .ov .k { height: 44px; box-sizing: border-box; padding-bottom: 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 14px; }
  .ov .k b { font-size: 28px; font-weight: 600; color: var(--ink); }
  .ov .k span { font-size: 22px; color: var(--ink-3); }
  .ov .r { display: grid; grid-template-columns: 160px 220px 1fr; column-gap: 20px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .ov .r:last-child { border-bottom: 0; }
  .ov .r .h { font-size: 25px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .ov .r .o { font-size: 22px; color: var(--ink-3); white-space: nowrap; }
  .ov .r .s { font-size: 24px; color: var(--ink-2); word-break: keep-all; }
  .side .server { border-bottom: 1px solid var(--line); padding-bottom: 18px; }
  .side .server:last-child { border-bottom: 0; }
  .side .server b { display: block; font-family: var(--mono); font-size: 23px; font-weight: 500; color: var(--ink); }
  .side .server span { display: block; margin-top: 5px; font-size: 22px; color: var(--ink-3); }
  .side .server p { margin: 6px 0 0; font-size: 23px; line-height: 34px; color: var(--ink-2); word-break: keep-all; }

  /* 단계에 들어설 때만 움직인다. 앞 카드 내용(복사본)이 0 ~ 0.3초에 사라진 뒤, 같은 자리의 틀 안에서 새 글(제목 줄 · 터미널 줄 · 오른쪽 머리)이
     0.3초부터 0.4초에 나타나 두 글이 같은 자리에 겹쳐 비치지 않는다. 번호 상자와 오른쪽 줄은 --at(0.9초부터 0.5초 간격)에 0.3초.
     열린 모습에서 ①로 넘어갈 때만 터미널 틀 자체도 0.3초부터 떠오른다. inst(← · #last)는 움직임 없이 */
  .card.go .term .tb > *, .card.go .term .ln, .card.go .side .hd { animation: fade .4s var(--ease) .3s both; }
  .card.go.first .term { animation: fade .4s var(--ease) .3s both; }
  .card.go .tg { animation: mark .3s var(--ease) var(--at) both; }
  .card.go .row { animation: fade .3s var(--ease) var(--at) both; }
  .card .ghost { position: absolute; inset: 0; pointer-events: none; animation: leave .3s var(--ease) both; }
  .card .ghost * { animation: none !important; }

  /* 열릴 때(약 2.0초): 제목 → 부제 → 칩, 띠의 다섯 칸을 0.35초부터 0.2초 간격으로, 카드(1.4초) */
  .bd { animation: rise .6s var(--ease) backwards; }
  .b1 { animation-delay: .35s; } .b2 { animation-delay: .55s; } .b3 { animation-delay: .75s; } .b4 { animation-delay: .95s; } .b5 { animation-delay: 1.15s; } .b6 { animation-delay: 1.4s; }

  .stage.inst *, .stage.inst *::before, .stage.inst *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }
  .stage.done h1, .stage.done .dek, .stage.done .title .env, .stage.done .bd { animation: none !important; }

  /* 원본 캡처(E 키 도구): 지금 분야의 증거본 캡처(계정 ID · 공인 주소가 있는 머리와 바닥은 잘라 냄)를 위아래로 */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); outline: none; }
  .fig::backdrop { background: rgba(8,10,15,.95); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .35s var(--ease); }
  .fig .bar { flex: none; display: flex; align-items: center; gap: calc(16px * var(--k, 1)); padding: calc(14px * var(--k, 1)) calc(24px * var(--k, 1)); font-size: calc(22px * var(--k, 1)); color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); white-space: nowrap; }
  /* 설명 줄은 잘리지 않게 두 줄까지 늘어난다(디스크처럼 출처가 긴 분야) */
  .fig .bar .cap { color: var(--ink-2); min-width: 0; white-space: normal; text-wrap: balance; }
  .fig .bar button { margin-left: auto; flex: none; font-family: var(--sans); font-size: calc(22px * var(--k, 1)); color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: calc(5px * var(--k, 1)) calc(12px * var(--k, 1)); cursor: pointer; }
  .fig .view { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: calc(18px * var(--k, 1)); padding: 0 calc(24px * var(--k, 1)) calc(24px * var(--k, 1)); }
  .fig figure { margin: 0; }
  .fig figcaption { margin: 0 0 calc(6px * var(--k, 1)); font-size: calc(22px * var(--k, 1)); color: var(--ink-2); }
  .fig figure img { display: block; border-radius: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.4); }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes mark { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }
  @keyframes lit { from { border-color: var(--edge); border-width: 2.5px; } to { border-color: var(--brand); border-width: 3px; } }
  @keyframes leave { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage" data-step="0">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">주요 설계 및 구현</span>04-5</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>리눅스 서버 운영</h1>
    <button class="tag orig" id="open-fig" type="button" aria-haspopup="dialog"><img src="assets/tint/ui-terminal-2-side.svg" alt="">원본 캡처<svg class="mx" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button>
    <span class="env"><img src="assets/tint/amazonwebservices-side.svg" alt="">학교 AWS</span>
  </div>
  <p class="dek">학교 EC2에서 권한 분리부터 장애 진단·복구까지 직접 확인했습니다.</p>

  <div class="areas" id="areas"></div>
  <div class="card bd b6" id="card" aria-live="polite"><div class="shot" id="shot"></div><div class="side" id="side"></div></div>

  <dialog class="fig" id="fig" tabindex="-1" aria-label="원본 캡처">
    <div class="bar"><b>원본 캡처</b><span class="cap" id="fig-cap"></span><button id="close-fig" type="button">닫기 (Esc)</button></div>
    <div class="view" id="fig-view"></div>
  </dialog>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  $('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // 분야 아이콘(tabler 계열 선 아이콘, 색은 CSS). 디스크는 04-3 vmserver 의 i-disk 와 같은 꼴
  const IC = {
    acct: '<path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3"/><path d="M11 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M12 12l0 2.5"/>',
    svc: '<path d="M8 9l3 3l-3 3"/><path d="M13 15l3 0"/><path d="M3 6a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/>',
    log: '<path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 15l2 2l4 -4"/>',
    net: '<path d="M6 9a6 6 0 1 0 12 0a6 6 0 0 0 -12 0"/><path d="M12 3c1.333 .333 2 2.333 2 6s-.667 5.667 -2 6"/><path d="M12 3c-1.333 .333 -2 2.333 -2 6s.667 5.667 2 6"/><path d="M6 9h12"/><path d="M3 20h7"/><path d="M14 20h7"/><path d="M10 20a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M12 15v3"/>',
    disk: '<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="4"/><path d="M12 10l3 5"/><path d="M7.5 18h1"/>',
  };
  const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
  // 역할 색(상자 · 번호 원 · 오른쪽 이름)과 판정 색(오른쪽 알약에만)
  const C = { set: 'var(--glow)', fix: 'var(--glow)', test: 'var(--warm)', check: 'var(--warm)', real: 'var(--bad)', res: 'var(--ink)' };
  const V = { deny: 'var(--bad)', keep: 'var(--ok)', auto: 'var(--brand)', warn: 'var(--warm)' };
  const ROLE = { set: '설정', fix: '조치', test: '시험', check: '확인', real: '실제 장애', res: '결과' };

  // 다섯 분야. 터미널은 증거본(failstop/증거본) 캡처에서 줄을 골라 옮긴 발췌다. 한 줄 안에서 줄인 곳(명령 끝은 늘 '; …')과
  // 같은 출력 묶음 가운데를 줄인 곳은 … 로 쓰고(088 명령과 ②의 325 두 조각은 앞뒤를 골라 옮긴 발췌), 프롬프트의 호스트 이름은 $ 로 줄이며 계정 ID · 공인 주소는 넣지 않는다. 줄 종류: c 명령, k 명령의 이어지는 줄, o 출력, m 설명 줄(# …).

  const fig = $('fig'), openBtn = $('open-fig');

    const W = view.clientWidth - 48 * k, H = view.clientHeight - 24 * k - a.shots.length * (40 * k) - (a.shots.length - 1) * 18 * k;
    const z = Math.min(2, W / Math.max(...a.shots.map(s => s[1])), H / a.shots.reduce((t, s) => t + s[2], 0));
    view.querySelectorAll('img').forEach(im => { im.style.width = Math.round(+im.dataset.w * z) + 'px'; im.style.height = Math.round(+im.dataset.h * z) + 'px'; });
  };
  const closeFig = () => { if (fig.open) fig.close(); openBtn.blur(); };
  // 도구가 꺼져 있으면 숨은 단추를 눌러도 열지 않는다
  openBtn.addEventListener('click', e => {

  let step = 0;
  const render = (n, inst) => {
    card.querySelectorAll('.ghost').forEach(g => g.remove());
    const from = step;
    if (!inst && n > 0) {
      const g = document.createElement('div'); g.className = 'ghost'; g.setAttribute('aria-hidden', 'true');
      g.innerHTML = `<div class="shot">${shot.innerHTML}</div><div class="side" style="${side.getAttribute('style') || ''}">${side.innerHTML}</div>`;
      card.appendChild(g); g.addEventListener('animationend', () => g.remove());

  if (matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash === '#last') { stage.classList.add('done'); render(LAST, true); }

    if (fig.open) { closeFig(); return true; }
    if (d > 0 && step < LAST) { render(step + 1, false); return true; }
    if (d < 0 && step > 0) { render(step - 1, true); return true; }
    return false;
  };

    if (!fig.open) return;
    if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeFig(); }
  }, true);

    if (fig.open) return;
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });

이 장의 기록은 학교 EC2에서 서비스를 설치하고 운영할 때 남긴 것입니다.

→ 1 (계정·권한. 실행 폴더의 소유자와 마지막 Permission denied를 짚는다.)
먼저 앱은 로그인할 수 없는 전용 계정으로 실행했습니다.
실행·설정 폴더는 root가 관리하고, 앱이 쓰는 데이터 경로는 서비스 계정 소유로 나눴습니다.
서비스 계정이 실행·설정 경로를 함부로 바꾸지 못하게 하기 위해서입니다.
설정한 뒤에는 그 계정으로 실행 폴더에 파일을 만들어 봤고, 화면처럼 쓰기가 차단됐습니다.

→ 2 (서비스 · 장애 진단. oom-kill 기록과 HTTP 시간 초과를 짚는다.)
운영 중에는 Grafana가 멈추는 문제도 있었습니다.
로그를 보니 제가 설정한 메모리 한도에 걸려 강제 종료된 것이었습니다.
systemd가 자동으로 다시 띄워서 상태는 running이었는데, 서버 안에서 보낸 HTTP 요청은 계속 시간 초과가 났습니다.
그래서 cgroup 통계까지 들어가 실제 메모리 사용량을 확인했습니다.

→ 3 (서비스 · 복구 확인. 설정 변경 뒤의 응답 기록으로 전환한다.)
처음에는 한도를 올리자 응답이 돌아왔지만, 관제 화면 여러 개를 열었을 때 다시 멈췄습니다.
최종적으로는 Go의 메모리 회수 기준과 systemd 한도를 함께 조정했습니다.
그 뒤에는 관제 화면을 바꿔 가며 10초 간격으로 여섯 번 확인했고, 모두 정상 응답을 받았습니다.
그 확인 구간에서 재시작과 메모리 부족에 따른 강제 종료 기록도 없었습니다.

→ 4 (로그. 이전 부팅의 시험 로그를 짚는다.)
장애가 난 뒤 원인을 찾을 수 있도록 로그는 디스크에 남기고, 보관 용량과 기간에 상한을 뒀습니다.
시험 로그를 남긴 후 실제로 재부팅해서, 이전 부팅의 로그가 조회되는 것까지 확인했습니다.

→ 5 (네트워크. 공개 조회 200과 관리 경로 403을 함께 보여준다.)
접속은 공개 서비스와 관리 경로를 나눴습니다.
앱은 서버 내부 주소에만 바인딩하고 외부 요청은 Nginx의 HTTPS를 거치게 했습니다.
공개 주소로 확인했을 때 일반 조회는 200으로 응답했고, 관리 경로는 403으로 차단됐습니다.

→ 6 (디스크. 시험용 loop 장치와 두 보고 상태를 짚는다.)
마지막은 용량이 부족할 때 담당자에게 알리는 경보입니다.
별도 시험용 디스크를 98%까지 채워 경보를 발생시킨 다음, 공간을 돌려 경보가 해제되는 것까지 확인했습니다.
발생과 해제 두 경우 모두 Teams 보고가 전송된 기록을 확인했습니다.

[질의응답 참고]
질문 때: Grafana는 한도를 올린 뒤에도 멈춰서, cgroup 통계로 실제 사용량 약 615MiB가 회수 기준 512MiB를 넘는 것을 확인했다. 실행 폴더는 root 소유다. 로그는 256MiB·7일 상한, 앱은 8080·8081에서만 듣고 공개 주소로 관리 경로를 요청하면 403이다. 디스크 경보는 여유 15% 미만이 5분 이어질 때다.
시험 디스크는 128MiB loop 장치이고 7분 뒤 자동으로 공간을 돌려받게 예약했다. 실제 디스크 부족은 df·du로 어느 파일시스템과 경로가 찼는지 확인한 뒤, 보존 조건에 맞는 로그 정리 또는 볼륨 확장을 선택한다(04-3 LVM). 이 장의 경보 시험은 운영 파일시스템을 채운 시험이 아니다.
앱 유닛은 Restart=on-failure, MemoryMax=1400M, StartLimitBurst=3(300초)이다(deploy/linux/app/exchange-app.service). 80번은 열려 있고 308로 HTTPS로 넘긴다. DB는 hostssl·TLS 1.3 연결만 받는다.
앱이 127.0.0.1에서만 들으면 Prometheus는? Nginx가 사설 9101 경로로 지표만 내주고, 보안 그룹에서 출발지를 봇 SG 하나로 제한했다.
Amazon Linux 2023의 journald는 원래 영구 저장이 아닌가? 기본 이미지에 /var/log/journal이 있었고, 여기에 256MiB·여유 1G·메모리 64MiB·7일 상한을 명시하고 실제 재부팅으로 확인했다.
Grafana 한도: 강제 종료 때 MemoryHigh 320MiB·MemoryMax 384MiB였고, 이후 512/640MiB로 한 번 올려도 재발했다. 최종적으로 GOMEMLIMIT=512MiB, MemoryHigh=768M, MemoryMax=896M을 적용했다. GOMEMLIMIT은 Go 런타임의 메모리 회수 목표이며 강제 상한이 아니다(부록 C1 트러블슈팅). 342·343은 10초 간격 6회 확인 기록이고 370은 전체 서버 수집 뒤 재확인이다. 장시간 안정성 측정으로 설명하지 않는다.
서비스 칸의 줄 순서: 실제로는 325(상태 조회 → 기록 조회) 뒤에 326(한도 조회)을 실행했다. 첫 화면은 당시 한도 → 강제 종료 → 자동 재기동 뒤 확인 순서로 발췌했다. 다음 클릭의 복구 확인은 335의 설정과 342·343 출력이며, 원본 창에서 확인할 수 있다.
증거 범위: 이 장의 기록은 학교 EC2이다. 앞 장의 개인 AWS 구성도와 같은 시점·환경의 결과로 설명하지 않는다. -->
