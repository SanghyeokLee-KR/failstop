<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 05 시연 영상</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ai: #C6C0F2;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
    --ease: cubic-bezier(.45,0,.25,1);
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  h1 {
    position: absolute; left: 130px; top: 164px; margin: 0;
    font-size: 60px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em;
    animation: rise .6s 0s var(--ease) both;
  }
  .dek { position: absolute; left: 130px; top: 254px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .6s .15s var(--ease) both; }

  /* 제목 줄 오른쪽: 환경 칩(어디서 녹화했는지, 이웃 장처럼 제목 줄에) + 영상 재생 단추(누르거나 V 키). 단추 높이는 칩에 맞춘 42 */
  .tr { position: absolute; right: 130px; top: 179px; display: flex; align-items: center; gap: 14px; animation: fade .6s .25s var(--ease) both; }
  .play {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--sans); font-size: 22px; font-weight: 600; color: var(--ink);
    background: rgba(121,167,250,.07); border: 1px solid rgba(121,167,250,.42); border-radius: 8px;
    padding: 6px 14px; line-height: 28px; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .play:hover { background: rgba(121,167,250,.13); border-color: var(--brand); }
  .play:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .play svg { width: 22px; height: 22px; fill: var(--brand); }
  .play .len { font-family: var(--mono); font-size: 22px; font-weight: 400; color: var(--ink-3); padding-left: 10px; border-left: 1px solid rgba(121,167,250,.3); }

  /* 7분 막대: 네 구간의 길이는 영상 속 실제 길이에 비례. 재생 표시는 열림이 끝난 뒤(2.0초) 한 번 훑고, 영상을 틀면 영상 시각을 따라간다.
     눈금 글자는 실제 시각 자리(i/7)에 가운데 맞춤(0:00은 왼쪽, 7:00은 오른쪽 맞춤), 글자 아래 막대 2px 위에 1×8 눈금선 */
  .bar { position: absolute; left: 130px; right: 130px; top: 350px; animation: fade .6s .35s var(--ease) both; }
  .scale { position: relative; height: 40px; font-family: var(--mono); font-size: 22px; line-height: 29px; color: var(--ink-3); }
  .scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .scale span.l0 { transform: none; } .scale span.l7 { transform: translateX(-100%); }
  .scale i { position: absolute; bottom: 2px; width: 1px; height: 8px; background: #8590A3; }
  .track { position: relative; display: flex; height: 14px; border-radius: 7px; background: #1C2332; }
  .track span { height: 100%; opacity: .35; transition: opacity .35s; }
  .track span.on { opacity: 1; }
  .track span + span { border-left: 2px solid var(--stage); }
  .track span:first-child { border-radius: 7px 0 0 7px; } .track span:last-of-type { border-radius: 0 7px 7px 0; }
  .head-mark { position: absolute; top: -6px; width: 2px; height: 26px; margin-left: -1px; background: var(--ink); border-radius: 1px; box-shadow: 0 0 0 3px rgba(240,243,247,.08); opacity: 0; transition: opacity .3s var(--ease); }
  .head-mark.show { opacity: 1; }

  /* 네 칸: 지금 장면의 칸은 위 선(3px)이 칸 색으로 켜지고, 훑는 동안(또는 영상 중간에 닫았을 때) 나머지 칸은 .45로 흐려진다(04-6 · 보고 전달과 같은 규칙).
     흐림은 칸 안쪽(.pin)에 걸어 열림의 떠오름(칸 자체의 opacity)과 겹치지 않게 한다 */
  .parts { position: absolute; left: 130px; right: 130px; top: 430px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 34px; align-items: start; }
  .part { position: relative; padding: 24px 0 0; border-top: 3px solid var(--line); transition: border-color .35s var(--ease); animation: rise .6s var(--ease) both; }
  .part.on { border-top-color: var(--c); }
  .part .pin { display: flex; flex-direction: column; transition: opacity .35s var(--ease); }
  .parts.focus .part:not(.on) .pin { opacity: .45; }
  .part:nth-child(1) { animation-delay: .55s; } .part:nth-child(2) { animation-delay: .75s; } .part:nth-child(3) { animation-delay: .95s; } .part:nth-child(4) { animation-delay: 1.15s; }
  .part .top { display: flex; align-items: baseline; justify-content: space-between; }
  .part .no { font-family: var(--mono); font-size: 22px; color: var(--c); }
  .part .tm { font-family: var(--mono); font-size: 22px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .part h2 { margin: 10px 0 0; font-size: 33px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; word-break: keep-all; }
  .part ul { margin: 18px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .part li { position: relative; padding-left: 18px; font-size: 22px; line-height: 1.45; color: var(--ink-2); word-break: keep-all; }
  .part li::before { content: ''; position: absolute; left: 0; top: .6em; width: 7px; height: 7px; border-radius: 2px; background: var(--c); opacity: .8; }
  .part li b { font-weight: 500; color: var(--ink); white-space: nowrap; }
  /* '보여 줄 것'은 이 장의 결론이라 목록 바로 아래(48)에 24px 흰 글자로 둔다(네 칸 목록이 모두 네 줄이라 같은 높이에 선다) */
  .part .see { margin-top: 48px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 24px; font-weight: 400; color: var(--ink); line-height: 1.45; word-break: keep-all; }
  .part .see b { display: block; font-size: 22px; font-weight: 500; color: var(--c); margin-bottom: 4px; letter-spacing: .02em; }

  .foot {
    position: absolute; left: 130px; right: 130px; bottom: 80px;
    display: flex; align-items: baseline; gap: 28px;
    padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 22px; color: var(--ink-2); animation: fade .6s 1.35s var(--ease) both;
  }
  .foot .k { font-size: 22px; color: var(--ink-3); white-space: nowrap; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  /* 영상 창: 장 위를 모두 덮는다. 위쪽의 구간 표시와 닫기 단추는 멈췄을 때나 마우스를 움직일 때만 보인다 */
  .vid { position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #000; color: var(--ink); overflow: hidden; font-family: var(--sans); }
  .vid::backdrop { background: #000; }
  .vid[open] { display: block; animation: fade .25s ease-out; }
  .vid video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; outline: none; }
  .vid.playing:not(.awake) { cursor: none; }
  .vch, .vid .x { position: absolute; top: 20px; background: rgba(12,15,21,.84); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; opacity: 0; transition: opacity .3s; }
  .vid.awake .vch, .vid.awake .x, .vid:not(.playing) .vch, .vid:not(.playing) .x { opacity: 1; }
  .vch { left: 24px; display: flex; align-items: center; gap: 16px; padding: 10px 18px 11px; pointer-events: none; }
  .vch .no { font-family: var(--mono); font-size: 22px; color: var(--c, var(--ink-3)); }
  .vch b { font-size: 24px; font-weight: 600; }
  .vch .tm { font-family: var(--mono); font-size: 22px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .mini { position: relative; display: flex; width: 220px; height: 6px; border-radius: 3px; background: #1C2332; }
  .mini span { height: 100%; opacity: .3; }
  .mini span.on { opacity: 1; }
  .mini span + span { border-left: 2px solid #0C0F15; }
  .mini em { position: absolute; top: -5px; width: 2px; height: 16px; background: var(--ink); border-radius: 1px; }
  .vid .x { right: 24px; font-family: var(--sans); font-size: 22px; font-weight: 500; color: var(--ink); padding: 10px 18px; cursor: pointer; }
  .vid .x:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }
  .vid .err { position: absolute; left: 0; right: 0; top: 50%; margin: 0; transform: translateY(-50%); text-align: center; font-size: 26px; color: var(--ink-2); }
  /* 파일 경로는 청중 화면에 보이지 않게, E 키 도구를 켰을 때만 */
  .vid .err code { display: none; margin-top: 10px; font-family: var(--mono); font-size: 22px; color: var(--ink-3); }
  body.tools .vid .err code { display: block; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* 뒤 장에서 ← 로 돌아올 때(#last)는 열림 움직임 없이 끝 모습 */
  .stage.done *, .stage.done *::before, .stage.done *::after { animation: none !important; }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">시연</span>05</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <h1>시연 영상</h1>
  <p class="dek">배포가 전부 끝나고 녹화한 7분 영상입니다.</p>
  <div class="tr"><span class="env"><img src="assets/tint/ui-device-desktop-side.svg" alt="">개발 PC, 로컬 Docker</span><button class="play" id="play" type="button" aria-haspopup="dialog" aria-keyshortcuts="V" title="영상 재생 (V)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.8v14.4a.8.8 0 0 0 1.2.7l11.3-7.2a.8.8 0 0 0 0-1.4L8.7 4.1a.8.8 0 0 0-1.2.7z"/></svg>영상 재생<span class="len">7:00</span></button></div>

  <div class="bar" aria-hidden="true">
    <div class="scale" id="scale"></div>
    <div class="track" id="track"></div>
  </div>

  <div class="parts" id="parts"></div>

  <div class="foot"><span class="k">연결</span>앞에서 설계한 구성으로 기획한 두 장면을 실제로 돌렸고, 증설 제안은 앞 장 AI 관제와 같은 흐름입니다.</div>
</div>

<dialog class="vid" id="vid" aria-label="시연 영상 7분">
  <video id="vv" src="assets/video/failstop-demo-7min.mp4" controls preload="auto" playsinline></video>
  <div class="vch" id="vch" aria-hidden="true"><span class="no" id="vno">01</span><b id="vtt"></b><span class="tm" id="vtm">0:00 / 7:00</span><i class="mini" id="mini"></i></div>
  <button class="x" id="vx" type="button">닫기 (Esc)</button>
  <p class="err" id="verr" hidden>영상을 열 수 없음<code>assets/video/failstop-demo-7min.mp4</code></p>
</dialog>


<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // 네 구간의 경계(초). 13회차 편집본(정확히 7:00)에서 장면이 바뀌는 시각이다. 영상을 바꾸면 이 줄만 고친다
  const CUT = [0, 73, 254, 372, 420];
  // 칸 색은 덱의 색 뜻을 따른다: 평상시 · 통과는 초록, 경보 · 부하는 노랑, 장애는 빨강, AI는 라벤더(04-6과 같음)
  // 글머리는 칸마다 넷, 한 줄씩(칸 안쪽 폭 약 372px). 굵은 숫자는 결과(9,000건 · 27초 · 0건)만
  const P = [
    { c: '#2DD196', t: '거래와 평상시 관제',
      li: ['시장 봇이 주문하는 리플 1분봉 화면', '수동 모드로 둔 AI 관제센터', '2초마다 실측값으로 그린 서비스 흐름', 'Grafana 서비스 관제'],
      see: '관제 화면의 숫자는 모두<br>실제 거래에서 잰 값입니다.' },
    { c: '#E8C07A', t: '부하 시험과 AI 증설',
      li: ['부하 발생기로 <b>초당 9,000건</b>', '앱 CPU가 증설 기준을 넘어 경보', 'AI가 조회 서버 켜기를 제안', '승인 뒤 앱 서버 3이 조회 서버로 합류'],
      see: '운영자가 승인한 뒤에<br>조회 서버가 켜집니다.' },
    { c: '#FF7A7A', t: 'DB 장애와 자동 전환',
      li: ['주 DB 강제 종료로 끊긴 서비스 흐름', 'Patroni가 <b>27초</b> 만에 예비 DB 승격', '옛 주 DB 되감기 합류 뒤 거래 재개', '확인받은 쓰기 대조로 사라진 주문 <b>0건</b>'],
      see: '거래는 잠시 멈추지만<br>확인받은 주문은 남습니다.' },
    { c: '#C6C0F2', t: 'AI 상담과 요약',
      li: ['AI에게 방금 일을 질문', '조회 전용이라 실행은 없음', '답에 근거·모델·수집 시각', '실측 요약 화면으로 마무리'],
      see: 'AI는 답만 하고<br>명령은 실행하지 않습니다.' },
  ];
  const TOTAL = CUT[CUT.length - 1];
  const track = document.getElementById('track'), parts = document.getElementById('parts'), scale = document.getElementById('scale');
  for (let i = 0; i <= 7; i++) {
    const lb = document.createElement('span'); lb.textContent = i + ':00'; lb.style.left = (i / 7 * 100) + '%'; if (i === 0) lb.className = 'l0'; if (i === 7) lb.className = 'l7'; scale.appendChild(lb);
    const tk = document.createElement('i'); tk.style.left = i === 7 ? 'calc(100% - 1px)' : (i / 7 * 100) + '%'; scale.appendChild(tk);
  }
  const mm = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const pct = s => (Math.min(Math.max(s, 0), TOTAL) / TOTAL * 100).toFixed(3) + '%';
  const idx = s => { let k = 0; for (let i = 0; i < P.length; i++) if (s >= CUT[i]) k = i; return k; };
  P.forEach((p, i) => {
    const seg = document.createElement('span'); seg.style.width = ((CUT[i + 1] - CUT[i]) / TOTAL * 100) + '%'; seg.style.background = p.c; track.appendChild(seg);
    const el = document.createElement('section'); el.className = 'part'; el.style.setProperty('--c', p.c);
    el.innerHTML = `<div class="pin"><div class="top"><span class="no">0${i + 1}</span><span class="tm">${mm(CUT[i])}–${mm(CUT[i + 1])}</span></div>`
      + `<h2>${p.t}</h2><ul>${p.li.map(x => `<li>${x}</li>`).join('')}</ul><div class="see"><b>보여 줄 것</b>${p.see}</div></div>`;
    parts.appendChild(el);
  });
  const mark = document.createElement('i'); mark.className = 'head-mark'; track.appendChild(mark);
  const segs = [...track.querySelectorAll('span')], secs = [...parts.children];
  // 영상 시각 s의 모습: 그 구간과 칸만 켜고 나머지 칸은 흐리게, 재생 표시는 그 시각 자리에
  function at(s) {
    const k = idx(s);
    segs.forEach((g, i) => g.classList.toggle('on', i === k));
    secs.forEach((g, i) => g.classList.toggle('on', i === k));
    parts.classList.add('focus');
    mark.classList.add('show'); mark.style.left = pct(s);
  }
  // 끝 모습(훑기 끝, 영상 끝, #last): 네 구간 모두 켜고, 재생 표시는 숨긴다('영상을 다 봤다'로 읽히지 않게)
  function allOn() {
    segs.forEach(g => g.classList.add('on')); secs.forEach(g => g.classList.add('on'));
    parts.classList.remove('focus');
    mark.classList.remove('show'); mark.style.left = '100%';
  }
  // 들어올 때: 열림이 끝난 2.0초에 시작해, 7분을 6초 빠르기로 훑는다. 구간 경계(1:13 · 4:14 · 6:12)에 닿으면 다음 구간과 칸을 켜고 0.45초 멈춘다.
  // 7:00에 닿고 0.2초 뒤 0.3초에 네 구간을 모두 켜고 재생 표시를 지운다(끝 약 9.9초). 훑기는 Web Animations로 만들어
  // 숨은 창에서도 getAnimations()로 시점을 옮겨 볼 수 있다. 영상을 틀면 훑기를 멈추고 영상 시각을 따른다
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash === '#last';
  if (location.hash === '#last') stage.classList.add('done');
  let sweep = [];
  const stopSweep = () => { sweep.forEach(a => { try { a.cancel(); } catch (e) {} }); sweep = []; };
  if (reduce) allOn();
  else {
    const T0 = 2000, MS = 6000 / TOTAL, PAUSE = 450, RAMP = 350, GAP = 200, FADE = 300;
    const arr = []; let t = 0;
    for (let i = 1; i < CUT.length; i++) { t += (CUT[i] - CUT[i - 1]) * MS; arr.push(t); if (i < CUT.length - 1) t += PAUSE; }
    const ALL = arr[3] + GAP, END = ALL + FADE;
    const kf = (prop, pts) => pts.map(([ms, v]) => ({ offset: Math.min(1, ms / END), [prop]: v }));
    const run = (el, prop, pts) => { const a = el.animate(kf(prop, pts), { duration: END, delay: T0, fill: 'forwards', easing: 'linear' }); sweep.push(a); return a; };
    // 칸 윗선 색은 CSS 변수로 넘겨 화이트 모드(deck.css)에서도 그 모드의 선 색·구간 색을 따른다
    const LINE = 'var(--line)', C = 'var(--c)';
    run(mark, 'left', [[0, '0%'], [arr[0], pct(CUT[1])], [arr[0] + PAUSE, pct(CUT[1])], [arr[1], pct(CUT[2])], [arr[1] + PAUSE, pct(CUT[2])], [arr[2], pct(CUT[3])], [arr[2] + PAUSE, pct(CUT[3])], [arr[3], '100%'], [END, '100%']]);
    run(mark, 'opacity', [[0, 0], [FADE, 1], [ALL, 1], [END, 0]]);
    P.forEach((p, i) => {
      const on0 = i === 0 ? 0 : arr[i - 1], on1 = i === 3 ? null : arr[i];
      const segPts = [[0, .35]], pinPts = [[0, 1]], bdPts = [[0, LINE]];
      if (i === 0) { segPts.push([FADE, 1]); bdPts.push([RAMP, C]); }
      else { segPts.push([on0, .35], [on0 + RAMP, 1]); pinPts.push([RAMP, .45], [on0, .45], [on0 + RAMP, 1]); bdPts.push([on0, LINE], [on0 + RAMP, C]); }
      if (on1 !== null) {
        segPts.push([on1, 1], [on1 + RAMP, .35], [ALL, .35], [END, 1]);
        pinPts.push([on1, 1], [on1 + RAMP, .45], [ALL, .45], [END, 1]);
        bdPts.push([on1, C], [on1 + RAMP, LINE], [ALL, LINE], [END, C]);
      } else { segPts.push([END, 1]); pinPts.push([END, 1]); bdPts.push([END, C]); }
      run(segs[i], 'opacity', segPts);
      run(secs[i].querySelector('.pin'), 'opacity', pinPts);
      run(secs[i], 'borderTopColor', bdPts);
    });
    // 다 돌면 애니메이션을 걷고 같은 끝 모습을 클래스로 남긴다(영상 창이 그 위에서 at(s)로 바꿀 수 있게)
    Promise.all(sweep.map(a => a.finished)).then(() => { stopSweep(); allOn(); }).catch(() => {});
  }

  // 영상 창
  const vid = document.getElementById('vid'), vv = document.getElementById('vv');
  const vch = document.getElementById('vch'), vno = document.getElementById('vno'), vtt = document.getElementById('vtt'), vtm = document.getElementById('vtm');
  const mini = document.getElementById('mini');
  P.forEach((p, i) => { const g = document.createElement('span'); g.style.width = ((CUT[i + 1] - CUT[i]) / TOTAL * 100) + '%'; g.style.background = p.c; mini.appendChild(g); });
  const miniMark = document.createElement('em'); mini.appendChild(miniMark);
  const minis = [...mini.querySelectorAll('span')];
  function paint() {
    const s = vv.currentTime || 0, k = idx(s);
    // 영상 시각을 장의 막대와 영상 창의 구간 표시에 함께 옮긴다. 끝까지 보면 네 구간을 모두 켠다
    stopSweep();
    // 창이 닫혔는데 1초도 안 봤으면(V를 잘못 누름) 이벤트 순서와 상관없이 끝 모습으로 둔다
    if (vv.ended || (!vid.open && s < 1)) allOn(); else at(s);
    vch.style.setProperty('--c', P[k].c);
    vno.textContent = '0' + (k + 1); vtt.textContent = P[k].t;
    vtm.textContent = `${mm(s)} / ${mm(TOTAL)}`;
    minis.forEach((g, i) => g.classList.toggle('on', i === k));
    miniMark.style.left = `calc(${pct(s)} - 1px)`;
  }
  let wt = 0;
  const wake = () => { vid.classList.add('awake'); clearTimeout(wt); wt = setTimeout(() => vid.classList.remove('awake'), 2500); };
  function openVideo() {
    if (!vid.open) { try { vid.showModal(); } catch (e) { vid.setAttribute('open', ''); } }
    paint(); wake();
    if (vv.ended) vv.currentTime = 0;
    const p = vv.play(); if (p && p.catch) p.catch(() => {});
  }
  function closeVideo() { vv.pause(); if (vid.open) { try { vid.close(); } catch (e) { vid.removeAttribute('open'); } } }
  const toggle = () => { if (vv.paused || vv.ended) { const p = vv.play(); if (p && p.catch) p.catch(() => {}); } else vv.pause(); };
  document.getElementById('play').addEventListener('click', openVideo);
  document.getElementById('vx').addEventListener('click', closeVideo);
  // 덱이 원본 창처럼 대화 상자를 닫아도(발표자 노트 창의 → 등) 영상은 멈춘다
  // 영상 창을 닫으면 그 시각의 모습을 남긴다. 다만 V를 잘못 눌러 1초 안에 닫았으면 끝 모습(네 구간 모두)으로 둔다
  vid.addEventListener('close', () => { vv.pause(); if ((vv.currentTime || 0) < 1 && !vv.ended) { stopSweep(); allOn(); } else paint(); });
  vid.addEventListener('mousemove', wake);
  vv.addEventListener('timeupdate', paint);
  vv.addEventListener('seeked', paint);
  vv.addEventListener('play', () => { vid.classList.add('playing'); paint(); });
  vv.addEventListener('pause', () => vid.classList.remove('playing'));
  vv.addEventListener('ended', () => { vid.classList.remove('playing'); paint(); });
  // 영상 오류: 한 번은 다시 받아 직전 시각부터 잇는다(이 맥의 덱 서버에서 받는 도중 끊기는 일이 있었다). 두 번째 오류에서만 안내를 띄운다
  let lastT = 0, retried = false;
  vv.addEventListener('timeupdate', () => { if (vv.currentTime > 0) lastT = vv.currentTime; });
  vv.addEventListener('error', () => {
    if (!retried) {
      retried = true; const t = lastT, wasPlaying = vid.classList.contains('playing') || !vv.paused;
      vv.addEventListener('loadedmetadata', () => { try { vv.currentTime = t; } catch (e) {} if (wasPlaying || vid.open) { const p = vv.play(); if (p && p.catch) p.catch(() => {}); } }, { once: true });
      vv.load(); return;
    }
    document.getElementById('verr').hidden = false; vv.style.visibility = 'hidden';
  });

  // 키: V 로 영상을 띄운다. 영상 창이 열려 있으면 덱보다 먼저 받아 장이 넘어가지 않게 한다(F·N·E는 덱으로 그대로)
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key, isV = k === 'v' || k === 'V' || e.code === 'KeyV';
    if (!vid.open) { if (isV) { e.preventDefault(); openVideo(); } return; }
    const take = () => { e.preventDefault(); e.stopImmediatePropagation(); };
    if (k === 'Escape') { take(); closeVideo(); return; }
    if (vv.ended && ['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { take(); closeVideo(); return; }
    if (k === ' ' || isV || k === 'k' || k === 'K') { take(); toggle(); wake(); return; }
    if (k === 'ArrowRight' || k === 'ArrowLeft') {
      take(); vv.currentTime = Math.min(Math.max((vv.currentTime || 0) + (k === 'ArrowRight' ? 5 : -5), 0), vv.duration || TOTAL); wake(); return;
    }
    if (['PageDown', 'PageUp', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(k)) take();
  }, true);
})();
</script>
<!-- 발표 노트(18초 + 영상 7분): 이제 7분 시연 영상입니다. 평상시 관제, 요청 급증과 AI 증설, DB 장애와 자동 전환, AI 상담 순서입니다.
영상 속 AI는 녹화 당시의 20B 모델이고, 앞 장의 평가는 그 뒤 바꾼 모델로 한 것입니다.
(V 또는 재생 단추로 영상, 끝나면 Esc로 닫기)
영상이 끝나고 넘길 때: 영상 속 경보가 Teams로 간 모습은 다음 장에서 보여 드립니다(보고 전달의 카드 · PDF는 같은 13회차 경보 00:03 발생 · 00:05 해제 · 00:06 보고, 증거본/2026-09-27_학교AWS_발표서버/README.md).
질문 때:
- AWS에서 찍었나? 로컬 Docker 시연 스택에서 AWS 배치대로 그린 화면이고 값은 실측이다. 개인 AWS에도 Patroni 엄격 동기를 적용했다.
- 04-6 평가는 qwen3.6 35B인데 영상은? 녹화 당시 개발 PC 모델이 gpt-oss:20b였다. 같은 평가에서 잘못 실행될 조치가 2/111이었고, 수동 모드라 실행은 승인 뒤에만 된다.
- 증설 기준 50%(영상 2:19 자막)? 로컬 시연 스택은 요청 제한 때문에 CPU가 60%대에 닿지 않아 50%로 낮췄다(로드맵 09-27). AWS 기준은 60%다.
- 마무리의 숫자? 마무리 장은 이 영상과 같은 13회차 값이다(승격 27.0초, 재개 95.9초, 확인받은 쓰기 16,858건 · 주문 974건 대조 유실 0). 같은 구성의 반복 실험(9/25)은 승격 22.75~23.18초였다.
- 재개까지 95.9초, 옛 주 DB가 안 돌아오면? 엄격 동기 두 대라 동기 예비가 없으면 쓰기를 멈춘다. 새 예비를 붙이거나 엄격 모드를 잠시 푸는 것은 운영자가 판단한다.
- Grafana에서 앱 서버 3 CPU가 비스듬히 오른다? 꺼져 있던 동안 값이 없어 앞뒤 점을 직선으로 이은 것이다.
- AI 상담 답의 '리더 부재·파티션 재구축 실패'는? 해제 전에 남아 있던 경보(LeaderAbsent · PartitionRebuildFailing · FailoverRtoExceeded)를 근거로 답한 것이다. 답 화면의 근거 칩에 '값 없음'이 함께 보여 사람이 확인하게 되어 있고, 그래서 결정은 사람이 한다. FailoverRtoExceeded는 매칭 리더 리스의 공백(옛 리더 마지막 심박 ~ 승격)이 30초를 넘으면 울린다(harness/prometheus/rules/exchange-alerts.yml 64~65행). 13회차에서 실제로 30초를 넘었는지는 기록으로 다시 확인할 것.
- '앱 서버 3'과 '조회 서버'? 같은 노드다. 영상과 Docker 구성의 이름은 app-3(api-3)이고, 맡은 역할이 조회 서버다.
