<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 01 기획 배경</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --ai: #C6C0F2;
    --data: #5CCFE6;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --figure: #5A6780;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  h1 {
    position: absolute; left: 130px; top: 164px; margin: 0;
    font-size: 60px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em;
    animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both;
  }

  /* 왼쪽: 책상 앞에 앉은 한 사람(표지판 그림처럼 굵은 선 하나로). 평소에는 턱을 괴고, 통장 잔액을 본 순간(5번)만 머리를 감쌌다가 6번에서 다시 턱을 괸다 */
  .me { position: absolute; left: 110px; top: 354px; width: 460px; height: 600px; overflow: visible; animation: fade .9s .2s ease-out both; }
  .me .p { fill: none; stroke: var(--figure); stroke-linecap: round; stroke-linejoin: round; }
  .me .hd { fill: var(--figure); }
  .me .fur { fill: none; stroke: var(--line); stroke-width: 8; stroke-linecap: round; }
  .me .lap { fill: none; stroke: var(--ink-3); stroke-width: 7; stroke-linecap: round; }
  .me .plate { fill: #1E2533; stroke: var(--card); stroke-width: 1.5; }
  .me .plname { font-family: var(--sans); font-size: 24px; font-weight: 600; letter-spacing: .08em; fill: var(--ink-2); }
  .me .tilt { transform-box: view-box; transform-origin: 168px 250px; transition: transform .45s cubic-bezier(.3,.7,.3,1); }
  .me .think circle { fill: var(--ink-3); opacity: 0; transition: opacity .3s; }
  .me .think.on circle { animation: bob 1.8s ease-in-out infinite; }
  .me .think.on circle:nth-child(2) { animation-delay: .25s; }
  .me .think.on circle:nth-child(3) { animation-delay: .5s; }
  .stage:not(.panic) .me .panic, .stage.panic .me .calm { opacity: 0; }
  /* 3·4·6번: 턱을 괴던 손을 내려 키보드를 친다(두 손이 번갈아). 고개는 화면 쪽으로 조금 숙인다. 끝 화면에서는 손을 멈춘다 */
  .me .type { opacity: 0; }
  .stage.keys:not(.panic) .me .type { opacity: 1; }
  .stage.keys:not(.panic) .me .calm { opacity: 0; }
  .stage.keys:not(.panic) .me .tilt { transform: rotate(4deg) translateY(2px); }
  .me .type .fa { transform-box: view-box; animation: tap .28s ease-in-out infinite alternate; }
  .me .type .fa1 { transform-origin: 224px 370px; }
  .me .type .fa2 { transform-origin: 212px 376px; animation-delay: .14s; }
  @keyframes tap { from { transform: rotate(-4deg); } to { transform: rotate(3deg); } }
  .stage.fin .me .type .fa, .stage.still .me .type .fa { animation: none; }
  .stage.keys.still:not(.panic) .me .tilt { transform: rotate(-3deg); }
  .stage.panic .me .tilt { transform: rotate(8deg) translateY(6px); }
  @keyframes bob { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: .9; transform: translateY(-6px); } }

  /* 통장 잔액: 5번 대사와 함께 떠올라 숫자가 굴러가다 300,000원에 멈춘다 */
  .bank {
    position: absolute; left: 130px; top: 344px; width: 370px;
    padding: 16px 22px 18px; border: 1.5px solid var(--warm); border-radius: 14px; background: #1E1F26;
    opacity: 0; transform: translateY(14px); transition: opacity .45s, transform .45s cubic-bezier(.2,.7,.2,1);
  }
  .stage.broke .bank { opacity: 1; transform: none; transition-delay: .3s; }
  .bank .k { font-size: 22px; color: var(--ink-3); }
  .bank .v { margin-top: 2px; font-size: 52px; font-weight: 700; letter-spacing: -.01em; color: var(--warm); font-variant-numeric: tabular-nums; }
  .bank .v small { font-family: var(--sans); font-size: 30px; font-weight: 600; margin-left: 4px; }

  /* 오른쪽: 혼잣말이 말풍선으로 쌓인다. 꼬리는 지금 말풍선에만 붙어 사람 쪽을 가리킨다 */
  .talk { position: absolute; left: 680px; right: 130px; top: 344px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .talk li {
    position: relative; max-width: 1080px;
    padding: 14px 30px 16px; border-radius: 22px 22px 22px 6px;
    background: #1A2130; border: 1.5px solid var(--line);
    font-size: 30px; line-height: 1.45; color: var(--ink); word-break: keep-all;
    opacity: 0; transform: translateY(18px) scale(.94); transform-origin: left top;
    transition: opacity .45s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.34,1.45,.64,1), border-color .4s;
  }
  .talk li.in { opacity: .6; transform: none; }
  .talk li.on { opacity: 1; border-color: var(--c, var(--brand)); }
  .stage.broke:not(.fin) .talk li.in:not(.on):not(.after):not(.money) { opacity: .22; }
  /* 재생이 끝나면 부하·주문 기록·운영 대상이 함께 읽히도록 남긴다. */
  .stage.fin .talk li.key { opacity: 1; }
  .talk li::before {
    content: ''; position: absolute; left: -10px; top: 22px; width: 16px; height: 16px;
    background: #1A2130; border-left: 1.5px solid var(--c, var(--brand)); border-bottom: 1.5px solid var(--c, var(--brand));
    transform: rotate(45deg) skew(8deg, 8deg); opacity: 0; transition: opacity .3s;
  }
  .talk li.on::before { opacity: 1; }
  .talk li.th { border-style: dashed; }
  .talk li.th::before { display: none; }
  /* 강조 구절: 말풍선이 나오고 조금 뒤 밑줄이 그어진다 */
  .talk em { font-style: normal; font-weight: 600; position: relative; white-space: nowrap; }
  .talk em::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 3px; border-radius: 2px; background: var(--u); transform: scaleX(0); transform-origin: left; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .talk li.in em::after { transform: scaleX(1); }
  .stage.broke:not(.fin) .talk li:not(.on) em::after { opacity: .3; }
  .talk li.in em:nth-of-type(1)::after { transition-delay: .45s; }
  .talk li.in em:nth-of-type(2)::after { transition-delay: .7s; }
  .talk li.in em:nth-of-type(3)::after { transition-delay: .95s; }
  .u-ha { --u: var(--brand); } .u-tr { --u: var(--bad); } .u-da { --u: var(--data); } .u-ch { --u: var(--warm); } .u-ex { --u: var(--data); }
  /* 6번 'AI' 밑줄은 말풍선 테두리와 같은 초록. 연보라는 덱에서 트래픽(탄력성)을 뜻하므로 AI에 쓰지 않는다(다음 장 기획 시나리오와 겹침 방지) */
  .u-ai { --u: var(--ok); }
  .talk .money { --c: var(--warm); font-size: 36px; }
  .talk .money b { font-weight: 700; color: var(--warm); }
  .talk .money.on { animation: shake .6s 1.55s; }
  @keyframes shake { 15% { transform: translateX(-11px); } 30% { transform: translateX(9px); } 45% { transform: translateX(-7px); } 60% { transform: translateX(5px); } 80% { transform: translateX(-2px); } }
  .talk .aib { --c: var(--ok); }
  /* 4번 말풍선 끝의 작은 캔들 그림(국내 거래소 관례대로 오름 빨강, 내림 파랑) */
  .talk .cdl { display: inline-block; width: 64px; height: 30px; margin-left: 14px; vertical-align: -4px; }


  /* 숨 쉬기(아주 작게 위아래)와 말풍선이 나올 때의 끄덕임 */
  .me .breath { animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: translateY(2.5px); } }
  .me .nod { transform-box: view-box; transform-origin: 168px 250px; }
  .me .nod.go { animation: nod .55s cubic-bezier(.3,.7,.3,1); }
  @keyframes nod { 35% { transform: rotate(5deg) translateY(4px); } 100% { transform: none; } }
  /* 말풍선이 나오기 직전의 '입력 중' 점 세 개(메신저처럼) */
  .typing { position: absolute; left: 0; top: 0; display: flex; gap: 8px; padding: 16px 22px; border-radius: 22px 22px 22px 6px; background: #1A2130; border: 1.5px solid var(--line); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .25s; pointer-events: none; }
  .typing.on { opacity: 1; transform: none; }
  .typing i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); animation: dot 1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 100% { opacity: .3; transform: none; } 40% { opacity: 1; transform: translateY(-5px); } }
  /* 잔액 카드: 튀어 오르듯 등장 */
  /* 카드는 5번 말풍선보다 0.3초 늦게 튀어 오르고, 숫자가 300,000에 멈추는 순간 숫자만 한 번 내려앉는다 */
  .stage.broke .bank { animation: pop .5s .3s cubic-bezier(.34,1.56,.64,1) backwards; }
  .stage.panic .bank .v { animation: land .32s cubic-bezier(.3,1.6,.5,1); transform-origin: left center; }
  @keyframes land { 0% { transform: scale(1.14); } 100% { transform: none; } }
  /* 끝 화면에서는 결론 줄이 먼저 보이도록 카드를 한 단계 낮춘다 */
  .stage.fin .bank { opacity: .6; transition-delay: 0s; }
  .stage.broke .talk li:not(.on) .cdl { opacity: .4; }
  .head .r .sec { display: none; }
  /* 제목과 함께 목적을 먼저 보여 주고, 말풍선으로 선택 과정을 설명한다. */
  .kick { position: absolute; left: 130px; top: 250px; margin: 0; font-size: 34px; font-weight: 600; color: var(--ink); animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both; }
  .kick .hl { color: var(--brand); }
  /* 제약 조건 세 칩은 말풍선 재생이 끝날 때 오른쪽에 정리한다. */
  .cons { position: absolute; right: 130px; top: 246px; display: flex; align-items: center; gap: 12px; }
  .cons .k { font-size: 22px; color: var(--ink-3); margin-right: 4px; opacity: 0; transition: opacity .5s .2s; }
  .cons .c { display: inline-flex; align-items: baseline; gap: 10px; padding: 7px 16px 8px; border: 1.5px solid var(--line); border-radius: 999px; background: #161C29; opacity: 0; transform: translateY(10px); transition: opacity .5s, transform .6s cubic-bezier(.34,1.4,.64,1); }
  .cons i { font-style: normal; font-size: 22px; color: var(--ink-3); }
  .cons b { font-size: 26px; font-weight: 700; color: var(--ink); }
  .stage.fin .cons .k { opacity: 1; }
  .stage.fin .cons .c { opacity: 1; transform: none; }
  .stage.fin .cons .c:nth-child(2) { transition-delay: .35s; } .stage.fin .cons .c:nth-child(3) { transition-delay: .5s; } .stage.fin .cons .c:nth-child(4) { transition-delay: .65s; }
  .talk .aha { font-weight: 700; color: var(--ink); margin-right: 4px; }
  @keyframes pop { 0% { transform: translateY(14px) scale(.9); } 100% { transform: none; } }
  /* 재생 막대: 자동 재생이 어디까지 왔는지(발표자에게만 희미하게) */
  .prog { position: absolute; left: 680px; right: 130px; top: 1000px; height: 2px; background: var(--line); overflow: hidden; opacity: .6; }
  .prog i { position: absolute; inset: 0; background: var(--ink-3); transform: scaleX(0); transform-origin: left; }
  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">기획 배경</span>01</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <h1>기획 배경</h1>
  <p class="kick">모의 거래소로 검증하는 <span class="hl">고가용성 인프라</span></p>
  <div class="cons" aria-label="제약 조건"><span class="k">제약 조건</span><span class="c"><i>운영 예산</i><b class="w">30만 원</b></span><span class="c"><i>운영 인력</i><b>1명</b></span><span class="c"><i>배포 기간</i><b>한 달</b></span></div>

  <div class="bank" aria-hidden="true"><div class="k">월 운영 예산</div><div class="v"><span id="bal">0</span><small>원</small></div></div>

  <svg class="me" viewBox="0 0 460 600" aria-hidden="true">
    <g class="think" id="think"><circle cx="226" cy="140" r="8"/><circle cx="252" cy="104" r="11"/><circle cx="286" cy="60" r="14"/></g>
    <!-- 의자와 책상 -->
    <path class="fur" d="M96 426 H168 M108 426 L96 300 M130 430 V556 M96 556 H164"/>
    <path class="fur" d="M214 402 H430 M410 402 V556"/>
    <!-- 노트북: 화면은 사람 쪽을 향한다 -->
    <path class="lap" d="M276 396 H386 L404 290"/>
    <!-- 사람: 몸통·다리는 늘 같고, 팔과 머리만 자세에 따라 바뀐다 -->
    <g class="breath">
    <path class="p" d="M160 272 L134 410" stroke-width="32"/>
    <path class="p" d="M134 420 L236 426 L230 544 L260 544" stroke-width="24"/>
    <g class="tilt"><g class="nod" id="nod">
      <circle class="hd" cx="168" cy="210" r="36"/>
      <g class="pose calm"><path class="p" d="M160 292 L246 386 L204 236" stroke-width="20"/></g>
      <g class="pose panic"><path class="p" d="M158 290 L222 236 L202 196" stroke-width="20"/><path class="p" d="M150 294 L112 232 L134 196" stroke-width="18" style="opacity:.75"/></g>
    </g></g>
    <g class="pose type">
      <path class="p" d="M150 296 L212 376" stroke-width="18"/>
      <path class="p fa fa2" d="M212 376 L300 394" stroke-width="18"/>
      <path class="p" d="M160 292 L224 370" stroke-width="20"/>
      <path class="p fa fa1" d="M224 370 L320 390" stroke-width="20"/>
    </g>
    </g>
    <!-- 책상 앞판의 명패 -->
    <rect class="plate" x="274" y="408" width="116" height="42" rx="6"/>
    <text class="plname" x="332" y="438" text-anchor="middle">이상혁</text>
  </svg>

  <ol class="talk" id="talk">
    <li class="th">서버를 운영해 보려면, 어떤 서비스가 좋을까?</li>
    <li class="key"><em class="u-tr">요청이 몰릴 때</em>도, <em class="u-ch">서버가 멈췄을 때</em>도 확인해 보자.</li>
    <li class="key">그때도 <em class="u-da">주문 기록</em>은 <em class="u-ha">온전히 남아 있어야</em> 하잖아.</li>
    <li class="key"><b class="aha">아하!</b> 만들어 둔 <em class="u-ex">모의 거래소</em>를 직접 운영해 보자.<svg class="cdl" viewBox="0 0 64 30" aria-hidden="true"><path d="M6 12 V26 M20 10 V24 M34 8 V22 M50 1 V20" stroke="#8390A1" stroke-width="1.5"/><rect x="2" y="15" width="8" height="8" rx="1" fill="#FF7A7A"/><rect x="16" y="13" width="8" height="7" rx="1" fill="#79A7FA"/><rect x="30" y="11" width="8" height="8" rx="1" fill="#FF7A7A"/><rect x="46" y="3" width="8" height="15" rx="1" fill="#FF7A7A"/></svg></li>
    <li class="money">근데… 한 달 운영비는 <b>30만 원</b>까지네.</li>
    <li class="aib after">지표와 경보를 보고, <em class="u-ai">AI가 조치를 제안</em>하게 하자.</li>
    <div class="typing" id="typing" aria-hidden="true"><i></i><i></i><i></i></div>
  </ol>
  <div class="prog orig" aria-hidden="true"><i id="prog"></i></div>
</div>

<!-- 발표 노트(35초): (장 진입 직후, 0~5초)
먼저, 기획 배경을 짧은 애니메이션으로 보여드리겠습니다.

(도입을 말한 뒤에는 청중이 말풍선을 읽도록 기다린다. 장을 연 시점부터 약 20초에 마지막 AI 말풍선과 제약 조건이 모두 보인다. 도입 시간은 이 20초에 포함된다.)

(약 20~35초, 마지막 화면에서 설명)
부하 대응과 주문 기록 보존을 함께 확인하려고 모의 거래소를 골랐습니다.
혼자 운영하는 만큼, 지표 분석과 조치 제안에는 AI의 도움을 받았습니다.

(한 박자 쉰 뒤 다음 장. 말풍선을 하나씩 읽거나 관객의 웃음을 기다리지는 않는다.) -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // 자동 재생: 장이 열리면 '입력 중' 점 → 말풍선 순서로 저절로 나온다(약 20초).
  // 5번(통장)에서 사람이 머리를 감싸고 잔액 카드가 뜨며, 6번에서 다시 턱을 괸다. 끝까지 키 입력 없이 이어진다.
  // → 는 재생 중이면 다음 말풍선을 바로 부르고, 끝났으면 다음 장으로. ← 는 앞 장. R 은 처음부터 다시
  const items = [...document.querySelectorAll('#talk li')];
  const think = document.getElementById('think'), bal = document.getElementById('bal');
  const typing = document.getElementById('typing'), nod = document.getElementById('nod'), prog = document.getElementById('prog');
  const MONEY = 4, LAST = items.length - 1, TARGET = 300000;
  // 말풍선 사이에 2.7~2.8초의 읽을 시간을 둔다. 예산 장면은 4초, 마지막 AI 설명은 3초 남긴다.
  // 다음 말풍선 앞의 0.7초는 '입력 중' 점으로 표시한다.
  const AT = [1.5, 4.2, 7.0, 9.8, 12.6, 16.6], END = 19.6;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cur = -1, t0 = 0, raf = 0, rollRaf = 0, done = false, released = false;
  const fmt = n => n.toLocaleString('ko-KR');
  function roll() {
    cancelAnimationFrame(rollRaf);
    const from = 3000000, s0 = performance.now();
    const step = now => {
      const p = Math.min(1, (now - s0) / 1100), e = 1 - Math.pow(1 - p, 4);
      bal.textContent = fmt(Math.round((from + (TARGET - from) * e) / 1000) * 1000);
      if (p < 1) rollRaf = requestAnimationFrame(step);
    };
    rollRaf = requestAnimationFrame(step);
  }
  function show(i, quiet) {
    const prev = cur; cur = i;
    items.forEach((li, k) => { li.classList.toggle('in', k <= i); li.classList.toggle('on', k === i); });
    think.classList.toggle('on', i < 0);
    stage.classList.toggle('broke', i >= MONEY);
    // 5번: 말풍선과 흐려짐(0초) → 카드와 숫자 굴림(0.35초) → 숫자가 멈추는 순간 머리 감싸기·흔들림(1.45초)
    clearTimeout(show.t1); clearTimeout(show.t2);
    // 5번 숫자가 다 구르기 전에 6번으로 넘어가도 카드는 300,000원에서 멈춘다
    if (i > MONEY) { cancelAnimationFrame(rollRaf); bal.textContent = fmt(TARGET); }
    // 5번은 손을 자판 위에 멈추고 고개를 든 채 잔액을 본 뒤(1.55초) 머리를 감싼다
    stage.classList.toggle('keys', i === 2 || i === 3 || i === MONEY || i === LAST);
    stage.classList.toggle('still', i === MONEY);
    if (i !== MONEY) stage.classList.remove('panic');
    else if (quiet) stage.classList.add('panic');
    else show.t2 = setTimeout(() => stage.classList.add('panic'), 1550);
    if (i >= MONEY && prev < MONEY) { if (quiet) bal.textContent = fmt(TARGET); else { bal.textContent = fmt(3000000); show.t1 = setTimeout(roll, 450); } }
    if (i < MONEY) bal.textContent = '0';
    if (!quiet && i > prev && i !== MONEY) { nod.classList.remove('go'); void nod.getBoundingClientRect(); nod.classList.add('go'); }
  }
  function typeAt(k) {
    const li = items[k];
    if (!li) { typing.classList.remove('on'); return; }
    typing.style.top = li.offsetTop + 'px'; typing.classList.add('on');
  }
  function finish() {
    cancelAnimationFrame(raf); done = true; typing.classList.remove('on');
    show(LAST, true); bal.textContent = fmt(TARGET); prog.style.transform = 'scaleX(1)'; stage.classList.add('fin');
  }
  function tick(now) {
    if (!t0) t0 = now;
    // 6번까지 키를 누르지 않아도 AT 시각대로 끝까지 저절로 나온다
    const t = (now - t0) / 1000;
    stage.classList.toggle('fin', t >= END - .4);
    let k = -1; AT.forEach((a, j) => { if (t >= a) k = j; });
    if (k !== cur) show(k);
    const next = k + 1;
    // 1번은 생각 말풍선이라 '입력 중' 점 없이 머리 위 생각 점만 쓴다
    if (next > 0 && next <= LAST && t >= AT[next] - .7) typeAt(next); else typing.classList.remove('on');
    prog.style.transform = `scaleX(${Math.min(1, t / END)})`;
    if (t >= END) { done = true; typing.classList.remove('on'); return; }
    raf = requestAnimationFrame(tick);
  }
  function play() { cancelAnimationFrame(raf); done = false; released = false; stage.classList.remove('fin'); t0 = 0; cur = -1; show(-1, true); raf = requestAnimationFrame(tick); }
  // 주소가 #last로 열리면(뒤 장에서 돌아온 경우) 끝 장면으로 연다
  if (location.hash === '#last' || reduce) finish(); else play();
  window.deckStep = d => {
    // 재생 중 → 는 다음 말풍선을 바로 부른다(이후 자동 재생은 그 자리부터 이어짐). 끝났으면 다음 장
    // 이미 '입력 중' 점이 떠 있으면 말풍선을 바로 부른다. 6번 뒤에는 제약 조건을 포함한 끝 화면을 보인다.
    if (d > 0 && !done) {
      const n = cur + 1, now = performance.now();
      if (n > LAST) { if (!stage.classList.contains('fin')) { finish(); return true; } cancelAnimationFrame(raf); return false; }
      if (n === LAST) released = true;
      const t = (now - t0) / 1000, to = n === 0 || t >= AT[n] - .7 ? AT[n] : AT[n] - .7;
      t0 = now - to * 1000; return true;
    }
    return false;
  };
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'r' || e.key === 'R') play();
  });
})();
</script>
