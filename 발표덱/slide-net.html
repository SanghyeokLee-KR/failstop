<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-2 네트워크</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --ai: #C6C0F2;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 158px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both; }
  .dek { position: absolute; left: 130px; right: 130px; top: 244px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .8s .3s ease-out both; }
  .tag { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; white-space: nowrap; }
  .tag img { width: 26px; height: 26px; }
  button.tag { font-family: var(--sans); background: transparent; cursor: pointer; }
  .tag .mx { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-left: 2px; }

  /* 도면: 위에서 아래로 공인 구간 → 경계(라우터·방화벽) → DMZ(방화벽 옆) → 내부(방화벽 아래), 관리망은 내부 안에 따로.
     방화벽 한 대가 세 구역을 잇는 문이다(밖 0 · DMZ 50 · 안 100). 좌표는 viewBox 1120×620 */
  .net { position: absolute; left: 130px; top: 318px; width: 1120px; height: 620px; overflow: visible; }
  .net text { font-family: var(--sans); }
  .net .zone { fill: rgba(255,255,255,.018); stroke: #5A6883; stroke-width: 1.6; }
  .net .zone.dmz { fill: rgba(232,192,122,.035); stroke: rgba(232,192,122,.55); }
  .net .zone.sub { fill: rgba(255,255,255,.025); stroke: #5A6883; stroke-dasharray: 6 6; }
  .net .zh { font-size: 22px; font-weight: 600; fill: var(--ink); }
  .net .zh tspan.m { font-family: var(--mono); font-weight: 500; fill: var(--ink-2); }
  .net .zh tspan.n { font-weight: 400; fill: var(--ink-3); }
  .net .wire { fill: none; stroke: #56647C; stroke-width: 2; }
  .net .nd rect { fill: #1A2130; stroke: var(--card); stroke-width: 1.6; transition: stroke .3s, fill .3s; }
  .net .nd text.nm { font-size: 22px; fill: var(--ink-2); }
  .net .nd.gate rect { fill: #1C2538; stroke: var(--ink); stroke-width: 2.4; }
  .net .nd.gate text.nm { font-size: 24px; font-weight: 600; fill: var(--ink); }
  .net .nd.gate text.sub { font-size: 22px; fill: var(--ink-2); }
  .net .nd.halo circle { fill: transparent; stroke: transparent; stroke-width: 1.6; transition: stroke .25s, fill .25s; }
  /* 출발하면 목적지에 파란 점선 테두리(어디로 가는지), 판정 뒤에는 도착한 곳은 초록, 막은 장비는 빨강 테두리가 남는다 */
  .net .nd.lit-ok rect { stroke: var(--ok); }
  .net .nd.lit-no rect { stroke: var(--bad); }
  .net .nd.aim rect { stroke: var(--glow); stroke-width: 2; stroke-dasharray: 7 5; }
  .net .nd.hit-pass rect, .net .nd.halo.hit-pass circle { stroke: var(--glow); fill: #1B2A44; }
  .net .nd.hit-ok rect { stroke: var(--ok); fill: #173A31; }
  .net .nd.hit-no rect { stroke: var(--bad); fill: #3A1E25; }
  .net .sm { font-size: 22px; fill: var(--ink-3); }
  .net .lg { font-size: 22px; fill: var(--ink-3); }
  .net .lg.k { fill: var(--ink-2); }
  .net .lg tspan.v { font-family: var(--mono); font-weight: 600; fill: var(--ink); }
  .net .nat { font-size: 22px; fill: var(--ink-3); transition: fill .25s; }
  .net .nat tspan.b { font-weight: 600; fill: var(--ink); }
  .net .nat.hit { fill: var(--glow); }
  /* 흐름: 움직이는 동안은 파랑, 판정한 순간 허용은 초록, 막힌 길은 회색 점선으로 낮춘다. 설정만 확인한 길은 점 없이 초록 점선이 한 번에.
     같은 선을 쓰는 흐름은 10px 옆 차선으로 비켜 그린다 */
  .net .trail { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; transition: stroke .35s; }
  .net .trail.mv { stroke: var(--brand); }
  .net .trail.ok { stroke: var(--ok); }
  .net .trail.rule { stroke: var(--ok); stroke-width: 4; stroke-dasharray: 10 9; stroke-linecap: butt; animation: fade .4s ease-out both; }
  .net .trail.gone { stroke: #8A96AB; stroke-width: 3; stroke-dasharray: 4 8; }
  .net .dot { fill: #D6E4FF; stroke: var(--brand); stroke-width: 2.4; }
  .net .xmark circle { fill: #2A1F29; stroke: var(--bad); stroke-width: 2.6; }
  .net .xmark path { stroke: var(--bad); stroke-width: 3.4; stroke-linecap: round; fill: none; }
  .net .xmark text { font-size: 22px; font-weight: 600; fill: var(--bad); }
  .net .xmark { transform-box: fill-box; transform-origin: center; animation: pop .4s cubic-bezier(.2,.7,.2,1.4) both; }
  .net .fadeout { animation: fadeout .3s ease-out forwards; }
  .net .bld { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .net .b1 { animation-delay: .25s; } .net .b2 { animation-delay: .45s; } .net .b3 { animation-delay: .65s; }
  .net .b4 { animation-delay: .85s; } .net .b5 { animation-delay: 1.05s; }

  /* 오른쪽: 이 설계로 확인한 길. → 마다 한 묶음씩, 한 번에 한 흐름이 나가고 그 줄이 먼저 밝아진 뒤 판정이 붙는다.
     흐름 사이의 쉼은 발표자가 그 줄을 말하는 박자에 맞췄다. 줄을 누르면 그 흐름만 다시 보인다(질문 대응) */
  .pane { position: absolute; left: 1310px; top: 318px; width: 480px; }
  .pane .ph { display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .pane .ph b { font-size: 24px; font-weight: 600; color: var(--ink); }
  .pane .lgd { font-size: 22px; color: var(--ink-3); display: flex; gap: 16px; align-items: center; }
  .pane .lgd span { display: inline-flex; align-items: center; gap: 8px; }
  .pane .mk { flex: none; display: inline-block; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; }
  .pane .mk.t { background: var(--ink-2); }
  .pane .mk.r { border: 2.5px solid var(--ink-2); }
  .pane .grp { margin-top: 14px; opacity: 0; transition: opacity .35s; }
  .pane .grp.on { opacity: 1; }
  .pane .grp h3 { margin: 0 0 4px; font-size: 22px; font-weight: 600; color: var(--ink-3); }
  .pane .row { display: flex; align-items: center; gap: 12px; width: calc(100% + 20px); padding: 3px 10px; margin: 0 0 2px -10px; background: transparent; border: 0; border-radius: 8px;
    font-family: var(--sans); font-size: 22px; line-height: 1.5; color: var(--ink-2); text-align: left; cursor: pointer;
    opacity: 0; transform: translateX(-8px); pointer-events: none; transition: opacity .3s, transform .4s cubic-bezier(.2,.7,.2,1), background .3s, color .3s; }
  .pane .row.show { opacity: 1; transform: none; pointer-events: auto; }
  .pane .row.cur { background: rgba(121,167,250,.16); color: var(--ink); }
  .pane .row:hover { background: rgba(255,255,255,.05); }
  .pane .row:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .pane .row .fl { flex: 1; }
  .pane .row .v { flex: none; font-weight: 600; padding: 0 10px; border-radius: 14px; border: 1.5px solid transparent; line-height: 1.3;
    opacity: 0; transform: scale(.6); transition: opacity .25s, transform .4s cubic-bezier(.2,.7,.2,1.5); }
  .pane .row.on .v { opacity: 1; transform: none; }
  .pane .row .v.ok { color: var(--ok); background: rgba(45,209,150,.14); border-color: rgba(45,209,150,.6); }
  .pane .row .v.no { color: var(--bad); background: rgba(255,122,122,.14); border-color: rgba(255,122,122,.6); }
  .pane .row .v.rule { color: var(--ok); border: 1.6px dashed rgba(45,209,150,.85); }

  .foot {
    position: absolute; left: 130px; right: 130px; bottom: 58px;
    display: flex; align-items: baseline; gap: 28px;
    padding-top: 18px; border-top: 1px solid var(--line);
    font-size: 25px; color: var(--ink);
    opacity: 0; transform: translateY(10px); transition: opacity .6s, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .stage.done .foot { opacity: 1; transform: none; transition-delay: .4s; }
  .foot .k { font-size: 22px; color: var(--ink-3); white-space: nowrap; }
  .foot .nx { margin-left: auto; font-size: 22px; color: var(--ink-3); white-space: nowrap; }

  /* 원본 Packet Tracer 도면(질문 대비). E 키 도구를 켤 때만 단추가 보인다 */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); }
  .fig::backdrop { background: rgba(8,10,15,.86); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .25s ease-out; }
  .fig .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 24px; font-size: 22px; color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); font-size: 22px; }
  .fig .bar .x { margin-left: auto; font-family: var(--sans); font-size: 22px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; }
  .fig .view { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 24px 24px; }
  .fig img { max-width: calc(100vw - 48px); max-height: calc(100vh - 80px); border-radius: 6px; background: #fff; cursor: zoom-in; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .fig.zoom .view { place-items: start; }
  /* 원본 도면은 좌우 메모 글을 잘라 낸 그림(1495px)이라 평소에는 원래 크기 그대로 또렷하게 보이고, 누르면 정확히 두 배로 키운다 */
  .fig.zoom img { max-width: none; max-height: none; width: 2990px; cursor: zoom-out; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeout { to { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="stage" id="stage" data-step="0">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">주요 설계 및 구현</span>04-2</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>인터넷과 내부 사이에 DMZ, 필요한 길만 개방</h1>
    <button class="tag orig" id="open-fig" type="button" aria-haspopup="dialog"><img src="assets/tint/ui-network-side.svg" alt="">원본 도면<svg class="mx" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button>
    <span class="env" style="margin-left:14px"><img src="assets/tint/cisco-side.svg" alt="">Packet Tracer 설계</span>
  </div>
  <p class="dek">온프레미스로 짠다면: 방화벽 한 대가 밖·DMZ·안을 잇고, 구역 사이 규칙은 Packet Tracer로 시험</p>

  <svg class="net" id="net" viewBox="0 0 1120 620" role="img" aria-label="계층형 망 설계: 맨 위 공인 구간에 외부 사용자와 인터넷, 외부 서비스가 있고, 경계 라우터가 공인 주소 하나를 DMZ 로드밸런서로 넘긴다. 방화벽 한 대가 밖(보안 수준 0), DMZ(50), 안(100) 세 구역을 잇는다. DMZ에는 웹 방화벽, 로드밸런서, 웹 서버 두 대가 DMZ 스위치에 붙어 있고, 내부에는 코어 스위치 두 대 아래 거래·조회·DB·백업·AI 서버가 역할마다 다른 VLAN에 있으며, 관리망은 따로 떨어져 있다">
    <!-- 구역 -->
    <g class="bld b1">
      <rect class="zone" x="0" y="0" width="1120" height="116" rx="14"/>
      <text class="zh" x="18" y="34">공인 구간<tspan class="n" dx="12">누구나 들어오는 곳</tspan></text>
      <rect class="zone sub" x="660" y="8" width="452" height="100" rx="12"/>
      <text class="zh" x="682" y="62" style="fill:var(--ink-2)">외부 서비스</text>
    </g>
    <g class="bld b3">
      <rect class="zone dmz" x="456" y="196" width="664" height="182" rx="14"/>
      <text class="zh" x="476" y="226">DMZ<tspan class="m" dx="12">VLAN 10</tspan><tspan class="n" dx="14">밖에 여는 곳은 여기뿐</tspan></text>
    </g>
    <g class="bld b4">
      <rect class="zone" x="0" y="394" width="1120" height="226" rx="14"/>
      <text class="zh" x="18" y="422">내부<tspan class="n" dx="12">역할마다 VLAN</tspan></text>
      <text class="sm" x="282" y="422">거래 서버와 DB는 두 코어에 나눔</text>
    </g>
    <g class="bld b5">
      <rect class="zone sub" x="905" y="408" width="205" height="192" rx="12"/>
      <text class="zh" x="921" y="436">관리망<tspan class="m" dx="10">VLAN 99</tspan></text>
    </g>

    <!-- 선 -->
    <g class="bld b1">
      <path class="wire" d="M88 64 H226 M274 80 H885 M885 33 V80 M885 33 H900 M885 80 H900"/>
    </g>
    <g class="bld b2">
      <path class="wire" d="M250 88 V128 M250 172 V228"/>
      <text class="nat" id="nat" x="356" y="158"><tspan class="b">NAT</tspan><tspan dx="10">공인 203.0.113.1 → 로드밸런서</tspan></text>
      <text class="lg" x="268" y="206">밖<tspan class="v" dx="6">0</tspan></text>
      <text class="lg k" x="10" y="256">보안 수준</text>
      <text class="lg" x="10" y="284">클수록 안쪽</text>
    </g>
    <g class="bld b3">
      <path class="wire" d="M360 266 H470 M544 288 V318 M709 288 V318 M875 288 V318 M1035 288 V318 M544 318 H1035"/>
      <text class="lg" x="368" y="254">DMZ<tspan class="v" dx="6">50</tspan></text>
      <text class="sm" x="556" y="356">DMZ 스위치</text>
    </g>
    <g class="bld b4">
      <path class="wire" d="M250 304 V434 M340 448 H470 M340 464 H470 M250 478 V496 M78 496 H328 M78 496 V516 M203 496 V516 M328 496 V516 M560 478 V496 M453 496 H828 M453 496 V516 M578 496 V516 M703 496 V516 M828 496 V516"/>
      <text class="lg" x="268" y="374">안<tspan class="v" dx="6">100</tspan></text>
    </g>
    <g class="bld b5">
      <path class="wire" d="M650 456 H915 V557 M915 461 H930 M915 509 H930 M915 557 H930"/>
    </g>

    <g id="trails"></g>
    <g id="nodes"></g>
    <g id="marks"></g>
    <g id="dots"></g>
  </svg>

  <aside class="pane" aria-label="Packet Tracer에서 확인한 길">
    <div class="ph"><b>확인한 길</b><span class="lgd"><span><i class="mk t"></i>직접 시험</span><span><i class="mk r"></i>설정만 확인</span></span></div>
    <section class="grp" data-s="1"><h3>들어오는 길</h3>
      <button class="row" type="button" data-f="in"><i class="mk t"></i><span class="fl">외부 사용자 → 로드밸런서</span><b class="v ok">허용</b></button>
      <button class="row" type="button" data-f="wa"><i class="mk r"></i><span class="fl">웹 서버 → 거래 서버 8080</span><b class="v rule">허용</b></button>
      <button class="row" type="button" data-f="adb"><i class="mk r"></i><span class="fl">거래 서버 → 주 DB 5432</span><b class="v rule">허용</b></button>
      <button class="row" type="button" data-f="wdb"><i class="mk t"></i><span class="fl">웹 서버 → 주 DB</span><b class="v no">차단</b></button>
    </section>
    <section class="grp" data-s="2"><h3>나가는 길</h3>
      <button class="row" type="button" data-f="ops"><i class="mk t"></i><span class="fl">관제 서버 → Teams</span><b class="v ok">허용</b></button>
      <button class="row" type="button" data-f="trt"><i class="mk t"></i><span class="fl">거래 서버 → Teams</span><b class="v no">차단</b></button>
      <button class="row" type="button" data-f="bk"><i class="mk t"></i><span class="fl">백업 서버 → 외부 보관</span><b class="v ok">허용</b></button>
      <button class="row" type="button" data-f="wst"><i class="mk t"></i><span class="fl">웹 서버 → 외부 보관</span><b class="v no">차단</b></button>
    </section>
    <section class="grp" data-s="3"><h3>관리와 옆 이동</h3>
      <button class="row" type="button" data-f="jump"><i class="mk t"></i><span class="fl">점프 서버 → 웹 서버</span><b class="v ok">허용</b></button>
      <button class="row" type="button" data-f="ww"><i class="mk t"></i><span class="fl">웹 서버 1 → 웹 서버 2</span><b class="v no">차단</b></button>
    </section>
  </aside>

  <div class="foot"><span class="k">원칙</span><span>밖에서는 DMZ까지만, 안으로는 8080만, 밖으로는 관제와 백업만, 관리는 점프 서버로만</span><span class="nx">다음: VM 여섯 대에서 실제로 거르기</span></div>

  <dialog class="fig" id="fig" aria-label="Packet Tracer 계층형 도면 원본">
    <div class="bar"><b>Packet Tracer 계층형 도면 원본</b><span>그림을 누르면 확대</span><button class="x" id="close-fig" type="button">닫기 (Esc)</button></div>
    <div class="view"><img id="fig-img" src="assets/img/net-layered-clean.png" alt="Packet Tracer 계층형 도면: 공인 구간, 경계 라우터, 외부 서비스, ASA 방화벽, 웹 방화벽과 DMZ(VLAN 10), 코어 스위치 두 대, VLAN 21·22·30·41·42·60·70의 서버와 관리망 VLAN 99"></div>
  </dialog>
</div>


<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // 원본 도면 창(E 키 도구)
  const fig = document.getElementById('fig');
  const closeFig = () => { fig.classList.remove('zoom'); if (fig.open) fig.close(); };
  document.getElementById('open-fig').addEventListener('click', e => { e.stopPropagation(); try { fig.showModal(); } catch (err) { fig.setAttribute('open', ''); } });
  document.getElementById('close-fig').addEventListener('click', e => { e.stopPropagation(); closeFig(); });
  document.getElementById('fig-img').addEventListener('click', e => { e.stopPropagation(); fig.classList.toggle('zoom'); });

  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };

  // ---- 장비(도면 좌표). v 가 있으면 세로 타일(아이콘 · 이름) ----
  const NODES = {
    rt:    { x: 160, y: 128, w: 180, h: 44, icon: 'ui-router-glow', name: '경계 라우터' },
    fw:    { x: 140, y: 228, w: 220, h: 76, icon: 'ui-shield-lock-glow', name: '방화벽', sub: '세 구역을 잇는 문', gate: true },
    waf:   { x: 470, y: 244, w: 148, h: 44, icon: 'ui-shield-check-glow', name: '웹 방화벽' },
    lb:    { x: 628, y: 244, w: 162, h: 44, icon: 'ui-arrows-split-glow', name: '로드밸런서' },
    w1:    { x: 800, y: 244, w: 150, h: 44, icon: 'nginx-glow', name: '웹 서버 1' },
    w2:    { x: 960, y: 244, w: 150, h: 44, icon: 'nginx-glow', name: '웹 서버 2' },
    ca:    { x: 160, y: 434, w: 180, h: 44, icon: 'ui-switch-horizontal-glow', name: '코어 A' },
    cb:    { x: 470, y: 434, w: 180, h: 44, icon: 'ui-switch-horizontal-glow', name: '코어 B' },
    t21:   { x: 20,  y: 516, w: 116, h: 84, icon: 'ui-server-glow', name: '거래 서버', v: 1 },
    t30:   { x: 145, y: 516, w: 116, h: 84, icon: 'ui-server-2-glow', name: '조회 서버', v: 1 },
    t41:   { x: 270, y: 516, w: 116, h: 84, icon: 'ui-database-glow', name: '주 DB', v: 1 },
    t22:   { x: 395, y: 516, w: 116, h: 84, icon: 'ui-server-glow', name: '거래 서버', v: 1 },
    t42:   { x: 520, y: 516, w: 116, h: 84, icon: 'ui-database-glow', name: '예비 DB', v: 1 },
    t70:   { x: 645, y: 516, w: 116, h: 84, icon: 'ui-stack-2-glow', name: '백업 서버', v: 1 },
    t60:   { x: 770, y: 516, w: 116, h: 84, icon: 'ollama-glow', name: 'AI 서버', v: 1 },
    pc:    { x: 930, y: 442, w: 172, h: 38, icon: 'ui-device-desktop-glow', name: '관리자 PC' },
    jump:  { x: 930, y: 490, w: 172, h: 38, icon: 'ui-terminal-2-glow', name: '점프 서버' },
    ops:   { x: 930, y: 538, w: 172, h: 38, icon: 'ui-activity-glow', name: '관제 서버' },
    store: { x: 900, y: 14, w: 204, h: 38, icon: 'ui-box-glow', name: '외부 보관' },
    teams: { x: 900, y: 61, w: 204, h: 38, icon: 'ui-message-glow', name: 'Teams' },
  };
  const BUILD = { rt: 'b2', fw: 'b2', waf: 'b3', lb: 'b3', w1: 'b3', w2: 'b3', ca: 'b4', cb: 'b4', pc: 'b5', jump: 'b5', ops: 'b5', store: 'b1', teams: 'b1' };
  const nodesG = $('nodes');
  for (const id in NODES) {
    const n = NODES[id];
    const g = el('g', { class: `nd bld ${BUILD[id] || 'b4'}${n.gate ? ' gate' : ''}`, id: 'n-' + id }, nodesG);
    el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: n.gate ? 12 : 10 }, g);
    if (n.v) {   // 세로 타일
      el('image', { href: `assets/tint/${n.icon}.svg`, x: n.x + n.w / 2 - 15, y: n.y + 12, width: 30, height: 30 }, g);
      el('text', { class: 'nm', x: n.x + n.w / 2, y: n.y + 68, 'text-anchor': 'middle' }, g).textContent = n.name;
    } else if (n.gate) {   // 방화벽: 이름과 한 줄 설명
      el('image', { href: `assets/tint/${n.icon}.svg`, x: n.x + 14, y: n.y + 11, width: 30, height: 30 }, g);
      el('text', { class: 'nm', x: n.x + 54, y: n.y + 35 }, g).textContent = n.name;
      el('text', { class: 'sub', x: n.x + 14, y: n.y + 66 }, g).textContent = n.sub;
    } else {
      const s = n.h >= 44 ? 28 : 26;
      el('image', { href: `assets/tint/${n.icon}.svg`, x: n.x + 12, y: n.y + (n.h - s) / 2, width: s, height: s }, g);
      el('text', { class: 'nm', x: n.x + 12 + s + 10, y: n.y + n.h / 2 + 8 }, g).textContent = n.name;
    }
  }
  // 이름만 있는 끝점(외부 사용자, 인터넷). 외부 사용자는 출발할 때 둥근 빛으로 깜빡인다
  const pub = el('g', { class: 'bld b1' }, nodesG);
  el('circle', { cx: 68, cy: 62, r: 25 }, el('g', { class: 'nd halo', id: 'n-user' }, pub));
  el('image', { href: 'assets/tint/ui-users-side.svg', x: 50, y: 44, width: 36, height: 36 }, pub);
  el('text', { class: 'sm', x: 68, y: 106, 'text-anchor': 'middle' }, pub).textContent = '외부 사용자';
  el('image', { href: 'assets/tint/ui-cloud-side.svg', x: 226, y: 40, width: 48, height: 48 }, pub);
  el('text', { class: 'sm', x: 282, y: 70 }, pub).textContent = '인터넷';

  // ---- 흐름: 점 [x, y, 장비]. 장비가 붙은 점에서 다음 점까지는 장비 안이라 점을 감추고 장비가 파랗게 한 번 빛난다.
  //      rule 은 설정만 확인한 길(점 없이 초록 점선), at 은 실제로 막은 장비(.pkt 안의 설정으로 확인), aim 은 막힌 흐름이 가려던 곳,
  //      lane 은 같은 선을 쓰는 다른 흐름과 겹치지 않게 비켜 그릴 거리(진행 방향 오른쪽이 +), laneTo 는 비켜 그릴 점 수 ----
  const FLOWS = {
    in:   { ok: true, from: 'user', to: 'lb', pts: [[88,64],[226,64,'cloud'],[250,88],[250,128,'rt'],[250,172],[250,228,'fw'],[360,266],[470,266,'waf'],[544,288],[544,318],[709,318],[709,288]] },
    wa:   { ok: true, rule: true, from: 'w1', to: 't21', lane: -10, laneTo: 6, pts: [[875,288],[875,318],[544,318],[544,288,'waf'],[470,266],[360,266,'fw'],[250,304],[250,434,'ca'],[250,478],[250,496],[78,496],[78,516]] },
    adb:  { ok: true, rule: true, from: 't21', to: 't41', pts: [[78,516],[78,496],[250,496],[250,478,'ca'],[250,462],[250,478],[250,496],[328,496],[328,516]], part: { after: 'wa', pts: [[250,496],[328,496],[328,516]] } },
    wdb:  { ok: false, from: 'w2', aim: 't41', at: 'waf', pts: [[1035,288],[1035,308],[576,308],[576,297]] },
    ops:  { ok: true, from: 'ops', to: 'teams', pts: [[930,557],[915,557],[915,456],[650,456,'cb'],[470,448],[340,448,'ca'],[250,434],[250,304,'fw'],[250,228],[250,172,'rt'],[250,128],[250,88,'cloud'],[274,80],[885,80],[900,80]] },
    trt:  { ok: false, from: 't21', aim: 'teams', at: 'ca', pts: [[78,516],[78,496],[250,496],[250,488]] },
    bk:   { ok: true, from: 't70', to: 'store', pts: [[703,516],[703,496],[560,496],[560,478,'cb'],[470,464],[340,464,'ca'],[250,434],[250,304,'fw'],[250,228],[250,172,'rt'],[250,128],[250,88,'cloud'],[274,80],[885,80],[885,33],[900,33]] },
    wst:  { ok: false, from: 'w2', aim: 'store', at: 'waf', pts: [[1035,288],[1035,308],[576,308],[576,297]] },
    jump: { ok: true, from: 'jump', to: 'w1', pts: [[930,509],[915,509],[915,456],[650,456,'cb'],[470,448],[340,448,'ca'],[250,434],[250,304,'fw'],[360,266],[470,266,'waf'],[544,288],[544,318],[875,318],[875,288]] },
    ww:   { ok: false, from: 'w1', aim: 'w2', tag: '보호 포트', lane: -10, pts: [[875,288],[875,318],[955,318]] },
  };
  // 옆 차선: 구간마다 진행 방향 오른쪽 법선으로 비키고, 꺾이는 곳은 두 법선을 더한다(장비 안 구간은 계산에서 뺀다)
  const lanePts = (pts, d, upto = pts.length) => {
    const N = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      N.push(a[2] || !L ? null : [-dy / L, dx / L]);
    }
    return pts.map((p, i) => {
      if (i >= upto) return p;   // 방화벽 안에서 제 선으로 돌아온다
      const n1 = i > 0 ? N[i - 1] : null, n2 = i < N.length ? N[i] : null;
      let o = [0, 0];
      if (n1 && n2) o = n1[0] === n2[0] && n1[1] === n2[1] ? n1 : [n1[0] + n2[0], n1[1] + n2[1]];
      else if (n1 || n2) o = n1 || n2;
      return [p[0] + o[0] * d, p[1] + o[1] * d, p[2]];
    });
  };
  // 경로 길이를 미리 잰다. 장비 안 구간은 짧아도 잠시 머물도록 최소 길이를 준다
  for (const k in FLOWS) {
    const f = FLOWS[k];
    if (f.lane) f.pts = lanePts(f.pts, f.lane, f.laneTo);
    f.segs = []; let s = 0;
    for (let i = 1; i < f.pts.length; i++) {
      const a = f.pts[i - 1], b = f.pts[i], real = Math.hypot(b[0] - a[0], b[1] - a[1]), dev = a[2] || null;
      const L = dev ? Math.max(real, 70) : real;
      f.segs.push({ a, b, L, dev, s }); s += L;
    }
    f.total = s;
  }
  const posAt = (f, d) => {
    for (let i = 0; i < f.segs.length; i++) {
      const g = f.segs[i];
      if (d <= g.s + g.L) { const k = g.L ? (d - g.s) / g.L : 1; return { x: g.a[0] + (g.b[0] - g.a[0]) * k, y: g.a[1] + (g.b[1] - g.a[1]) * k, dev: g.dev, i }; }
    }
    const last = f.pts[f.pts.length - 1];
    return { x: last[0], y: last[1], dev: null, i: f.segs.length };
  };
  // 지나가는 장비는 파랗게 잠깐, 도착한 장비는 초록, 막은 장비는 빨강으로 빛난 뒤 테두리만 남긴다
  const pulse = (id, tone, keep) => {
    const g = $('n-' + id); if (!g) return;
    g.classList.remove('hit-pass', 'hit-ok', 'hit-no'); g.getBoundingClientRect(); g.classList.add('hit-' + tone);
    if (keep) g.classList.add('lit-' + tone);
    clearTimeout(g._t); g._t = setTimeout(() => g.classList.remove('hit-' + tone), tone === 'pass' ? 450 : 900);
  };
  const xmark = (x, y, tag) => {
    const g = el('g', { class: 'xmark' }, $('marks'));
    g.style.transformBox = 'view-box'; g.style.transformOrigin = `${x}px ${y}px`;
    el('circle', { cx: x, cy: y, r: 14 }, g);
    el('path', { d: `M${x - 5.5} ${y - 5.5} L${x + 5.5} ${y + 5.5} M${x + 5.5} ${y - 5.5} L${x - 5.5} ${y + 5.5}` }, g);
    if (tag) el('text', { x, y: y + 40, 'text-anchor': 'middle' }, g).textContent = tag;
  };

  // ---- 재생: 한 번에 한 흐름. 줄·출발 장비·목적지를 먼저 밝히고 0.3초 뒤 출발, 막히면 그 자리에서 0.3초 멈춘 뒤 X ----
  const SPEED = .65, PRE = 300, HOLD = 300, RULE = 1400;
  let live = null, timers = [];
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const rowOf = k => document.querySelector(`.row[data-f="${k}"]`);
  // 단계를 넘기면 앞 단계의 선과 표시는 0.3초에 함께 흐려지며 사라진다
  function clearAll(fade) {
    timers.forEach(clearTimeout); timers = []; live = null;
    if (fade) {
      const t = el('g', { class: 'fadeout' }); $('net').insertBefore(t, $('nodes'));
      const move = (from, to) => { while (from.firstChild) { from.firstChild.style.animation = 'none'; to.appendChild(from.firstChild); } };
      move($('trails'), t);
      const m = el('g', { class: 'fadeout' }, $('net'));
      move($('marks'), m); move($('dots'), m);
      setTimeout(() => { t.remove(); m.remove(); }, 350);
    } else {
      $('trails').replaceChildren(); $('marks').replaceChildren(); $('dots').replaceChildren();
    }
    $('nat').classList.remove('hit');
    document.querySelectorAll('.nd').forEach(g => { clearTimeout(g._t); g.classList.remove('hit-pass', 'hit-ok', 'hit-no', 'lit-ok', 'lit-no', 'aim'); });
    document.querySelectorAll('.row').forEach(r => r.classList.remove('cur'));
  }
  function play(key, then) {
    const f = FLOWS[key], row = rowOf(key), tgt = f.to || f.aim;
    if (row) row.classList.add('show', 'cur');
    if (f.from) pulse(f.from, 'pass');
    const r = { key, f, then, t0: performance.now() + PRE };
    const tg = tgt && $('n-' + tgt);
    if (tg) {
      clearTimeout(tg._t); r.wasLit = tg.classList.contains('lit-ok');
      tg.classList.remove('hit-pass', 'hit-ok', 'hit-no', 'lit-ok'); tg.classList.add('aim');
    }
    if (f.rule) {   // 설정만 확인한 길: 점 없이 길 전체를 한 번에(앞 점선이 이미 그은 구간은 빼고)
      const pts = f.part && document.querySelector(`#trails [data-k="${f.part.after}"]`) ? f.part.pts : f.pts;
      later(PRE, () => { r.trail = el('polyline', { class: 'trail rule', 'data-k': key, points: pts.map(q => q[0] + ',' + q[1]).join(' ') }, $('trails')); });
      later(PRE + RULE, () => finish(r));
      return;
    }
    r.trail = el('polyline', { class: 'trail mv', points: '' }, $('trails'));
    r.dot = el('circle', { class: 'dot', r: 9, cx: f.pts[0][0], cy: f.pts[0][1] }, $('dots'));   // 출발점에서 잠깐 머문 뒤 달린다
    r.seen = new Set();
    live = r;
  }
  function finish(r) {
    const f = r.f, row = rowOf(r.key), last = f.pts[f.pts.length - 1], tgt = f.to || f.aim, tg = tgt && $('n-' + tgt);
    if (tg) tg.classList.remove('aim');
    if (tg && !f.ok && r.wasLit) later(800, () => tg.classList.add('lit-ok'));
    if (r.dot) r.dot.remove();
    if (f.ok) {
      if (!f.rule) r.trail.setAttribute('class', 'trail ok');
      pulse(f.to, 'ok', true);
    } else {
      xmark(last[0], last[1], f.tag);
      if (f.at) pulse(f.at, 'no', true);
      r.trail.setAttribute('class', 'trail gone');
      $('trails').insertBefore(r.trail, $('trails').firstChild);   // 막힌 길은 다른 길 아래로
    }
    if (row) { row.classList.remove('cur'); row.classList.add('on'); }
    if (r.then) r.then();
  }
  function tick(now) {
    const r = live;
    if (!r) return;
    const t = now - r.t0;
    if (t < 0) return;
    const d = Math.min(r.f.total, t * SPEED);
    const p = posAt(r.f, d);
    const pts = r.f.pts.slice(0, p.i + 1).map(q => q[0] + ',' + q[1]); pts.push(p.x + ',' + p.y);
    r.trail.setAttribute('points', pts.join(' '));
    r.dot.setAttribute('cx', p.x); r.dot.setAttribute('cy', p.y); r.dot.setAttribute('opacity', p.dev ? 0 : 1);
    if (p.dev && !r.seen.has(p.i)) {
      r.seen.add(p.i);
      if (NODES[p.dev]) pulse(p.dev, 'pass');
      if (p.dev === 'rt' && r.key === 'in') { $('nat').classList.add('hit'); later(1000, () => $('nat').classList.remove('hit')); }
    }
    if (d >= r.f.total) {
      live = null;
      if (r.f.ok) finish(r); else later(HOLD, () => finish(r));
    }
  }
  const loop = now => { tick(now); requestAnimationFrame(loop); };

  // ---- 단계: 0 도면만, 1 들어오는 길, 2 나가는 길, 3 관리와 옆 이동. 앞 단계의 결과 줄은 남긴다.
  //      pre 는 → 뒤 첫 흐름까지, 흐름 옆 숫자는 판정 뒤 다음 흐름까지 쉬는 시간(대사 박자) ----
  const STEPS = {
    1: { pre: 0, seq: [['in', 3500], ['wa', 1200], ['adb', 2500], ['wdb', 0]] },
    2: { pre: 2000, seq: [['ops', 400], ['trt', 600], ['bk', 400], ['wst', 0]] },
    3: { pre: 0, seq: [['jump', 2500], ['ww', 0]] },
  };
  const LAST = 3;
  let step = 0;
  function run(n) {
    const S = STEPS[n];
    const go = i => {
      if (i >= S.seq.length) { if (n === LAST) stage.classList.add('done'); return; }
      const [k, gap] = S.seq[i];
      play(k, () => later(gap, () => go(i + 1)));
    };
    later(S.pre, () => go(0));
  }
  function setStep(n, instant) {
    step = n; stage.dataset.step = n;
    clearAll(!instant);
    stage.classList.toggle('done', !!instant && n === LAST);
    document.querySelectorAll('.grp').forEach(g => g.classList.toggle('on', +g.dataset.s <= n));
    document.querySelectorAll('.row').forEach(row => {
      const s = +row.closest('.grp').dataset.s;
      const shown = s < n || (!!instant && s <= n);
      row.classList.toggle('show', shown); row.classList.toggle('on', shown);
    });
    if (n > 0 && !instant) run(n);
  }
  // 결과 줄을 누르면 그 흐름만 다시 보인다(질문 대응)
  document.querySelectorAll('.row').forEach(row => row.addEventListener('click', e => {
    e.stopPropagation(); clearAll(false); play(row.dataset.f);
  }));

  if (reduce) {
    document.querySelectorAll('.grp').forEach(x => x.classList.add('on'));
    document.querySelectorAll('.row').forEach(x => x.classList.add('show', 'on'));
    stage.dataset.step = LAST; stage.classList.add('done');
    window.deckStep = () => false;
    return;
  }
  requestAnimationFrame(loop);
  setStep(location.hash === '#last' ? LAST : 0, location.hash === '#last');
  window.deckStep = d => {
    if (fig.open) { closeFig(); return true; }
    if (d > 0 && step < LAST) { setStep(step + 1); return true; }
    if (d < 0 && step > 0) { setStep(step - 1); return true; }
    return false;
  };
  if (window.parent === window) addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });
})();
</script>
