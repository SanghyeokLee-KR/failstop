<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-3 서버 내부 이중화와 용량 확장</title>
<script>
// ======== 사용자가 채우는 곳(이 장의 설정은 여기 한곳에만 있다) ========
// 사용자가 학교 VM에서 아래 절차를 수행했다고 확인했다(2026-10-10). 원본 로그·캡처는 학교에 있다.
// 화면은 실습 절차를 재현한다. 측정값은 원본 기록을 대조한 뒤 채우고, 빈칸은 표시하지 않는다.
// 아래 예시는 입력 형식이며 실제 측정값이 아니다.
const RESULT = {
  raid: {
    alert: '',     // 디스크를 뺀 때부터 OPS01 경보가 발생(firing)할 때까지. 예: '1분 10초' → 감지 줄 '경보까지 1분 10초'
    resync: '',    // 새 디스크를 넣은 때부터 [UU]가 될 때까지. 예: '2분 10초' → md0 칸 [UU] 앞에 '재동기화 2분 10초'
    writeGap: '',  // 1초마다 쓰는 검사에서 실패한 구간. 원본 로그로 확인한 값만 기입한다. 전체 서비스의 중단 시간과 구분한다.
  },
  lvm: {
    alert: '',     // 사용량이 85%를 넘은 때부터 LinuxDiskSpaceLow 가 발생할 때까지(규칙에 for: 5m 이 있다)
    from: '',      // 늘리기 전 /var/lib/pgsql 크기. 예: '20 GiB'
    to: '',        // 늘린 뒤 크기. 예: '40 GiB'. 둘 다 있어야 '확장 완료' 옆에 '20 GiB → 40 GiB'
    writeGap: '',  // 늘리는 동안 APP01에서 INSERT 반복(또는 pgbench)을 돌린 오류 시간. df -h 전후와 함께 srv-df 증거로 남긴다
  },
  bond: {
    alert: '',     // 링크를 끊은 때부터 경보가 발생할 때까지
    pingLoss: '',  // APP01 → DB01 ping -i 0.2 로 링크를 끊는 동안 잃은 수. 예: '0.2초 간격 1개 손실' → '절체' 아래에 'ping 0.2초 간격 1개 손실'
    writeGap: '',
  },
};
// NIC·네트워크·마운트는 기존 DB01 구축 자료의 값을 사용한다.
// RAID·LVM·추가 디스크 이름은 원본 기록과 대조하기 전까지 기존 도면 표기를 유지한다.
const DEV = {
  net: 'lab-data', nic: ['enp0s8', 'enp0s9'], bond: 'bond0',
  md: 'md0', disk: ['sdc', 'sdd'], fresh: 'sdd',   // fresh: ①에서 고장 낸 두 번째 디스크 자리에 새로 끼운 디스크
  vg: 'vg_pgdata', lv: 'lv_pgdata', mount: '/var/lib/pgsql',
  md2: 'md1', disk2: ['sde', 'sdf'],               // ②에서 볼륨 그룹에 더한 RAID1(md0과 같은 크기로 그린다)
};
// OPS01 경보 흐름을 재현하는 문구다. 실제 발생·해제 시각과 규칙 적용 상태는 학교 기록을 대조한다.
// sev는 critical 빨강, warning 노랑으로 표시한다. 여기서 Teams 전송 여부를 단정하지 않는다.
const ALERT = {
  raid: { code: 'LinuxRaidDegraded', sev: 'critical', fire: `RAID 디스크 장애 발생 · ${DEV.md} degraded`, ok: 'RAID 디스크 장애 경보 해제' },
  disk: { code: 'LinuxDiskSpaceLow', sev: 'warning', fire: '디스크 여유 공간 부족 · 15% 미만', ok: '디스크 여유 공간 부족 경보 해제' },
  bond: { code: 'LinuxBondDegraded', sev: 'warning', fire: `네트워크 링크 장애 발생 · ${DEV.bond} 링크 하나 끊김`, ok: '네트워크 링크 장애 경보 해제' },
};
// 증거 화면(E 키 도구). 이 경로에 캡처를 넣으면 단추가 나타나고, 없는 파일은 건너뛴다. .txt는 글로 보인다
const EVIDENCE = [
  { src: 'assets/vm/srv-alerts.png', cap: 'OPS01 경보: 발생 → 해제(Prometheus 경보 화면이나 Alertmanager 기록)' },
  { src: 'assets/vm/srv-mdstat.png', cap: '/proc/mdstat: md0 [U_] → recovery → [UU]' },
  { src: 'assets/vm/srv-lsblk.png', cap: 'lsblk: 디스크 → md0·md1 → vg_pgdata → /var/lib/pgsql' },
  { src: 'assets/vm/srv-df.png', cap: 'lvextend -r 와 df -h: 늘리기 전후 /var/lib/pgsql 크기' },
  { src: 'assets/vm/srv-bond.png', cap: '/proc/net/bonding/bond0: 끊기 전후의 활성 NIC와 Link Failure Count' },
  { src: 'assets/vm/srv-writecheck.txt', cap: 'DB 쓰기 검사 기록: 1초마다 INSERT 한 결과' },
];
</script>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --edge: #8E9BB3;
    --box: #1F2839;
    --box-line: #6B7A94;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --brand: #79A7FA;
    --ok: #2DD196;
    --bad: #FF6B6B;
    --warm: #E8C07A;
    --ease: cubic-bezier(.45,0,.25,1);
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; white-space: nowrap; animation: rise .6s 0s var(--ease) both; }
  .dek { position: absolute; left: 130px; right: 130px; top: 232px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .6s .2s var(--ease) both; }
  .title .env { margin-left: 14px; animation: fade .6s .3s var(--ease) both; }
  .tag { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; white-space: nowrap; }
  .tag img { width: 26px; height: 26px; }
  button.tag { font-family: var(--sans); background: transparent; cursor: pointer; }
  .tag .mx { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-left: 2px; }
  /* 증거 캡처가 하나도 없으면 단추를 빼고, 환경 칩이 오른쪽 끝을 지킨다 */
  .title .tag[hidden] { display: none; }
  .title .tag[hidden] + .env { margin-left: auto; }

  /* 도면: 위는 주 DB 서버 DB01 한 대의 단면, 아래는 운영 콘솔.
     단면은 위 가운데 줄에 네트워크(가상 스위치 → NIC 두 장 → bond0), 왼쪽에 PostgreSQL, 그 아래 저장 계층(XFS → LVM → RAID1 → 디스크).
     두 겹으로 둔 곳(NIC 둘, 디스크 둘)이 위아래에서 마주 본다. 세로 줄 맞춤: PostgreSQL·md0 가운데 x420, 네트워크 열·md1 왼쪽 x860.
     콘솔은 단계마다 경보 흐름, 작업 명령(③은 커널 동작), 확인할 출력 형식을 재현한다. 오른쪽에는 확인 방법을 둔다.
     좌표는 viewBox 1660×688(머리말 줄과 같은 좌우 끝 130 ~ 1790, 위 312 ~ 아래 1000) */
  .srv { position: absolute; left: 130px; top: 312px; width: 1660px; height: 688px; overflow: visible; }
  .srv text { font-family: var(--sans); }
  /* 덱의 Plex Mono는 400·500만 있어, 굵게는 500으로 둔다(600을 주면 브라우저가 가짜 굵기를 만든다) */
  .srv .m { font-family: var(--mono); font-weight: 500; }
  .srv .sub.m, .srv .faint.m { font-weight: 400; }
  /* 서버 틀 테두리는 바탕과 약 2.6:1 이라 프로젝터에서도 남는다 */
  .srv .chassis { fill: #161D2A; stroke: #435B88; stroke-width: 2; }
  .srv .link { fill: none; stroke: var(--edge); stroke-width: 3; transition: stroke .3s var(--ease), opacity .3s var(--ease); }
  .srv .tile .bx { fill: var(--box); stroke: var(--box-line); stroke-width: 2; transition: stroke .3s var(--ease); }
  .srv .nm { font-size: 24px; font-weight: 600; fill: var(--ink); }
  .srv .sub { font-size: 22px; font-weight: 400; fill: var(--ink-2); }
  .srv .faint { font-size: 22px; font-weight: 400; fill: var(--ink-3); }
  .srv .ico { fill: none; stroke: #A8C8FF; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* 이름표는 앞 장들처럼 DATA 구역 색(파랑)을 옅게 입힌다 */
  .srv .plate rect { fill: color-mix(in srgb, #79A7FA 12%, #1E2638); stroke: color-mix(in srgb, #79A7FA 85%, transparent); stroke-width: 2; }

  /* 저장 계층 막대. 막대 길이가 용량이다(②에서 늘어난다). XFS 막대 안의 칠은 사용량이고 경보 기준(85%)을 넘으면 노랑 */
  .srv .bar { fill: #1A2232; stroke: var(--box-line); stroke-width: 2; }
  .srv { --u: var(--ok); }
  .srv.hot { --u: var(--warm); }
  .srv .use { fill: color-mix(in srgb, var(--u) 18%, transparent); transition: fill .3s var(--ease); }
  .srv .use-l { fill: var(--u); transition: fill .3s var(--ease); }
  .srv .tick { stroke: var(--ink-3); stroke-width: 2; stroke-dasharray: 5 5; transition: stroke .3s var(--ease); }
  .srv .tickl { font-size: 22px; fill: var(--ink-3); text-anchor: end; transition: fill .3s var(--ease); }
  .srv.hot .tick { stroke: var(--warm); }
  .srv.hot .tickl { fill: var(--warm); font-weight: 600; }
  .srv .bay rect { fill: none; stroke: var(--card); stroke-width: 2; stroke-dasharray: 9 7; }

  /* 상태 알약. 초록 정상, 노랑 경보·degraded, 파랑 새로 끼운 것·자동 */
  .srv .pill rect { stroke-width: 2; }
  .srv .pill text { font-size: 22px; font-weight: 600; text-anchor: middle; }
  .srv .pill text.m { font-weight: 500; }
  .srv .pill.ok rect { fill: rgba(45,209,150,.12); stroke: var(--ok); } .srv .pill.ok text, .srv .pill.ok circle { fill: var(--ok); }
  .srv .pill.warn rect { fill: rgba(232,192,122,.12); stroke: var(--warm); } .srv .pill.warn text, .srv .pill.warn circle { fill: var(--warm); }
  .srv .pill.new rect { fill: rgba(121,167,250,.12); stroke: var(--brand); } .srv .pill.new text { fill: var(--brand); }
  .srv .rv { font-size: 22px; fill: var(--ink-2); }
  .srv .rv .v { font-weight: 600; fill: var(--ink); }

  /* 고장 표시(✕)·흐르는 점·재동기화 길. 앞 장 구성도와 같은 모양 */
  .srv .xm circle { fill: var(--stage); stroke: var(--bad); stroke-width: 2.8; }
  .srv .xm path { fill: none; stroke: var(--bad); stroke-width: 4.2; stroke-linecap: round; }
  .srv .dot { fill: #D6E4FF; stroke: var(--brand); stroke-width: 2.4; }
  .srv .sync { fill: none; stroke: var(--brand); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; }

  /* 운영 콘솔. 출력은 실제 도구의 형식 그대로 고정폭 글꼴로 쓰고, 측정값은 테두리 칩으로 따로 붙인다(중단 칩만 0이면 초록, 0보다 크면 노랑) */
  .srv .con { fill: #0B1019; stroke: #2E3848; stroke-width: 2; }
  .srv .ch { font-size: 22px; font-weight: 500; fill: var(--ink-3); }
  /* 경보 한 줄: Teams 제목처럼 색 점과 한국어 제목. critical 빨강, warning 노랑(경보 색), 해제 초록 */
  .srv .al text { font-size: 22px; font-weight: 600; fill: var(--ink); }
  .srv .al.critical circle { fill: var(--bad); } .srv .al.warning circle { fill: var(--warm); }
  .srv .al.ok circle { fill: var(--ok); } .srv .al.ok text { fill: var(--ink-2); }
  /* 같은 자리의 두 글이 겹쳐 비치지 않게, 나가는 글이 .15초에 빠진 뒤 들어오는 글이 .15초에 들어온다(합쳐 .3초) */
  .srv .state .al { transition: opacity .15s var(--ease); }
  .srv .cdiv { stroke: #2E3848; stroke-width: 2; }
  .srv .tm { font-family: var(--mono); font-size: 22px; font-weight: 400; fill: var(--ink-2); }
  .srv .tm.hi { font-weight: 500; fill: var(--ink); }
  .srv .tm.pr { fill: var(--ink-3); }
  .srv .res rect { fill: rgba(255,255,255,.03); stroke: var(--ink-3); stroke-width: 2; }
  .srv .res.good rect { fill: rgba(45,209,150,.08); stroke: var(--ok); }
  .srv .res.warn rect { fill: rgba(232,192,122,.10); stroke: var(--warm); }
  .srv .res text { font-size: 22px; fill: var(--ink-2); }
  .srv .res .v { font-weight: 600; fill: var(--ink); }

  /* ---- 단계 상태. 스크립트가 .srv 에 이름을 붙였다 뗀다. 나타나는 것은 0.3초 ----
     도면 ① d2x 디스크 2 고장·md0 degraded → swap 새 디스크 → sync 재동기화 → uu [UU]
          ② hot 사용량 경보 → md1 RAID1 추가 → vg 볼륨 그룹 늘림 → lv 논리 볼륨·XFS 늘림
          ③ cut 위 링크 끊김 → bk 대기 링크가 이어받음
     콘솔 감지 줄은 늘 보인다. k1 경보 없음 → 발생, kr 발생 → 해제, k2 조치 줄, k3 확인 줄 */
  .srv .fx { transition: opacity .3s var(--ease), transform .4s var(--ease); }
  .srv .x2, .srv .p-deg, .srv .fresh, .srv .g-md1, .srv .x1, .srv .r1, .srv .r2, .srv .r3 { opacity: 0; }
  .srv.d2x:not(.swap) .x2 { opacity: 1; }
  .srv.d2x:not(.swap) .old2 .bx { stroke: var(--bad); }
  .srv.d2x:not(.swap) .old2 .in { opacity: .35; }
  /* 재동기화를 마쳐 [UU]가 될 때 두 번째 거울 선이 다시 이어진다 */
  .srv.d2x:not(.uu) .br2 { opacity: .25; }
  .srv.swap .old2 { opacity: 0; transform: translateY(16px); }
  /* 빠지고 들어오는 디스크가 서버 틀 아랫선 안에서 움직이게 16만 옮긴다 */
  .srv .fresh { transform: translateY(16px); }
  /* 옛 디스크가 다 빠진 뒤에 새 디스크가 올라와 두 상자가 겹쳐 보이지 않게 한다 */
  .srv.swap .fresh { opacity: 1; transform: none; transition-delay: .3s; }
  .srv.d2x:not(.uu) .p-uu0 { opacity: 0; }
  .srv.d2x:not(.uu) .p-deg { opacity: 1; }
  /* md0 칩은 폭이 달라 겹치면 글자가 포개져 보인다. 앞 칩이 0.2초에 사라진 뒤 다음 칩이 들어온다(고장 때도, [UU]로 돌아올 때도) */
  .srv.d2x:not(.uu) .p-uu0, .srv.uu .p-deg { transition-duration: .2s; }
  .srv.d2x:not(.uu) .p-deg, .srv.uu .p-uu0 { transition-delay: .2s; }
  .srv.d2x:not(.uu) .md0 .bx { stroke: var(--warm); }
  /* 재동기화 길(약 412px)은 덱 기준 빠르기(초당 약 450px)로 0.9초에 그린다 */
  .srv .sync { opacity: 0; stroke-dashoffset: 1; transition: stroke-dashoffset .9s cubic-bezier(.45,0,.55,1), opacity .3s var(--ease); }
  .srv.sync-on .sync { opacity: 1; stroke-dashoffset: 0; }
  .srv.uu .sync { opacity: 0; }
  .srv.uu .r1, .srv.ok2 .r2, .srv.ok3 .r3 { opacity: 1; }
  .srv .g-md1 { transform: translateY(16px); }
  /* 점선 빈 슬롯이 먼저 걷힌 뒤 md1 이 올라와, 올라오는 디스크 사이로 점선이 비치지 않게 한다 */
  .srv.md1 .g-md1 { opacity: 1; transform: none; transition-delay: .15s; }
  .srv .bay { transition-duration: .15s; }
  .srv.md1 .bay { opacity: 0; }
  .srv .lk2 { stroke-dasharray: 9 7; }
  .srv.cut .lk1 { stroke: var(--bad); stroke-dasharray: 9 7; }
  .srv.cut .x1 { opacity: 1; }
  .srv.bk .lk2 { stroke: var(--ok); stroke-dasharray: none; }
  .srv .row { opacity: 0; transform: translateX(-10px); transition: opacity .3s var(--ease), transform .3s var(--ease); }
  .srv.k2 .r-act, .srv.k3 .r-chk { opacity: 1; transform: none; }
  .srv .p-fire, .srv .p-ok, .srv .r-det .res { opacity: 0; }
  .srv .r-det .res { transition: opacity .15s var(--ease); }
  .srv.k1 .p-none { opacity: 0; }
  .srv:not(.k1) .p-none { transition-delay: .15s; }
  .srv.k1 .p-fire, .srv.k1 .r-det .res { opacity: 1; transition-delay: .15s; }
  .srv.kr .p-fire { opacity: 0; transition-delay: 0s; }
  .srv.kr .p-ok { opacity: 1; transition-delay: .15s; }
  .stage.inst *, .stage.inst *::before, .stage.inst *::after { transition: none !important; }

  .srv .bd { animation: rise .6s var(--ease) both; }
  .srv .b1 { animation-delay: .3s; } .srv .b2 { animation-delay: .55s; } .srv .b3 { animation-delay: .8s; } .srv .b4 { animation-delay: 1.05s; } .srv .b5 { animation-delay: 1.3s; } .srv .b6 { animation-delay: 1.5s; }
  .stage.done *, .stage.done *::before, .stage.done *::after { animation: none !important; }

  /* 증거 화면(질문 대비): 캡처를 한 장씩 크게. E 키 도구를 켤 때만 단추가 보인다 */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); outline: none; }
  .fig::backdrop { background: rgba(8,10,15,.95); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .35s var(--ease); }
  .fig .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 24px; font-size: 22px; color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .fig .bar .cap { color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fig .bar .cnt { margin-left: auto; font-family: var(--mono); white-space: nowrap; }
  .fig .bar button { flex: none; font-family: var(--sans); font-size: 22px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; }
  .fig .bar button:disabled { opacity: .35; cursor: default; }
  .fig .view { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 24px 24px; }
  .fig img { max-width: calc(100vw - 48px); max-height: calc(100vh - 92px); border-radius: 6px; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .fig pre { margin: 0; max-width: calc(100vw - 48px); max-height: calc(100vh - 92px); overflow: auto; box-sizing: border-box; padding: 20px 26px; border-radius: 6px; background: #0C0C0C; color: #CCCCCC; font-family: var(--mono); font-size: 22px; line-height: 1.45; white-space: pre-wrap; }

  .fs {
    position: absolute; right: 130px; top: 20px;

    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* 둘째 줄 이름: 내가 친 명령은 '명령', ③처럼 커널이 스스로 넘긴 단계는 '커널'. 같은 자리에 겹쳐 두고, 그 줄 내용이 나오는 때(k2)에
     경보 줄과 같은 규칙(.15초에 빠지고 .15초에 들어옴)으로 바꾼다 */
  .srv .lb-cmd, .srv .lb-krn { transition: opacity .15s var(--ease); }

<!-- 발표 노트(45초): (0~12초. 서버 전체를 짚고, 강의에서 배운 내용을 직접 적용했다는 점을 설명한다.)
이번에는 서버 한 대 안에서 장애에 대비한 구성입니다.
시스원 김남훈 대리님께 배운 RAID와 네트워크 이중화를, 주 DB 역할의 VM에 직접 적용했습니다.
→ 1 (12~23초. 디스크 교체 애니메이션을 보며 설명하고 [UU]에서 잠깐 멈춘다.)
가상 디스크 하나를 제거한 뒤 새 디스크를 넣고, 두 디스크가 다시 정상 상태로 돌아오는지 확인했습니다.
→ 2 (23~34초. RAID1 추가부터 XFS 막대가 늘어나는 순서대로 짚는다.)
용량은 RAID1 묶음을 추가해 LVM과 파일시스템까지 늘렸고, df 명령으로 늘어난 크기를 확인했습니다.
→ 3 (34~45초. 빨간 링크에서 초록색 대기 링크로 시선을 옮긴다.)
사용 중인 가상 NIC의 링크를 끊어, 대기 NIC로 전환되는 것도 확인했습니다.
(활성 NIC 출력에서 1초 멈추고 다음 장으로. 화면의 명령을 모두 읽지 않는다.)
질문 대비(말하지 않음): 이 페이지는 학교에서 수행한 VM 실습 절차를 재현한 것이다. 수행 사실은 발표자 확인에 따르며, 원본 로그·캡처는 학교에 있어 현재 발표덱에 연결하지 못했다. 재동기화 시간·증설 전후 크기·패킷 손실·쓰기 검사 실패 구간은 원본을 대조한 뒤 RESULT에 기입한다. 이 장에 있는 명령과 출력 형식을 원본 로그 캡처라고 설명하지 않는다.
RAID는 가상 디스크 제거, 교체 후 재동기화 완료를 /proc/mdstat와 mdadm --detail로 확인하는 흐름이다. 용량 확장은 추가한 RAID1을 볼륨 그룹에 편입한 뒤 논리 볼륨과 XFS를 늘리고 df로 전후 크기를 대조하는 흐름이다. bonding은 active-backup이며 /proc/net/bonding/bond0에서 활성 NIC 변경을 확인한다. 링크 절체와 장애 링크 복구는 별개라, 절체 후에도 끊긴 링크의 경보는 남는다.
검증 범위는 VM의 가상 디스크·NIC 장애 대응이다. 물리 디스크나 스위치의 독립된 장애 도메인까지 시험한 것으로 확대하지 않는다. 쓰기 실패가 없었다는 수치와 서비스 무중단 여부는 학교 기록에서 확인한 범위로 답한다. 장치 이름·RAID 재부팅 유지·경보 규칙과 수집기 설정·Teams 전송 여부도 질문받으면 해당 원본을 근거로 설명한다. -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  const srv = $('srv');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  $('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };

  // 장치 이름은 맨 위 DEV 에서 읽는다('nic.0' 처럼 점 뒤는 목록의 차례)
  srv.querySelectorAll('[data-dev]').forEach(t => { const [k, i] = t.dataset.dev.split('.'); t.textContent = i == null ? DEV[k] : DEV[k][+i]; });

  // ---- 운영 콘솔의 단계별 내용. 명령과 출력 형식으로 실습 흐름을 재현하며 원본 로그 캡처와 구분한다.
  //      측정값 가운데 단계 결과(재동기화·용량·ping)는 도면에 남겨 끝 모습이 요약이 되게 하고, 콘솔에는 경보까지 걸린 시간과 쓰기 중단만 둔다.
  //      det 감지(경보 제목, 끝에 해제로 바뀌는지), act 조치(auto 면 사람이 아니라 커널이 한 일), chk 확인.
  //      RESULT 는 그릴 때마다 다시 읽는다 ----
  const CONSOLE = () => [
    null,
    { det: { al: ALERT.raid, res: ['경보까지', RESULT.raid.alert], clear: true },
      act: { cmd: `mdadm /dev/${DEV.md} --add /dev/${DEV.fresh}` },
      chk: { out: 'State : clean' },   // mdadm --detail /dev/md0. 재동기화 중에는 'clean, degraded, recovering' 이다
      check: { tool: '/proc/mdstat', detail: '재동기화 완료 확인' },
      gap: RESULT.raid.writeGap },
    { det: { al: ALERT.disk, res: ['경보까지', RESULT.lvm.alert], clear: true },
      act: { cmd: `vgextend ${DEV.vg} /dev/${DEV.md2} && lvextend -r -l +100%FREE ${DEV.vg}/${DEV.lv}` },
      chk: { out: `Logical volume ${DEV.vg}/${DEV.lv} successfully resized.` },
      check: { tool: `df -h ${DEV.mount}`, detail: '파일시스템 크기 비교' },
      gap: RESULT.lvm.writeGap },
    { det: { al: ALERT.bond, res: ['경보까지', RESULT.bond.alert], clear: false },
      act: { auto: true, cmd: `${DEV.bond}: (slave ${DEV.nic[1]}): making interface the new active one` },
      chk: { out: `Currently Active Slave: ${DEV.nic[1]}` },
      check: { tool: `/proc/net/bonding/${DEV.bond}`, detail: '활성 NIC 변경 확인' },
      gap: RESULT.bond.writeGap },
  ];

  // 알약(조치 줄의 '자동'): 테두리 상자와 글. 측정값 칩: 앞말은 보조 색, 값은 굵게
  const pill = (parent, cls, text) => {
    const g = el('g', { class: 'pill ' + cls }, parent);
    el('rect', { height: 30, rx: 15 }, g);
    el('text', {}, g).textContent = text;
    return g;
  };
  const chip = (parent, label, value) => {
    const g = el('g', { class: 'res' }, parent);
    el('rect', { height: 32, rx: 8 }, g);
    const t = el('text', {}, g);
    if (label) el('tspan', {}, t).textContent = label + ' ';
    el('tspan', { class: 'v' }, t).textContent = value;
    return g;
  };
  // 도면 결과 글: 앞말은 보조 색, 값은 굵게. 값이 비면 글을 비운다
  const setResult = (t, label, value) => {
    t.replaceChildren();
    if (!value) return;
    if (label) el('tspan', {}, t).textContent = label + ' ';
    el('tspan', { class: 'v' }, t).textContent = value;
  };
  const fillResults = () => {
    setResult($('r1'), '재동기화', RESULT.raid.resync);
    setResult($('r2'), '', RESULT.lvm.from && RESULT.lvm.to ? `${RESULT.lvm.from} → ${RESULT.lvm.to}` : '');
    setResult($('r3'), 'ping', RESULT.bond.pingLoss);
  };
  // 경보 한 줄: 색 점과 제목
  const alertLine = (parent, cls, text) => { const g = el('g', { class: 'al ' + cls }, parent); el('circle', { r: 7 }, g); el('text', {}, g).textContent = text; return g; };
  const term = (parent, text, cls) => { const t = el('text', { class: 'tm ' + (cls || '') }, parent); t.textContent = text; return t; };

  // 콘솔 줄을 채운다. k=0 은 열린 모습(경보 없음), 1~3 은 단계
  function fillConsole(k) {
    const det = $('row-det'), act = $('row-act'), chk = $('row-chk'), gap = $('gap');
    [det, act, chk, gap].forEach(r => r.replaceChildren());
    srv.classList.remove('kn');
    // '경보 없음'·발생·해제 세 줄을 같은 자리에 겹쳐 두고, 같은 점이 초록 → 빨강·노랑 → 초록으로 바뀌어 보이게 한다
    const st = el('g', { class: 'state' }, det);
    alertLine(st, 'ok p-none', '경보 없음');
    if (!k) {
      $('check-tool').textContent = '디스크·용량·네트워크';
      $('check-detail').textContent = '단계별 상태 확인';
      return;
    }
    const c = CONSOLE()[k];
    $('check-tool').textContent = c.check.tool;
    $('check-detail').textContent = c.gap ? '' : c.check.detail;
    alertLine(st, c.det.al.sev + ' p-fire', c.det.al.fire);
    if (c.det.clear) alertLine(st, 'ok p-ok', c.det.al.ok);
    if (c.det.res[1]) chip(det, ...c.det.res);
    srv.classList.toggle('kn', !!c.act.auto);
    if (c.act.auto) pill(act, 'new', '자동'); else term(act, '$', 'pr');
    term(act, c.act.cmd, 'hi');
    term(chk, c.chk.out);
    if (c.gap) chip(gap, '쓰기 실패 구간', c.gap).classList.add(gapped(c.gap) ? 'warn' : 'good');
  }
  // 학교 기록에서 확인한 쓰기 검사 실패 구간만 색으로 구분한다. 빈 값에서 성공 표시를 생성하지 않는다.
  const gapped = g => !!g && parseFloat(g.replace(/[^0-9.]/g, '')) > 0;

  // ---- 글자 폭에 맞춰 알약·이름표·콘솔 줄을 놓는다 ----
  const width = n => n.getBBox().width;
  const placePill = (g, x, w) => {
    const r = g.querySelector('rect'), t = g.querySelector('text'), c = g.querySelector('circle');
    w = w || t.getBBox().width + (c ? 42 : 28);
    r.setAttribute('x', x); r.setAttribute('width', w);
    if (c) { c.setAttribute('cx', x + 17); t.setAttribute('x', x + 17 + (w - 17) / 2 + 2); } else t.setAttribute('x', x + w / 2);
    return w;
  };
  // 콘솔 한 줄: 왼쪽 x 부터 차례로 놓는다. 측정값 칩 앞은 넓게 띄운다
  function flow(row, x, cy) {
    for (const n of row.children) {
      let w;
      if (n.matches('.state, .al')) {
        const ls = n.matches('.al') ? [n] : [...n.children];
        ls.forEach(l => { const c = l.querySelector('circle'), t = l.querySelector('text'); c.setAttribute('cx', x + 7); c.setAttribute('cy', cy); t.setAttribute('x', x + 22); t.setAttribute('y', cy + 8); });
        w = 22 + Math.max(...ls.map(l => l.querySelector('text').getBBox().width)) + 4;
      } else if (n.matches('.pill')) {
        n.querySelector('rect').setAttribute('y', cy - 15); n.querySelector('text').setAttribute('y', cy + 8);
        const c = n.querySelector('circle'); if (c) c.setAttribute('cy', cy);
        w = placePill(n, x);
      } else if (n.matches('.res')) {
        x += 18;
        const r = n.querySelector('rect'), t = n.querySelector('text');
        t.setAttribute('x', x + 14); t.setAttribute('y', cy + 8);
        w = t.getBBox().width + 28;
        r.setAttribute('x', x); r.setAttribute('y', cy - 16); r.setAttribute('width', w);
      } else { n.setAttribute('x', x); n.setAttribute('y', cy + 8); w = width(n); }
      x += w + 14;
    }
  }
  function layout() {
    const w = $('plate-t').getBBox().width, os = 92 + w + 22 + 34;
    $('plate-li').setAttribute('x', 92 + w + 22); $('plate-os').setAttribute('x', os);
    $('plate-bx').setAttribute('width', os + width($('plate-os')) + 18 - 40);
    placePill($('p-new'), 540 + width($('fresh-t')) + 14);
    let r1x = 784;
    srv.querySelectorAll('.pill[data-right]').forEach(g => { const w = g.querySelector('text').getBBox().width + 28; placePill(g, +g.dataset.right - w, w); if (g.matches('.p-uu0')) r1x = 784 - w - 14; });
    $('r1').setAttribute('x', r1x);
    srv.querySelectorAll('.pill[data-mid]').forEach(g => { const w = g.querySelector('text').getBBox().width + 28; placePill(g, +g.dataset.mid - w / 2, w); });
    // 결과 줄: 알약 뒤에 글을 오른쪽 끝(data-end)에 맞춘다(글이 비면 알약만으로 맞춘다)
    srv.querySelectorAll('[data-end]').forEach(g => {
      const p = g.querySelector('.pill'), t = g.querySelector('.rv'), pw = p.querySelector('text').getBBox().width + 28;
      const w = pw + (t.textContent ? width(t) + 12 : 0), x = +g.dataset.end - w;
      placePill(p, x, pw); t.setAttribute('x', x + pw + 12);
    });
    flow($('row-det'), 104, 592); flow($('row-act'), 104, 624); flow($('row-chk'), 104, 656); flow($('gap'), 1272, 656);
  }
  fillResults(); fillConsole(0); layout();
  // 한글 글꼴은 글자 범위별 조각이라 그 글자를 처음 그릴 때 받는다. 창이 숨은 채 열리면 조각이 늦게 와서
  // 처음 잰 폭이 틀리므로, 이 장에서 재는 글자들을 미리 받아 둔 뒤 다시 맞춘다
  if (document.fonts) {
    const SAMPLE = '주 DB Rocky Linux 새 디스크 경보 없음 해제 발생 장애 네트워크 링크 하나 끊김 여유 공간 부족 미만 까지 재동기화 확장 완료 절체 간격 자동 쓰기 실패 구간 ping 손실 개 분 초 GiB → [UU] degraded 0123456789';
    Promise.all(["600 24px 'IBM Plex Sans KR'", "400 22px 'IBM Plex Sans KR'", "600 22px 'IBM Plex Sans KR'", "400 22px 'IBM Plex Mono'", "500 22px 'IBM Plex Mono'"]
      .map(f => document.fonts.load(f, SAMPLE))).then(layout, () => {});
    document.fonts.ready.then(layout);
    document.fonts.addEventListener('loadingdone', layout);
  }
  // 숨은 탭에서 열리면 글꼴을 받아도 tspan 폭이 빠진 채로 재어진다(브라우저에서 확인). 화면에 처음 그려지는 때 다시 맞춘다
  requestAnimationFrame(() => requestAnimationFrame(layout));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) layout(); });

  // ---- 막대: XFS·LVM 막대의 너비(용량)와 사용량 칠. 사용량은 데이터 크기라 막대가 늘어도 길이가 그대로이고, 비율만 줄어든다.
  //      그림은 md1을 md0과 같은 크기로 보아 두 배로 늘린다(실제 크기는 확인 줄의 측정값) ----
  const BAR = { x: 40, short: 760, long: 1580, used: .60, full: .92, alarm: .85 };
  const geo = { vg: 0, lv: 0, use: 0 };
  function setBars(g) {
    Object.assign(geo, g);
    $('vg-b').setAttribute('width', geo.vg);
    $('lv-b').setAttribute('width', geo.lv); $('lv-c').setAttribute('width', geo.lv);
    $('use').setAttribute('width', geo.use); $('use-l').setAttribute('width', geo.use);
    const tx = BAR.x + BAR.alarm * geo.lv;
    $('tick').setAttribute('x1', tx); $('tick').setAttribute('x2', tx); $('tickl').setAttribute('x', tx - 10);
  }

  // ---- 시간표 도구: 예약(later), 값 옮기기(tween), 흐르는 점(run). 단계를 바꾸면 모두 멈춘다 ----
  let timers = [], rafs = new Set();
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const tween = (ms, fn) => {
    const b = performance.now();
    const f = now => { const k = Math.min(1, (now - b) / ms); fn(ease(k)); if (k < 1) { const id = requestAnimationFrame(f); rafs.add(id); } };
    rafs.add(requestAnimationFrame(f));
  };
  const lerp = (a, b, k) => a + (b - a) * k;
  // 점 [x, y, 감춤]: 감춤이 붙은 점부터 다음 점까지는 장비 속이라 점을 감추고 짧게(40) 지나간다.
  // 길이를 초당 약 450px로 그리되 0.8초보다 짧게 끝내지 않는다
  const UP = [[945, 48], [945, 100, 1], [945, 148], [945, 176, 1], [860, 201], [570, 201]];   // 스위치 → 위 링크 → bond0 → PostgreSQL
  function run(pts) {
    const segs = []; let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i], L = a[2] ? 40 : Math.hypot(b[0] - a[0], b[1] - a[1]);
      segs.push({ a, b, L, s: total, hide: !!a[2] }); total += L;
    }
    const dot = el('circle', { class: 'dot', r: 11, cx: pts[0][0], cy: pts[0][1] }, $('dots'));
    tween(Math.max(800, total / 450 * 1000), e => {
      const d = e * total, g = segs.find(q => d <= q.s + q.L) || segs[segs.length - 1], f = g.L ? Math.min(1, (d - g.s) / g.L) : 1;
      dot.setAttribute('cx', lerp(g.a[0], g.b[0], f)); dot.setAttribute('cy', lerp(g.a[1], g.b[1], f));
      dot.style.opacity = g.hide ? 0 : 1;
      if (e >= 1) dot.remove();
    });
  }

  // ---- 단계. end 는 그 단계의 끝 모습을 바로 놓고, play 는 한 번에 한 곳씩 움직인다.
  //      → 를 누르면 도면은 바로 움직이고, 콘솔은 앞 단계의 명령·확인 줄을 0.3초(F)에 지운 뒤 이 단계의 줄로 바꾼다.
  //      시각은 모두 → 를 누른 때부터 잰다 ----
  const F = 300;
  const on = (...c) => srv.classList.add(...c);
  const consoleEnd = k => { fillConsole(k); layout(); on('k1', 'k2', 'k3'); srv.classList.toggle('kr', CONSOLE()[k].det.clear); };
  const STEPS = [
    {
      // 열린 모습: 디스크 둘이 [UU], 사용량은 도식상 60%, 위 링크가 쓰는 선, 콘솔은 경보 없음
      end: () => { srv.setAttribute('class', 'srv'); setBars({ vg: BAR.short, lv: BAR.short, use: BAR.used * BAR.short }); fillConsole(0); layout(); },
    },
    {
      // ① 약 3.65초: 디스크 2에 ✕·md0 degraded(0~0.3) → 감지: 같은 점이 빨강으로, 경보 발생(0.4~0.7)
      //    → 옛 디스크가 빠지고 새 디스크(0.8~1.5) → 조치: mdadm --add(1.5~1.8) → 재동기화 길(1.8~2.7)
      //    → md0 [UU]와 걸린 시간(2.9~3.2) → 확인: mdadm --detail 의 State 줄, 경보 해제(3.35~3.65)
      end: () => { on('d2x', 'swap', 'uu'); consoleEnd(1); },
      play: () => {
        on('d2x');
        later(400, () => on('k1'));
        later(800, () => on('swap'));
        later(1500, () => on('k2'));
        later(1800, () => on('sync-on'));
        later(2900, () => on('uu'));
        later(3350, () => on('k3', 'kr'));
      },
    },
    {
      // ② 약 3.9초: 사용량이 경보 기준을 넘고(0~0.7) → 감지: 디스크 여유 공간 부족 경보(0.75~1.05) → 빈 슬롯에 md1(1.1~1.65)
      //    → 조치: vgextend·lvextend -r(1.65~1.95) → 볼륨 그룹(2.0~2.6), 논리 볼륨과 XFS(2.6~3.2)가 늘고
      //    → 초록으로, '확장 완료'와 기록이 있으면 늘린 크기(3.2~3.5) → 확인: 출력 형식과 경보 해제(3.6~3.9)
      end: () => { on('md1', 'ok2'); setBars({ vg: BAR.long, lv: BAR.long, use: BAR.full * BAR.short }); consoleEnd(2); },
      play: () => {
        const u0 = geo.use, u1 = BAR.full * BAR.short;
        tween(700, k => setBars({ use: lerp(u0, u1, k) }));
        later(470, () => on('hot'));   // 사용량 칠이 경보 기준선을 지나는 때
        later(750, () => on('k1'));
        later(1100, () => on('md1'));
        later(1650, () => on('k2'));
        later(2000, () => tween(600, k => setBars({ vg: lerp(BAR.short, BAR.long, k) })));
        later(2600, () => tween(600, k => setBars({ lv: lerp(BAR.short, BAR.long, k) })));
        later(3200, () => { srv.classList.remove('hot'); on('ok2'); });
        later(3600, () => on('k3', 'kr'));
      },
    },
    {
      // ③ 약 3.3초: 위 링크로 흐르던 점(0~1.07) → 위 링크에 ✕(1.1~1.4) → bonding 이 대기 링크로 바로 넘김(1.5~1.8)
      //    → '절체'(1.8~2.1) → 조치(자동): 커널 기록 한 줄(2.2~2.5) → 감지: 경보 발생(2.6~2.9) → 확인: 활성 NIC(3.0~3.3).
      //    커널은 miimon 100ms 로 먼저 넘기고 경보는 수집·평가 뒤에 뜬다. 끊긴 선은 바꿀 때까지 경보가 발생 상태로 남는다
      end: () => { on('cut', 'bk', 'ok3'); consoleEnd(3); },
      play: () => {
        run(UP);
        later(1100, () => on('cut'));
        later(1500, () => on('bk'));
        later(1800, () => on('ok3'));
        later(2200, () => on('k2'));
        later(2600, () => on('k1'));
        later(3000, () => on('k3'));
      },
    },
  ];
  const LAST = STEPS.length - 1;

  let step = 0;
  // 앞 단계들의 끝 모습을 움직임 없이 놓은 뒤, 이 단계를 움직이거나(→) 끝 모습으로 바로 놓는다(←, #last, 움직임 줄이기)
  function render(n, inst) {
    timers.forEach(clearTimeout); timers = [];
    rafs.forEach(cancelAnimationFrame); rafs.clear();
    $('dots').replaceChildren();
    step = n; stage.dataset.step = n;
    fillResults();
    stage.classList.add('inst');
    for (let k = 0; k < n; k++) STEPS[k].end();
    if (n === 0 || inst) STEPS[n].end();
    void srv.getBoundingClientRect();
    if (inst) { requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('inst'))); return; }
    stage.classList.remove('inst');
    if (n === 0) return;
    // 앞 단계의 명령·확인 줄을 지우고 경보 없음으로 돌린 뒤, 이 단계의 줄로 바꿔 둔다(아직 보이지 않음)
    srv.classList.remove('k1', 'k2', 'k3', 'kr');
    later(F, () => { stage.classList.add('inst'); fillConsole(n); layout(); void srv.getBoundingClientRect(); stage.classList.remove('inst'); });
    STEPS[n].play();
  }

  // ---- 증거 화면 창(E 키 도구): 맨 위 EVIDENCE 가운데 실제로 있는 파일만 차례로 보인다. 하나도 없으면 단추를 숨긴 채 둔다.
  //      없는 파일을 찾으면 브라우저가 콘솔에 404를 남기므로, 발표자가 도구를 켤 때 한 번만 찾는다 ----
  const fig = $('fig'), img = $('fig-img'), pre = $('fig-pre'), openBtn = $('open-fig');
  const SHOTS = [];
  let at = 0, probed = false;
  const exists = s => /\.txt$/i.test(s.src)
    ? fetch(s.src).then(r => (r.ok ? r.text() : null)).then(t => { if (t != null) s.text = t; return t != null; }, () => false)
    : new Promise(ok => { const i = new Image(); i.onload = () => ok(true); i.onerror = () => ok(false); i.src = s.src; });
  const probe = () => {
    if (probed || !document.body.classList.contains('tools')) return;
    probed = true;
    Promise.all(EVIDENCE.map(s => exists(s).then(y => y && s))).then(list => {
      SHOTS.push(...list.filter(Boolean));
      if (SHOTS.length) openBtn.hidden = false;
    });
  };
  probe();
  new MutationObserver(probe).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  const showShot = n => {
    at = Math.max(0, Math.min(SHOTS.length - 1, n));
    const s = SHOTS[at];
    if (s.text != null) { img.hidden = true; img.removeAttribute('src'); pre.hidden = false; pre.textContent = s.text.trim(); }
    else { pre.hidden = true; img.hidden = false; img.src = s.src; img.alt = s.cap; }
    $('fig-cap').textContent = s.cap;
    $('fig-cnt').textContent = `${at + 1} / ${SHOTS.length}`;
    $('fig-prev').disabled = at === 0;
    $('fig-next').disabled = at === SHOTS.length - 1;
  };
  const closeFig = () => { if (fig.open) fig.close(); openBtn.blur(); };
  // 도구가 꺼져 있으면 숨은 단추를 눌러도 열지 않는다
  openBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (!document.body.classList.contains('tools') || !SHOTS.length) return;
    showShot(0);
    try { fig.showModal(); } catch (err) { fig.setAttribute('open', ''); }
    try { fig.focus(); } catch (err) {}
  });
  $('close-fig').addEventListener('click', e => { e.stopPropagation(); closeFig(); });
  $('fig-prev').addEventListener('click', e => { e.stopPropagation(); showShot(at - 1); });
  $('fig-next').addEventListener('click', e => { e.stopPropagation(); showShot(at + 1); });
  // 닫을 때 숨은 단추에서 초점을 빼 스페이스·엔터로 다시 열리지 않게 한다
  fig.addEventListener('close', () => openBtn.blur());
  // 창이 열려 있는 동안은 ← → 를 덱보다 먼저 받아 그림을 넘긴다(덱은 장을 다 읽은 뒤에 같은 자리에 키를 건다)
  addEventListener('keydown', e => {
    if (!fig.open) return;
    const d = { ArrowRight: 1, PageDown: 1, ' ': 1, ArrowLeft: -1, PageUp: -1 }[e.key];
    const to = e.key === 'Home' ? 0 : e.key === 'End' ? SHOTS.length - 1 : d ? at + d : null;
    if (to === null) return;
    e.preventDefault(); e.stopImmediatePropagation();
    showShot(to);
  }, true);

  // ---- 시작: 움직임을 줄인 환경과 #last 는 ③의 끝 모습. 그 밖에는 열린 모습에서 쌓인다 ----
  if (reduce) {
    stage.classList.add('done');
    render(LAST, true);
    window.deckStep = () => { if (fig.open) { closeFig(); return true; } return false; };
    return;
  }
  if (location.hash === '#last') { stage.classList.add('done'); render(LAST, true); }
  else render(0, false);
  // 앞으로는 다음 단계를 움직여 보이고, 뒤로는 앞 단계의 끝 모습을 바로 보인다. 마지막 뒤 → 는 다음 장
  window.deckStep = d => {
    if (fig.open) { closeFig(); return true; }
    if (d > 0 && step < LAST) { render(step + 1, false); return true; }
    if (d < 0 && step > 0) { render(step - 1, true); return true; }
    return false;
  };
  if (window.parent === window) addEventListener('keydown', e => {
    if (fig.open) return;
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });
})();
</script>
