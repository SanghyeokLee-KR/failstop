<title>페일스톱 01 고가용성</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --ai: #C6C0F2;
    --data: #5CCFE6;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  h1 {
    position: absolute; left: 130px; top: 164px; margin: 0;
    font-size: 60px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em;
    animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both;
  }
  .dek { position: absolute; left: 130px; top: 254px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .8s .3s ease-out both; }

  /* 도면 하나에서 네 상황을 차례로 재생한다. 아래 '주문 처리' 막대가 그동안 주문이 이어졌는지 보여 준다 */
  .fig { position: absolute; left: 130px; top: 318px; width: 1050px; height: 560px; overflow: visible; animation: fade .8s .35s ease-out both; }
  .fig text { font-family: var(--sans); }
  .fig .tx { font-size: 26px; fill: var(--ink); transition: fill .35s; }
  .fig .tx2 { font-size: 24px; fill: var(--ink); }
  .fig .sub { font-size: 22px; fill: var(--ink-3); transition: fill .35s; }
  .fig .sm { font-size: 22px; fill: var(--ink-3); transition: opacity .35s; }
  .fig .box { fill: #1A2130; stroke: var(--card); stroke-width: 1.6; transition: stroke .35s, fill .35s, opacity .35s; }
  .fig .box.busy { stroke: var(--warm); }
  .fig .box.hot { stroke: var(--bad); fill: #2A1F29; }
  .fig .box.good { stroke: var(--ok); }
  .fig .box.ghost { stroke-dasharray: 6 5; fill: transparent; opacity: .75; }
  .fig .wire { fill: none; stroke: #3A465A; stroke-width: 2; transition: stroke .35s, opacity .35s; }
  .fig .wire.ghost { stroke-dasharray: 5 6; }
  .fig .wire.off { opacity: .28; }
  .fig .wire.dead { stroke: var(--bad); opacity: .35; }
  .fig .wire.good { stroke: var(--ok); }
  .fig .wire.sync { stroke: var(--side); stroke-width: 1.6; }
  .fig .wire.sync.dead { stroke: var(--bad); }
  .fig .wire.bk { stroke-dasharray: 4 6; stroke: #6A7890; }
  .fig .wire.bk.live { stroke: var(--data); }
  .fig .dim { opacity: .35; transition: opacity .35s; }
  .fig .dot { fill: var(--glow); }
  .fig .dot.w { fill: var(--warm); }
  .fig .dot.rep { fill: var(--side); }
  .fig .dot.bk { fill: var(--data); }
  .fig .flag { font-size: 22px; font-weight: 600; opacity: 0; transition: opacity .35s; }
  .fig .flag.on { opacity: 1; }
  .fig .x { stroke: var(--bad); stroke-width: 3.4; stroke-linecap: round; opacity: 0; transition: opacity .25s; }
  .fig .x.on { opacity: 1; }
  .fig .bar.ok { fill: var(--ok); opacity: .8; }
  .fig .bar.w { fill: var(--warm); }
  .fig .bar.bad { fill: var(--bad); }
  .fig #sf { font-size: 22px; font-weight: 600; transition: fill .35s; }

  /* 오른쪽: 네 상황. 누르면(또는 →) 그 상황을 도면에서 재생한다. 색은 deck.css의 기준 색(02 목표 표와 같음) */
  .sits { position: absolute; left: 1236px; right: 130px; top: 330px; margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; animation: fade .8s .5s ease-out both; }
  .sits button {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: grid; grid-template-columns: 44px 1fr; column-gap: 8px; row-gap: 6px;
    padding: 18px 20px 20px 18px; border-left: 3px solid var(--line); border-radius: 0 8px 8px 0;
    opacity: .8; transition: opacity .35s, border-color .35s, background .35s;
  }
  .sits.playing button { opacity: .42; }
  .sits.playing button.on { opacity: 1; border-left-color: var(--c); background: rgba(255,255,255,.035); }
  .sits button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .sits b { grid-row: 1 / span 2; font-family: var(--mono); font-weight: 500; font-size: 26px; line-height: 1.3; color: var(--c); }
  .sits .s { font-size: 30px; font-weight: 600; line-height: 1.3; color: var(--ink); }
  .sits .tag { font-style: normal; font-size: 22px; font-weight: 500; color: var(--c); border: 1px solid var(--c); border-radius: 5px; padding: 1px 9px 2px; margin-left: 14px; vertical-align: 3px; opacity: .85; }
  .sits li.sep { border-top: 1px dashed var(--line); padding-top: 14px; }
  .sits .a { font-size: 24px; line-height: 1.4; color: var(--ink-2); }

  .foot {
    position: absolute; left: 130px; right: 130px; bottom: 64px;
    display: flex; align-items: baseline; gap: 28px;
    padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 24px; color: var(--ink-2); animation: fade .8s 1.1s ease-out both;
  }
  .foot .k { font-size: 22px; color: var(--ink-3); white-space: nowrap; }
  .foot b { font-weight: 600; color: var(--ink); margin-right: 10px; }
  .foot .m { margin-left: auto; color: var(--ink-3); font-size: 22px; white-space: nowrap; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<!-- 발표 노트(40초): → 네 번(상황 1~4). 오른쪽 줄을 눌러도 그 상황을 다시 재생한다. 고가용성은 어느 한 곳이 멈춰도 거래가 이어지게 하는 것입니다. 그래서 거래 서버와 DB를 둘씩 두고, 멈춘 쪽의 일을 남은 쪽이 넘겨받게 했습니다. (→ 1) 요청이 몰리면 조회만 받는 서버를 켜서 나눠 받습니다. 주문은 마켓마다 한 서버가 순서를 정하고 병목이 DB 기록이라 서버를 늘려도 빨라지지 않기 때문에, 두 거래 서버가 그대로 맡습니다. (→ 2) 거래 서버 하나가 멈추면 남은 서버가 그 서버의 마켓 6개를 더 맡아 12개의 리더가 됩니다. 넘겨받는 동안 그 마켓의 주문은 잠시 멈춥니다. (→ 3) 주 DB가 멈추면 예비 DB가 자동으로 주 DB가 됩니다. 이 자동 전환은 로컬에서 검증했고 AWS에는 아직 적용하지 않았습니다. 주문은 두 DB에 모두 기록된 뒤에만 확인하기 때문에 확인받은 주문은 잃지 않고, 그 대신 예비 DB가 다시 붙을 때까지 새 주문은 기다립니다. (→ 4) 두 DB를 모두 잃는 경우를 대비해 서버 밖에 백업을 두고 되살립니다. 이것은 고가용성이 아니라 재해 복구이고, 복원과 예비 DB 재구성까지 멈추며 백업 뒤의 기록을 잃을 수 있습니다. 수치는 06 결과에서 보여 드립니다. 사실 확인: 조회 서버(app-3)는 Auto Scaling 그룹 0~1대(앱 계층 최소 2·최대 3, ADR 0030). DB 자동 전환은 Patroni 엄격 동기(ADR 0036)이고 로컬 Docker 실험에서 23초 승격·유실 0건·장애 뒤 66초 주문 재개를 확인했다(06-2). 운영 환경(AWS)에 적용한 자동 DB 전환은 아직 없다. 백업은 시점 복원(PITR)이 아니라 백업 시점까지 되살리는 방식이다. 도면의 점 흐름과 막대 길이는 설명용이며 측정값이 아니다. -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const on = (id, v = true) => $(id).classList.toggle('on', v);
  const cls = (id, c, v = true) => $(id).classList.toggle(c, v);
  const mk = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const lenOf = pts => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
  const along = (pts, d) => {
    for (let i = 1; i < pts.length; i++) {
      const [x1, y1] = pts[i - 1], [x2, y2] = pts[i], L = Math.hypot(x2 - x1, y2 - y1);
      if (d <= L) return [x1 + (x2 - x1) * d / L, y1 + (y2 - y1) * d / L];
      d -= L;
    }
    return pts[pts.length - 1];
  };
  // 점 여러 개가 꺾인 선을 따라 일정한 속도로 움직인다. 끝에 닿으면 done을 부른다(돌려받은 true면 점을 지우지 않는다)
  const parts = [];
  const send = (pts, c = 'dot', speed = .3, done, r = 5) => {
    const el = mk('circle', { r, class: c, cx: pts[0][0], cy: pts[0][1] }, $('dots'));
    parts.push({ el, pts, L: lenOf(pts), b: performance.now(), speed, done });
  };
  const moveDots = now => {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i], d = (now - p.b) * p.speed;
      if (d >= p.L) { parts.splice(i, 1); if (!(p.done && p.done(p.el))) p.el.remove(); continue; }
      const [x, y] = along(p.pts, d); p.el.setAttribute('cx', x.toFixed(1)); p.el.setAttribute('cy', y.toFixed(1));
    }
  };

  // 길: 요청(사용자 → 로드밸런서 → 서버), 주문 기록(서버 → 주 DB), 복제(주 DB → 예비 DB), 복원(백업 → DB)
  const REQ = {
    s1: [[52, 176], [96, 176], [212, 176], [320, 62], [352, 62]],
    s2: [[52, 176], [96, 176], [212, 176], [320, 176], [352, 176]],
    r: [[52, 176], [96, 176], [212, 176], [320, 290], [352, 290]],
  };
  const ROW_Y = { s1: 62, s2: 176 };
  const toTop = y => [[610, y], [670, y], ...(y === 62 ? [] : [[670, 62]]), [740, 62], [772, 62]];
  const toBottom = y => [[610, y], [670, y], [670, 290], [740, 290], [772, 290]];
  const REP_DOWN = [[890, 100], [890, 252]], REP_UP = [[890, 252], [890, 100]];
  const RESTORE = [[1040, 412], [1046, 412], [1046, 62], [1040, 62], [1012, 62]];

  // 상태를 도면에 옮긴다. 같은 상태면 몇 번을 불러도 결과가 같다
  const BASE = { surge: false, busy: false, r: false, s1down: false, s2all: false, pdown: false, promoted: false, rejoined: false, lost: false, restored: false, order: 'ok', sf: ['정상', 'ink-3'] };
  let st = { ...BASE };
  function paint() {
    cls('n-s1', 'hot', st.s1down); cls('n-s1', 'busy', st.busy && !st.s1down); on('x-s1', st.s1down);
    cls('w-s1', 'dead', st.s1down); cls('b-s1', 'dead', st.s1down);
    cls('n-s2', 'good', st.s2all); cls('n-s2', 'busy', st.busy);
    $('n-s2s').textContent = st.s2all ? '마켓 12개 리더' : '마켓 6개 리더';
    $('n-s2s').style.fill = st.s2all ? 'var(--ok)' : '';
    cls('n-r', 'ghost', !st.r); cls('n-r', 'good', st.r); cls('n-ri', 'dim', !st.r);
    $('n-rt').style.fill = st.r ? 'var(--ink)' : 'var(--ink-3)';
    cls('w-r', 'ghost', !st.r); cls('b-r', 'ghost', !st.r);
    const pHot = (st.pdown && !st.rejoined) || (st.lost && !st.restored);
    cls('n-p', 'hot', pHot); cls('n-p', 'good', st.restored); on('x-p', pHot);
    $('n-pt').textContent = st.restored ? '복원한 DB' : st.rejoined ? '예비 DB' : '주 DB';
    cls('n-q', 'hot', st.lost); cls('n-q', 'good', st.promoted && !st.lost); on('x-q', st.lost);
    $('n-qt').textContent = st.promoted ? '주 DB' : '예비 DB';
    cls('b-p', 'dead', pHot); cls('b-p', 'off', st.rejoined); cls('b-p', 'good', st.restored);
    cls('b-q', 'off', !st.promoted || st.lost); cls('b-q', 'good', st.promoted && !st.lost); cls('b-q', 'dead', st.lost);
    const syncDead = pHot || st.lost;
    cls('sync', 'dead', syncDead); $('syn-t').style.opacity = syncDead ? 0 : 1;
    cls('w-bk', 'live', st.lost);
    on('f1', st.r); on('f1b', st.r); on('f2', st.s2all); on('f3', st.promoted && !st.lost); on('f4', st.restored);
    $('sf').textContent = st.sf[0]; $('sf').style.fill = `var(--${st.sf[1]})`;
  }

  // 상황별 시간표(초). 0은 평소
  const SC = [
    [],
    [[0, s => { s.surge = true; }], [1.2, s => { s.busy = true; }], [2.8, s => { s.r = true; }], [3.6, s => { s.busy = false; }]],
    [[1.0, s => { s.s1down = true; s.order = 'w'; s.sf = ['넘겨받는 동안 그 마켓 주문은 잠깐 멈춤', 'warm']; }],
     [2.6, s => { s.s2all = true; s.order = 'ok'; s.sf = ['넘겨받은 뒤 재개', 'ok']; }]],
    [[1.0, s => { s.pdown = true; s.order = 'w'; s.sf = ['새 주문은 잠시 대기', 'warm']; }],
     [2.4, s => { s.promoted = true; s.sf = ['예비 DB가 다시 붙을 때까지 대기', 'warm']; }],
     [5.2, s => { s.rejoined = true; s.order = 'ok'; s.sf = ['예비 DB가 다시 붙은 뒤 재개', 'ok']; flush(); }]],
    [[1.0, s => { s.lost = true; s.order = 'bad'; s.sf = ['복원할 때까지 주문 멈춤', 'bad']; }],
     [3.8, s => { s.restored = true; s.order = 'ok'; s.sf = ['복원·재구성 뒤 재개 · 백업 뒤 기록은 잃을 수 있음', 'warm']; }]],
  ];

  // DB가 멈춘 동안의 주문은 버스 앞에 쌓였다가, 예비 DB가 다시 붙으면 새 주 DB로 흘러간다
  let queue = [];
  const slot = i => [652 - (i % 3) * 13, 150 - Math.floor(i / 3) * 13];
  const park = el => {
    if (queue.length >= 9) return false;
    const [x, y] = slot(queue.length); el.setAttribute('cx', x); el.setAttribute('cy', y); queue.push(el); return true;
  };
  function flush() {
    queue.forEach((el, i) => {
      const x = +el.getAttribute('cx'), y = +el.getAttribute('cy');
      setTimeout(() => { el.remove(); send([[x, y], [670, y], [670, 290], [740, 290], [772, 290]], 'dot w', .3); }, i * 90);
    });
    queue = [];
  }

  // 주문 처리 막대: 0.25초마다 한 칸, 그 순간의 주문 상태 색으로 오른쪽에서 들어온다
  const BAR_MS = 250, BAR_P = 16, BAR_R = 1030, BAR_L = 110;
  let bars = [], lastBar = 0;
  const bar = (c, born) => { const el = mk('rect', { y: 488, width: 10, height: 34, rx: 2, class: 'bar ' + c }, $('strip')); bars.push({ el, born }); return el; };

  let cur = -1, t0 = 0, done = 0, lastReq = 0, lastOrd = 0, lastRep = 0, lastBk = 0, n = 0, m = 0;
  function reset() {
    parts.forEach(p => p.el.remove()); parts.length = 0;
    queue.forEach(el => el.remove()); queue = [];
    st = { ...BASE }; paint();
  }
  function play(i, instant) {
    cur = i; reset();
    bars.forEach(b => b.el.setAttribute('class', 'bar ok'));
    t0 = 0; done = 0;
    if (instant) { SC[i].forEach(([, f]) => f(st)); done = SC[i].length; paint(); }
    $('sits').classList.toggle('playing', i > 0);
    document.querySelectorAll('#sits button').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  }

  function tick(now) {
    if (!t0) t0 = now;
    const t = (now - t0) / 1000;
    while (done < SC[cur].length && t >= SC[cur][done][0]) { SC[cur][done][1](st); done++; paint(); }
    // 요청: 몰리면 간격이 짧아지고, 조회 서버가 켜지면 셋에 하나는 조회 서버로 간다
    if (now - lastReq > (st.surge ? 130 : 480)) {
      lastReq = now; n++;
      send(st.r && n % 3 === 0 ? REQ.r : st.s1down || n % 2 ? REQ.s2 : REQ.s1, 'dot', .42);
    }
    // 주문 기록: 서버를 넘겨받는 동안과 DB를 모두 잃은 동안은 새로 나가지 않고, 주 DB가 멈춘 동안은 버스 앞에 쌓인다
    const waitDb = st.pdown && !st.rejoined;
    if (now - lastOrd > 720 && (st.order === 'ok' || waitDb)) {
      lastOrd = now; m++;
      const y = st.s1down || m % 2 ? ROW_Y.s2 : ROW_Y.s1;
      if (waitDb) send([[610, y], [650, y]], 'dot w', .3, el => park(el));
      else send(st.promoted ? toBottom(y) : toTop(y), 'dot w', .3);
    }
    // 복제: 주문이 흐를 때 주 DB에서 예비 DB로. 승격 뒤에는 방향이 바뀐다
    if (now - lastRep > 900 && st.order === 'ok' && !st.lost && !st.restored) {
      lastRep = now;
      send(st.rejoined ? REP_UP : REP_DOWN, 'dot rep', .14, null, 4);
    }
    // 복원: DB를 모두 잃으면 서버 밖 백업에서 데이터가 올라온다
    if (st.lost && !st.restored && t > 1.8 && now - lastBk > 260) { lastBk = now; send(RESTORE, 'dot bk', .5); }
    moveDots(now);
    if (!lastBar) { lastBar = now; for (let k = 0; k < 58; k++) bar('ok', now - k * BAR_MS); }
    if (now - lastBar > BAR_MS) { lastBar = now; bar(st.order, now); }
    bars = bars.filter(b => {
      const x = BAR_R - (now - b.born) / BAR_MS * BAR_P;
      if (x < BAR_L - BAR_P) { b.el.remove(); return false; }
      b.el.setAttribute('x', x.toFixed(1)); return true;
    });
  }

  document.querySelectorAll('#sits button').forEach(b => b.addEventListener('click', () => play(+b.dataset.i)));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (location.hash === '#last' || reduce) {
    // 뒤 장에서 돌아왔거나 움직임을 줄인 환경: 마지막 상황의 끝 모습과 그 사이의 주문 처리 기록을 그대로 보인다
    play(4, true);
    for (let k = 0; k < 58; k++) bar(k >= 18 && k < 30 ? 'bad' : 'ok', 0).setAttribute('x', BAR_R - k * BAR_P);
    lastBar = reduce ? 0 : performance.now();
    if (!reduce) bars.forEach((b, k) => { b.born = performance.now() - k * BAR_MS; });
  } else play(0);
  if (!reduce) {
    const loop = now => { tick(now); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
  // 덱에서 → 는 다음 상황, ← 는 앞 상황. 끝에 닿으면 false를 돌려 장을 넘긴다
  window.deckStep = d => { const k = cur + d; if (k < 0 || k > 4) return false; play(k); return true; };
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });
})();
</script>
