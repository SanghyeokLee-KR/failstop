<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 02 기획 시나리오</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  h1 {
    position: absolute; left: 130px; top: 164px; margin: 0;
    font-size: 60px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em;
    animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both;
  }
  .dek { position: absolute; left: 130px; top: 254px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .8s .3s ease-out both; }

  /* 두 질문. 결과 없이 문제 장면만 보인다. 그림은 저절로 되풀이된다 */
  .qs { position: absolute; left: 130px; right: 130px; top: 336px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .q { border-top: 2px solid var(--card); padding-top: 26px; animation: rise .8s cubic-bezier(.2,.7,.2,1) both; transition: filter .6s, border-color .6s; }
  .q:nth-child(1) { animation-delay: .35s; }
  .q:nth-child(2) { animation-delay: .55s; }
  /* 단계: 0 첫 장면만 움직이고 둘째는 흐리게, 1 둘째 장면이 움직이고 첫 장면은 막힌 순간에 멈춤, 2 AI 역할 줄 */
  .stage[data-step="0"] .q:nth-child(2) { filter: opacity(.32); }
  .stage[data-step="0"] .q:nth-child(1), .stage:not([data-step="0"]) .q:nth-child(2) { border-top-color: var(--ink-3); }
  #s1-dots, #s2-dots { transition: opacity .4s; }
  .q .no { display: flex; align-items: baseline; gap: 14px; font-size: 22px; color: var(--ink-3); }
  .q .no b { font-family: var(--mono); font-weight: 500; font-size: 22px; color: var(--brand); }
  .q:nth-child(1) .no b { color: #C6C0F2; } .q:nth-child(2) .no b { color: var(--bad); }
  .q h2 { margin: 14px 0 0; font-size: 44px; font-weight: 600; line-height: 1.3; letter-spacing: -.015em; word-break: keep-all; }
  .q h2 em { font-style: normal; color: var(--glow); }
  .q:nth-child(1) h2 em { color: #C6C0F2; }
  .q:nth-child(2) h2 em { color: var(--bad); }
  .scene { display: block; width: 790px; height: 270px; margin-top: 18px; }
  .scene text { font-family: var(--sans); }
  .scene .lb { font-size: 22px; fill: var(--ink-2); }
  .scene .sm { font-size: 22px; fill: var(--ink-3); }
  .scene .box { fill: #1A2130; stroke: var(--card); stroke-width: 1.6; transition: stroke .3s, fill .3s; }
  .scene .box.hot { stroke: var(--bad); fill: #2A1F29; }
  .scene .wire { fill: none; stroke: #3A465A; stroke-width: 2; }
  .scene .dot { fill: var(--glow); }
  .scene .dot.stuck { fill: var(--warm); }
  .scene .dot.lost { fill: var(--bad); }
  .scene .gbg { fill: #222A38; }
  .scene .gfill { transition: fill .3s; }
  .scene .flag { font-size: 22px; font-weight: 600; opacity: 0; transition: opacity .35s; }
  .scene .flag.on { opacity: 1; }
  .scene .x { stroke: var(--bad); stroke-width: 4; stroke-linecap: round; opacity: 0; transition: opacity .25s; }
  .scene .x.on { opacity: 1; }

  .chk { margin: 22px 0 0; display: flex; align-items: baseline; gap: 18px; font-size: 24px; line-height: 1.4; color: var(--ink-2); white-space: nowrap; }
  .chk span { font-size: 21px; color: var(--ink-3); padding-right: 18px; border-right: 2px solid var(--line); }

  .foot {
    position: absolute; left: 130px; right: 130px; bottom: 64px;
    display: flex; align-items: baseline; gap: 28px;
    padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 25px; color: var(--ink);
    opacity: 0; transform: translateY(10px); transition: opacity .6s, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .stage[data-step="2"] .foot { opacity: 1; transform: none; }
  .foot .k { font-size: 22px; color: var(--ink-3); white-space: nowrap; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage" data-step="0">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">기획 시나리오</span>02</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <h1>기획 시나리오</h1>
  <p class="dek">거래소를 실제로 운영한다면 가장 먼저 겪게 될 두 장면을 골랐습니다.</p>

  <div class="qs">
    <section class="q">
      <div class="no"><b>01</b>트래픽 급증</div>
      <h2><em>주문이 한꺼번에 몰려도</em><br>서버는 버텨야 한다</h2>
      <svg class="scene" id="s1" viewBox="0 0 790 270" role="img" aria-label="사용자 요청이 로드밸런서를 거쳐 거래 서버 두 대로 몰리고, 서버 CPU 사용량이 한계에 닿아 응답이 늦어지는 장면">
        <path class="wire" d="M84 60 L282 135 M84 135 H282 M84 210 L282 135"/>
        <path class="wire" d="M382 135 L470 75 M382 135 L470 195"/>
        <g id="s1-dots"></g>
        <g>
          <image href="assets/tint/ui-users-side.svg" x="36" y="36" width="46" height="46"/>
          <image href="assets/tint/ui-users-side.svg" x="36" y="111" width="46" height="46"/>
          <image href="assets/tint/ui-users-side.svg" x="36" y="186" width="46" height="46"/>
          <text class="sm" x="59" y="262" text-anchor="middle">사용자</text>
        </g>
        <rect class="box" x="282" y="103" width="100" height="64" rx="10"/>
        <image href="assets/tint/ui-arrows-split-glow.svg" x="314" y="117" width="36" height="36"/>
        <text class="sm" x="332" y="197" text-anchor="middle">로드밸런서</text>
        <rect class="box" id="s1-b1" x="470" y="45" width="190" height="60" rx="10"/>
        <image href="assets/tint/ui-server-glow.svg" x="492" y="59" width="32" height="32"/>
        <text class="lb" x="536" y="82">거래 서버 1</text>
        <rect class="box" id="s1-b2" x="470" y="165" width="190" height="60" rx="10"/>
        <image href="assets/tint/ui-server-glow.svg" x="492" y="179" width="32" height="32"/>
        <text class="lb" x="536" y="202">거래 서버 2</text>
        <text class="sm" x="690" y="46">CPU</text>
        <rect class="gbg" x="690" y="66" width="92" height="12" rx="6"/>
        <rect class="gfill" id="s1-g1" x="690" y="66" width="0" height="12" rx="6"/>
        <rect class="gbg" x="690" y="186" width="92" height="12" rx="6"/>
        <rect class="gfill" id="s1-g2" x="690" y="186" width="0" height="12" rx="6"/>
        <text class="flag" id="s1-late" x="736" y="140" text-anchor="middle" style="fill:var(--bad)">응답 지연</text>
      </svg>
      <p class="chk"><span>확인할 것</span>어디서 먼저 막히는지, 언제 서버를 늘려야 하는지</p>
    </section>

    <section class="q">
      <div class="no"><b>02</b>DB 장애</div>
      <h2><em>DB가 갑자기 멈춰도</em><br>받은 주문은 지켜야 한다</h2>
      <svg class="scene" id="s2" viewBox="0 0 790 270" role="img" aria-label="주문이 거래 서버를 거쳐 주 DB에 기록되다가 주 DB가 멈추자 주문이 거래 서버 앞에 쌓여 기다리는 장면">
        <path class="wire" d="M84 135 H230 M420 135 H540"/>
        <g id="s2-dots"></g>
        <image href="assets/tint/ui-users-side.svg" x="36" y="111" width="46" height="46"/>
        <text class="sm" x="59" y="188" text-anchor="middle">사용자</text>
        <rect class="box" x="230" y="105" width="190" height="60" rx="10"/>
        <image href="assets/tint/ui-server-glow.svg" x="261" y="119" width="32" height="32"/>
        <text class="lb" x="305" y="142">거래 서버</text>
        <rect class="box" id="s2-db" x="540" y="105" width="190" height="60" rx="10"/>
        <image href="assets/tint/ui-database-glow.svg" x="586" y="119" width="32" height="32"/>
        <text class="lb" x="630" y="142">주 DB</text>
        <path class="x" id="s2-x" d="M700 116 L720 136 M720 116 L700 136"/>
        <text class="flag" id="s2-wait" x="474" y="72" text-anchor="middle" style="fill:var(--warm)">주문 대기</text>
        <text class="flag" id="s2-q" x="635" y="204" text-anchor="middle" style="fill:var(--bad)">받은 주문은 무사할까?</text>
      </svg>
      <p class="chk"><span>확인할 것</span>받은 주문이 남는지, 사람 없이 넘어가는지</p>
    </section>
  </div>

  <div class="foot"><span class="k">AI의 역할</span>흩어진 경보와 지표를 모아 원인을 짚고, 다음에 할 일을 제안합니다.</div>
</div>

<!-- 발표 노트(45초): 장이 열리면 첫 장면만 움직이고 둘째 장면은 흐리다. → 두 번으로 둘째 장면, AI 역할 줄 순서로 보이고, 세 번째 → 에 다음 장(시스템 구성)으로 간다. ← 로 한 단계씩 되돌린다. 말할 거리: (첫 장면) "거래소를 실제로 운영한다면 가장 먼저 겪을 장면은 주문이 한꺼번에 몰릴 때입니다. 서버가 버텨야 하는데, 어디서 먼저 막히는지, 언제 서버를 늘려야 하는지를 확인하고 싶었습니다." → (둘째 장면) "두 번째는 DB가 갑자기 멈출 때입니다. 이미 받은 주문이 남아 있는지, 사람이 손대지 않아도 예비 DB로 넘어가는지가 핵심입니다." → (AI 줄) "그리고 이런 순간마다 AI가 경보와 지표를 모아 원인과 다음 할 일을 먼저 제안하게 했습니다. 실행은 제가 승인합니다." 이 장에는 결과를 두지 않는다. 답은 뒤의 설계 장, 수치는 06 결과 장. 학교 제출 요약서의 기획 배경(DB 장애: 요청은 언제 회복되는가 / 트래픽 급증: 병목은 어디에서 시작되는가)과 같은 질문이다. -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 꺾인 선 위의 위치
  const along = (pts, d) => {
    for (let i = 1; i < pts.length; i++) {
      const [x1, y1] = pts[i - 1], [x2, y2] = pts[i], L = Math.hypot(x2 - x1, y2 - y1);
      if (d <= L) return [x1 + (x2 - x1) * d / L, y1 + (y2 - y1) * d / L];
      d -= L;
    }
    return pts[pts.length - 1];
  };
  const lenOf = pts => pts.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);
  const dot = (layer, cls = 'dot', r = 5) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', r); c.setAttribute('class', cls); layer.appendChild(c); return c; };

  // 장면 1: 요청이 점점 몰리고, 두 서버의 사용량 막대가 차오르다 응답 지연이 뜬다. 10초마다 되풀이
  // frozen 이면(둘째 장면으로 넘어간 뒤) 새 요청을 멈추고 막힌 순간(막대 가득·응답 지연)에 머문다
  const s1 = { layer: $('s1-dots'), parts: [], t0: 0, last: 0, n: 0, load: [0, 0], frozen: false };
  const S1_SRC = [[84, 60], [84, 135], [84, 210]];
  const S1_DST = [[[470, 75], [530, 75]], [[470, 195], [530, 195]]];
  const gColor = v => v > .82 ? 'var(--bad)' : v > .6 ? 'var(--warm)' : 'var(--ok)';
  function step1(now) {
    const t = (now - s1.t0) / 1000;
    if (!s1.frozen && t > 10) {  // 되풀이: 남은 점은 앞서 흐려 두었다가 치운다
      s1.parts.forEach(p => p.el.remove()); s1.parts = []; s1.t0 = now; s1.last = now; s1.load = [0, 0];
      s1.layer.style.opacity = 1;
      $('s1-late').classList.remove('on'); $('s1-b1').classList.remove('hot'); $('s1-b2').classList.remove('hot');
    }
    else if (!s1.frozen && t > 9.4) s1.layer.style.opacity = 0;
    const tt = Math.min(t, 6.5);
    const gap = Math.max(55, 520 - tt * 75);          // 보내는 간격이 점점 짧아진다
    if (!s1.frozen && t < 7.5 && now - s1.last > gap) {
      s1.last = now; s1.n++;
      const k = s1.n % 2, src = S1_SRC[s1.n % 3];
      const pts = [src, [282, 135], [382, 135], ...S1_DST[k]];
      s1.parts.push({ el: dot(s1.layer), pts, L: lenOf(pts), b: now, k });
    }
    s1.parts = s1.parts.filter(p => {
      const d = (now - p.b) * 0.42;
      if (d >= p.L) { p.el.remove(); return false; }
      const [x, y] = along(p.pts, d); p.el.setAttribute('cx', x); p.el.setAttribute('cy', y); return true;
    });
    // 사용량은 서버 한 대에 들어오는 요청 속도를 처리 한계(초당 5건으로 둔 그림용 값)로 나눈 값을 천천히 따라간다
    const per = t < 7.5 ? 1000 / gap / 2 : 0;
    for (let k = 0; k < 2; k++) {
      const target = s1.frozen ? (k ? .93 : .97) : Math.min(1, per / 5 * (k ? .96 : 1));
      s1.load[k] += (target - s1.load[k]) * 0.05;
      const v = s1.load[k];
      const g = $('s1-g' + (k + 1)); g.setAttribute('width', (92 * v).toFixed(1)); g.style.fill = gColor(v);
      $('s1-b' + (k + 1)).classList.toggle('hot', v > .82);
    }
    $('s1-late').classList.toggle('on', Math.max(...s1.load) > .82);
  }

  // 장면 2: 주문이 주 DB로 들어가다 DB가 멈추면 거래 서버 앞에 쌓인다. 10초마다 되풀이
  const s2 = { layer: $('s2-dots'), parts: [], stack: [], t0: 0, last: 0, down: false };
  const S2_PATH = [[84, 135], [230, 135], [420, 135], [540, 135]];
  function reset2(now) {
    s2.parts.forEach(p => p.el.remove()); s2.stack.forEach(el => el.remove());
    s2.parts = []; s2.stack = []; s2.t0 = now; s2.last = now; s2.down = false;
    s2.layer.style.opacity = 1;
    $('s2-db').classList.remove('hot'); $('s2-x').classList.remove('on');
    $('s2-q').classList.remove('on'); $('s2-wait').classList.remove('on');
  }
  function step2(now) {
    const t = (now - s2.t0) / 1000;
    if (t > 10) { reset2(now); return; }
    if (t > 9.4) s2.layer.style.opacity = 0;
    if (!s2.down && t > 3.2) {  // 주 DB 멈춤
      s2.down = true; $('s2-db').classList.add('hot'); $('s2-x').classList.add('on');
      s2.parts.forEach(p => { if (p.d > 190 + 146) { p.el.setAttribute('class', 'dot lost'); p.dead = now; } });
    }
    if (s2.down && t > 4.6) $('s2-q').classList.add('on');
    if (t < 8.6 && now - s2.last > 330) {
      s2.last = now;
      s2.parts.push({ el: dot(s2.layer), d: 0, b: now });
    }
    s2.parts = s2.parts.filter(p => {
      if (p.dead) { const a = 1 - (now - p.dead) / 700; if (a <= 0) { p.el.remove(); return false; } p.el.style.opacity = a; return true; }
      p.d = (now - p.b) * 0.3;
      const stopAt = 190 + 146 + 4;   // 거래 서버 오른쪽 끝
      if (s2.down && p.d >= stopAt - 1) {
        // 멈춘 주문은 거래 서버 위로 한 줄씩 쌓인다
        const i = s2.stack.length, el = p.el; el.setAttribute('class', 'dot stuck'); $('s2-wait').classList.add('on');
        el.setAttribute('cx', 446 + (i % 5) * 14); el.setAttribute('cy', 118 - Math.floor(i / 5) * 14);
        if (i < 15) s2.stack.push(el); else el.remove();
        return false;
      }
      if (p.d >= lenOf(S2_PATH)) { p.el.remove(); return false; }
      const [x, y] = along(S2_PATH, p.d); p.el.setAttribute('cx', x); p.el.setAttribute('cy', y); return true;
    });
  }

  // 단계: 0 첫 장면, 1 둘째 장면, 2 AI 역할 줄. → 는 다음 단계, 마지막 단계면 다음 장. ← 는 한 단계 뒤로
  const LAST = 2;
  let step = 0, pending2 = false;
  function setStep(n) {
    step = n; stage.dataset.step = n;
    s1.frozen = n >= 1;
    if (s1.frozen) s1.layer.style.opacity = 0;
    if (n === 0) {  // 첫 장면을 처음부터, 둘째 장면은 멈춘 채 비운다
      s1.parts.forEach(p => p.el.remove()); s1.parts = []; s1.layer.style.opacity = 1; s1.t0 = 0;
      reset2(performance.now());
    }
    else if (!s2.on) pending2 = true;                          // 둘째 장면은 넘어온 순간부터 재생
    s2.on = n >= 1;
  }

  if (reduce) {
    // 움직임을 줄인 환경: 문제 장면의 마지막 상태와 AI 줄까지 한 번에 보인다
    ['s1-late', 's2-q', 's2-wait', 's2-x'].forEach(id => $(id).classList.add('on'));
    $('s1-g1').setAttribute('width', 88); $('s1-g1').style.fill = 'var(--bad)';
    $('s1-g2').setAttribute('width', 84); $('s1-g2').style.fill = 'var(--bad)';
    $('s1-b1').classList.add('hot'); $('s1-b2').classList.add('hot'); $('s2-db').classList.add('hot');
    stage.dataset.step = LAST;
    window.deckStep = () => false;
    return;
  }
  const loop = now => {
    if (!s1.t0) { s1.t0 = now; s1.last = now; if (!s2.t0) reset2(now); }
    if (pending2) { pending2 = false; reset2(now); }
    step1(now);
    if (s2.on) step2(now);
    requestAnimationFrame(loop);
  };
  // 뒤 장에서 돌아오면(#last) 마지막 단계로 연다
  setStep(location.hash === '#last' ? LAST : 0);
  requestAnimationFrame(loop);
  window.deckStep = d => {
    if (d > 0 && step < LAST) { setStep(step + 1); return true; }
    if (d < 0 && step > 0) { setStep(step - 1); return true; }
    return false;
  };
  // 이 장만 따로 열었을 때도 → ← 로 단계를 넘긴다(덱 안에서는 덱이 deckStep 을 부른다)
  if (window.parent === window) addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });
})();
</script>
