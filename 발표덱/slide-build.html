<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04 구축 순서</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --ai: #C6C0F2;
    --warm: #E8C07A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }
  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  h1 { position: absolute; left: 130px; top: 164px; margin: 0; font-size: 60px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em; animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both; }
  .dek { position: absolute; left: 130px; top: 250px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .8s .3s ease-out both; }

  /* 네 단계 파이프라인: 단계마다 독립 카드, 카드 사이만 짧은 화살표로 잇는다.
     번호·제목·환경·두 줄이 한 기준선에 서고, 결과 줄의 체크만 왼쪽 여백에 걸친다. 끝나면 네 장이 같은 완료 상태다 */
  .pipe { position: absolute; left: 130px; right: 130px; top: 428px; display: flex; align-items: stretch; }
  .card {
    position: relative; flex: 0 0 365px; box-sizing: border-box;
    padding: 56px 40px 48px 50px; border-radius: 18px;
    background: #2A3448; border: 2px solid #6E7B93;
    display: flex; flex-direction: column;
    animation: rise .5s cubic-bezier(.2,.7,.2,1) both;
    filter: opacity(.55); transition: filter .35s;
  }
  .card:nth-of-type(1) { animation-delay: .4s; } .card:nth-of-type(2) { animation-delay: .46s; }
  .card:nth-of-type(3) { animation-delay: .52s; } .card:nth-of-type(4) { animation-delay: .58s; }
  .card .no { font-size: 22px; font-weight: 600; line-height: 24px; color: var(--ink-3); }
  .card h2 { margin: 10px 0 0; font-size: 44px; font-weight: 600; letter-spacing: -.01em; }
  .card .env2 { margin-top: 18px; margin-bottom: 48px; }
  .card .env { border-color: #5A6780; }
  .card .desc { position: relative; margin: auto 0 0; padding: 28px 0 0; border-top: 1px solid #5E6A81; font-size: 26px; line-height: 1.45; font-weight: 500; color: #AFB9C7; word-break: keep-all; white-space: nowrap; }
  /* 결과 줄: 이 단계에서 시험해 확인한 것. 켜지기 전에는 구성 줄보다 어둡게 기다리고, 최종 화면에서 초록은 이 줄과 그 앞 체크에만 쓴다 */
  .card .desc .mid { font-style: normal; margin: 0 .07em; }
  .card .desc span { display: block; position: relative; margin-top: 12px; font-weight: 700; color: #6F7B8E; transition: color .25s .3s; }
  .card .desc .tick { position: absolute; left: -38px; top: 50%; width: 26px; height: 26px; margin-top: -13px; fill: none; stroke: var(--ink-4); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke .35s; }

  .card.on { filter: none; }
  .card.on .desc span { color: var(--ok); }
  .card .desc .tick path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .25s .3s ease-out; }
  .card.on .desc .tick { stroke: var(--ok); }
  .card.on .desc .tick path { stroke-dashoffset: 0; }
  /* 켜지는 순간에만 테두리가 초록으로 번쩍였다가 원래 색으로 돌아간다 */
  .card::after { content: ''; position: absolute; inset: -2px; border: 2px solid var(--ok); border-radius: 18px; opacity: 0; transition: opacity .45s ease-out; pointer-events: none; }
  .card.lit::after { opacity: 1; transition: opacity .12s; }

  /* 카드 사이 화살표: 흐린 선으로 깔려 있다가 다음 단계로 넘어갈 때 밝게 차오른다. 머리는 체크와 같은 둥근 끝 선 */
  .cn { position: relative; flex: 1; align-self: center; height: 26px; animation: fade .4s .6s ease-out both; }
  .cn::before { content: ''; position: absolute; left: 10px; right: 12px; top: 11px; border-top: 4px solid #4E5A6F; }
  .cn .fill { position: absolute; left: 10px; right: 12px; top: 11px; height: 4px; border-radius: 2px; background: #BAC4D1; transform: scaleX(0); transform-origin: left; transition: transform .35s cubic-bezier(.45,.1,.25,1); }
  .cn .hd { position: absolute; right: 8px; top: 0; width: 18px; height: 26px; fill: none; stroke: #4E5A6F; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s .25s; }
  .cn.run .fill { transform: scaleX(1); }
  .cn.run .hd { stroke: #BAC4D1; }

  /* 끝 장면으로 바로 갈 때(→, #last, 움직임 줄이기)는 전이를 끊는다 */
  .stage.instant *, .stage.instant *::after { transition: none !important; animation: none !important; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">주요 설계 및 구현</span>04</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <h1>구현 과정</h1>
  <p class="dek">로컬에서 먼저 검증하고, 단계마다 시험으로 확인하며 범위를 넓혔습니다.</p>

  <div class="pipe">
    <section class="card" id="c1">
      <div class="no">1단계</div>
      <h2>로컬 검증</h2>
      <div class="env2"><span class="env"><img src="assets/tint/docker-side.svg" alt="">로컬 Docker</span></div>
      <p class="desc">거래 서버 이중화<span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>장애 시 자동 전환 확인</span></p>
    </section>
    <div class="cn" aria-hidden="true"><i class="fill"></i><svg class="hd" viewBox="0 0 18 26"><path d="M5 4l9 9l-9 9"/></svg></div>
    <section class="card" id="c2">
      <div class="no">2단계</div>
      <h2>망 설계</h2>
      <div class="env2"><span class="env"><img src="assets/tint/cisco-side.svg" alt="">Packet Tracer</span></div>
      <p class="desc">DMZ<i class="mid">·</i>내부<i class="mid">·</i>관리망 분리<span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>허용한 통신만 통과 확인</span></p>
    </section>
    <div class="cn" aria-hidden="true"><i class="fill"></i><svg class="hd" viewBox="0 0 18 26"><path d="M5 4l9 9l-9 9"/></svg></div>
    <section class="card" id="c3">
      <div class="no">3단계</div>
      <h2>서버 구축</h2>
      <div class="env2"><span class="env"><img src="assets/tint/ui-server-2-side.svg" alt="">VM 실습망</span></div>
      <p class="desc">서버별 방화벽<i class="mid">·</i>DB 백업<span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>접속 차단<i class="mid">·</i>백업 복원 확인</span></p>
    </section>
    <div class="cn" aria-hidden="true"><i class="fill"></i><svg class="hd" viewBox="0 0 18 26"><path d="M5 4l9 9l-9 9"/></svg></div>
    <section class="card" id="c4">
      <div class="no">4단계</div>
      <h2>클라우드 배포</h2>
      <div class="env2"><span class="env"><img src="assets/tint/amazonwebservices-side.svg" alt="">AWS</span></div>
      <p class="desc">자동 증설<i class="mid">·</i>DB 이중화<span><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>부하 대응<i class="mid">·</i>DB 전환 확인</span></p>
    </section>
  </div>

</div>

<!-- 발표 노트(12초): 이 설계를 Docker 시험, Packet Tracer 망 설계, VM 실습, AWS 배포의 네 단계로 구축했습니다.
장마다 오른쪽 위에 어디서 잰 값인지 표시했습니다. -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  // 부제가 먼저 뜨고(0.3초), 카드 넷이 흐린 채 올라온다(0.4~1.1초). 1.35초에 1단계가 켜지고 0.9초 간격으로
  // 화살표가 차오르며 다음 카드가 켜진다. 켜질 때 테두리가 잠깐 초록으로 번쩍인 뒤(0.45초) 원래 색으로 돌아가고,
  // 한 박자(0.3초) 늦게 결과 줄이 초록이 되며 체크가 그려지고, 체크가 끝난 뒤 다음 화살표가 차오른다. 4.05초에 4단계가 켜지며 끝난다.
  // → 는 재생 중이면 끝 장면으로, 끝났으면 다음 장. #last 로 열리거나 움직임 줄이기면 끝 장면으로 연다
  const $ = id => document.getElementById(id);
  const cards = [1, 2, 3, 4].map(n => $('c' + n)), cns = [...document.querySelectorAll('.cn')];
  const timers = [];
  let done = false;
  const at = (sec, fn) => timers.push(setTimeout(fn, sec * 1000));
  const light = c => { c.classList.add('on', 'lit'); at(.45, () => c.classList.remove('lit')); };
  function finish() {
    timers.forEach(clearTimeout); done = true;
    stage.classList.add('instant');
    cards.forEach(c => { c.classList.add('on'); c.classList.remove('lit'); });
    cns.forEach(c => c.classList.add('run'));
  }
  function play() {
    at(1.35, () => light(cards[0]));
    cns.forEach((cn, i) => {
      const t = 1.35 + i * .9;
      at(t + .55, () => cn.classList.add('run'));
      at(t + .9, () => light(cards[i + 1]));
    });
    at(4.65, () => { done = true; });
  }
  if (location.hash === '#last' || matchMedia('(prefers-reduced-motion: reduce)').matches) finish(); else play();
  window.deckStep = d => { if (d > 0 && !done) { finish(); return true; } return false; };
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });
})();
</script>
