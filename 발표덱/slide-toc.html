<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 목차</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); }

  h1 {
    position: absolute; left: 130px; top: 164px; margin: 0;
    font-size: 60px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em;
    animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both;
  }

  /* 목차: 번호 · 장 이름 · 그 장의 제목 문장 · 성격. 02의 하위 장은 들여 쓰고 세로선으로 묶는다. */
  .toc { position: absolute; left: 130px; right: 130px; top: 270px; margin: 0; padding: 0; list-style: none; }
  .toc li { border-top: 1px solid var(--line); animation: fade .6s ease-out both; }
  .toc li:last-child { border-bottom: 1px solid var(--line); }
  .toc button {
    width: 100%; display: grid; grid-template-columns: 150px 470px 1fr; align-items: baseline;
    padding: 15px 0; background: transparent; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
    transition: background .2s;
  }
  .toc button:hover { background: rgba(121,167,250,.045); }
  .toc button.soon { cursor: default; } .toc button.soon:hover { background: transparent; } .toc button.soon:hover .nm { color: var(--ink); } .toc button.soon:hover .no { color: var(--ink-3); }
  .toc button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .no { font-family: var(--mono); font-size: 40px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-left: 4px; }
  .nm { font-size: 38px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  .ln { font-size: 26px; color: var(--ink-3); word-break: keep-all; }
  .tg { justify-self: end; padding-right: 8px; font-size: 19px; color: var(--side); white-space: nowrap; }
  .tg b { font-weight: 500; color: var(--ok); }
  .toc button:hover .nm { color: var(--glow); }
  .toc button:hover .no { color: var(--brand); }

  .toc li.sub button { padding: 14px 0; }
  .toc li.sub .no { font-size: 26px; padding-left: 40px; position: relative; color: var(--ink-4); }
  .toc li.sub .no::before { content: ''; position: absolute; left: 14px; top: -14px; bottom: -14px; border-left: 1.5px solid var(--card); }
  .toc li.sub.last .no::before { bottom: 50%; }
  .toc li.sub .no::after { content: ''; position: absolute; left: 14px; top: 50%; width: 16px; border-top: 1.5px solid var(--card); }
  .toc li.sub .nm { font-size: 30px; font-weight: 500; color: var(--ink-2); padding-left: 40px; }
  .toc li.sub .ln { font-size: 24px; }
  .toc li.sub { border-top-color: rgba(46,56,72,.55); }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">목차</span></div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <h1>목차</h1>

  <!-- data-go 는 index.html 의 SLIDES 순서 번호다. 장을 넣거나 빼면 함께 고친다. -->
  <ol class="toc" id="toc">
    <li><button type="button" data-go="2"><span class="no">01</span><span class="nm">기획 배경</span><span class="ln">고가용성을 보여 주려고 고른 거래소, 몰려도 멈춰도 이어지는 구조</span></button></li>
    <li><button type="button" data-go="3"><span class="no">02</span><span class="nm">기획 시나리오</span><span class="ln">주문이 몰릴 때, DB가 멈출 때 두 장면</span></button></li>
    <li><button type="button" data-go="4"><span class="no">03</span><span class="nm">설계 방향</span><span class="ln">두 장면에 대한 답과 계획한 아키텍처</span></button></li>
    <li><button type="button" data-go="5"><span class="no">04</span><span class="nm">주요 설계 및 구현</span><span class="ln">Docker에서 AWS까지 네 단계, Linux 운영, AI 관제</span></button></li>
    <li><button type="button" data-go="13"><span class="no">05</span><span class="nm">테스트 및 검증</span><span class="ln">어디서, 어떻게 부수고 쟀나</span></button></li>
    <li><button type="button" data-go="14"><span class="no">06</span><span class="nm">결과</span><span class="ln">트래픽이 몰렸을 때 · DB가 멈췄을 때 · 요구사항별 달성</span></button></li>
    <li><button type="button" data-go="17"><span class="no">07</span><span class="nm">시연</span><span class="ln">7분 영상 · 부하 증설부터 DB 자동 전환, AI 상담까지</span></button></li>
    <li class="sub last"><button type="button" data-go="18"><span class="no">&nbsp;</span><span class="nm">보고 전달</span><span class="ln">경보가 Teams 카드와 2쪽 보고서로</span></button></li>
    <li><button type="button" data-go="19"><span class="no">08</span><span class="nm">트러블슈팅</span><span class="ln">시연에서 본 관제 화면이 멈춘 원인을 서버 기록으로 좁혀 해결</span></button></li>
  </ol>
</div>

<!-- 발표 노트(15초): 끝에 "먼저, 이 프로젝트를 기획하게 된 배경과 설계 방향이 결정된 과정을 짧게 보여드리겠습니다."라고 말하고 → (다음 장 말풍선이 저절로 나온다). 왜 했는지(기획 배경과 기획 시나리오 두 장면)를 먼저, 그다음 구성과 구현, 검증, 결과, 마지막에 7분 시연 영상과 Teams·PDF 보고 전달. 04의 네트워크·AWS 장은 눌러 보는 흐름 시연, 06은 측정값 재생. -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });
  // 항목을 누르면 덱(index.html)에서 그 장으로 간다. 이 장만 따로 열었을 때는 아무 일도 하지 않는다.
  const rows = [...document.querySelectorAll('#toc li')];
  rows.forEach((li, k) => { li.style.animationDelay = (0.25 + k * 0.06) + 's'; });
  document.getElementById('toc').addEventListener('click', e => {
    const b = e.target.closest('button[data-go]');
    if (!b) return;
    try { if (parent !== window && typeof parent.goTo === 'function') parent.goTo(+b.dataset.go); } catch (err) {}
  });
})();
</script>
