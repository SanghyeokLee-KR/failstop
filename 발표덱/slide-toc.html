<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 목차</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); }

  h1 {
    position: absolute; left: 130px; top: 164px; margin: 0;
    font-size: 60px; font-weight: 600; line-height: 1.2; letter-spacing: -.02em;
    animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both;
  }

  /* 목차: 번호 · 장 이름 · 그 장의 제목 문장 · 성격. 하위 장이 생기면 li.sub 로 들여 쓰고 연결선으로 묶는다(지금은 없음, 2026-10-05 사용자 결정으로 보고 전달 줄을 뺐다). */
  .toc { position: absolute; left: 130px; right: 130px; top: 270px; margin: 0; padding: 0; list-style: none; }
  .toc li { border-top: 1px solid var(--line); animation: fade .6s ease-out both; }
  .toc li:last-child { border-bottom: 1px solid var(--line); }
  .toc button {
    width: 100%; display: grid; grid-template-columns: 150px 470px 1fr; align-items: baseline;
    padding: 21px 0; background: transparent; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
    transition: background .2s;
  }
  /* 마우스 강조는 목록 위에서 포인터가 한 번 움직인 뒤부터(장이 열릴 때 포인터가 우연히 걸쳐 있어도 한 줄만 밝게 열리지 않게) */
  .toc.ptr button:hover { background: rgba(121,167,250,.045); }
  .toc button.soon { cursor: default; } .toc button.soon:hover { background: transparent; } .toc button.soon:hover .nm { color: var(--ink); } .toc button.soon:hover .no { color: var(--ink-3); }
  .toc button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .no { font-family: var(--mono); font-size: 40px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-left: 4px; }
  .nm { font-size: 38px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  .ln { font-size: 26px; color: var(--ink-3); word-break: keep-all; }
  .tg { justify-self: end; padding-right: 8px; font-size: 19px; color: var(--side); white-space: nowrap; }
  .tg b { font-weight: 500; color: var(--ok); }
  .toc.ptr button:hover .nm { color: var(--glow); }
  .toc.ptr button:hover .no { color: var(--brand); }

  .toc li.sub button { padding: 18px 0; }
  .toc li.sub .no { font-size: 26px; padding-left: 40px; color: var(--ink-4); }
  /* 하위 줄 연결선(ㄴ자)은 이름 칸 안에: 세로선이 위 줄 이름('시연') 시작 바로 아래(x292)에서 내려와 가로선이 '보고 전달' 앞(x310)까지 닿는다 */
  .toc li.sub .nm { position: relative; font-size: 30px; font-weight: 500; color: var(--ink-2); padding-left: 40px; }
  .toc li.sub .nm::before { content: ''; position: absolute; left: 12px; top: -18px; bottom: 50%; border-left: 1.5px solid var(--card); }
  .toc li.sub .nm::after { content: ''; position: absolute; left: 12px; top: 50%; width: 18px; border-top: 1.5px solid var(--card); }
  .toc li.sub .ln { font-size: 24px; }
  .toc li.sub { border-top-color: rgba(46,56,72,.55); }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  /* 뒤 장에서 ← 로 돌아올 때(#last)는 열림 움직임 없이 끝 모습 */
  .stage.done *, .stage.done *::before, .stage.done *::after { animation: none !important; }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">목차</span></div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <h1>목차</h1>

  <!-- data-go 는 index.html 의 SLIDES 순서 번호다. 장을 넣거나 빼면 함께 고친다. -->
  <ol class="toc" id="toc">
    <li><button type="button" data-go="2"><span class="no">01</span><span class="nm">기획 배경</span><span class="ln">고가용성을 보여 주려고 거래소를 고른 이유</span></button></li>
    <li><button type="button" data-go="3"><span class="no">02</span><span class="nm">기획 시나리오</span><span class="ln">요청이 몰릴 때와 DB가 멈출 때의 두 장면</span></button></li>
    <li><button type="button" data-go="4"><span class="no">03</span><span class="nm">설계 방향</span><span class="ln">두 장면에 답하도록 그린 전체 구조</span></button></li>
    <li><button type="button" data-go="5"><span class="no">04</span><span class="nm">주요 설계 및 구현</span><span class="ln">Docker부터 VM·Linux·AWS를 거쳐 AI 관제까지</span></button></li>
    <li><button type="button" data-go="15"><span class="no">05</span><span class="nm">시연</span><span class="ln">부하 증설과 DB 자동 전환을 담은 7분 영상</span></button></li>
    <li><button type="button" data-go="17"><span class="no">06</span><span class="nm">마무리</span><span class="ln">시험으로 확인한 결과와 앞으로의 다짐</span></button></li>
  </ol>
</div>


<!-- 발표 노트(10초): 발표는 이 순서로 진행하겠습니다.
기획 배경과 두 장면, 설계와 구축 과정을 말씀드린 뒤, 7분 시연 영상을 보여 드리고 마무리하겠습니다. -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) {}
  };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });
  // 항목을 누르면 덱(index.html)에서 그 장으로 간다. 이 장만 따로 열었을 때는 아무 일도 하지 않는다.
  if (location.hash === '#last') stage.classList.add('done');
  const toc = document.getElementById('toc');
  toc.addEventListener('pointermove', () => toc.classList.add('ptr'), { once: true });
  const rows = [...document.querySelectorAll('#toc li')];
  rows.forEach((li, k) => { li.style.animationDelay = (0.25 + k * 0.06) + 's'; });
  document.getElementById('toc').addEventListener('click', e => {
    const b = e.target.closest('button[data-go]');
    if (!b) return;
    try { if (parent !== window && typeof parent.goTo === 'function') parent.goTo(+b.dataset.go); } catch (err) {}
  });
})();
</script>
