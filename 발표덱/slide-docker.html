<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-1 Docker</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ai: #C6C0F2;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
    /* 위 색을 섞어 만든 면과 선 */
    --box: color-mix(in srgb, var(--card) 24%, var(--stage));
    --wire: color-mix(in srgb, var(--card) 80%, var(--glow));
    --pc: color-mix(in srgb, var(--card) 7%, var(--stage));
    --obs: color-mix(in srgb, var(--ai) 75%, var(--stage));
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; transform: translate(-50%, -50%) scale(.5); background: var(--stage); overflow: hidden; }
  .head { position: absolute; left: 130px; right: 130px; top: 64px; height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both; }
  .title .tag { margin-left: auto; }
  .tag img { width: 26px; height: 26px; }
  .title .env { margin-left: 14px; }
  .dek { position: absolute; left: 130px; top: 236px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .8s .3s ease-out both; }
  .tag { display: inline-flex; align-items: center; gap: 10px; font-family: var(--sans); font-size: 22px; color: var(--ink-3); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  .tag:hover { border-color: var(--card); color: var(--ink-2); }
  .tag .mx { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* 원본 구성도 보기(E 키 도구) */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); }
  .fig::backdrop { background: color-mix(in srgb, var(--ground) 90%, transparent); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .25s ease-out; }
  .fig .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 24px; font-size: 22px; color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); font-size: 22px; }
  .fig .bar .x { margin-left: auto; font-family: var(--sans); font-size: 22px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; }
  .fig .view { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 24px 24px; }
  .fig img { max-width: calc(100vw - 48px); max-height: calc(100vh - 80px); border-radius: 6px; background: var(--ink); cursor: zoom-in; }
  .fig.zoom .view { place-items: start; }
  .fig.zoom img { max-width: none; max-height: none; width: 260%; cursor: zoom-out; }

  /* 도면: PC 한 대 테두리 안에 위는 서비스 흐름, 아래는 관측과 알림.
     단계 0 서비스 흐름 → 단계 1 거래 경로에 장애 주입(Toxiproxy)을 끼움 → 단계 2 관측과 알림
     → 단계 3 AI 관제센터의 경보와 제안 → 단계 4 운영자 승인과 조회 서버 켜짐.
     .atN 은 'N 단계 이상'이라는 뜻이다(스크립트가 단다). 한 번 나온 것은 뒤 단계에서도 남는다 */
  .dia { position: absolute; left: 90px; top: 318px; width: 1660px; height: 680px; overflow: visible; }
  .dia text { font-family: var(--sans); }
  /* PC 한 대 테두리. 처음에는 위 두 줄만 감싸고, 관측 줄이 들어오는 단계 2에서 아래로 자라
     PC 한 대가 점점 채워지는 장면이 된다. CSS 높이를 모르는 브라우저는 속성값(전체 높이)을 쓴다 */
  .dia .pc { fill: var(--pc); stroke: var(--line); stroke-width: 1.6; height: 288px; transition: height .7s cubic-bezier(.2,.7,.2,1); }
  .stage.at2 .dia .pc { height: 592px; }
  .dia .frame { animation: fade .8s .1s ease-out both; }
  .dia .pcl { font-size: 22px; font-weight: 600; fill: var(--ink-2); }
  .dia .sec { font-size: 24px; font-weight: 600; fill: var(--ink-2); }
  .dia .lane { font-size: 22px; fill: var(--ink-2); }
  .dia .tap { fill: var(--ai); stroke: var(--stage); stroke-width: 2; }
  .dia .s2 .lo .side { opacity: 0; transition: opacity .4s; }
  .stage.at2 .dia .s2 .lo .side { opacity: 1; transition-delay: 1s; }
  .dia .lane.hi { font-size: 24px; fill: var(--ink-2); }
  .dia .nm { font-size: 25px; font-weight: 600; fill: var(--ink); }
  /* 보조 글씨는 프로젝터에서도 읽히도록 한 단계 밝은 ink-2 를 쓴다 */
  .dia .sb { font-size: 22px; fill: var(--ink-2); }
  .dia .box { fill: var(--box); stroke: var(--card); stroke-width: 1.6; }
  .dia .box.back { opacity: .7; }
  .dia .box.test { stroke: var(--warm); stroke-dasharray: 8 6; transition: stroke .4s; }
  .dia .box.lg { stroke-width: 2; }
  .dia .box.hero { fill: color-mix(in srgb, var(--warm) 12%, var(--stage)); stroke: var(--warm); stroke-width: 2.2; }
  .dia .test-k { font-size: 22px; font-weight: 600; fill: var(--warm); }
  .dia .wire { fill: none; stroke: var(--wire); stroke-width: 2.4; marker-end: url(#ah); }
  .dia .wire.nm { marker-end: none; }
  .dia .ahp { fill: none; stroke: var(--wire); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dia .obs { fill: none; stroke: var(--obs); stroke-width: 1.6; marker-end: url(#ahd); }
  .dia .obs.nm { marker-end: none; }
  /* 묶음 선은 transition으로 그린다. animation으로 그리면 ← 로 돌아오거나 마지막 단계로 열 때 다시 그려졌다 */
  .dia .brk { stroke-dasharray: 1640; stroke-dashoffset: 1640; transition: stroke-dashoffset .8s .15s cubic-bezier(.4,0,.2,1); }
  .stage.at2 .dia .brk { stroke-dashoffset: 0; }
  .dia .s2 .lo { opacity: 0; transition: opacity .4s; }
  .stage.at2 .dia .s2 .lo { opacity: 1; transition-delay: .75s; }
  .dia .ahd { fill: none; stroke: var(--obs); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dia .sep { stroke: var(--line); stroke-width: 1; }
  .dia .nd { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .dia .wires { animation: fade .6s 1.3s ease-out both; }
  /* 단계 1부터는 → 로 나온다 */
  .dia .s1, .dia .s2 { opacity: 0; transform: translateY(-22px); transition: opacity .5s, transform .6s cubic-bezier(.2,.7,.2,1); }
  .dia .s2 { transform: translateY(14px); }
  .stage.at1 .dia .s1, .stage.at2 .dia .s2 { opacity: 1; transform: none; }
  /* 관측 단계부터는 장애 주입의 노란 면을 낮춰 시선이 관측 줄로 가게 한다 */
  .stage.at2 .dia .box.hero { fill: var(--box); stroke-width: 1.6; transition: fill .4s, stroke .4s; }
  .dia .test-k { transition: fill .4s; }
  .stage.at2 .dia .test-k { fill: var(--ink-3); }
  /* AI 단계부터는 시험 장치의 노란 점선도 낮춰 보라(AI)와 초록(승인)만 눈에 띄게 한다 */
  .stage.at3 .dia .box.test { stroke: color-mix(in srgb, var(--warm) 30%, var(--card)); }
  .stage[data-step="1"] .dia .s1 .box.hero { animation: pulse 1.1s 1.4s ease-in-out 2; transform-box: fill-box; transform-origin: center; }

  .dia .s1 .tx { opacity: 0; transition: opacity .45s; }
  .stage.at1 .dia .s1 .tx { opacity: 1; transition-delay: .8s; }
  .dia .k6n { transition: stroke .4s, fill .4s; }
  .stage[data-step="1"] .dia .k6n { stroke-width: 2.2; fill: color-mix(in srgb, var(--warm) 12%, var(--stage)); }

  /* 단계 3·4: AI 관제센터. 경보를 받은 AI가 같은 PC의 로컬 LLM으로 판단해 조치를 제안하고, 운영자가 승인한 뒤에야
     꺼져 있던 조회 서버가 켜져 합류한다(수동 모드). 2026-09-27 로컬 시연 스택에서 실제로 돈 흐름이다(앱 서버 3 켜기).
     도면을 한 바퀴 도는 고리로 그린다. 지표 → Alertmanager → AI 관제센터(오른쪽 아래) → 아래 길로 제안 → 운영자(왼쪽 아래)
     → 왼쪽 길로 승인 → 조회 서버. 단계 3은 경보와 AI 제안까지, 단계 4는 승인부터다. 발표자가 'AI는 여기까지'라고
     말할 틈을 두려고 나눴다. 색과 칩 모양은 03 설계 방향 장을 따른다 */
  .dia .alm { fill: none; stroke: var(--warm); stroke-width: 1.6; }
  .dia .alm-dot { fill: var(--warm); }
  .dia .box.ai { stroke: var(--ai); fill: color-mix(in srgb, var(--ai) 6%, var(--stage)); }
  .dia .nm.ai { fill: var(--ai); }
  .dia .ask { fill: none; stroke: var(--ai); stroke-width: 1.8; stroke-dasharray: 8 7; }
  .dia .aha { fill: none; stroke: var(--ai); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dia .ok-line { fill: none; stroke: var(--ok); stroke-width: 1.8; stroke-dasharray: 8 7; }
  .dia .aho { fill: none; stroke: var(--ok); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* 점선은 dash 값으로 그려 나갈 수 없어서, 흰 실선 마스크를 그려 나가며 점선을 드러낸다 */
  .dia .mk { fill: none; stroke: #fff; stroke-width: 20; stroke-linejoin: round; stroke-dasharray: 1 1; stroke-dashoffset: 1; }
  .dia .chipbox { fill: #1A2130; stroke-width: 1.6; }
  .dia .chip { font-size: 22px; }
  .dia .t-ai { font-family: var(--mono); font-weight: 600; fill: var(--ai); }
  .dia .t-ail { font-weight: 600; fill: var(--ai); }
  .dia .t-warm { font-weight: 600; fill: var(--warm); }
  .dia .t-ok { font-weight: 600; fill: var(--ok); }
  .dia .t-1 { font-weight: 500; fill: var(--ink); }
  .dia .ping { fill: none; stroke-width: 2; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .dia .s3 .n3, .dia .s3 .c { opacity: 0; transition: opacity .45s, transform .6s cubic-bezier(.2,.7,.2,1); }
  .dia .s3 .n3 { transform: translateY(14px); }
  .dia .s3 .c { transform: translateY(6px); }
  /* 단계 3: AI 관제센터와 운영자가 나오고, 경보 칩 → 제안 선(운영자까지) → AI 제안 칩 순서 */
  .stage.at3 .dia .s3 .n3, .stage.at3 .dia .s3 .c1, .stage.at3 .dia .s3 .c2 { opacity: 1; transform: none; }
  .stage.at3 .dia .s3 .n3 { transition-delay: .15s; }
  .stage.at3 .dia .s3 .c1 { transition-delay: 1s; }
  .stage.at3 .dia .mk-prop { stroke-dashoffset: 0; transition: stroke-dashoffset 1.4s 1.6s cubic-bezier(.4,0,.2,1); }
  .stage.at3 .dia .s3 .c2 { transition-delay: 2.1s; }
  /* 단계 4: 승인 칩 → 승인 선(조회 서버까지) → 조회 서버 켜짐. 테두리만 초록으로 바꾼다.
     도면의 조회 서버가 곧 시연에서 켠 노드라 카드를 더 겹치지 않는다 */
  .stage.at4 .dia .s3 .c3 { opacity: 1; transform: none; transition-delay: .2s; }
  .stage.at4 .dia .mk-appr { stroke-dashoffset: 0; transition: stroke-dashoffset 1.1s .4s cubic-bezier(.4,0,.2,1); }
  .dia .box.rd { transition: stroke .4s; }
  .stage.at4 .dia .box.rd { stroke: var(--ok); stroke-width: 2.2; transition-delay: 1.4s; }
  /* 핑은 그 단계에 → 로 들어올 때만 울린다. 다음 단계로 가면 규칙이 풀려 다시 울리지 않고,
     ← 로 돌아오거나 마지막 단계로 열면(quiet) 울리지 않는다 */
  .stage[data-step="3"] .dia .ping.p-ai { animation: ping 1s .8s cubic-bezier(.2,.7,.2,1); }
  .stage[data-step="3"] .dia .ping.p-op { animation: ping 1s 3s cubic-bezier(.2,.7,.2,1); }
  .stage[data-step="4"] .dia .ping.p-rd { animation: ping 1s 1.4s cubic-bezier(.2,.7,.2,1); }
  .stage.quiet .dia .ping { animation: none !important; }

  .stage.instant * { transition-duration: 0s !important; transition-delay: 0s !important; }

  .fs { position: absolute; right: 130px; top: 20px; font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; opacity: 0; transition: opacity .3s, color .3s; }
  .stage:hover .fs { opacity: 1; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  @keyframes ping { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.06, 1.35); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage" data-step="0">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">주요 설계 및 구현</span>04-1</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>PC 한 대에 구성한 시험 환경</h1>
    <button class="tag orig" id="open-fig" type="button" aria-haspopup="dialog"><img src="assets/tint/ui-stack-2-side.svg" alt="">원본 구성도<svg class="mx" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button>
    <span class="env"><img src="assets/tint/docker-side.svg" alt="">로컬 Docker</span>
  </div>
  <p class="dek">서버에 올리기 전, 운영 구성을 본떠 같은 장애를 몇 번이고 재현하고 AI 관제까지 같은 PC에서 시험</p>

  <dialog class="fig" id="fig" aria-label="거래소 Docker 검증 환경 구성도 원본">
    <div class="bar"><b>Docker 검증 환경 구성도 · 원본</b><span>교수님 보고본 02_검증환경 · 그림을 누르면 확대</span><button class="x" id="close-fig" type="button">닫기 (Esc)</button></div>
    <div class="view"><img id="fig-img" src="assets/img/docker-v7.png" alt="Docker 검증 환경 구성도 원본"></div>
  </dialog>

  <svg class="dia" viewBox="0 0 1660 680" role="img" aria-label="PC 한 대의 Docker 안. 시장 봇의 요청이 로드밸런서를 거쳐 거래 서버 두 대와 조회 서버로 간다. 거래 서버는 DB 두 대에 기록하고, 조회 서버는 DB에서 읽는다. 다음 단계에서 시험 장치 둘을 더한다. 부하 시험 도구 k6가 요청을 넣고, 거래 서버와 DB 사이에 장애 주입 장치(Toxiproxy)가 끼어 지연과 끊김을 넣는다. 마지막 단계에서 서버와 DB의 지표를 Prometheus로 모아 Grafana로 보고, 기준을 넘으면 Alertmanager가 메신저로 알린다. k6와 장애 주입 장치는 운영에는 없는 시험용이다. 끝으로 AI 관제센터가 경보를 받는다. 앱 CPU가 50%를 넘었다는 경보에 같은 PC의 로컬 LLM이 판단해 조회 서버 켜기를 운영자에게 제안한다. 마지막 단계에서 운영자가 승인한 뒤에야 조회 서버가 켜져 합류한다. 이 모두가 개발 PC 한 대 안에서 돈다.">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahp" d="M1 1 L9 5 L1 9"/></marker>
      <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahd" d="M1 1 L9 5 L1 9"/></marker>
      <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="aha" d="M1 1 L9 5 L1 9"/></marker>
      <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="aho" d="M1 1 L9 5 L1 9"/></marker>
      <!-- 단계 3의 제안 선과 승인 선을 그려 나가는 마스크. 경로는 아래 보이는 선과 같아야 한다 -->
      <mask id="m-prop" maskUnits="userSpaceOnUse" x="0" y="0" width="1660" height="680"><path class="mk mk-prop" d="M1460 612 V646 H155 V617" pathLength="1"/></mask>
      <mask id="m-appr" maskUnits="userSpaceOnUse" x="0" y="0" width="1660" height="680"><path class="mk mk-appr" d="M155 512 V366 H870 V350" pathLength="1"/></mask>
    </defs>
    <!-- PC 한 대 테두리. 제목의 'PC 한 대'를 그림으로 보인다. Docker 컨테이너와 로컬 LLM이 모두 이 PC 안에서 돈다 -->
    <g class="frame">
      <rect class="pc" x="12" y="84" width="1636" height="592" rx="22"/>
      <text class="pcl" x="1640" y="63" text-anchor="end">개발 PC 한 대 · Docker와 로컬 LLM</text>
    </g>
    <g class="wires">
      <path class="wire nm" d="M270 158 H300 V226"/>
      <path class="wire" d="M300 226 H326"/>

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  document.getElementById('fs').addEventListener('click', toggleFs);
  const fig = document.getElementById('fig');
  const closeFig = () => { fig.classList.remove('zoom'); if (fig.open) fig.close(); };
  document.getElementById('open-fig').addEventListener('click', () => { if (!document.body.classList.contains('tools')) return; try { fig.showModal(); } catch (e) { fig.setAttribute('open', ''); } });
  document.getElementById('close-fig').addEventListener('click', closeFig);
  document.getElementById('fig-img').addEventListener('click', e => { e.stopPropagation(); fig.classList.toggle('zoom'); });
  fig.addEventListener('click', e => { if (e.target === fig || e.target.classList.contains('view')) closeFig(); });
  fig.addEventListener('close', () => fig.classList.remove('zoom'));
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // ---- 단계: 0 서비스 흐름, 1 장애 주입을 끼움, 2 관측과 알림, 3 AI 경보와 제안, 4 운영자 승인. ← 는 한 단계씩 되돌린다 ----
  // atN 클래스는 'N 단계 이상'이다. CSS가 한 번 나온 것을 뒤 단계에서도 남기는 데 쓴다
  const LAST = 4;
  let step = 0;
  const set = (n, instant) => {
    step = n; stage.classList.toggle('instant', !!instant); stage.classList.toggle('quiet', !!instant); stage.dataset.step = n;
    for (let k = 1; k <= LAST; k++) stage.classList.toggle('at' + k, n >= k);
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
  };
  set(location.hash === '#last' ? LAST : 0, location.hash === '#last');
  window.deckStep = d => {
    if (fig.open) { closeFig(); return true; }
    if (d > 0 && step < LAST) { set(step + 1); return true; }
    if (d < 0 && step > 0) { set(step - 1, true); return true; }
    return false;
  };
  if (window.parent === window) addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });
})();
</script>
