<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-6 AI 관제</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --edge: #7D8BA5;
    --wire: #6A7489;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ai: #C6C0F2;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --ease: cubic-bezier(.45,0,.25,1);
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .6s 0s var(--ease) both; }
  .title .env { margin-left: auto; animation: fade .6s .25s var(--ease) both; }
  .dek { position: absolute; left: 130px; right: 130px; top: 232px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .6s .15s var(--ease) both; }

  /* 위 띠: AI 관제의 흐름 한 줄(관제 서버 → AI 서버 → 정책 검사 → 운영자 승인 → 조회 서버). 아래 콘솔 카드가 지금 어느 칸의 화면인지 이 띠가 짚는다.
     색은 하는 쪽마다 하나: 경보 노랑, AI 라벤더, 사람 파랑, 통과 · 결과 초록, 막힘 빨강. 선 · 테두리 · 글자는 회색.
     좌표는 viewBox 1660×84(무대 x130 ~ 1790, y296 ~ 380). 칸은 폭 270 · 높이 76, 사이 77.
     칸 안: 아이콘 36(왼쪽 +16), 이름 24px(+64, 위 +34), 설명 22px(+64, +62) */
  .flow { position: absolute; left: 130px; top: 296px; width: 1660px; height: 84px; overflow: visible; }
  .flow text { font-family: var(--sans); }
  .flow .wire { fill: none; stroke: var(--wire); stroke-width: 2; }
  .flow .tip { fill: var(--wire); }
  .flow .node .bx { fill: #1E2638; stroke: var(--edge); stroke-width: 2.5; }
  .flow .node.asg .bx { stroke-dasharray: 10 6; }
  .flow .node .nm { font-size: 24px; font-weight: 600; fill: var(--ink); }
  .flow .node .sb { font-size: 22px; fill: var(--ink-2); }
  .flow .node .ic { color: var(--ink-2); }
  .flow .node { transition: opacity .35s var(--ease); }
  /* 단계마다 그 단계에 나오는 칸(i1~i5)만 두고 나머지는 0.45로 흐린다 */
  .stage[data-step="1"] .flow .node:not(.i1), .stage[data-step="2"] .flow .node:not(.i2), .stage[data-step="3"] .flow .node:not(.i3),
  .stage[data-step="4"] .flow .node:not(.i4), .stage[data-step="5"] .flow .node:not(.i5) { opacity: .45; }

  /* 단계의 길: 6px 색 선을 가림판(mask)의 대시로 앞에서부터 드러낸다(slide-awsmap 과 같은 방식). 가림판은 defs 안에 있어 id(#m1~#m5)로 고른다. 칸 사이가 77px 라 한 구간 0.8초(덱 하한).
     끝 표시(화살촉 · ✕)는 길이 닿고 0.2초 뒤 0.3초. 단계 무리(s1~s5)는 그 단계부터 보이고 다음 단계에서 0.35로 물러난다 */
  .flow .trail { fill: none; stroke: var(--v); stroke-width: 6; stroke-linecap: round; }
  .flow .rv { fill: none; stroke: #fff; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 100 200; }
  .flow .arrow { fill: var(--v); stroke: var(--v); stroke-width: 2; stroke-linejoin: round; }
  .flow .xm circle { fill: var(--stage); stroke: var(--v); stroke-width: 2.8; }
  .flow .xm path { fill: none; stroke: var(--v); stroke-width: 4.2; stroke-linecap: round; }
  .flow .s { transition: opacity .35s var(--ease); }
  .stage:not(.g1) .s1, .stage:not(.g2) .s2, .stage:not(.g3) .s3, .stage:not(.g4) .s4, .stage:not(.g5) .s5 { visibility: hidden; }
  .stage.g2 .s1, .stage.g3 .s2, .stage.g4 .s3, .stage.g5 .s4 { opacity: .35; }
  .stage[data-step="1"] #m1 .rv, .stage[data-step="2"] #m2 .rv, .stage[data-step="3"] #m3 .rv, .stage[data-step="4"] #m4 .rv, .stage[data-step="5"] #m5 .rv { animation: draw .8s cubic-bezier(.45,0,.55,1) .3s both; }
  .stage[data-step="1"] .s1 .late, .stage[data-step="2"] .s2 .late, .stage[data-step="3"] .s3 .late, .stage[data-step="4"] .s4 .late, .stage[data-step="5"] .s5 .late { animation: fade .3s var(--ease) 1.3s both; }
  /* 칸 켜기: 길이 닿는 1.1초에 0.3초. ④에서는 카드의 3번 설명 '경보 해제'와 같은 2.4초에 관제 서버가 초록으로 켜진다.
     이어지는 두 단계에서 같은 칸을 다시 켤 때는 이름만 다른 같은 움직임(lit-a2 등)을 써 처음부터 다시 돈다 */
  .stage[data-step="1"] #n-mon .bx { animation: lit-w .3s var(--ease) 0s both; }
  .stage[data-step="1"] #n-ai .bx { animation: lit-a .3s var(--ease) 1.1s both; }
  .stage[data-step="2"] #n-ai .bx { animation: lit-a2 .3s var(--ease) 0s both; }
  .stage[data-step="2"] #n-pol .bx { animation: lit-g .3s var(--ease) 1.1s both; }
  .stage[data-step="2"] #n-pol .ic { animation: ic-g .3s var(--ease) 1.1s both; }
  .stage[data-step="3"] #n-opr .bx { animation: lit-b .3s var(--ease) 1.1s both; }
  .stage[data-step="4"] #n-rd .bx { animation: lit-g .3s var(--ease) 1.1s both; }
  .stage[data-step="4"] #n-mon .bx { animation: lit-g2 .3s var(--ease) 2.4s both; }
  .stage[data-step="5"] #n-ai .bx { animation: lit-a .3s var(--ease) 0s both; }
  .stage[data-step="5"] #n-pol .bx { animation: stopped .3s var(--ease) 1.1s both; }
  .stage[data-step="5"] #n-pol .ic { animation: ic-r .3s var(--ease) 1.1s both; }
  .flow #n-pol .shd { transform-box: fill-box; transform-origin: center; }
  .stage[data-step="5"] #n-pol .shd { animation: pulse .25s ease-in-out 1.4s both; }
  /* 지난 단계의 결과가 사라지지 않게 정책 검사의 '통과' 초록은 ③ · ④에도 남긴다(⑤에서만 빨강) */
  .stage[data-step="3"] #n-pol .bx, .stage[data-step="4"] #n-pol .bx { stroke: var(--ok); stroke-width: 3; }
  .stage[data-step="3"] #n-pol .ic, .stage[data-step="4"] #n-pol .ic { color: var(--ok); }
  /* ④에서는 운영자 승인의 파랑도 남겨, 운영자 → 조회 서버로 가는 파란 길과 이어지게 한다 */
  .stage[data-step="4"] #n-opr .bx { stroke: var(--brand); stroke-width: 3; }
  /* ⑤에서는 AI와 정책 검사 사이 빈칸의 회색 선 · 화살촉과 ②의 라벤더 길을 감춰 'AI ━ ✕  정책 검사', 닿기 전에 막힘으로 읽히게 한다 */
  .flow .w2, .flow .s2 { transition: opacity .3s var(--ease); }
  .stage[data-step="5"] .flow .w2, .stage[data-step="5"] .flow .s2 { opacity: 0; }

  /* 아래 콘솔 카드: 단계마다 관제센터 실제 화면 한 장(왼쪽)과 같은 번호의 설명(오른쪽).
     단계에 들어서면 앞 카드 내용이 0.3초에 0.35로 물러나고, 띠의 길이 닿는 1.1초에 새 화면이 0.4초 떠오른 뒤,
     화면 위 번호 상자와 오른쪽 설명이 같은 때 하나씩(1.6초부터 0.4초 간격) 나타나고 끝 줄은 마지막 번호 0.4초 뒤에 나온다.
     순서는 늘 '띠의 길 → 칸 켜짐 · 끝 표시 → 카드 화면 → 번호 하나씩 → 끝 줄'이다.
     열린 모습은 AI 권한 목록, ⑤는 판단 평가. 카드 틀과 칸 자리는 단계마다 바뀌지 않는다 */
  .card { position: absolute; left: 130px; top: 404px; width: 1660px; height: 596px; box-sizing: border-box; background: #0B1019; border: 2px solid var(--line); border-radius: 14px; }
  .card .shot { position: absolute; left: 20px; top: 20px; width: 1044px; height: 552px; display: grid; place-items: center; }
  .card .side { position: absolute; left: 1100px; top: 20px; width: 536px; height: 552px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .card .side::before { content: ''; position: absolute; left: -18px; top: 24px; bottom: 24px; width: 1px; background: var(--line); }
  .frame { position: relative; border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
  .frame img { display: block; width: 100%; height: 100%; border-radius: 10px; }
  .mk { position: absolute; box-sizing: border-box; border: 3px solid var(--c); border-radius: 10px; box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 16%, transparent); }
  .mk b, .an .no { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #0B1019; font-family: var(--mono); font-size: 22px; font-weight: 700; font-style: normal; }
  .mk b { position: absolute; left: -17px; top: -17px; }
  /* 번호 원 자리: 기본은 왼쪽 위 모서리, 붙은 상자와 겹치거나 화면의 점을 가리면 오른쪽 위(tr) · 오른쪽 변 가운데(r) */
  .mk b.tr { left: auto; right: -17px; }
  .mk b.r { left: auto; right: -17px; top: calc(50% - 17px); }
  .an { display: grid; grid-template-columns: 34px 1fr; column-gap: 16px; align-items: start; }
  .an .no { margin-top: 1px; }
  .an h3 { margin: 0; font-size: 26px; font-weight: 600; line-height: 36px; color: var(--ink); }
  .an p { margin: 2px 0 0; font-size: 22px; line-height: 32px; color: var(--ink-2); word-break: keep-all; }
  .side .ft { padding-top: 18px; border-top: 1px solid var(--line); font-size: 22px; line-height: 32px; color: var(--ink-3); word-break: keep-all; }
  .side .ft i { font-style: normal; color: var(--c); font-weight: 600; margin-right: 10px; }
  /* 단계에 들어설 때만 움직인다: 화면은 0.1초에 0.4초 떠오르고, 번호 상자와 설명은 --at 에 0.3초. inst(← · #last)는 움직임 없이 */
  .card.go .frame, .card.go .pol, .card.go .ev { animation: pop .4s var(--ease) 1.1s both; }
  .card.go .mk { animation: mark .3s var(--ease) var(--at) both; }
  .card.go .an, .card.go .ft, .card.go .num { animation: fade .3s var(--ease) var(--at) both; }
  .card.go .side .hd { animation: fade .3s var(--ease) 1.1s both; }
  /* 앞 카드 내용(복사본)은 앞 단계의 색 그대로 0 ~ 0.3초에 0.35로 물러났다가 0.9 ~ 1.1초에 사라지며 새 화면(1.1초)과 이어진다 */
  .card .ghost { position: absolute; inset: 0; pointer-events: none; animation: leave 1.1s linear both; }
  .card .ghost * { animation: none !important; }

  /* 열린 모습: AI 권한 목록. 왼쪽은 할 수 있는 것 5가지와 어느 모드에서도 못 하는 것 8가지, 오른쪽은 두 모드 */
  .pol { width: 100%; display: flex; flex-direction: column; gap: 24px; padding: 0 20px; box-sizing: border-box; }
  .pol .lead h2 { margin: 0; font-size: 32px; line-height: 42px; font-weight: 600; }
  .pol .lead p { margin: 6px 0 0; font-size: 22px; line-height: 32px; color: var(--ink-2); }
  .pol .k { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; color: var(--ink); padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .pol .k .ct { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--c); border: 2px solid var(--c); border-radius: 15px; padding: 0 10px; line-height: 26px; }
  .pol ul { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 10px 12px; }
  .pol li { display: inline-flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 8px; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); font-size: 22px; color: var(--ink); white-space: nowrap; }
  .pol li svg, .side .md svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .side .hd { font-size: 22px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }
  .side .md { display: grid; grid-template-columns: 34px 1fr; column-gap: 16px; }
  .side .md .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--c); box-sizing: border-box; }
  .side .md h3 { margin: 0; font-size: 26px; font-weight: 600; line-height: 34px; }
  .side .md h3 small { font-size: 22px; font-weight: 600; color: var(--c); margin-left: 10px; }
  .side .md p { margin: 2px 0 0; font-size: 22px; line-height: 32px; color: var(--ink-2); word-break: keep-all; }

  /* ⑤ 판단 평가: 네 숫자를 두 줄 두 칸으로 */
  .ev { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 0 20px; box-sizing: border-box; }
  .ev .num { padding: 22px 26px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
  .ev .num b { display: block; font-family: var(--mono); font-size: 64px; font-weight: 500; line-height: 1; color: var(--tone); letter-spacing: -.02em; }
  .ev .num b small { font-size: 30px; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
  .ev .num span { display: block; margin-top: 14px; font-size: 24px; line-height: 34px; color: var(--ink); word-break: keep-all; }
  .ev .num em { display: block; margin-top: 4px; font-size: 22px; line-height: 30px; font-style: normal; color: var(--ink-2); }
  .scope { position: absolute; left: 130px; right: 130px; top: 1012px; margin: 0; font-size: 22px; line-height: 32px; color: var(--ink-2); }
  .scope strong { color: var(--warm); font-weight: 500; }
  .scope:empty { display: none; }

  /* 열릴 때(약 2.1초): 제목 → 부제 → 칩, 띠의 다섯 칸을 0.35초부터 0.2초 간격으로, 회색 선(1.35초), 콘솔 카드(1.5초) */
  .bd { animation: rise .6s var(--ease) backwards; }
  .b1 { animation-delay: .35s; } .b2 { animation-delay: .55s; } .b3 { animation-delay: .75s; } .b4 { animation-delay: .95s; } .b5 { animation-delay: 1.15s; }
  .b6 { animation-delay: 1.35s; } .b7 { animation-delay: 1.5s; }

  .stage.inst *, .stage.inst *::before, .stage.inst *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }
  .stage.done h1, .stage.done .dek, .stage.done .title .env, .stage.done .bd { animation: none !important; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes leave { 0% { opacity: 1; } 27% { opacity: .35; } 82% { opacity: .35; } 100% { opacity: 0; } }
  @keyframes mark { from { opacity: 0; transform: scale(1.03); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes lit-w { to { stroke: var(--warm); stroke-width: 3; } }
  @keyframes lit-a { to { stroke: var(--ai); stroke-width: 3; } }
  @keyframes lit-a2 { to { stroke: var(--ai); stroke-width: 3; } }
  @keyframes lit-g { to { stroke: var(--ok); stroke-width: 3; } }
  @keyframes lit-g2 { to { stroke: var(--ok); stroke-width: 3; } }
  @keyframes lit-b { to { stroke: var(--brand); stroke-width: 3; } }
  @keyframes ic-g { to { color: var(--ok); } }
  @keyframes ic-r { to { color: var(--bad); } }
  @keyframes stopped { to { stroke: var(--bad); stroke-width: 3; } }
  @keyframes pulse { 50% { transform: scale(1.25); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage" data-step="0">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">주요 설계 및 구현</span>04-6</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>AI 관제</h1>
    <span class="env"><img src="assets/tint/ui-heartbeat-ai.svg" alt=""><span id="context-label">온프레미스 LLM · 수동 모드 기본</span></span>
  </div>
  <p class="dek">AI는 원인과 조치를 제안하고, 실행은 별도 정책 검사로 제한합니다.</p>

  <svg class="flow" id="flow" viewBox="0 0 1660 84" role="img" aria-label="AI 관제의 흐름: 관제 서버의 경보를 온프레미스 AI 서버가 읽고 조치안을 내면, 정책 검사(허용 목록·한도)와 운영자 승인(수동 모드 기본)을 거쳐 조회 서버(증설 0~1대)가 켜진다. 목록 밖이나 금지 요청은 정책 검사에서 막힌다.">
    <defs>

    <!-- 회색 선과 작은 화살촉: 평소의 흐름 -->
    <g class="bd b6">
      <path class="wire" d="M270 42 H347"/><path class="tip" d="M333 35 L347 42 L333 49 Z"/>

    <g class="node i2 i3 i5 bd b3" id="n-pol"><rect class="bx" x="694" y="4" width="270" height="76" rx="12"/><g class="shd"><use class="ic" href="#shield" x="710" y="24" width="36" height="36"/></g><text class="nm" x="758" y="38">정책 검사</text><text class="sb" x="758" y="66">허용 목록·한도</text></g>
    <g class="node i3 i4 bd b4" id="n-opr"><rect class="bx" x="1041" y="4" width="270" height="76" rx="12"/><image href="assets/color/user-dark.svg" x="1057" y="24" width="36" height="36"/><text class="nm" x="1105" y="38">운영자 승인</text><text class="sb" x="1105" y="66">수동 모드 기본</text></g>
    <g class="node asg i4 bd b5" id="n-rd"><rect class="bx" x="1388" y="4" width="270" height="76" rx="12"/><image href="assets/aws/Arch_Amazon-EC2-Auto-Scaling_64.svg" x="1404" y="24" width="36" height="36"/><text class="nm" x="1452" y="38">조회 서버</text><text class="sb" x="1452" y="66">수동 스케일링</text></g>
    <!-- 끝 표시(칸 위): 화살촉은 길이 24 · 밑변 30, ✕는 반지름 17로 AI와 정책 검사 사이 빈칸(617~694) 가운데 -->
    <g class="s s1" style="--v: var(--warm)"><path class="arrow late" d="M323 27 L323 57 L346 42 Z"/></g>
    <g class="s s2" style="--v: var(--ai)"><path class="arrow late" d="M670 27 L670 57 L693 42 Z"/></g>
    <g class="s s3" style="--v: var(--ai)"><path class="arrow late" d="M1017 27 L1017 57 L1040 42 Z"/></g>
    <g class="s s4" style="--v: var(--brand)"><path class="arrow late" d="M1364 27 L1364 57 L1387 42 Z"/></g>
    <g class="s s5" style="--v: var(--bad)"><g class="xm late"><circle cx="655" cy="42" r="17"/><path d="M648 35 L662 49 M662 35 L648 49"/></g></g>
  </svg>

  <div class="card bd b7" id="card" aria-live="polite"><div class="shot" id="shot"></div><div class="side" id="side"></div></div>
  <p class="scope" id="scope"></p>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  $('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  const CK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>';
  const XX = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6l-12 12"/></svg>';
  const HU = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0 -8a4 4 0 0 0 0 8M5 20a7 7 0 0 1 14 0"/></svg>';
  const AU = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M12 21a9 9 0 1 0 0 -18a9 9 0 0 0 0 18"/></svg>';

  // AI 권한(ADR 0035 허용 목록 · 금지 목록). 화면에는 쉬운 말로 줄여 쓴다(허용 다섯은 한 줄에 들어가게)
  const ALLOW = ['조회 서버 켜기·끄기', '경보 기준 조정', '경보 보류', '시장 봇 부하 줄임', '백업 즉시 실행'];
  const DENY = ['DB 승격·전환', '매칭 리더 전환', '데이터·백업 삭제', '보안·네트워크 변경', '거래·DB 서버 재시작·중지', '회원·자산 조작', '허용 목록 밖 자원 생성', '자기 권한 변경'];

  // 2026-09-25 개발 PC의 실제 모델 평가. summary.json의 S/H 37개 상황을 3회씩 집계한다.
  // 원자료의 전체 132회에는 별도 구조화 입력 시험 I01~I07의 21회도 포함되므로 분모에 섞지 않는다.
  // S/H의 111회는 기대 일치 90회, D2가 막은 축소 제안 9회, 기대 조치를 제안하지 않은 12회다.
  // '실행 후보 오류 0'은 정책 함수의 모의 판정이며 서버에 조치를 실행한 결과가 아니다.
  const EVAL = { model: 'qwen3.6 35B', runs: 111,
    nums: [
      ['90', '/111', '기대 판단과 일치', '같은 상황을 세 번씩 평가', 'var(--brand)'],
      ['9', '/9', '부적합 제안을 정책이 차단', '축소 조건을 충족하지 않은 제안', 'var(--ok)'],
      ['12', '/111', '기대한 조치를 제안하지 않음', '봇 부하 감소·임계값 조정', 'var(--warm)'],
      ['0', '/111', '정책 통과 후 실행 후보 오류', '자동 실행을 가정한 정책 판정', 'var(--ok)']
    ] };

  // 단계별 콘솔 화면. 관제센터 시나리오 재생 화면을 2배 해상도로 찍어 핵심만 자른 것(원래 픽셀 크기)과, 번호 상자(같은 좌표 [x, y, w, h, 번호 원 자리])와 설명.
  // c 는 그 단계를 하는 쪽의 색(경보 노랑, AI 라벤더, 사람 파랑, 결과 초록), ft 는 끝 줄 [굵은 말, 설명, 굵은 말 색(없으면 단계 색)]
  const STEPS = [
    null,
    { c: 'var(--warm)', img: 'assets/app/v4-alert.png', w: 890, h: 408, alt: '관제센터 활성 경보 두 건: 앱 계층 CPU 높음, 응답 지연 증가',
      marks: [[19, 75, 855, 152], [19, 246, 855, 152]],
      an: [['CPU 경보', '앱 서버 평균 73%<br>경보 기준 60% 초과'], ['응답 지연 경보', '응답 시간 p95 486ms<br>기준 400ms 초과']],
      ft: ['Teams', 'AI 판단을 기다리지 않고 경보 전달'] },
    { c: 'var(--ai)', img: 'assets/app/v6-judge.png', w: 1026, h: 610, alt: 'AI 관제 판단 카드: 원인 추정, 조치안 app-3 켜기와 확신도, 근거 지표 칩',
      marks: [[16, 100, 1000, 112], [28, 238, 800, 116], [16, 380, 740, 212]],
      an: [['원인 가설', '조회량 증가와 CPU·응답 지연을 연결<br>주문 경로와 DB 상태도 함께 확인'], ['조치 제안', '조회 서버 app-3 켜기<br>제안 이유·확신도·위험 표시'], ['판단 근거', '사용한 지표와 수집 시각을 남겨<br>운영자가 판단 근거를 확인']],
      ft: ['정책 검사', '허용 조치·한도·전제 조건을 별도 코드로 확인', 'var(--ok)'] },
    { c: 'var(--brand)', img: 'assets/app/v7-approve.png', w: 1120, h: 669, alt: '승인 창: 앱 계층을 3대로 늘립니다, 대상 · 영향 · 비용 · 되돌리기 · 쿨다운, 승인하고 실행 단추',
      marks: [[20, 106, 318, 90], [40, 214, 1022, 324, 'tr'], [852, 564, 232, 84]],
      an: [['변경 대상 확인', '조회 서버 app-3 기동<br>앱 서버 2대 → 3대'], ['영향과 복구 방법 확인', '영향·추가 비용·되돌리기·쿨다운'], ['운영자 승인 후 실행', '기본 수동 모드의 실행 절차']],
      ft: ['자동 모드', '운영자가 별도로 켠 동안만 허용 범위에서 실행', 'var(--ai)'] },
    { c: 'var(--ok)', img: 'assets/app/v7-done.png', w: 1036, h: 622, alt: '사건 기록: 경보 발생, Teams 알림, AI 판단, 운영자 승인, app-3 기동, 경보 해제, 사건 종료',
      marks: [[4, 368, 1026, 250, 'r'], [4, 258, 1026, 96, 'r'], [4, 98, 1026, 102, 'r']],
      an: [['경보와 판단', '발생한 경보와 AI의 조치안을 연결'], ['승인과 실행', '누가 승인했고 무엇을 실행했는지 기록'], ['해제와 결과', '경보 해제 시각과 조치 이력을 확인']],
      ft: ['사건 기록', '판단·승인·실행·해제를 한 사건에서 추적'] },
    'eval',
  ];
  const LAST = STEPS.length - 1;
  // 카드 안 칸 크기, 새 화면이 뜨는 때(띠의 길이 닿는 1.1초), 첫 번호의 때와 번호 간격
  const BOX_W = 1044, BOX_H = 552, T_IN = 1.1, T0 = 1.6, GAP = .4, AN = .15;
  const card = $('card'), shot = $('shot'), side = $('side');
  const at = t => `--at:${t.toFixed(2)}s`;

  function policy() {
    shot.innerHTML = `<div class="pol">
      <div class="lead"><h2>서버 지표를 모아 판단 근거를 제시</h2><p>경보·CPU·응답 시간·DB 상태를 함께 확인합니다.</p></div>
      <div style="--c: var(--ok)"><div class="k">제안할 수 있는 조치<span class="ct">${ALLOW.length}</span></div><ul>${ALLOW.map(t => `<li>${CK}${t}</li>`).join('')}</ul></div>
      <div style="--c: var(--bad)"><div class="k">수동·자동 모두 금지<span class="ct">${DENY.length}</span></div><ul>${DENY.map(t => `<li>${XX}${t}</li>`).join('')}</ul></div></div>`;
    side.innerHTML = `<div class="hd">실행 권한을 제한하는 방법</div>
      <div class="md" style="--c: var(--brand)"><span class="dot">${HU}</span><div><h3>수동<small>기본</small></h3><p>AI가 제안하고 운영자가 승인해야 실행</p></div></div>
      <div class="md" style="--c: var(--ai)"><span class="dot">${AU}</span><div><h3>자동</h3><p>운영자가 켜면 최대 8시간 동안<br>허용 조치만 한도 안에서 실행</p></div></div>
      <div class="ft" style="--c: var(--ink-2)">DB 전환은 Patroni가 담당<br>AI의 조치 권한과 분리</div>`;
  }
  // ⑤: 숫자 넷은 1.6초부터 0.3초 간격, 오른쪽 머리와 AI 줄은 새 화면과 같은 1.1초, 끝 줄 '차단'은 마지막 숫자 0.3초 뒤
  function evaluation() {
    const n = EVAL.nums.length;
    shot.innerHTML = `<div class="ev">${EVAL.nums.map(([a, b, t, d, tone], j) => `<div class="num" style="--tone:${tone};${at(T0 + j * .3)}"><b>${a}<small>${b}</small></b><span>${t}</span><em>${d}</em></div>`).join('')}</div>`;
    side.innerHTML = `<div class="hd">모델 판단과 실행 통제를 나눠 평가</div>
      <div class="an" style="--c: var(--ai); ${at(T_IN)}"><span class="no">AI</span><div><h3>${EVAL.model}</h3><p>37개 상황 × 3회 = ${EVAL.runs}회<br>개발 PC RTX 4090 · Ollama<br>2026.09.25</p></div></div>
      <div class="ft" style="--c: var(--warm); ${at(T0 + n * .3)}"><i>평가 범위</i>서버 조치 없이 모델 응답과 정책 검사 결과만 평가했습니다.</div>
      <div class="ft" style="--c: var(--brand); ${at(T0 + n * .3 + .3)}"><i>운영 원칙</i>AI의 근거를 사람이 확인하고, 실행 조건은 코드로 다시 검사합니다.</div>`;
  }
  function console_(s) {
    const k = Math.min(BOX_W / s.w, BOX_H / s.h, 1.1), W = Math.round(s.w * k), H = Math.round(s.h * k);
    const pct = (v, t) => (v / t * 100).toFixed(2) + '%';
    const marks = s.marks.map(([x, y, w, h, b], j) =>
      `<i class="mk" style="${at(T0 + j * GAP)};left:${pct(x, s.w)};top:${pct(y, s.h)};width:${pct(w, s.w)};height:${pct(h, s.h)}"><b${b ? ` class="${b}"` : ''}>${j + 1}</b></i>`).join('');
    shot.innerHTML = `<div class="frame" style="width:${W}px;height:${H}px"><img src="${s.img}" alt="${s.alt}">${marks}</div>`;
    side.innerHTML = s.an.map(([t, d], j) => `<div class="an" style="${at(T0 + j * GAP + AN)}"><span class="no">${j + 1}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('') +
      `<div class="ft" style="${at(T0 + s.an.length * GAP + AN)}${s.ft[2] ? `;--c:${s.ft[2]}` : ''}"><i>${s.ft[0]}</i>${s.ft[1]}</div>`;
  }
  // 열린 모습과 ⑤는 번호로 잇지 않으므로 오른쪽 첫 줄의 위를 왼쪽 내용의 위에 맞춘다(둘 다 칸 안에서 위아래 가운데)
  const alignTop = () => {
    const c = shot.firstElementChild;
    shot.style.alignItems = side.style.justifyContent = side.style.paddingTop = '';
    if (!c || c.classList.contains('frame')) return;
    const top = Math.max(0, (BOX_H - c.offsetHeight) / 2);
    shot.style.alignItems = 'start'; c.style.marginTop = top + 'px';
    side.style.justifyContent = 'flex-start'; side.style.paddingTop = top + 'px';
  };

  // ---- 단계: 0 열림(AI 권한 목록), 1 경보, 2 AI 판단, 3 운영자 승인, 4 조치 · 해제, 5 막힘과 판단 평가. 그다음 → 는 다음 장.
  //      stage 의 g1~g5 는 '그 단계 이상'(띠의 길이 보이기 · 물러나기를 이것으로 정한다). 앞으로는 움직여 그리고, 뒤로는 앞 단계의 끝 모습을 바로.
  //      앞으로 갈 때는 앞 카드 내용의 복사본(ghost)을 위에 얹어 물러나게 하고, 새 내용은 1.1초부터 나타난다 ----
  let step = 0;
  const render = (n, inst) => {
    card.querySelectorAll('.ghost').forEach(g => g.remove());
    if (!inst && n > 0) {
      const g = document.createElement('div'); g.className = 'ghost'; g.setAttribute('aria-hidden', 'true');
      g.style.setProperty('--c', card.style.getPropertyValue('--c') || 'var(--ink-2)');
      g.innerHTML = `<div class="shot" style="${shot.getAttribute('style') || ''}">${shot.innerHTML}</div><div class="side" style="${side.getAttribute('style') || ''}">${side.innerHTML}</div>`;
      card.appendChild(g); g.addEventListener('animationend', () => g.remove());
    }
    stage.classList.toggle('inst', !!inst); step = n; stage.dataset.step = n;
