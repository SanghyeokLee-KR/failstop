<script>
// ======== 사용자가 채우는 곳(이 장의 설정은 여기 한곳에만 있다) ========
// VM 실습망 Patroni 자동 전환의 실측 결과. 값을 넣은 항목만 ① 자동 전환 끝에 DB02 옆 글줄로 그리고,
// 빈칸('')인 항목은 그 줄을 아예 그리지 않는다. 예시 값은 형식을 보이려는 것이며 측정값이 아니다.
const RESULT = {
  failoverTime: '',  // DB01을 멈춘 때부터 DB02가 주 DB(patronictl list 의 Leader)가 될 때까지. 예: '23초' → '자동 전환 23초'
  lostCommits: '',   // 전환 동안 커밋 확인을 받은 쓰기 가운데 새 주 DB에 없는 수. 예: '0건' → '확인된 커밋 유실 0건'
};
// 증거 화면(E 키 도구)의 '이중화' 쪽. 이 경로에 캡처(.png)나 출력(.txt)을 넣으면 목록에 나타나고, 없는 파일은 건너뛴다.
// 둘 다 없으면 '이중화' 묶음이 통째로 빠진다. 설명(d)은 실제로 찍은 내용에 맞게 고친다
const EVIDENCE_HA = [
  { src: 'assets/vm/db-patroni-list.png',     t: '클러스터 상태', d: 'patronictl list: DB01 Leader, DB02 Sync Standby, etcd 세 멤버(DB01·DB02·OPS01)' },
  { src: 'assets/vm/db-patroni-failover.png', t: '자동 전환 기록', d: 'DB01을 멈춘 뒤 DB02 승격, HAProxy가 DB02로 전환, DB01이 pg_rewind로 예비 복귀' },
];

<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --edge: #8E9BB3;
    --box: #1F2839;
    --box-line: #6B7A94;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ease: cubic-bezier(.45,0,.25,1);
    --brand: #79A7FA;
    --ok: #2DD196;
    --bad: #FF7A7A;
    --warm: #E8C07A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .6s 0s var(--ease) both; }
  .dek { position: absolute; left: 130px; right: 130px; top: 232px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .6s .15s var(--ease) both; }
  .title .env { animation: fade .6s .25s var(--ease) both; }
  .tag { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; white-space: nowrap; }
  .tag img { width: 26px; height: 26px; }
  button.tag { font-family: var(--sans); background: transparent; cursor: pointer; }
  .tag .mx { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-left: 2px; }

  /* 본문: 왼쪽 ① 이중화(서버가 멈출 때), 오른쪽 ② 백업(지우거나 망가졌을 때). 가운데 세로줄로 나눈다.
     두 열 모두 머리(296–352) 아래 18px에서 794×630 도면이 시작해 아래 1000에서 끝나고, 도면 안의 자리도 같다.
     위 줄: 왼쪽 300×72 DB01 상자(404–476, 가운데 440) → 174px 선과 20px 화살촉(이름 기준선 424) → 오른쪽 상자.
     아래 줄: 300×140 상자 둘(860–1000). 장비 상자는 모두 같은 첫 줄(아이콘 30px·굵은 이름 26px·회색 역할 22px)이고,
     140 높이 상자는 줄 기준선이 상자 위 +44(장비) / +94(하는 일) / +126(세부)로 같다 */
  .cols { position: absolute; left: 130px; right: 130px; top: 296px; height: 704px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 72px; }
  .cols::before { content: ''; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 1px; background: var(--line); animation: fade .6s .3s var(--ease) both; }
  .col { display: flex; flex-direction: column; min-width: 0; }
  .ch { margin: 0; display: flex; align-items: center; gap: 12px; height: 56px; flex: none; font-size: 34px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .ch span { font-size: 24px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
  .n { flex: none; font-style: normal; font-family: var(--mono); font-weight: 700; font-size: 22px; color: var(--stage); background: var(--ink); border-radius: 50%; width: 32px; height: 32px; display: inline-grid; place-items: center; }

  /* 도면 공통. 상자는 바깥 테두리가 정수 자리에 오게 1px 안쪽에 그린다(바깥 300×72·300×140, 모서리 12px) */
  .dg { display: block; width: 794px; height: 630px; margin-top: 18px; overflow: visible; }
  .dg text { font-family: var(--sans); font-size: 22px; fill: var(--ink-2); }
  .dg .bx { fill: var(--box); stroke: var(--box-line); stroke-width: 2; }
  .dg .bx.tmp { fill: color-mix(in srgb, var(--box) 60%, transparent); stroke-dasharray: 9 7; }
  .dg .nm { font-size: 26px; font-weight: 600; fill: var(--ink); }
  .dg .nm tspan, .dg .rl { font-size: 22px; font-weight: 400; fill: var(--ink-2); }
  .dg .rl.bad { font-weight: 600; fill: var(--bad); }
  .dg .ro { font-size: 24px; font-weight: 600; fill: var(--ink); }
  .dg .hd { font-weight: 600; fill: var(--ink); }
  .dg .ok { fill: var(--ok); font-weight: 600; }
  .dg .m { font-family: var(--mono); }
  .dg .ar { fill: none; stroke: var(--edge); stroke-width: 3; }
  .dg .ar.cmp { stroke-dasharray: 8 7; }
  .dg .hdp, .dg .dot { fill: var(--edge); }
  /* etcd 합의 표: 평소 회색 이름. ①에서 남은 두 표(DB02·OPS01)는 초록, 멈춘 DB01의 표는 빨간 취소선으로 바꿔 쓴다(같은 자리에 겹친 글) */
  .dg .vn.yes { fill: var(--ok); }
  .dg .vn.no { fill: var(--bad); text-decoration: line-through; }

  /* 열릴 때(약 2.3초): 제목·요약 → 왼쪽 머리(0.35초) → 위 줄 DB01 → DB02 복제(0.6초) → 앱 서버와 HAProxy 길(0.85초)
     → Patroni와 etcd 표(1.1초) → 오른쪽 머리(1.6초)와 DB01(1.7초). 하나는 0.6초 */
  .bd { animation: rise .6s var(--ease) both; }
  .col.l > .ch { animation-delay: .35s; } .ha .t1 { animation-delay: .6s; } .ha .t2 { animation-delay: .85s; } .ha .t3 { animation-delay: 1.1s; }
  .col.r > .ch { animation-delay: 1.6s; } .loop .t1 { animation-delay: 1.7s; }

  /* 단계(→ 한 번에 하나). 들어설 때만 움직이고, 숨은 상태는 keyframes 시작에만 두어 끝 모습이 곧 기본 모습이다(←·#last 는 움직임 없이).
     ① 자동 전환(약 3.4초): DB01 멈춤 — 상자가 흐려지고 DB01에 닿던 복제·HAProxy 길이 사라지며 역할이 '멈춤'(0~0.5초)
        → etcd 표: DB01 표가 빠지고 DB02·OPS01 두 표(0.5~0.8초) → DB02 역할이 '주 DB'(1.0~1.5초)
        → HAProxy 길이 갈림목에서 DB02로(1.5~2.9초, 약 670px) → 화살촉·결과(3.1~3.4초)
     ② 되돌림(약 2.3초, ①과 같은 꼴): DB01 흐림이 풀리고 '멈춤'이 사라짐(0~0.3초) → 역할 '예비 DB'와 그 아래 'pg_rewind로 복귀'(0.2~0.5초)
        → etcd 표가 평소대로(0.5~0.8초) → DB02 → DB01 엄격 동기 복제 길(1.0~1.8초) → 화살촉·'엄격 동기 복제'(2.0~2.3초)
     ③ 백업(약 2.6초): DB01 → OPS01 길(0~0.8초) → 화살촉·이름·OPS01(1.0~1.3초) → OPS01 → EDGE01 길(1.3~2.1초) → 화살촉·이름·EDGE01(2.3~2.6초)
     ④ 복원 검증(약 2.6초): EDGE01 → 임시 DB 길(0~0.8초) → 화살촉·이름·임시 DB(1.0~1.3초)
        → 임시 DB 위 점(1.3~1.6초)과 원본 대조 점선(1.3~2.1초) → DB01 아래 점·결과(2.3~2.6초). 대조는 되돌려 넣는 길이 아니라 화살촉 없이 양 끝 점으로 잇는다
     역할 글을 바꿀 때는 옛 글이 0.3초에 걸쳐 사라지고 새 글은 0.2초 뒤에 들어와 두 낱말이 겹쳐 보이지 않게 한다.
     stage 의 g1~g4 는 '그 단계 이상'이다. e1~e4 는 그 단계부터 보이는 것, x1 은 ①부터 사라지는 것, o1 은 ①에서만 보이는 것,
     rp(복제 이름)·vb(회색 표 이름)는 ①에서만 사라지는 것, db1b 는 ①에서만 흐린 DB01 상자다 */
  .stage:not(.g1) .e1, .stage:not(.g2) .e2, .stage:not(.g3) .e3, .stage:not(.g4) .e4, .stage:not(.g1) .o1 { visibility: hidden; }
  .stage.g1 .x1, .stage.g2 .o1, .stage[data-step="1"] .rp, .stage[data-step="1"] .vb { opacity: 0; }
  .stage[data-step="1"] .db1b { opacity: .4; }
  .dg .draw { stroke-dasharray: 1; stroke-dashoffset: 0; }
  .stage[data-step="1"]:not(.inst) .x1, .stage[data-step="1"]:not(.inst) .rp, .stage[data-step="1"]:not(.inst) .vb { animation: out .3s var(--ease) both; }
  .stage[data-step="1"]:not(.inst) .db1b { animation: dim .3s var(--ease) both; }
  .stage[data-step="1"]:not(.inst) .o1, .stage[data-step="1"]:not(.inst) .e1.pop { animation: fade .3s var(--ease) both; }
  .stage[data-step="1"]:not(.inst) .e1.draw { animation: draw 1.4s var(--ease) both; }
  .stage[data-step="2"]:not(.inst) .db1b { animation: undim .3s var(--ease) both; }
  .stage[data-step="2"]:not(.inst) .o1 { animation: out .3s var(--ease) both; }
  .stage[data-step="2"]:not(.inst) .e2.pop, .stage[data-step="2"]:not(.inst) .rp, .stage[data-step="2"]:not(.inst) .vb { animation: fade .3s var(--ease) both; }
  .stage[data-step="2"]:not(.inst) .e2.draw { animation: draw .8s var(--ease) both; }
  .stage[data-step="3"]:not(.inst) .e3.draw, .stage[data-step="4"]:not(.inst) .e4.draw { animation: draw .8s var(--ease) both; }
  .stage[data-step="3"]:not(.inst) .e3.pop, .stage[data-step="4"]:not(.inst) .e4.pop { animation: fade .3s var(--ease) both; }
  /* 단계 안 시점. a 는 ①, b 는 ②에서만 걸린다(같은 요소가 두 단계에서 다른 때에 움직이므로). w 는 ③·④ */
  .stage[data-step="1"] .a02 { animation-delay: .2s !important; } .stage[data-step="1"] .a05 { animation-delay: .5s !important; } .stage[data-step="1"] .a10 { animation-delay: 1s !important; } .stage[data-step="1"] .a12 { animation-delay: 1.2s !important; }
  .stage[data-step="1"] .a15 { animation-delay: 1.5s !important; } .stage[data-step="1"] .a31 { animation-delay: 3.1s !important; }
  .stage[data-step="2"] .b02 { animation-delay: .2s !important; } .stage[data-step="2"] .b05 { animation-delay: .5s !important; } .stage[data-step="2"] .b10 { animation-delay: 1s !important; }
  .stage[data-step="2"] .b20 { animation-delay: 2s !important; }
  .loop .w1 { animation-delay: 1s !important; } .loop .w2 { animation-delay: 1.3s !important; } .loop .w3 { animation-delay: 2.3s !important; }
  .stage.done .bd, .stage.done h1, .stage.done .dek, .stage.done .title .env, .stage.done .cols::before { animation: none !important; }

  /* 증거 화면(질문 대비): 왼쪽 목록(번호·제목), 오른쪽 캡처와 설명. 본문 순서대로 ← → 로 넘기고 Esc 로 닫는다.
     E 키 도구를 켤 때만 단추가 보인다 */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); outline: none; }
  .fig::backdrop { background: rgba(8,10,15,.95); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .35s var(--ease); }
  .fig .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 24px; font-size: 22px; color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .fig .bar button { margin-left: auto; flex: none; font-family: var(--sans); font-size: 22px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; }
  .fig .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 400px 1fr; gap: 18px; padding: 0 24px 24px; }
  .fig ol { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .fig li.g { margin: 8px 0 2px; font-size: 22px; font-weight: 600; color: var(--ink-3); }
  .fig li.g:first-child { margin-top: 0; }
  .fig li button { width: 100%; text-align: left; font-family: var(--sans); font-size: 22px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; }
  .fig li button.cur { border-color: #A8C8FF; color: var(--ink); background: rgba(168,200,255,.06); }
  .fig li .no { font-family: var(--mono); color: var(--ink-3); }
  .fig li .st { color: var(--ok); } .fig li .st.t { color: var(--ink-3); }
  .fig .pn { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 10px; }
  .fig .cap { font-size: 22px; color: var(--ink-2); line-height: 1.45; word-break: keep-all; }
  .fig .cap b { color: var(--ink); font-weight: 600; margin-right: 12px; }
  /* 칸 크기를 100%로 정해 두어야 캡처가 칸 안에 다 들어온다(잘리지 않고 줄어든다) */
  .fig .shot { flex: 1; min-height: 0; display: grid; grid-template: 100% / 100%; place-items: center; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: #0C1016; }
  .fig .shot img { max-width: 100%; max-height: 100%; object-fit: contain; background: #fff; }
  .fig .shot pre { margin: 0; align-self: start; justify-self: stretch; padding: 22px 28px; font-family: var(--mono); font-size: 22px; line-height: 1.45; color: #CCCCCC; white-space: pre-wrap; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes dim { from { opacity: 1; } to { opacity: .4; } }
  @keyframes undim { from { opacity: .4; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">주요 설계 및 구현</span>04-3</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>DB 이중화와 백업</h1>
    <button class="tag orig" id="open-fig" type="button" aria-haspopup="dialog"><img src="assets/tint/ui-file-check-side.svg" alt="">증거 화면<svg class="mx" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button>
    <span class="env" style="margin-left:14px"><img src="assets/tint/ui-server-2-side.svg" alt="">VM 실습망</span>
  </div>
  <p class="dek">복제만으로는 잘못 지운 데이터를 되돌릴 수 없어 백업을 두고 복원까지 해 봤습니다.</p>

  <div class="cols">
    <!-- 왼쪽: ① 이중화. Patroni가 관리하는 DB01 → DB02 엄격 동기 복제와 앱 서버의 HAProxy, etcd 합의 3표. → ① 자동 전환, → ② pg_rewind 되돌림 -->

<!-- 발표 노트(60초): DB는 두 가지 사고를 함께 생각했습니다.
서버가 멈추는 사고는 이중화로, 데이터가 지워지는 사고는 백업으로 대비했습니다.
주 DB와 예비 DB는 엄격 동기 복제라, 예비 DB가 받아 적어야 커밋이 끝납니다.
→ 1 주 DB가 멈추면 Patroni가 예비 DB를 올리고, HAProxy가 연결을 새 주 DB로 옮깁니다.
(RESULT를 채우면 여기에: 전환에 ○초 걸렸고 확인된 커밋 유실은 ○건이었습니다.)
→ 2 돌아온 DB는 pg_rewind로 되감아 예비로 다시 붙습니다. 예비가 없는 동안에는 쓰기를 멈춰, 확인받은 주문을 잃지 않는 쪽을 골랐습니다. 하지만 복제는 잘못 지운 데이터까지 따라 지우기 때문에 백업을 따로 뒀습니다.
→ 3 매일 거래 DB를 암호화해 DB 서버 밖에 7일 보관합니다. 실습망이라 웹 진입 서버에 뒀고, 운영이라면 백업 전용 VLAN과 외부로 옮깁니다.
→ 4 그 백업을 임시 DB에 되살려 표 109개가 원본과 같은 것까지 확인했습니다.
질문 때: VM 거래 DB에는 거래 데이터가 없어(마켓·주문·원장 0건) 데이터가 많을 때의 복원 시간은 재지 않았다. 승격은 etcd 세 표 가운데 남은 두 표로 판단한다. 백업은 하루 한 번 논리 백업이라 잘못 지운 사고에서는 최대 하루치를 잃을 수 있고, 시점 복구(PITR)는 켜지 않았다. 실습망이라 'DB 서버 밖'이라는 조건만 맞춰 웹 진입 서버에 두었고, 설계(04-2)대로라면 백업 서버 VLAN과 외부 보관이다. 대조는 표 개수와 주요 표의 행 수까지 했다. 백업 원본은 DB01 주소로 정해 두어, 전환 뒤에는 대상을 바꿔야 한다. 고친다면 HAProxy 쓰기 포트(지금의 주 DB)를 백업 원본으로 둔다. -->

<script>
(() => {
  const stage = document.getElementById('stage');
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  $('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // ---- 왼쪽 도면 자리 맞춤: 단계마다 바뀌는 역할 글은 이름 뒤 12px에, etcd 표 이름은 앞 이름 뒤 24px에 놓는다.
  // 글꼴을 읽은 뒤 한 번 더 맞춘다(처음 값은 IBM Plex Sans KR 로 잰 자리) ----
  const layout = () => {
    document.querySelectorAll('#ha [data-after]').forEach(t => {
      const n = $(t.dataset.after);
      t.setAttribute('x', (+n.getAttribute('x') + n.getComputedTextLength() + 12).toFixed(1));
    });
    const base = document.querySelectorAll('#ha .vb'), over = document.querySelectorAll('#ha .vn');
    let x = +document.querySelector('#ha .vote').dataset.x;
    base.forEach((t, i) => { t.setAttribute('x', x); over[i].setAttribute('x', x); x += t.getComputedTextLength() + 24; });
  };
  layout();
  if (document.fonts) document.fonts.ready.then(layout);

  // ---- ① 끝의 결과 글줄: RESULT 에 값이 있는 것만 DB02로 오르는 길 왼쪽에 끝맞춤으로 쌓는다(오른쪽 열 'SFTP 22'와 같은 자리 규칙) ----
  const lines = [['자동 전환', RESULT.failoverTime], ['확인된 커밋 유실', RESULT.lostCommits]].filter(r => String(r[1] || '').trim());
  lines.forEach(([k, v], i) => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'ok'); t.setAttribute('x', 626); t.setAttribute('y', 160 + i * 34); t.setAttribute('text-anchor', 'end');
    t.textContent = `${k} ${String(v).trim()}`;
    $('res').appendChild(t);
  });
  if (lines.length) $('ha').setAttribute('aria-label', $('ha').getAttribute('aria-label') + '. ' + lines.map(([k, v]) => `${k} ${String(v).trim()}`).join(', '));

  // ---- 증거 화면 창(E 키 도구): 왼쪽 목록에서 고르거나 ← → 로 본문 순서대로 넘긴다 ----
  // 이중화는 맨 위 EVIDENCE_HA 가운데 실제로 있는 파일만(없으면 묶음째 뺀다), 백업은 증거본 2026-09-26_VM_Databasus의 캡처 열 장.
  // 세로로 긴 캡처는 핵심 부분만 잘라 assets/vm에 둔 사본을 쓴다
  const EV_BAK = [
    { src: 'assets/vm/db-pre.png', t: '시작 전 상태', d: '관제 서버의 Databasus 컨테이너 정상, 관리 화면은 127.0.0.1:4005에만, 보관소는 비어 있음' },
    { src: 'assets/vm/db-storage.png', t: '외부 보관소 연결', d: '웹 진입 서버 192.168.10.11:22의 SFTP 전용 계정 dbbackup에 연결 시험 성공' },
    { src: 'assets/vm/db-register.png', t: 'DB 등록', d: '주 DB 192.168.10.31:5432, 백업 계정, SSL Require' },
    { src: 'assets/vm/db-warning.png', t: '계정 권한 경고', d: '백업 계정에 TEMP와 SECURITY DEFINER 함수 실행 권한이 남았다는 경고. 기록하고 진행했다' },
    { src: 'assets/vm/db-schedule.png', t: '일정·암호화·보존', d: '매일 09:00 논리 백업, 외부 백업 보관소, 백업 파일 암호화, 보존 1주' },
    { src: 'assets/vm/db-backup2.png', t: '백업 성공', d: '백업 목록의 성공 기록, 0.45 MB' },
    { src: 'assets/vm/db-offhost.png', t: '서버 밖 도착', d: '웹 진입 서버 /srv/db-backup/databasus에 백업 파일과 메타데이터, 관제 서버 192.168.10.41의 SFTP 접속 기록' },
    { src: 'assets/vm/db-verify.png', t: '복원 검증 성공', d: 'Databasus가 임시 DB에 복원하고 성공 보고' },
    { src: 'assets/vm/db-rows.png', t: '복원 결과', d: '스키마 2, 표 109개, pg_restore 종료 코드 0' },
    { src: 'assets/vm/db-crosscheck.png', t: '원본과 대조', d: '주 DB에서 센 표 public 104개와 harness 5개, 합 109개. 같은 세 표의 행 수 47·22·3 일치. 관제 서버에는 Databasus 컨테이너만 남음' },
  ];
  const isText = src => /\.txt$/i.test(src);
  const exists = src => isText(src)
    ? fetch(src, { cache: 'no-store' }).then(r => r.ok).catch(() => false)
    : new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = src; });
  const fig = $('fig'), list = $('ev-list'), cap = $('ev-cap'), shot = $('ev-shot'), openBtn = $('open-fig');
  let items = [], at = 0;
  const build = groups => {
    list.replaceChildren(); items = []; let n = 0;
    groups.forEach(([name, arr]) => {
      if (!arr.length) return;
      const g = document.createElement('li'); g.className = 'g'; g.textContent = name; list.appendChild(g);
      arr.forEach(src => {
        const it = { ...src, no: String(++n).padStart(2, '0') };
        const li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
        b.innerHTML = `<span class="no">${it.no}</span><span></span><span class="st${isText(it.src) ? ' t' : ''}">${isText(it.src) ? '출력' : '캡처'}</span>`;
        b.children[1].textContent = it.t;
        const i = items.length;
        b.addEventListener('click', e => { e.stopPropagation(); show(i); });
        it.btn = b; li.appendChild(b); list.appendChild(li); items.push(it);
      });
    });
  };
  build([['백업', EV_BAK]]);
  // 이중화 캡처가 있는지는 발표자 도구를 켤 때(E 키) 한 번만 본다. 평소 화면에서 없는 파일을 찾느라 콘솔에 404가 남지 않게 하려는 것이다.
  // 덱 서버(WEBrick)의 폴더 목록에서 이름을 찾고, 목록을 못 읽으면 파일마다 직접 열어 본다
  let probed = false;
  const probeHA = () => {
    if (probed || !EVIDENCE_HA.length) return; probed = true;
    const dir = EVIDENCE_HA[0].src.replace(/[^/]*$/, '');
    fetch(dir, { cache: 'no-store' }).then(r => r.ok ? r.text() : Promise.reject())
      .then(html => EVIDENCE_HA.filter(e => e.src.startsWith(dir) && html.includes('>' + e.src.slice(dir.length) + '<')))
      .catch(() => Promise.all(EVIDENCE_HA.map(e => exists(e.src).then(ok => ok ? e : null))).then(a => a.filter(Boolean)))
      .then(ha => {
        if (!ha.length) return;
        build([['이중화', ha], ['백업', EV_BAK]]);
        if (fig.open) show(0);
      });
  };
  const watchTools = () => { if (document.body.classList.contains('tools')) probeHA(); };
  new MutationObserver(watchTools).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  watchTools();
  function show(i) {
    at = Math.max(0, Math.min(items.length - 1, i));
    const it = items[at];
    items.forEach(x => x.btn.classList.toggle('cur', x === it));
    cap.innerHTML = ''; const b = document.createElement('b'); b.textContent = it.no + ' ' + it.t; cap.append(b, it.d);
    shot.replaceChildren();
    if (isText(it.src)) {
      const p = document.createElement('pre'); shot.appendChild(p);
      fetch(it.src, { cache: 'no-store' }).then(r => r.text()).then(t => { p.textContent = t.trim(); }).catch(() => { p.textContent = '파일을 읽지 못했습니다: ' + it.src; });
    } else { const im = document.createElement('img'); im.src = it.src; im.alt = it.t + ' 캡처: ' + it.d; shot.appendChild(im); }
    shot.scrollTop = 0;
    it.btn.scrollIntoView({ block: 'nearest' });
  }
  const closeFig = () => { if (fig.open) fig.close(); openBtn.blur(); };
  // 도구가 꺼져 있으면 숨은 단추를 눌러도 열지 않는다
  openBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (!document.body.classList.contains('tools')) return;
    show(0);
    try { fig.showModal(); } catch (err) { fig.setAttribute('open', ''); }
    try { fig.focus(); } catch (err) {}
  });
  $('close-fig').addEventListener('click', e => { e.stopPropagation(); closeFig(); });
  // 닫을 때 숨은 단추에서 초점을 빼 스페이스·엔터로 다시 열리지 않게 한다
  fig.addEventListener('close', () => openBtn.blur());
  // 창이 열려 있는 동안은 ← → 를 덱보다 먼저 받아 목록을 넘긴다.
  // 덱(index.html)은 장을 다 읽은 뒤에 같은 자리(창의 캡처 단계)에 키를 걸므로, 먼저 건 이 처리가 앞선다
  addEventListener('keydown', e => {
    if (!fig.open) return;
    const d = { ArrowRight: 1, ArrowDown: 1, PageDown: 1, ' ': 1, ArrowLeft: -1, ArrowUp: -1, PageUp: -1 }[e.key];
    const to = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : d ? at + d : null;
    if (to === null) return;
    e.preventDefault(); e.stopImmediatePropagation();
    show(to);
  }, true);

  // ---- 단계: 0 열림(평소 모습), 1 자동 전환, 2 되돌림(pg_rewind), 3 백업해 서버 밖에 보관, 4 백업으로 복원해 원본과 대조. 그다음 → 는 다음 장 ----
  // 앞으로는 다음 단계를 그리고, 뒤로는 앞 단계의 끝 모습을 바로 보인다. 원본 창이 열려 있으면 닫기만 한다.
  // stage 의 g1~g4 는 '그 단계 이상'(CSS 가 보이기·숨기기를 이것으로 정한다)
  const LAST = 4;
  let step = 0;
  const render = (n, inst) => {
    stage.classList.toggle('inst', !!inst); step = n; stage.dataset.step = n;
    for (let k = 1; k <= LAST; k++) stage.classList.toggle('g' + k, n >= k);
  };
  // 움직임을 줄인 환경과 #last(뒤로 돌아올 때)는 마지막 단계의 끝 모습을 움직임 없이
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash === '#last') { stage.classList.add('done'); render(LAST, true); }
  else render(0, false);
  window.deckStep = d => {
    if (fig.open) { closeFig(); return true; }
    if (d > 0 && step < LAST) { render(step + 1, false); return true; }
    if (d < 0 && step > 0) { render(step - 1, true); return true; }
    return false;
  };
  if (window.parent === window) addEventListener('keydown', e => {
    if (fig.open) return;
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });
})();
</script>
