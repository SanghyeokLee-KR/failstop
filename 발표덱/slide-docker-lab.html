<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-1 시험 환경</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --ink-4: #5F6B7C;
    /* 덱 공통 --ink-3 과 같은 값으로 맞춘 낮은 회색(회색 머리띠 위 글자 대비 4.6:1) */
    --side: #A8B3C2;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
    /* 밝은 강의실 프로젝터에서도 상자 · 선 · 머리띠가 남도록 몸통 · 선 · 회색 테두리를 한 단계씩 밝혔다 */
    --box: color-mix(in srgb, var(--card) 50%, var(--stage));
    /* 파랑은 '사양을 제한한 컨테이너' 한 가지 뜻으로만 쓴다. 제한한 카드는 머리띠(넓은 면) · 몸통 · 테두리 · 아이콘이 모두 파랗고,
       나머지 카드 · 선 · 테두리는 무채색으로 두어 범례 없이도 파란 카드가 제한한 컨테이너로 읽히게 한다 */
    --lim: color-mix(in srgb, #79A7FA 28%, var(--box));
    --hd-lim: #1D5C9E;
    --wire: #848B96;
    --edge: #757B85;
    --pc: color-mix(in srgb, var(--card) 7%, var(--stage));
    /* 제한하지 않은 컨테이너의 머리띠: 몸통보다 한 단계 밝은 무채색(흐린 프로젝터에서도 머리띠가 몸통과 갈리게) */
    --hd: #3A4456;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; transform: translate(-50%, -50%) scale(.5); background: var(--stage); overflow: hidden; }
  .head { position: absolute; left: 130px; right: 130px; top: 64px; height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .title .tag { margin-left: auto; }
  .tag img { width: 26px; height: 26px; }
  /* 환경 표식은 제목이 거의 자리 잡은 뒤(0.25초) 나타나게 해 첫 화면에 표식만 먼저 보이거나 제목 줄이 둘로 갈려 보이지 않게 한다(04-3 VM 장들과 같은 박자) */
  .title .env { margin-left: 14px; animation: fade .6s .25s ease-out both; }
  .tag { display: inline-flex; align-items: center; gap: 10px; font-family: var(--sans); font-size: 22px; color: var(--ink-3); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
  .tag:hover { border-color: var(--card); color: var(--ink-2); }
  .tag .mx { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* 원본 구성도 보기(E 키 도구) */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); }
  .fig::backdrop { background: color-mix(in srgb, var(--ground) 90%, transparent); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .25s ease-out; }
  .fig .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 24px; font-size: 22px; color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); font-size: 22px; }
  .fig .bar .x { margin-left: auto; font-family: var(--sans); font-size: 22px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; }
  .fig .view { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 24px 24px; }
  .fig img { max-width: calc(100vw - 48px); max-height: calc(100vh - 80px); border-radius: 6px; background: var(--ink); cursor: zoom-in; }
  .fig.zoom .view { place-items: start; }
  .fig.zoom img { max-width: none; max-height: none; width: 260%; cursor: zoom-out; }

  /* 도면: PC 한 대의 Docker 시험 환경. 상자마다 진짜 컨테이너처럼 머리띠에 컨테이너 이름(docker ps 의 이름)을 단다.
     발표에서는 '개발 단계에서는 Docker로 클라우드 · VM과 같은 사양으로 배포 환경을 따라 만들어 시험했다' 한 문장만 하고 넘기는 장이라 단계가 없다.
     장이 열리면 저절로, 박자 셋으로 2.1초에 끝나고(2026-10-05 사용자 지시로 너무 빠르지 않게 늦췄다) 그 뒤에는 멈춘다(말하는 동안 시선을 뺏지 않게).
     ① 0초: 제목과 개발 PC 테두리. 0.4초에 터미널과 설명이 한 번에 나온다(타자 효과는 너무 빨라 뜻이 없어 뺐다).
     ② 1.0초: 컨테이너와 시험 도구, 선이 '한 번에 실행'대로 한꺼번에 떠오른다. 시험 도구는 시간차가 아니라 노란 점선으로만 가른다.
        API · DB 컨테이너는 처음부터 파란 모습으로 뜬다. 자원 한도는 컨테이너를 만들 때 함께 거는 값이라, 켜진 뒤 따로 파래지면
        기동 완료 같은 상태 변화로 읽히기 때문이다.
     ③ 1.5초: 카드가 자리 잡을 무렵 도면 아래 한 줄 요약이 나와(파랑이 무슨 뜻인지 곧바로 정해지게) 파란 숫자가 파란 카드와 색으로 이어진다(같은 사양은 요약에 한 번만 쓴다.
        카드마다 붙이던 자원 표는 2026-10-04 사용자 결정으로 뺐다).
     파랑은 이 '제한' 한 가지 뜻으로만 쓰려고, 제한하지 않은 카드의 머리띠 · 아이콘과 선 · 테두리, 터미널 프롬프트는 무채색으로 둔다.
     부하 · 장애 시험의 수치는 본편에서 빼고 부록(A1 트래픽 천장, A2 부하·장애 시험)에 두었다 */
  /* 도면은 머리말 줄과 같은 좌우 끝(130 ~ 1790)에 맞춘다. PC 테두리 = 도면 전체 폭, 안쪽 여백 40 */
  .dia { position: absolute; left: 130px; top: 232px; width: 1660px; height: 790px; overflow: visible; }
  .dia text { font-family: var(--sans); }
  /* PC 테두리는 카드 테두리보다 한 단계 얇게 두어(2 대 2.4) 카드가 앞에 서 보이게 한다 */
  .dia .pc { fill: var(--pc); stroke: var(--edge); stroke-width: 2; animation: fade .7s ease-out both; }
  /* 개발 PC 이름표: PC 테두리 왼쪽 위 선 위에 얹어(바탕을 칠해 선을 끊는다) 발표의 '개발 단계'가 처음부터 보이게 한다 */
  .dia .pcl { animation: fade .7s ease-out both; }
  .dia .pcl rect { fill: var(--stage); }
  .dia .pcl text { font-size: 26px; font-weight: 600; fill: var(--ink); }
  /* 묶음 이름(Spring Boot API · PostgreSQL): 틀 없이 열 머리 글자로만 둔다(틀은 흐린 프로젝터에서 사라지고 층만 늘렸다) */
  .dia .cap { font-size: 24px; fill: var(--ink-3); }
  /* 카드 이름은 요약 한 줄보다 가볍게(28px · 500) 두어 마지막 시선이 요약으로 모이게 한다 */
  .dia .nm { font-size: 28px; font-weight: 500; fill: var(--ink); }
  /* 컨테이너 카드(모두 높이 104, 모서리 14): 몸통(bf) 위에 머리띠(hd)와 컨테이너 이름(cn), 맨 위에 테두리(box).
     docker ps 에 나오는 이름처럼 보이게 이름은 고정폭 글꼴로 쓴다. 몸통에는 아이콘과 한국어 이름 한 줄만 둔다 */
  .dia .bf { fill: var(--box); }
  .dia .hd { fill: var(--hd); }
  /* 머리띠의 컨테이너 이름은 뒷줄에서도 읽히게 밝게 두되, 한국어 역할 이름보다 먼저 들어오지 않게 흰색보다 한 단계 낮춘다.
     고정폭 글꼴은 500까지만 실려 있어 그보다 굵게 하면 획이 번진다 */
  .dia .cn { font-family: var(--mono); font-size: 22px; font-weight: 500; fill: #D5DCE6; }
  /* 같은 한도를 걸지 않은 카드(봇 · nginx · k6)의 두 이름은 한 단계 낮은 회색으로 두어, 파란 카드보다 글자가 먼저 튀지 않게 한다 */
  .dia .bf:not(.lim) ~ .nm, .dia .bf:not(.lim) ~ .cn { fill: var(--side); }
  .dia .box { fill: none; stroke: var(--edge); stroke-width: 2.4; }
  .dia .box.test { stroke: var(--warm); stroke-dasharray: 9 7; stroke-width: 2.4; }
  /* 사양을 제한한 카드(API · DB): 테두리 · 몸통 · 머리띠가 파랗다 */
  .dia .box.sized { stroke: var(--brand); stroke-width: 4; }
  .dia .bf.lim { fill: var(--lim); }
  .dia .hd.lim { fill: var(--hd-lim); }
  /* 장애 주입 표식: 선 위에 얹는 작은 노란 점선 알약. 서버가 아니라 시험 장치라 바탕은 아주 옅게, 글자는 카드 이름보다 낮춘다 */
  .dia .mk { fill: color-mix(in srgb, var(--warm) 6%, var(--pc)); stroke: var(--warm); stroke-width: 2.4; stroke-dasharray: 9 7; }
  .dia .mkt { font-size: 24px; font-weight: 500; fill: var(--ink-2); }
  /* 맨 위 터미널과 설명: 제목이 자리 잡을 무렵(0.4초) 한 번에 나온다 */
  .dia .term { animation: fade .5s .4s ease-out both; }
  .dia .tm { fill: #0B0F16; stroke: var(--edge); stroke-width: 1.6; }
  /* 프롬프트(PS>)는 강조색을 파랑 · 노랑 둘로 줄이려고 회색으로 둔다 */
  .dia .tp { font-family: var(--mono); font-size: 24px; font-weight: 500; fill: var(--side); }
  .dia .tc { font-family: var(--mono); font-size: 24px; fill: var(--ink); }
  /* 터미널 설명은 카드 이름(28px)보다 한 단계 작게 두어 요약 · 카드와 다투지 않게 한다 */
  .dia .tcap { font-size: 24px; fill: var(--ink-2); }
  .dia .wire { fill: none; stroke: var(--wire); stroke-width: 3.5; marker-end: url(#ah); }
  .dia .wire.nm { marker-end: none; }
  .dia .ahp { fill: none; stroke: var(--wire); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* 컨테이너 · 시험 도구 · 선이 모두 같은 때(1.0초) 같은 움직임으로 떠올라, 떠오르는 동안에도 화살촉이 카드 가장자리에 붙어 있다 */
  .dia .nd { animation: rise .6s 1s cubic-bezier(.2,.7,.2,1) both; }

  /* ---- 한 줄 요약(1.5초) ----
     사양(2 vCPU · 2 GiB, docker run --cpus 2 --memory 2g 와 같은 뜻)은 요약에 한 번만 쓰고, 문장 앞쪽에 둔다(3초 안에 읽히게).
     요약은 제목(56px · 600)보다 가볍게 두고, 나머지 글자는 한 단계 낮은 회색, 숫자는 밝은 하늘색(파란 카드 아이콘과 같은 색) · 굵기 700 ·
     가장 큰 글자로 둔다. 숫자가 둘레 글자보다 어둡지 않고 크기 · 굵기로도 갈려, 흑백 · 흐린 프로젝터에서도 숫자가 먼저 들어온다 */
  .dia .sumg { animation: rise .6s 1.5s cubic-bezier(.2,.7,.2,1) both; }
  .dia .sum { font-size: 40px; font-weight: 600; fill: var(--side); }
  .dia .sum .hi { font-size: 46px; font-weight: 700; fill: var(--glow); }

  .stage.instant * { transition-duration: 0s !important; transition-delay: 0s !important; }
  /* 뒤로 돌아와(#last) 열면 그리기를 다시 돌리지 않고 끝 상태로 바로 연다. 애니메이션이 끝 값을 유지하므로(both) 길이 · 지연을 0으로 두면 된다 */
  .stage.quiet *, .stage.quiet *::before, .stage.quiet *::after { animation-delay: 0s !important; animation-duration: 0s !important; }

  /* 전체 화면 단추는 장을 따로 열었을 때 키보드 초점으로만 보인다(마우스가 무대 위에 있어도 청중에게 작은 글자가 나타나지 않게) */
  .fs { position: absolute; right: 130px; top: 20px; font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; opacity: 0; transition: opacity .3s, color .3s; }
  .fs:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>

  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>Docker로 클라우드·VM 배포 환경을 따라 만들어 시험</h1>
    <button class="tag orig" id="open-fig" type="button" aria-haspopup="dialog"><img src="assets/tint/ui-stack-2-side.svg" alt="">원본 구성도<svg class="mx" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button>

    <div class="view"><img id="fig-img" src="assets/img/docker-v7.png" alt="Docker 검증 환경 구성도 원본"></div>

  <svg class="dia" id="dia" viewBox="0 0 1660 790" role="img" aria-label="PowerShell 스크립트 demo-obs-up.ps1 하나로 docker 명령 여러 개를 묶어 PC 한 대에 띄운 컨테이너들이다. 스크립트가 DB, API, 나머지 순서로 컨테이너를 켠다. 시장 봇(bots)과 부하 시험 도구(k6)의 요청이 로드밸런서(nginx)를 거쳐 Spring Boot API 컨테이너 세 개로 간다. 거래 서버 두 대(api-1, api-2)는 장애 주입 장치(toxiproxy)를 거쳐 주 DB(pg)에 기록하고, 조회 서버(api-3)는 주 DB에서 바로 읽는다. 주 DB는 예비 DB(pg-standby)로 스트리밍 복제한다. API·DB 컨테이너마다 2 vCPU·2 GiB로 제한했고, AWS t3.small·실습 VM과 같은 사양이다.">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="ahp" d="M1 1 L9 5 L1 9"/></marker>
    </defs>
    <!-- 격자: 주문 줄 y271(bots · api-1 · 장애 주입 표식 · pg), 대기 줄 y403(nginx · api-2), 조회 줄 y535(k6 · api-3 · pg-standby). 줄 간격 132.
         카드 사이를 28 띄워 API 컨테이너 셋이 한 덩어리가 아니라 따로 선 컨테이너로 읽히게 했다(2026-10-05 사용자 제안. 그만큼 PC 테두리를 키우고 요약을 내렸다).
         컨테이너 카드는 모두 높이 104(카드 가운데가 줄에 온다), 모서리 14, 머리띠 28.
         머리띠: 이름 +14(기준선 +22). 몸통: 아이콘 40(+14, +46. 머리띠 이름과 왼쪽 끝을 맞춤) · 이름 +66(기준선 +77, 몸통 가운데).
         열 폭은 두 가지로 맞춘다: 바깥 열(봇 · k6 · nginx)과 DB 열 250, API 열 318.

<script>
(() => {
  const stage = document.getElementById('stage'), dia = document.getElementById('dia');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  document.getElementById('fs').addEventListener('click', toggleFs);
  const fig = document.getElementById('fig');
  const closeFig = () => { fig.classList.remove('zoom'); if (fig.open) fig.close(); };
  document.getElementById('open-fig').addEventListener('click', () => { if (!document.body.classList.contains('tools')) return; try { fig.showModal(); } catch (e) { fig.setAttribute('open', ''); } });
  document.getElementById('close-fig').addEventListener('click', closeFig);
  document.getElementById('fig-img').addEventListener('click', e => { e.stopPropagation(); fig.classList.toggle('zoom'); });
  fig.addEventListener('click', e => { if (e.target === fig || e.target.classList.contains('view')) closeFig(); });
  fig.addEventListener('close', () => fig.classList.remove('zoom'));
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // ---- 단계: 없다(한 문장 하고 넘기는 장이라 열리면 저절로 끝까지 돈다). 덱의 → · ← 는 바로 다음 · 앞 장으로 간다 ----
  // 다른 장과 같은 틀(set · deckStep)을 두어 #last 로 열거나 덱이 단계를 물어도 같은 방식으로 답한다.
  // #last 로 열면 quiet 가 붙어 그리기 없이 끝 상태로 바로 연다
  const LAST = 0;
  let step = 0;
  const set = (n, instant) => {
    step = n; stage.classList.toggle('instant', !!instant); stage.classList.toggle('quiet', !!instant); stage.dataset.step = n;
    for (let k = 1; k <= LAST; k++) stage.classList.toggle('at' + k, n >= k);
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
  };
  set(location.hash === '#last' ? LAST : 0, location.hash === '#last');
  window.deckStep = d => {
    if (fig.open) { closeFig(); return true; }
    if (d > 0 && step < LAST) { set(step + 1); return true; }
    if (d < 0 && step > 0) { set(step - 1, true); return true; }
    return false;
  };
  if (window.parent === window) addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });

  // ---- 글자 맞춤 ----
  // 글꼴을 받은 뒤, 상자 안 이름이 오른쪽 여백 14를 넘으면 글자를 1px씩 줄인다(브라우저마다 글꼴 폭이 달라도 튀어나오지 않게).
  // 한 줄 요약도 PC 테두리 오른쪽 끝(1660)을 넘으면 줄인다
  const fitAll = () => {
    try {
      const num = (r, k) => +r.getAttribute(k);
      const boxes = [...dia.querySelectorAll('rect.box')];
      const sum = dia.querySelector('text.sum');
      if (sum) { let fs = parseFloat(getComputedStyle(sum).fontSize), g = 0; while (sum.getBBox().x + sum.getBBox().width > 1660 && fs > 20 && g++ < 24) { fs -= 1; sum.style.fontSize = fs + 'px'; } }
      for (const t of dia.querySelectorAll('text.nm')) {
        const bb = t.getBBox(); if (!bb.width) continue;
        const cx = bb.x + 2, cy = bb.y + bb.height / 2;
        const box = boxes.filter(r => cx >= num(r, 'x') && cx <= num(r, 'x') + num(r, 'width') && cy >= num(r, 'y') && cy <= num(r, 'y') + num(r, 'height'))
          .sort((a, b) => num(a, 'width') * num(a, 'height') - num(b, 'width') * num(b, 'height'))[0];
        if (!box) continue;
        const right = num(box, 'x') + num(box, 'width') - 14;
        let fs = parseFloat(getComputedStyle(t).fontSize), guard = 0;
        while (t.getBBox().x + t.getBBox().width > right && fs > 16 && guard++ < 20) { fs -= 1; t.style.fontSize = fs + 'px'; }
      }
    } catch (e) {}
  };
  // 글꼴은 처음 쓰일 때 받기 시작해서, 스크립트가 도는 순간에는 document.fonts.ready 가 이미 끝난 것으로 나올 수 있다.
  // 그래서 페이지가 다 열린 뒤, 글꼴을 받은 뒤, 잠시 뒤에 한 번 더 잰다(줄이기만 하므로 여러 번 불러도 같다)
  fitAll();
  if (document.fonts) { document.fonts.ready.then(fitAll); document.fonts.addEventListener('loadingdone', fitAll); }
  addEventListener('load', fitAll);
  setTimeout(fitAll, 900);
})();
</script>
<!-- 발표 노트(15초): 개발 단계에서는 Docker를 이용해 클라우드나 VM과 같은 사양으로 배포 환경을 따라 만들고 시험해 봤습니다. -->
