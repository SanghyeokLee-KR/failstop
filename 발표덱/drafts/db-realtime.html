<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-5 DB 실시간 1:1</title>
<!-- 초안(drafts). 덱 폴더의 공통 파일을 한 단계 위(../)에서 읽는다. 덱 본편(루트)으로 옮길 때는 ../ 를 지우고, 장 번호(04-5)와 index.html SLIDES·목차를 함께 고친다 -->
<link rel="stylesheet" href="../assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --card: #46536A;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --side: #A3AEBC;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ai: #C6C0F2;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --term: #0C1016;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  /* 제목 상자 위 158px, 부제 244px(모든 본문 장 공통, deck.css), 본문은 300px 아래 */
  .title { position: absolute; left: 130px; right: 130px; top: 158px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .8s .1s cubic-bezier(.2,.7,.2,1) both; }
  .dek { position: absolute; left: 130px; right: 130px; top: 244px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .8s .3s ease-out both; }
  .tag { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; white-space: nowrap; }
  .tag img { width: 26px; height: 26px; }
  button.tag { font-family: var(--sans); background: transparent; cursor: pointer; transition: border-color .2s, color .2s; }
  button.tag:hover { border-color: var(--card); color: var(--ink-2); }
  button.tag:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .tag .mx { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-left: 2px; }

  /* 원본 설계·기록 창(E 키로 켠 발표자 도구에서만 열린다). 왼쪽 목록, 오른쪽 원문. 캡처가 아니라 저장소 파일의 원문을 글로 보인다 */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); }
  .fig::backdrop { background: rgba(8,10,15,.86); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .25s ease-out; }
  .fig .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 24px; font-size: 18px; color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); font-size: 18px; }
  .fig .bar .x { margin-left: auto; font-family: var(--sans); font-size: 18px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; }
  .fig .bar .x:hover { border-color: var(--card); }
  .ev { background: rgba(15,19,27,.97); }
  .ev .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; gap: 18px; padding: 0 24px 24px; }
  .ev ol { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .ev li button { width: 100%; text-align: left; font-family: var(--sans); font-size: 18px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; }
  .ev li button:hover { border-color: var(--card); color: var(--ink); }
  .ev li button.cur { border-color: var(--glow); color: var(--ink); background: rgba(168,200,255,.06); }
  .ev li .no { font-family: var(--mono); font-size: 18px; color: var(--ink-3); }
  .ev li .st { font-size: 18px; color: var(--ink-3); }
  .ev .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 10px; }
  .ev .cap { font-size: 18px; color: var(--ink-3); } .ev .cap b { color: var(--ink); font-weight: 600; font-size: 18px; margin-right: 10px; }
  .ev .shot { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--term); }
  .ev .intro { max-width: 1120px; padding: 32px 44px; font-size: 26px; line-height: 1.6; color: var(--ink-2); word-break: keep-all; }
  .ev .intro section + section { margin-top: 28px; }
  .ev .intro h3 { margin: 0 0 8px; font-size: 26px; font-weight: 600; color: var(--glow); }
  .ev .intro p { margin: 0 0 12px; }
  .ev .intro p:last-child { margin-bottom: 0; }
  .ev pre.code { margin: 0; padding: 26px 32px; font-family: var(--mono); font-size: 22px; line-height: 1.5; color: var(--ink-2); white-space: pre; tab-size: 2; }

  /* 도면: Patroni 설계 3-1 구성 요소(mermaid)를 선 그림으로 옮겼다. 위는 거래 서버, 가운데는 DB 길잡이 선, 아래는 두 DB와 관제 서버, 맨 아래는 투표 셋.
     viewBox와 같은 크기로 그려 글자 22px이 무대 위에서도 22px이다 */
  .topo { position: absolute; left: 110px; top: 284px; width: 1210px; height: 740px; animation: fade 1s .3s ease-out both; }
  .topo text { font-family: var(--sans); fill: var(--ink-2); }
  .topo .nm { font-size: 22px; font-weight: 600; fill: var(--ink); }
  .topo .sm { font-size: 22px; fill: var(--ink-3); transition: fill .3s; }
  .topo .sm.lit { fill: var(--ok); }
  .topo .st { font-size: 22px; font-weight: 600; transition: fill .3s; }
  .topo .st.ok { fill: var(--ok); }
  .topo .st.wa { fill: var(--warm); }
  .topo .st.no { fill: var(--bad); }
  .topo .st.gl { fill: var(--glow); }
  .topo .st.mu { fill: var(--ink-3); }
  .box { fill: var(--stage); stroke: var(--card); stroke-width: 1.6; transition: stroke .35s, fill .35s; }
  .box.hot { stroke: var(--bad); fill: #2A1F29; }
  .box.good { stroke: var(--ok); }
  .box.warn { stroke: var(--warm); }
  .box.rew { stroke: var(--glow); stroke-dasharray: 8 6; }
  .chip { fill: var(--stage); stroke: var(--side); stroke-width: 1.4; }
  .topo .chipt { font-size: 22px; fill: var(--ink-2); }
  .x { stroke: var(--bad); stroke-width: 3.4; stroke-linecap: round; opacity: 0; transition: opacity .25s; }
  .x.on { opacity: 1; }

  .wire { fill: none; stroke: var(--card); stroke-width: 2; }
  /* 길잡이가 DB로 내려가는 선: 지금 쓰는 길은 실선, 확인만 하는 길은 점선, 끊긴 길은 빨간 점선 */
  .drop { fill: none; stroke-width: 2.4; transition: stroke .35s, opacity .35s; }
  .drop.act { stroke: var(--side); }
  .drop.new { stroke: var(--ok); }
  .drop.idle { stroke: var(--card); stroke-dasharray: 6 6; }
  .drop.cut { stroke: var(--bad); stroke-dasharray: 5 6; opacity: .5; }
  /* 엄격 동기 복제: 두 줄(보냄·확인). 방향은 끝의 꺾쇠 */
  .sync .ln { fill: none; stroke: var(--ok); stroke-width: 2; transition: stroke .35s, opacity .35s; }
  .sync .hd { fill: none; stroke: var(--ok); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: opacity .3s, stroke .35s; }
  .sync.cut .ln { stroke: var(--bad); stroke-dasharray: 5 6; opacity: .45; }
  .sync.off .ln { opacity: .12; }
  .sync.weak .ln { stroke: var(--glow); stroke-dasharray: 6 6; }
  .sync.weak .hd { stroke: var(--glow); }
  /* 투표 셋: 호스트에서 내려온 짧은 선과 표끼리 잇는 점선 */
  .stub { fill: none; stroke: var(--card); stroke-width: 1.6; }
  .vline { fill: none; stroke: var(--card); stroke-width: 1.8; stroke-dasharray: 3 6; transition: stroke .3s, opacity .3s; }
  .vline.lit { stroke: var(--glow); }
  .vline.cut { stroke: var(--bad); opacity: .5; }
  .vote rect { fill: var(--stage); stroke: var(--side); stroke-width: 1.4; transition: stroke .3s, fill .3s; }
  .topo .vote text { font-size: 22px; fill: var(--ink-2); transition: fill .3s; }
  .vote.lit rect { stroke: var(--glow); fill: rgba(168,200,255,.1); }
  .topo .vote.lit text { fill: var(--glow); }
  .vote.lit.pulse rect { animation: pulse .9s ease-out 2; }
  @keyframes pulse { 0% { stroke-width: 5; } 100% { stroke-width: 1.4; } }
  .vote.dead rect { stroke: var(--bad); fill: rgba(255,122,122,.12); }
  .topo .vote.dead text { fill: var(--bad); }

  /* 흐름 확인: 선택 고리, 지나간 길, 점, 멈춤 표시 */
  .hit { fill: transparent; cursor: pointer; }
  .hit:hover { fill: rgba(168,200,255,.05); }
  .hit:focus { outline: none; }
  .hit:focus-visible { outline: none; stroke: var(--brand); stroke-width: 2; }
  .ring { fill: none; stroke-width: 2.4; stroke-dasharray: 5 4; opacity: 0; transition: opacity .2s; }
  .ring.on { opacity: 1; }
  .ring.src { stroke: var(--glow); }
  .ring.ok { stroke: var(--ok); stroke-dasharray: none; }
  .ring.no { stroke: var(--bad); stroke-dasharray: none; }
  .ring.rew { stroke: var(--glow); }
  .ring.hop { stroke: var(--glow); stroke-dasharray: none; stroke-width: 3; animation: hop .5s ease-out; }
  @keyframes hop { 0% { stroke-width: 7; opacity: .4; } 100% { stroke-width: 3; opacity: 1; } }
  .trail { fill: none; stroke: var(--glow); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: .45; }
  .trail.ok { stroke: var(--ok); }
  .trail.wal { stroke: var(--ok); stroke-width: 4; }
  .trail.rd { stroke: var(--side); }
  .pkt { fill: var(--glow); }
  .pkt.ok, .pkt.wal { fill: var(--ok); }
  .pkt.rd { fill: var(--side); }
  .burst { fill: none; stroke: var(--bad); stroke-width: 3; opacity: 0; }
  .burst.on { animation: burst .6s ease-out both; }
  @keyframes burst { from { opacity: 1; r: 18; } to { opacity: 0; r: 60; } }
  .spark { fill: var(--ok); }

  /* 오른쪽: 장애 대응 확인(결과·빠른 버튼)과 대응 순서 */
  .side { position: absolute; left: 1372px; right: 130px; top: 300px; display: flex; flex-direction: column; gap: 18px; }
  .blk { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .blk:nth-child(1) { animation-delay: .5s; }
  .blk:nth-child(2) { animation-delay: .65s; }
  .blk .k { font-size: 22px; line-height: 1.3; color: var(--ink-3); letter-spacing: .02em; }

  /* 결과: 첫 줄에 지금 일어난 일과 시각(또는 판정), 아래 두 줄에 왜 그렇게 되는지 */
  .res { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 11px 18px; height: 128px; overflow: hidden; box-sizing: border-box; background: rgba(255,255,255,.02); transition: border-color .25s; }
  .res .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .res .fr { min-width: 0; font-size: 22px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .fr b { font-weight: 600; color: var(--ink); }
  .res .ph { color: var(--ink-3); }
  .res .vd { flex: none; font-size: 30px; font-weight: 600; letter-spacing: -.01em; line-height: 1.25; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .res .why { margin-top: 6px; font-size: 22px; line-height: 1.4; color: var(--ink-3); word-break: keep-all; white-space: pre-line; }
  .res.ok { border-color: rgba(45,209,150,.55); } .res.ok .vd { color: var(--ok); }
  .res.no { border-color: rgba(255,122,122,.6); } .res.no .vd { color: var(--bad); }
  .res.wa { border-color: rgba(232,192,122,.6); } .res.wa .vd { color: var(--warm); }
  .res.rw { border-color: rgba(168,200,255,.55); } .res.rw .vd { color: var(--glow); }
  .res.na .vd { color: var(--side); }

  .quick { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .quick button { font-family: var(--sans); font-size: 22px; line-height: 1.25; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; white-space: nowrap; transition: border-color .2s, color .2s, background .2s; }
  .quick button:hover { border-color: var(--card); color: var(--ink); }
  .quick button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .quick button i { font-style: normal; font-size: 22px; }
  .quick button i.y { color: var(--ok); } .quick button i.w { color: var(--warm); } .quick button i.s { color: var(--side); }
  .quick button.cur { border-color: var(--glow); color: var(--ink); background: rgba(168,200,255,.06); }

  /* 대응 순서: 기록의 시각을 한 줄씩. 지금 단계는 밝히고 지난 단계는 흐리게 둔다 */
  .seq { margin-top: 10px; background: var(--term); border: 1px solid var(--line); border-radius: 10px; padding: 8px 18px 10px; font-size: 22px; line-height: 1.42; color: var(--ink-2); }
  .seq .row, .seq .ft { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; white-space: nowrap; margin: 0 -10px; padding: 1px 10px; border-radius: 5px; transition: background .25s, opacity .25s; }
  .seq .t { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .seq .t.kr { font-family: var(--sans); }
  .seq .row.r .t { color: var(--bad); } .seq .row.w .t { color: var(--warm); } .seq .row.g .t { color: var(--ok); } .seq .row.m .t { color: var(--glow); }
  .seq em { font-style: normal; font-size: 22px; color: var(--warm); border: 1px solid rgba(232,192,122,.5); border-radius: 5px; padding: 0 7px; margin-left: 10px; }
  .seq .ft { margin-top: 6px; padding-top: 7px; border-top: 1px solid var(--line); border-radius: 0; color: var(--ink-3); }
  .seq .ft .t { font-family: var(--sans); color: var(--ink-2); }
  .seq.focus .row, .seq.focus .ft { opacity: .45; }
  .seq.focus .row.done { opacity: .8; }
  .seq .row.on, .seq .ft.on { opacity: 1 !important; }
  .seq .row.on.r { background: rgba(255,122,122,.13); }
  .seq .row.on.w { background: rgba(232,192,122,.14); }
  .seq .row.on.g { background: rgba(45,209,150,.12); }
  .seq .row.on.m { background: rgba(168,200,255,.1); }
  .seq .ft.on .t { color: var(--ok); }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }
  .fs:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .spark { display: none; }
  }
</style>
<link rel="stylesheet" href="../deck.css">

<div class="stage" id="stage">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">주요 설계 및 구현</span>04-5</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>실시간 1:1, 두 DB에 기록해야 확정</h1>
    <button class="tag orig" id="open-ev" type="button" aria-haspopup="dialog"><img src="../assets/tint/postgresql-side.svg" alt="">원본 설계·기록<svg class="mx" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button>
    <span class="env" style="margin-left:14px"><img src="../assets/tint/docker-side.svg" alt="">로컬 Docker · 시연 스택</span>
  </div>
  <p class="dek">주 DB가 멈추면 예비 DB가 자동 승격하고, 옛 주 DB는 되감아 예비로 돌린 뒤 거래를 재개</p>

  <dialog class="fig ev" id="ev" aria-label="DB 실시간 이중화 원본 설계와 기록">
    <div class="bar"><b>Patroni 엄격 동기 · 원본 설계와 기록</b><span>설계·설정은 저장소 원문 발췌, 기록은 판정 파일의 값을 옮기고 한글 풀이를 붙임</span><button class="x" id="close-ev" type="button">닫기 (Esc)</button></div>
    <div class="body"><ol id="ev-list"></ol><div class="pane"><div class="cap" id="ev-cap"></div><div class="shot" id="ev-shot"></div></div></div>
  </dialog>

  <svg class="topo" viewBox="0 0 1210 740" role="img" aria-label="거래 서버 1·2와 관제 서버가 각자의 DB 길잡이로 주 DB에만 연결하고, 주 DB는 예비 DB와 엄격 동기 복제하며, 주 DB·예비 DB·관제 서버의 세 표 중 둘이 주 DB를 정하는 구성">
    <!-- 연결선. DB 길잡이(서버마다 하나인 HAProxy)가 1초마다 두 DB에 주 DB인지 묻고 주 DB로만 넘긴다 -->
    <path class="wire" d="M330 208V262M870 208V262M1105 328V262M220 262H1105"/>
    <path class="drop act" id="drop-L" d="M220 262V346"/>
    <path class="drop idle" id="drop-R" d="M780 262V346"/>
    <text class="sm" x="555" y="249" text-anchor="middle">1초마다 주 DB를 확인해 주 DB로만 연결</text>
    <path class="stub" d="M220 582V630M780 582V630M1105 582V630"/>
    <path class="vline" id="vl-a" d="M276 648H724"/>
    <path class="vline" id="vl-b" d="M836 648H1049"/>

    <!-- 엄격 동기 복제: 주 DB가 보낸 WAL을 예비 DB가 디스크에 쓴 뒤에야 확인이 돌아온다 -->
    <g class="sync" id="sync">
      <path class="ln" d="M400 452H600M400 464H600"/>
      <path class="hd" id="hd-LR" d="M583 444L597 458L583 472"/>
      <path class="hd" id="hd-RL" d="M417 444L403 458L417 472" style="opacity:0"/>
    </g>

<!-- 발표 노트(45초): 연구소장님 숙제대로 DB를 둘로 나눴다. 첫째는 실시간 1:1이다. 주 DB 한 대와 예비 DB 한 대를 Patroni가 엄격 동기 복제로 묶어, 주문은 예비 DB가 디스크에 쓴 뒤에만 확정된다. 거래 서버마다 둔 DB 길잡이(HAProxy)가 1초마다 누가 주 DB인지 물어 주 DB로만 연결하고, 주 DB를 누가 맡을지는 주 DB·예비 DB·관제 서버의 세 표(etcd) 중 둘이 정한다.
→ 다섯 번: ⓪ 평상시 쓰기(두 DB에 기록된 뒤 확정) ① 주 DB 강제 종료, 3.9초에 거래 일시 중단 ② 27.0초에 예비 DB 자동 승격, 30.5초에 조회 복구. 동기 예비가 없어 주문은 계속 멈춘다 ③ 55.9초에 옛 주 DB를 다시 켜면 Patroni가 되감아(pg_rewind) 예비로 붙인다 ④ 95.9초에 거래 재개. 확인받은 쓰기 16,858건 가운데 사라진 것 0건.
세부(질문 대비): 엄격 동기라 예비 DB가 없으면 주 DB가 살아 있어도 주문을 멈추고(423 거래 일시 중단) 조회는 계속 받는다. E-P2a(예비 DB 90초 정지)에서 1.7초에 중단을 알렸고, 예비 DB가 돌아온 뒤 96.7초에 사람 조작 없이 재개했으며, 중단 동안 조회 435건이 모두 성공하고 주문 87건은 모두 423이었다. 유실 0을 가용성보다 앞에 둔 사용자 결정(ADR 0036)의 대가다. 관제 서버의 투표 하나를 멈춘 E-P4a에서는 상태 표본 152건 중 거래 중단 0이었고 주 DB와 거래 리더가 그대로였다. 옛 주 DB를 영영 잃으면 사람이 새 인스턴스, etcd 멤버 교체, --no-slot 베이스백업으로 새 예비 DB를 붙일 때까지 주문이 멈춘다(Patroni 설계 9-5. 목표 60분은 AI 제안이라 확정 전이고 실행 기록은 없다). 두 DB를 함께 잃는 이중 장애는 WAL 보관(아카이브)이 없어 범위 밖이고 다음 장의 백업이 맡는다. AI는 어느 모드에서도 DB 승격·전환을 실행하지 않는다(ADR 0035). DB 길잡이는 1초 간격 두 번 실패하면 그 DB를 내리고 열린 연결을 끊는다(haproxy.cfg inter 1s fall 2, shutdown-sessions).
사실 범위: 시각표는 로컬 Docker 시연 스택의 13회차(2026-09-27 15:05 UTC, harness/evidence/demo-patroni-failover-20260927-1505)다. 판정 파일의 결과는 INCONCLUSIVE다. 사후 불변식 run을 돌리지 않았기 때문이고, 판정한 축(승격 27.044초 ≤ 30, 확인받은 쓰기 유실 0, 구 epoch 쓰기 0, 주문 500 0 등)은 모두 통과했다. '사라진 것 0건'은 ACK 기록기의 확인받은 쓰기 16,858건 대조이고, 주입 직전 60초에 보인 주문 974건·체결 661건도 모두 남았다. 옛 주 DB는 시연 도구가 촬영에 맞춰 55.9초에 켰다(운영에서는 사람). 시간 축까지 PASS로 판정한 회차는 2026-09-25 E-P1(승격 22.75초, 06-2 결과 장의 값)이다. 리더 키 시간 값이 로컬 20·5·5(AWS 기본 30·10·10)라 AWS의 시간은 다르다. 학교 AWS DB는 아직 비동기 복제·수동 승격이고 Patroni는 적용하지 않았다.
호스트명: 거래 서버 1·2=chaos-api-1·2(AWS app-1·app-2), 관제 서버=bot-1, 주·예비 DB=chaos-db-1·2(db-1·db-2, 13회차 뒤 db-2가 주 DB), DB 길잡이=HAProxy 사이드카, 투표=etcd 세 멤버. -->

  // 관제 서버의 투표 하나 정지(E-P4a): 남은 두 표가 과반이라 아무것도 바뀌지 않는다
  function playV() {
    cancelAuto(); stopAll(); base(); markQuick('V');
    votes({ v3: 'dead', b: 'cut' }); ring('v3', 'no');
    seqShow('V', [0, 1, 2]);
    show('ok', '<b>관제 서버</b>의 투표 정지', '영향 없음', '남은 두 표로 과반 유지\n주 DB 그대로 · 거래 중단 0');
    later(() => writeTrip('A1', 'L'), 600);
    later(() => {
      soft(); votes({});
      seqShow('V', [3], [0, 1, 2], true);
      show('ok', '투표 다시 켬', '60.6초', '세 표로 돌아옴\n주 DB와 거래 리더 그대로');
    }, 3800);
  }
  // 두 DB를 함께 잃음: 실험 기록이 없다. ADR 0036의 범위 규칙만 보이고 다음 장(백업)으로 넘긴다
  function playD() {
    cancelAuto(); stopAll(); base(); markQuick('D');
    db('L', ROLE.dead, '주 DB'); db('R', ROLE.dead, '예비 DB'); drops('cut', 'cut'); sync('cut', ''); apps('DB 연결 장애', 'no');
    seqShow('D', [0, 1, 2]);
    show('na', '두 DB 모두 잃음', '범위 밖', 'WAL 보관이 없어 실시간 쪽으로 못 살림\n서버 밖 백업에서 복원(다음 장)');
  }
  function noRecord(k) {
    cancelAuto(); stopAll(); base(); seqShow('P'); ring(k, 'src');
    show('na', `<b>${k === 'v1' ? '주 DB' : '예비 DB'}</b>의 투표만 정지`, '기록 없음', '이 한 표만 멈춘 실험은 없음\n기록은 관제 서버의 투표 정지(E-P4a)');
  }
  function trip(app) {
    cancelAuto(); stopAll(); base(); seqShow('P');
    const fr = `<b>${app === 'A1' ? '거래 서버 1' : '거래 서버 2'}</b> → <b>주 DB</b> 쓰기`;
    show('', fr, '쓰는 중…', ''); ring(app, 'src');
    writeTrip(app, 'L', false, () => show('ok', fr, '확정', '주 DB가 예비 DB의 디스크 기록을 기다림\n두 DB에 모두 있어야 확인을 돌려줌'));
  }

  const HIT = { A1: () => trip('A1'), A2: () => trip('A2'), L: playP, R: playS, M: playV, v3: playV, v1: () => noRecord('v1'), v2: () => noRecord('v2') };
  document.querySelectorAll('.topo .hit').forEach(h => {
    h.addEventListener('click', () => HIT[h.dataset.id]());
    h.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); HIT[h.dataset.id](); } });
  });
  const PLAY = { P: playP, S: playS, V: playV, D: playD };
  document.querySelectorAll('#quick button').forEach(q => q.addEventListener('click', () => PLAY[q.dataset.s]()));

  // ---------- 발표자 단계 ----------
  // 덱에서 → 를 누를 때마다 주 DB 장애 대응을 한 단계씩 보이고, 목록 밖으로 나가면 false를 돌려 장을 넘긴다.
  // 저절로 재생하지 않는다. 주소가 #last로 열리면(뒤 장에서 돌아온 경우) 마지막 단계의 끝 모습을 바로 보인다.
  window.deckStep = d => {
    const n = cur + d;
    if (n < 0 || n >= P.length) return false;
    cancelAuto(); cur = n; P[n]();
    return true;
  };
  base(); seqShow('P');
  if (location.hash === '#last') { cur = P.length - 1; P[cur](true); }
})();
</script>
