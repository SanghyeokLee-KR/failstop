<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 07 시연</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --edge: #7D8BA5;
    --wire: #6A7489;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ai: #C6C0F2;
    --ok: #2DD196;
    --warm: #E8C07A;
    --bad: #FF7A7A;
    --ease: cubic-bezier(.45,0,.25,1);
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .6s 0s var(--ease) both; }
  .title .play { margin-left: auto; animation: fade .6s .25s var(--ease) both; }
  .title .env { margin-left: 14px; animation: fade .6s .25s var(--ease) both; }
  .tag { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 14px 4px 12px; white-space: nowrap; }
  button.tag { font-family: var(--sans); background: transparent; cursor: pointer; }
  .tag svg { width: 20px; height: 20px; fill: var(--ink); }
  .tag .tm { font-family: var(--mono); color: var(--ink-3); }
  .play:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .dek { position: absolute; left: 130px; right: 130px; top: 232px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .6s .15s var(--ease) both; }

  /* 위 띠: 영상의 네 장면(평상시 운영 → 트래픽 급증 → DB 장애 → AI 상담). 칸마다 번호 · 이름 · 영상 속 시각.
     단계마다 앞 장면에서 다음 장면으로 장면 색의 길을 0.8초에 그리고, 길이 닿으면 그 칸이 장면 색으로 켜진다(04-6과 같은 꼴).
     색: 초록 정상 · 이어받음, 노랑 경보 · 보류, 빨강 장애, 라벤더 AI(영상 화면의 범례와 04-6의 뜻이 같다). 좌표는 viewBox 1660×84, 칸 폭 357 · 사이 77 */
  .flow { position: absolute; left: 130px; top: 296px; width: 1660px; height: 84px; overflow: visible; }
  .flow text { font-family: var(--sans); }
  .flow .wire { fill: none; stroke: var(--wire); stroke-width: 2; }
  .flow .tip { fill: var(--wire); }
  .flow .node .bx { fill: #1E2638; stroke: var(--edge); stroke-width: 2.5; }
  .flow .node .no { font-family: var(--mono); font-size: 22px; font-weight: 600; fill: var(--sc); }
  .flow .node .nm { font-size: 24px; font-weight: 600; fill: var(--ink); }
  .flow .node .tm { font-family: var(--mono); font-size: 22px; fill: var(--ink-2); }
  .flow .node { transition: opacity .35s var(--ease); }
  .flow .trail { fill: none; stroke: var(--v); stroke-width: 6; stroke-linecap: round; }
  .flow .rv { fill: none; stroke: #fff; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 100 200; }
  .flow .arrow { fill: var(--v); stroke: var(--v); stroke-width: 2; stroke-linejoin: round; }
  .flow .s { transition: opacity .35s var(--ease); }
  .stage:not(.g1) .s1, .stage:not(.g2) .s2, .stage:not(.g3) .s3 { visibility: hidden; }
  .stage.g2 .s1, .stage.g3 .s2 { opacity: .35; }
  .stage[data-step="1"] #m1 .rv, .stage[data-step="2"] #m2 .rv, .stage[data-step="3"] #m3 .rv { animation: draw .8s cubic-bezier(.45,0,.55,1) .3s both; }
  .stage[data-step="1"] .s1 .late, .stage[data-step="2"] .s2 .late, .stage[data-step="3"] .s3 .late { animation: fade .3s var(--ease) 1.3s both; }
  /* 칸 켜짐: ① 02, ② 03(02는 노랑 테두리를 남긴 채 흐림), ③ 네 칸 모두. 열림에서는 켜지 않는다 */
  .stage[data-step="1"] .flow .node:not(#n2), .stage[data-step="2"] .flow .node:not(#n3) { opacity: .45; }
  .stage.g1 #n2 .bx, .stage.g2 #n3 .bx, .stage.g3 .flow .node .bx { stroke: var(--sc); stroke-width: 3; }
  .stage[data-step="1"]:not(.inst) #n2 .bx, .stage[data-step="2"]:not(.inst) #n3 .bx { animation: lit .3s var(--ease) 1.1s both; }
  .stage[data-step="3"]:not(.inst) #n1 .bx, .stage[data-step="3"]:not(.inst) #n4 .bx { animation: lit .3s var(--ease) 1.1s both; }

  /* 아래 카드(04-6과 같은 틀): 왼쪽은 영상에서 뜬 서비스 흐름 정지 화면(원본 1920×1080에서 보일 구역만 잘라 배율대로), 오른쪽은 같은 번호의 설명 */
  .card { position: absolute; left: 130px; top: 404px; width: 1660px; height: 596px; box-sizing: border-box; background: #0B1019; border: 2px solid var(--line); border-radius: 14px; }
  .card .shot { position: absolute; left: 20px; top: 20px; width: 1044px; height: 552px; display: grid; place-items: center; }
  .card .side { position: absolute; left: 1100px; top: 20px; width: 536px; height: 552px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .card .side::before { content: ''; position: absolute; left: -18px; top: 24px; bottom: 24px; width: 1px; background: var(--line); }
  .ex { position: relative; flex: none; }
  .ex .clip { position: absolute; inset: 0; overflow: hidden; border-radius: 8px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
  .ex .clip img { position: absolute; display: block; }
  .mk { position: absolute; box-sizing: border-box; border: 3px solid var(--c); border-radius: 10px; box-shadow: 0 0 0 2px #0B1019, 0 0 0 6px color-mix(in srgb, var(--c) 30%, transparent); }
  .mk b, .an .no { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #0B1019; font-family: var(--mono); font-size: 22px; font-weight: 700; font-style: normal; }
  .mk b { position: absolute; right: -17px; top: calc(50% - 17px); }
  .an { display: grid; grid-template-columns: 34px 1fr; column-gap: 16px; align-items: start; }
  .an .no { margin-top: 1px; }
  .an h3 { margin: 0; font-size: 26px; font-weight: 600; line-height: 36px; color: var(--ink); }
  .an p { margin: 2px 0 0; font-size: 22px; line-height: 32px; color: var(--ink-2); word-break: keep-all; text-wrap: balance; }
  .side .hd { font-size: 22px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; }
  .side .ft { padding-top: 18px; border-top: 1px solid var(--line); font-size: 22px; line-height: 32px; color: var(--ink-3); word-break: keep-all; text-wrap: balance; }
  .side .ft i { font-style: normal; color: var(--fc, var(--ink-2)); font-weight: 600; margin-right: 10px; }

  /* 단계에 들어설 때만 움직인다(04-6과 같은 박자). 앞 카드 내용(복사본)이 0 ~ 0.3초에 0.35로 물러났다가 0.9 ~ 1.1초에 사라지고,
     띠의 길이 닿는 1.1초에 새 화면이 0.4초 떠오른 뒤, 번호 상자와 같은 번호의 설명이 1.6초부터 0.4초 간격, 끝 줄은 마지막 번호 0.4초 뒤 */
  .card.go .ex, .card.go .side .hd { animation: fade .4s var(--ease) 1.1s both; }
  .card.go .mk { animation: mark .3s var(--ease) var(--at) both; }
  .card.go .an, .card.go .ft { animation: fade .3s var(--ease) var(--at) both; }
  .card .ghost { position: absolute; inset: 0; pointer-events: none; animation: leave 1.1s linear both; }
  .card .ghost * { animation: none !important; }

  /* 열릴 때(약 1.9초): 제목 → 부제 → 칩, 띠 네 칸(0.35 ~ 0.95초), 회색 선(1.15초), 카드(1.3초) */
  .bd { animation: rise .6s var(--ease) backwards; }
  .b1 { animation-delay: .35s; } .b2 { animation-delay: .55s; } .b3 { animation-delay: .75s; } .b4 { animation-delay: .95s; } .b5 { animation-delay: 1.15s; } .b6 { animation-delay: 1.3s; }

  .stage.inst *, .stage.inst *::before, .stage.inst *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }
  .stage.done h1, .stage.done .dek, .stage.done .title .env, .stage.done .title .play, .stage.done .bd { animation: none !important; }

  /* 영상 창: 장 위를 모두 덮는다. 위쪽의 장면 표시와 닫기 단추는 멈췄을 때나 마우스를 움직일 때만 보인다 */
  .vid { position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #000; color: var(--ink); overflow: hidden; font-family: var(--sans); }
  .vid::backdrop { background: #000; }
  .vid[open] { display: block; animation: fade .3s ease-out; }
  .vid video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; outline: none; }
  .vid.playing:not(.awake) { cursor: none; }
  .vch, .vid .x { position: absolute; top: 20px; background: rgba(12,15,21,.84); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; opacity: 0; transition: opacity .3s; }
  .vid.awake .vch, .vid.awake .x, .vid:not(.playing) .vch, .vid:not(.playing) .x { opacity: 1; }
  .vch { left: 24px; display: flex; align-items: center; gap: 16px; padding: 10px 18px 11px; pointer-events: none; }
  .vch .no { font-family: var(--mono); font-size: 22px; color: var(--c, var(--ink-3)); }
  .vch b { font-size: 24px; font-weight: 600; }
  .vch .tm { font-family: var(--mono); font-size: 22px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .mini { position: relative; display: flex; width: 220px; height: 6px; border-radius: 3px; background: #1C2332; }
  .mini span { height: 100%; opacity: .3; }
  .mini span.on { opacity: 1; }
  .mini span + span { border-left: 2px solid #0C0F15; }
  .mini em { position: absolute; top: -5px; width: 2px; height: 16px; background: var(--ink); border-radius: 1px; }
  .vid .x { right: 24px; font-family: var(--sans); font-size: 22px; font-weight: 500; color: var(--ink); padding: 10px 18px; cursor: pointer; }
  .vid .x:focus-visible { opacity: 1; outline: 2px solid var(--brand); outline-offset: 3px; }
  .vid .err { position: absolute; left: 0; right: 0; top: 50%; margin: 0; transform: translateY(-50%); text-align: center; font-size: 26px; color: var(--ink-2); }
  .vid .err code { display: block; margin-top: 10px; font-family: var(--mono); font-size: 22px; color: var(--ink-3); }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes mark { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }
  @keyframes leave { 0% { opacity: 1; } 27% { opacity: .35; } 82% { opacity: .35; } 100% { opacity: 0; } }
  @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes lit { from { stroke: var(--edge); stroke-width: 2.5; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage" data-step="0">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">시연</span>07</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>요청이 몰릴 때, 주 DB가 멈출 때</h1>
    <button class="tag play" id="play" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>영상<span class="tm" id="ptm">7:00</span></button>
    <span class="env"><img src="assets/tint/docker-side.svg" alt="">로컬 Docker</span>
  </div>
  <p class="dek">로컬 Docker 시연 스택에서 녹화한 7분, 영상 속 주 화면은 실측으로 그린 서비스 흐름</p>

  <svg class="flow" id="flow" viewBox="0 0 1660 84" role="img" aria-label="영상의 네 장면: 평상시 운영, 트래픽 급증, DB 장애, AI 상담">
    <defs>
      <mask id="m1" maskUnits="userSpaceOnUse" x="-20" y="-20" width="1700" height="124"><path class="rv" d="M357 42 H433" pathLength="100"/></mask>
      <mask id="m2" maskUnits="userSpaceOnUse" x="-20" y="-20" width="1700" height="124"><path class="rv" d="M791 42 H867" pathLength="100"/></mask>
      <mask id="m3" maskUnits="userSpaceOnUse" x="-20" y="-20" width="1700" height="124"><path class="rv" d="M1225 42 H1301" pathLength="100"/></mask>
    </defs>
    <g class="bd b5">
      <path class="wire" d="M357 42 H434"/><path class="tip" d="M420 35 L434 42 L420 49 Z"/>
      <path class="wire" d="M791 42 H868"/><path class="tip" d="M854 35 L868 42 L854 49 Z"/>
      <path class="wire" d="M1225 42 H1302"/><path class="tip" d="M1288 35 L1302 42 L1288 49 Z"/>
    </g>
    <g class="s s1" style="--v: var(--warm)"><path class="trail" d="M357 42 H433" mask="url(#m1)"/></g>
    <g class="s s2" style="--v: var(--bad)"><path class="trail" d="M791 42 H867" mask="url(#m2)"/></g>
    <g class="s s3" style="--v: var(--ai)"><path class="trail" d="M1225 42 H1301" mask="url(#m3)"/></g>
    <g id="nodes"></g>
    <g class="s s1" style="--v: var(--warm)"><path class="arrow late" d="M410 27 L410 57 L433 42 Z"/></g>
    <g class="s s2" style="--v: var(--bad)"><path class="arrow late" d="M844 27 L844 57 L867 42 Z"/></g>
    <g class="s s3" style="--v: var(--ai)"><path class="arrow late" d="M1278 27 L1278 57 L1301 42 Z"/></g>
  </svg>

  <div class="card bd b6" id="card" aria-live="polite"><div class="shot" id="shot"></div><div class="side" id="side"></div></div>
</div>

<dialog class="vid" id="vid" aria-label="시연 영상 7분">
  <video id="vv" controls preload="auto" playsinline></video>
  <div class="vch" id="vch" aria-hidden="true"><span class="no" id="vno">01</span><b id="vtt"></b><span class="tm" id="vtm">0:00 / 7:00</span><i class="mini" id="mini"></i></div>
  <button class="x" id="vx" type="button">닫기 (Esc)</button>
  <p class="err" id="verr" hidden>영상을 열 수 없음<code id="vsrc"></code></p>
</dialog>

<script>
(() => {
  // ======== 영상을 다시 찍으면 여기만 고친다 ========
  // 장면의 시작 시각(초, 13회차 편집본에서 장면이 바뀌는 자막 시각). 정지 화면은 assets/demo 에 영상에서 뜬 서비스 흐름(자막 · 표시가 없는 시각)
  const VIDEO = { src: 'assets/video/failstop-demo-7min.mp4', end: 420, volume: .4 };
  const SCENES = [
    { no: '01', name: '평상시 운영', from: 0,   c: 'var(--ok)' },
    { no: '02', name: '트래픽 급증', from: 73,  c: 'var(--warm)' },
    { no: '03', name: 'DB 장애',     from: 254, c: 'var(--bad)' },
    { no: '04', name: 'AI 상담',     from: 372, c: 'var(--ai)' },
  ];
  const STILLS = { calm: 'assets/demo/flow-0057.jpg', load: 'assets/demo/flow-0250.jpg', fail: 'assets/demo/flow-0320.jpg' };   // 57.5초 · 250초 · 320초

  const $ = id => document.getElementById(id);
  const stage = $('stage');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  $('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  const mm = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  $('ptm').textContent = mm(VIDEO.end);
  $('nodes').innerHTML = SCENES.map((s, i) => { const x = i * 434, to = i < SCENES.length - 1 ? SCENES[i + 1].from : VIDEO.end;
    return `<g class="node bd b${i + 1}" id="n${i + 1}" style="--sc:${s.c}"><rect class="bx" x="${x}" y="4" width="357" height="76" rx="12"/>` +
      `<text class="no" x="${x + 20}" y="38">${s.no}</text><text class="nm" x="${x + 64}" y="38">${s.name}</text><text class="tm" x="${x + 64}" y="66">${mm(s.from)}–${mm(to)}</text></g>`; }).join('');

  // 단계 화면. cut 은 정지 화면에서 보일 구역 [x, y, w, h](원본 픽셀), k 는 배율, marks 는 [x, y, w, h, 색](원본 픽셀, 서비스 흐름 화면의 칸 자리).
  // 서비스 흐름 화면의 칸 배치는 녹화마다 같아, 영상을 다시 찍어도 좌표는 그대로 쓴다
  const C = { ok: 'var(--ok)', warn: 'var(--warm)', bad: 'var(--bad)', ai: 'var(--ai)', ppl: 'var(--brand)' };
  const STEPS = [
    { img: 'calm', cut: [40, 98, 1800, 940], k: .58, hd: '영상 속 서비스 흐름',
      marks: [[982, 226, 235, 294, 'ok'], [982, 548, 235, 220, 'warn'], [1293, 598, 505, 170, 'bad'], [49, 152, 236, 170, 'ai']],
      an: [['앱 서버 1·2', '평소 주문과 조회를 받음'], ['Auto Scaling', '조회가 몰리면 조회 서버인 앱 서버 3을 켬'], ['주 DB·예비 DB', '주 DB가 멈추면 예비 DB가 이어받음'], ['온프레미스 AI', '방금 일을 물으면 근거와 함께 답함']],
      ft: ['화면', '배치는 AWS 구성 그대로, 값은 로컬 Docker 스택의 실측', 'var(--ink-2)'] },
    { img: 'load', cut: [360, 210, 880, 560], k: .986, hd: '02 트래픽 급증',
      marks: [[695, 464, 188, 108, 'warn'], [1005, 262, 188, 236, 'warn'], [1005, 636, 188, 108, 'ok']],
      an: [['요청이 몰림', '부하 발생기가 조회 요청을 쏟아부음'], ['CPU 경보', '기준을 넘자 AI가 조회 서버 켜기를 제안'], ['승인 뒤 합류', '운영자가 승인하자 앱 서버 3이 붙어 셋이 나눠 받음']],
      ft: ['설계', '늘리는 것은 조회 서버뿐, 주문은 매칭 리더 한 곳', 'var(--warm)'] },
    { img: 'fail', cut: [960, 210, 850, 580], k: .952, hd: '03 DB 장애',
      marks: [[1317, 635, 188, 108, 'bad'], [1586, 635, 188, 108, 'ok'], [1005, 262, 188, 236, 'warn']],
      an: [['주 DB 강제 종료', '거래가 도는 중에 주 DB 서버를 끔'], ['예비 DB가 이어받음', 'Patroni가 사람 손 없이 새 주 DB로 올림'], ['쓰기 잠시 보류', '옛 주 DB가 되감기로 다시 붙으면 거래 재개']],
      ft: ['설계', '두 DB에 모두 기록한 뒤에만 주문을 확인', 'var(--bad)'] },
    { img: 'fail', cut: [40, 98, 1800, 940], k: .58, hd: '영상 뒤, 보고 길',
      marks: [[1317, 829, 188, 108, 'warn'], [1586, 829, 188, 108, 'ai'], [73, 829, 188, 108, 'ppl']],
      an: [['경보', '관측 서버가 울리고 푼 경보'], ['AI 운영 보고', '15분 지표와 경보 기록을 모아 보고서로'], ['Teams', '울릴 때와 풀릴 때 카드로 전송']],
      ft: ['이어서', '영상 속 경보가 Teams로 간 모습', 'var(--brand)'] },
  ];
  const LAST = STEPS.length - 1;
  const T0 = 1.6, GAP = .4;
  const card = $('card'), shot = $('shot'), side = $('side');

  function screen(s, n) {
    const [cx, cy, cw, ch] = s.cut, k = s.k, at = j => n === 0 ? '0s' : (T0 + j * GAP).toFixed(2) + 's';
    const marks = s.marks.map(([x, y, w, h, c], j) =>
      `<i class="mk" style="--c:${C[c]}; --at:${at(j)}; left:${((x - cx) * k).toFixed(1)}px; top:${((y - cy) * k).toFixed(1)}px; width:${(w * k).toFixed(1)}px; height:${(h * k).toFixed(1)}px"><b>${j + 1}</b></i>`).join('');
    shot.innerHTML = `<div class="ex" style="width:${Math.round(cw * k)}px; height:${Math.round(ch * k)}px"><div class="clip"><img src="${STILLS[s.img]}" alt="${s.hd}: 영상 속 서비스 흐름 화면" style="left:${(-cx * k).toFixed(1)}px; top:${(-cy * k).toFixed(1)}px; width:${(1920 * k).toFixed(1)}px; height:${(1080 * k).toFixed(1)}px"></div>${marks}</div>`;
    side.innerHTML = `<div class="hd">${s.hd}</div>` +
      s.an.map(([t, d], j) => `<div class="an" style="--c:${C[s.marks[j][4]]}; --at:${at(j)}"><span class="no">${j + 1}</span><div><h3>${t}</h3><p>${d}</p></div></div>`).join('') +
      `<div class="ft" style="--fc:${s.ft[2]}; --at:${n === 0 ? '0s' : (T0 + s.an.length * GAP).toFixed(2) + 's'}"><i>${s.ft[0]}</i>${s.ft[1]}</div>`;
  }

  // ---- 단계: 0 열림(영상 속 서비스 흐름), 1 트래픽 급증, 2 DB 장애, (②에서 → 나 V 로 영상), 3 영상 뒤 보고 길. 그다음 → 는 다음 장(보고 전달).
  //      앞으로는 앞 카드 내용의 복사본을 얹어 물러나게 하고 새 화면은 띠의 길이 닿는 1.1초부터, 뒤로는 앞 단계의 끝 모습을 바로 ----
  let step = 0, watched = false;
  const render = (n, inst) => {
    card.querySelectorAll('.ghost').forEach(g => g.remove());
    if (!inst && n > 0) {
      const g = document.createElement('div'); g.className = 'ghost'; g.setAttribute('aria-hidden', 'true');
      g.innerHTML = `<div class="shot">${shot.innerHTML}</div><div class="side">${side.innerHTML}</div>`;
      card.appendChild(g); g.addEventListener('animationend', () => g.remove());
    }
    stage.classList.toggle('inst', !!inst); step = n; stage.dataset.step = n;
    for (let k = 1; k <= LAST; k++) stage.classList.toggle('g' + k, n >= k);
    card.classList.remove('go'); void card.offsetWidth;
    screen(STEPS[n], n);
    if (!inst && n > 0) card.classList.add('go');
  };

  // ---- 영상 창 ----
  const vid = $('vid'), vv = $('vv'), vch = $('vch'), vno = $('vno'), vtt = $('vtt'), vtm = $('vtm'), mini = $('mini');
  vv.src = VIDEO.src; vv.volume = VIDEO.volume; $('vsrc').textContent = VIDEO.src;
  const sceneAt = s => { let k = 0; SCENES.forEach((sc, i) => { if (s >= sc.from) k = i; }); return k; };
  SCENES.forEach((sc, i) => { const g = document.createElement('span'); const to = i < SCENES.length - 1 ? SCENES[i + 1].from : VIDEO.end; g.style.width = ((to - sc.from) / VIDEO.end * 100) + '%'; g.style.background = sc.c; mini.appendChild(g); });
  const miniMark = document.createElement('em'); mini.appendChild(miniMark);
  const minis = [...mini.querySelectorAll('span')];
  function paint() {
    const s = vv.currentTime || 0, k = sceneAt(s);
    vch.style.setProperty('--c', SCENES[k].c);
    vno.textContent = SCENES[k].no; vtt.textContent = SCENES[k].name;
    vtm.textContent = `${mm(s)} / ${mm(VIDEO.end)}`;
    minis.forEach((g, i) => g.classList.toggle('on', i === k));
    miniMark.style.left = `calc(${(Math.min(s, VIDEO.end) / VIDEO.end * 100).toFixed(3)}% - 1px)`;
  }
  let wt = 0;
  const wake = () => { vid.classList.add('awake'); clearTimeout(wt); wt = setTimeout(() => vid.classList.remove('awake'), 2500); };
  function openVideo() {
    if (!vid.open) { try { vid.showModal(); } catch (e) { vid.setAttribute('open', ''); } }
    watched = true; paint(); wake();
    if (vv.ended) vv.currentTime = 0;
    const p = vv.play(); if (p && p.catch) p.catch(() => {});
  }
  function closeVideo() { vv.pause(); if (vid.open) { try { vid.close(); } catch (e) { vid.removeAttribute('open'); } } }
  const toggle = () => { if (vv.paused || vv.ended) { const p = vv.play(); if (p && p.catch) p.catch(() => {}); } else vv.pause(); };
  $('play').addEventListener('click', e => { e.stopPropagation(); openVideo(); });
  $('vx').addEventListener('click', closeVideo);
  // 영상을 닫으면(덱이 닫아도) 멈추고, 한 번이라도 연 뒤 ②에 있었으면 영상 뒤 단계(보고 길)로 넘어간다
  vid.addEventListener('close', () => { vv.pause(); paint(); if (watched && step === 2) render(3, false); });
  vid.addEventListener('mousemove', wake);
  vv.addEventListener('timeupdate', paint);
  vv.addEventListener('seeked', paint);
  vv.addEventListener('play', () => { vid.classList.add('playing'); paint(); });
  vv.addEventListener('pause', () => vid.classList.remove('playing'));
  vv.addEventListener('ended', () => { vid.classList.remove('playing'); paint(); });
  vv.addEventListener('error', () => { $('verr').hidden = false; vv.style.visibility = 'hidden'; });
  // 영상 중 키: Space · K 멈춤, Shift+← · → 5초 이동, 1~4 장면 처음으로(질문 대응), Esc 닫기.
  // → · PageDown · Enter 는 영상이 끝난 뒤에만 닫기로 쓰고 그 전에는 받기만 한다(다음 장으로 넘어가거나 영상이 튀지 않게). V 는 언제든 영상을 연다
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key, isV = k === 'v' || k === 'V' || e.code === 'KeyV';
    if (!vid.open) { if (isV) { e.preventDefault(); openVideo(); } return; }
    const take = () => { e.preventDefault(); e.stopImmediatePropagation(); };
    if (k === 'Escape') { take(); closeVideo(); return; }
    if (vv.ended && ['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { take(); closeVideo(); return; }
    if (k === ' ' || isV || k === 'k' || k === 'K') { take(); toggle(); wake(); return; }
    if ((k === 'ArrowRight' || k === 'ArrowLeft') && e.shiftKey) {
      take(); vv.currentTime = Math.min(Math.max((vv.currentTime || 0) + (k === 'ArrowRight' ? 5 : -5), 0), vv.duration || VIDEO.end); wake(); return;
    }
    if (/^[1-4]$/.test(k)) { take(); vv.currentTime = SCENES[+k - 1].from; wake(); return; }
    if (['ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Enter'].includes(k)) take();
  }, true);

  if (matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash === '#last') { stage.classList.add('done'); render(LAST, true); }
  else render(0, false);
  window.deckStep = d => {
    if (vid.open) return true;
    // ②에서 처음 누르는 → 는 영상을 연다(영상을 닫으면 보고 길로). 이미 본 뒤의 → 는 보고 길로 넘어간다
    if (d > 0 && step === 2 && !watched) { openVideo(); return true; }
    if (d > 0 && step < LAST) { render(step + 1, false); return true; }
    if (d < 0 && step > 0) { render(step - 1, true); return true; }
    return false;
  };
  if (window.parent === window) addEventListener('keydown', e => {
    if (vid.open) return;
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });
})();
</script>
<!-- 발표 노트(35초 + 영상 7분): 앞 장의 흐름을 실제 스택으로 돌린 7분 영상입니다. 로컬 Docker 시연 스택에서 녹화했고, 영상의 주 화면인 서비스 흐름은 AWS 구성대로 그렸고 값은 2초마다 Prometheus에서 읽은 실측입니다.
→ 1 요청이 몰리면 앱 서버 CPU가 기준을 넘고, AI가 조회 서버를 켜자고 제안합니다. 운영자가 승인하면 앱 서버 3이 붙습니다. 늘리는 건 조회 서버뿐입니다.
→ 2 거래 중에 주 DB를 끄면 Patroni가 예비 DB를 새 주 DB로 올립니다. 두 DB에 모두 기록해야 주문을 확인하므로, 옛 주 DB가 다시 붙을 때까지 새 주문은 잠시 멈춥니다.
→ 영상(자막이 설명합니다. 빨리 감은 구간은 오른쪽 위에 ×2·×3으로 표시). 영상 중에는 →가 넘어가지 않습니다. 끝나면 → 나 Esc로 닫습니다.
→ 3 영상 속 경보는 Teams로도 갔습니다. 그 카드와 보고서를 다음 장에서 보겠습니다.
질문 때:
- AWS에서 찍었나? 로컬 Docker 시연 스택에서 AWS 배치대로 그린 화면이고 값은 실측이다. 개인 AWS에도 Patroni 엄격 동기를 적용했다.
- 재개까지 95.9초, 옛 주 DB가 안 돌아오면? 엄격 동기 두 대라 동기 예비가 없으면 쓰기를 멈춘다. 새 예비를 붙이거나 엄격 모드를 잠시 푸는 것은 운영자가 판단한다. FailoverRtoExceeded 경보가 뜬 이유다.
- 04-6 평가는 qwen3.6 35B인데 영상은? 녹화 당시 개발 PC 모델이 gpt-oss:20b였다. 같은 평가에서 잘못 실행될 조치가 2/111이었고, 수동 모드라 실행은 승인 뒤에만 된다.
- 증설 기준 60%인가 50%인가? 로컬 시연 스택은 요청 제한 때문에 CPU가 60%대에 닿지 않아 50%로 낮췄다(로드맵 09-27). AWS 기준은 60%다.
- Grafana에서 앱 서버 3 CPU가 0→100%로 비스듬히 오른다? 꺼져 있던 동안 값이 없어 Grafana가 앞뒤 점을 직선으로 이은 것이다.
- 인프라 카드의 '수집 끊김'은? 로컬 호스트 지표 표시 문제다.
- AI 상담 답의 '리더 부재·파티션 재구축 실패'는? 남아 있던 경보(LeaderAbsent·PartitionRebuildFailing)를 근거로 답한 것이다(답 준비 필요).
- 마무리의 23초와 영상의 27초? 회차가 다르다. 영상은 13회차(승격 27.0초, 재개 95.9초, 확인받은 쓰기 16,858건 유실 0), 마무리는 9/25 Patroni 실험 값이다.
- 빨리 감은 구간의 실제 시간은? 화면에 표시했고 측정값은 원래 시각 기준이다.
- 사라진 주문 0건은 어떻게? 장애 전후 확인받은 쓰기 16,858건과 주문 974건을 두 노드에서 대조했다.
- 영상 이동: 이 맥의 덱 서버에서는 받아 둔 범위 밖으로 건너뛰면 멈출 수 있다. 처음부터 재생만 한다. 발표 주소에서 리허설한다. -->
