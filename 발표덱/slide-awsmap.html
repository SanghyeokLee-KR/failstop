<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페일스톱 04-5 AWS 구성도</title>
<link rel="stylesheet" href="assets/fonts/plex.css">
<style>
  :root {
    color-scheme: dark;
    --ground: #0F131B;
    --stage: #131824;
    --line: #2E3848;
    --edge: #7D8BA5;
    --wire: #8E9BB3;
    --ink: #F0F3F7;
    --ink-2: #BAC4D1;
    --ink-3: #8390A1;
    --brand: #79A7FA;
    --glow: #A8C8FF;
    --ok: #2DD196;
    --bad: #FF7A7A;
    --sel: #8FD3FF;
    --sans: 'IBM Plex Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'IBM Plex Mono', 'IBM Plex Sans KR', Consolas, 'Courier New', monospace;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .stage {
    position: fixed; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(.5);
    background: var(--stage);
    overflow: hidden;
  }

  .head {
    position: absolute; left: 130px; right: 130px; top: 64px; height: 52px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .head .l { display: flex; align-items: center; gap: 20px; font-size: 22px; color: var(--ink-2); }
  .head .l i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .head .code { font-family: var(--mono); font-weight: 500; letter-spacing: .06em; color: var(--ink); }
  .head .r { font-family: var(--mono); font-size: 22px; color: var(--ink); }
  .head .r .sec { font-family: var(--sans); color: var(--ink-3); margin-right: 16px; }

  .title { position: absolute; left: 130px; right: 130px; top: 150px; display: flex; align-items: baseline; gap: 24px; }
  h1 { margin: 0; font-size: 56px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; animation: rise .6s .1s cubic-bezier(.45,0,.55,1) both; }
  .title .tag { margin-left: auto; }
  .title .env { margin-left: 14px; }
  .tag { display: inline-flex; align-items: center; gap: 10px; font-size: 22px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 4px 12px; white-space: nowrap; }
  .tag img { width: 26px; height: 26px; }
  button.tag { font-family: var(--sans); background: transparent; cursor: pointer; }
  .tag .mx { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-left: 2px; }
  /* 부제는 단계마다 바꾸지 않는다. 판정은 도면 안 칩이 맡아 시선이 도면과 제목 줄을 오가지 않게 한다 */
  .dek { position: absolute; left: 130px; right: 130px; top: 232px; margin: 0; font-size: 26px; color: var(--ink-3); animation: fade .6s .2s ease-in-out both; }

  /* 도면: 최종 구성도(arch-v7)의 왼쪽 → 오른쪽 흐름(사용자 → CloudFront → 로드밸런서 → 앱 → DB → 관제)을 그대로 두고,
     데이터센터(AZ) 두 곳을 위아래 두 띠로 그려 같은 역할이 띠마다 한 대씩 거울처럼 놓이게 했다.
     두 띠에 걸친 것(로드밸런서, 조회 서버 자동 증설 그룹)은 띠 경계에 걸치거나 띠 앞에 둔다. 관제 서버는 AZ-c에만 있어 AZ-a 오른쪽은 비운다.
     밖에서 들어오는 쪽은 셋으로 나눴다: 왼쪽은 사용자(서비스 요청), 위는 운영자(관리)와 인터넷(직접 접속). 세 길이 엇갈리지 않는다.
     아이콘은 실제 색(AWS 공식 아키텍처 아이콘, 오픈소스 공식 로고. assets/aws, assets/color). 길 · 칩 · 판정의 색은 따로 정한다:
     파랑은 1단계(두 곳) 강조, 초록은 허용, 빨강은 차단, 선 · 테두리 · 글자는 회색. 노랑은 쓰지 않는다(시험 도구가 이 장에 없다).
     카드 모서리 표식은 오른쪽 위 방패(보안 그룹 = 서버마다 붙은 방화벽), 왼쪽 아래 etcd(DB 자동 전환의 합의 표)로 한 가지 규칙만 쓴다
     (방패를 오른쪽 위에 두어 인터넷 · 운영자 쪽 길이 위에서 곧장 방패 앞에 닿고, etcd 는 설명 글자와 닿지 않는 왼쪽 아래).
     층 순서: 구역 → 선 → 길 → 장비 → 글자표 → 끝 표시 · 판정 칩 → 누른 장비 테두리. 길은 장비 밑을 지나 장비 안에서는 가려진다.
     좌표는 viewBox 1660×700(머리말 줄과 같은 좌우 끝 130 ~ 1790, 무대 위 300 ~ 1000) */
  .map { position: absolute; left: 130px; top: 300px; width: 1660px; height: 700px; overflow: visible; }
  .map text { font-family: var(--sans); }
  .map .region { fill: none; stroke: var(--edge); stroke-width: 2; stroke-dasharray: 10 8; }
  .map .vpc { fill: color-mix(in srgb, var(--brand) 3%, var(--stage)); stroke: #66748C; stroke-width: 2; }
  /* 데이터센터 띠: 테두리는 연결선(3px)보다 가볍게 1.5px, 대신 채움을 10%로 두어 밝은 강의실에서도 면으로 남게 한다. 이름은 띠 안 왼쪽 위에 26px 굵게 */
  .map .lane rect { fill: color-mix(in srgb, var(--brand) 10%, var(--stage)); stroke: #4E5E7C; stroke-width: 1.5; }
  .map .lane .ln { font-size: 26px; font-weight: 600; fill: var(--ink); }
  .map .lane .az { font-family: var(--mono); font-size: 22px; font-weight: 500; fill: var(--ink-2); }
  .map .zh { font-size: 24px; font-weight: 600; fill: var(--ink); }
  .map .zh .ab { font-family: var(--mono); font-size: 22px; font-weight: 500; fill: var(--ink-3); }
  .map .link { fill: none; stroke: var(--wire); stroke-width: 3; }
  .map .link.thin { stroke: #6A7489; stroke-width: 2; }
  .map .link.dash { stroke-width: 2; stroke-dasharray: 7 6; }
  .map .tip { fill: var(--wire); }
  .map .tile .bx { fill: #1E2638; stroke: var(--edge); stroke-width: 2.5; }
  .map .tile.asg .bx { stroke-dasharray: 10 6; }
  .map .tile .nm { font-size: 26px; font-weight: 500; fill: var(--ink); }
  .map .tile .sb { font-size: 22px; fill: var(--ink-2); }
  .map .lbl { font-size: 22px; fill: var(--ink-2); }
  .map .igw .bx { fill: var(--stage); stroke: transparent; stroke-width: 3; }
  .map .igw text { font-size: 22px; fill: var(--ink); }
  .map .igw .sb { fill: var(--ink-3); }
  .map .bdg circle { fill: var(--stage); stroke: var(--edge); stroke-width: 2; }
  .map .sg { color: var(--ink-2); }
  .map .tag-l { font-size: 22px; fill: var(--ink-2); }
  .map .leg .k { font-size: 22px; font-weight: 600; fill: var(--ink); }
  .map .leg .d { font-size: 22px; font-weight: 400; fill: var(--ink-2); }

  /* 단계 흐름(slide-netmap 과 같은 언어): → 한 번에 흐름 하나. 관계없는 구역 · 장비 · 선 · 글자(data-k)를 0.35초에 흐리고,
     길을 판정 색으로 그린 뒤 0.2초 있다가 끝 표시(허용은 화살촉, 차단은 ✕)와 판정 칩이 0.3초에 나타나고 멈춘다.
     길 위 장비 테두리 · 방패와 데이터센터 띠는 길이 거기에 닿는 때(--at)에 켜고, 막은 장비(stop)와 가려다 못 간 장비(aim)는 판정 때 켠다.
     켜기는 애니메이션이라 흐름을 바꿀 때 클래스를 뗐다 다시 붙여 처음부터 켠다(앞 흐름의 색이 남지 않게).
     --onc 는 지나간 장비의 색: 허용은 초록, 1단계는 파랑, 막힌 흐름에서 지나기만 한 곳은 흰색 */
  .map { --onc: var(--ok); }
  .map[data-v="hi"] { --onc: var(--brand); }
  .map[data-v="no"] { --onc: var(--ink); }
  .map [data-k] { transition: opacity .35s ease-in-out; }
  .map [data-k].dim { opacity: .3; }
  .map #L-zones [data-k].dim { opacity: .22; }
  .map [data-k].hid { opacity: 0; }
  .map .on > .bx, .map .on > circle.bx { animation: lit .3s ease-in-out var(--at, 0s) both; }
  .map .tile.on .sh circle { animation: lit-s .3s ease-in-out var(--at, 0s) both; }
  .map .tile.on .sh .sg { animation: lit-c .3s ease-in-out var(--at, 0s) both; }
  /* 나가는 연결(SSM 에이전트, Teams 보고)과 1단계는 들어오는 규칙을 쓰지 않으므로 방패를 켜지 않는다 */
  .map.nosg .tile.on .sh circle, .map.nosg .tile.on .sh .sg { animation: none; }
  .map .tile.stop > .bx { animation: stopped .3s ease-in-out var(--at, 0s) both; }
  .map .tile.stop .sh circle { animation: stop-s .3s ease-in-out var(--at, 0s) both; }
  .map .tile.stop .sh .sg { animation: stop-c .3s ease-in-out var(--at, 0s) both; }
  /* 막은 방패는 ✕가 뜬 0.1초 뒤 한 번 1.3배로 부풀었다 돌아와 '무엇이 막았나'를 짚는다 */
  .map .tile.stop .sh { transform-box: fill-box; transform-origin: center; animation: pulse .25s ease-in-out var(--px, 0s) both; }
  .map .tile.aim > .bx { animation: aimed .3s ease-in-out var(--at, 0s) both; }
  .map .lane.on rect { animation: lane-lit .3s ease-in-out var(--at, 0s) both; }
  .map .lane.on text { animation: lane-t .3s ease-in-out var(--at, 0s) both; }
  .map .tag-l.on { animation: lit-t .3s ease-in-out var(--at, 0s) both; }
  .map .ed.lit circle { animation: ed-lit .3s ease-in-out var(--et, 0s) both; }
  .map.still, .map.still * { transition: none !important; }
  /* 길은 6px 판정 색 선이고, 같은 꺾은선을 넓은 흰 선으로 덮은 가림판(mask)의 대시를 당겨 앞에서부터 드러낸다 */
  #trails, #rings, #marks, #pick { pointer-events: none; }
  .map .hit { fill: transparent; }
  .map .trail { fill: none; stroke: var(--v); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .map .rv { fill: none; stroke: #fff; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 100 200; animation: draw var(--t) cubic-bezier(.45,0,.55,1) var(--d) both; }
  .map .late { animation: fade .3s ease-in-out var(--e) both; }
  .map .flow.gone { animation: fadeout .3s ease-in-out forwards; }
  /* 4단계 뒤 결론: 2단계 초록 길과 3단계 ✕를 0.45로 다시 깔아 '들어오는 길은 이것뿐'을 한 화면에 남긴다 */
  .map .ghost { animation: ghost .3s ease-in-out var(--g) both; }
  /* 결론 때 다시 깐 길이 지나는 장비는 같은 때 0.3초에 다시 밝힌다. 'from' 이 없어 그 전까지는 흐림(0.3)이 그대로다 */
  .map [data-k].back { animation: back .3s ease-in-out var(--g) forwards; }
  .map .arrow { fill: var(--v); stroke: var(--v); stroke-width: 2; stroke-linejoin: round; }
  .map .xm circle { fill: var(--stage); stroke: var(--v); stroke-width: 2.8; }
  .map .xm path { fill: none; stroke: var(--v); stroke-width: 4.2; stroke-linecap: round; }
  .map .chip rect { fill: var(--stage); stroke: var(--v); stroke-width: 2; }
  .map .chip .vd { font-size: 24px; font-weight: 700; fill: var(--vt, var(--v)); }
  .map .chip .pl { font-size: 22px; fill: var(--ink); }
  /* 장비를 직접 눌러 흐름 보기(질문 대응, slide-netmap 과 같은 방식). 누른 장비는 하늘색 테두리, 관리 접속의 차례(운영자 1, SSM 2)는 번호로,
     도착지는 판정 때 허용 초록 실선 · 차단 빨강 점선 테두리로 보인다. 마우스를 올리기만 하면 손가락 모양만 바뀐다.
     키보드로 옮긴 초점만 하늘색 테두리로 보인다 */
  .map [data-pick] { cursor: pointer; outline: none; }
  .map [data-pick]:focus-visible > .bx { stroke: var(--sel); stroke-width: 3; }
  .map g[data-pick]:not(.tile):focus-visible text { fill: var(--sel); }
  .map .ring { fill: none; stroke: var(--sel); stroke-width: 3; }
  .map .ring.ok { stroke: var(--ok); }
  .map .ring.no { stroke: var(--bad); stroke-dasharray: 10 6; }
  .map .badge circle { fill: var(--stage); stroke: var(--sel); stroke-width: 2.4; }
  .map .badge text { font-family: var(--mono); font-size: 22px; font-weight: 600; fill: var(--sel); text-anchor: middle; }

  /* 등장: 장이 열리면 바깥 틀 → 데이터센터 띠 → VPC 안 장비 → 바깥 장비 · 선 → 글자표 차례로 0.6초씩 떠올라
     (0.35 ~ 1.35초에 0.25초 간격으로 출발) 2초 안에 멈춘다. 그 뒤에는 → 를 누르기 전까지 아무것도 움직이지 않는다.
     길 · 끝 표시 층은 등장 묶음 밖에 두어, 쌓이는 동안 → 를 눌러도 길이 처음부터 보이게 한다 */
  .map .bd { animation: rise .6s cubic-bezier(.45,0,.55,1) both; }
  .map .b1 { animation-delay: .35s; } .map .b2 { animation-delay: .6s; } .map .b3 { animation-delay: .85s; }
  .map .b4 { animation-delay: 1.1s; } .map .b5 { animation-delay: 1.35s; }

  /* 최종 구성도 원본(질문 대비). E 키 도구를 켤 때만 단추가 보인다 */
  .fig { width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--ink); }
  .fig::backdrop { background: rgb(8,10,15); }
  .fig[open] { display: flex; flex-direction: column; animation: fade .25s ease-out; }
  .fig .bar { flex: none; display: flex; align-items: center; gap: 16px; padding: 14px 24px; font-size: 22px; color: var(--ink-3); }
  .fig .bar b { font-weight: 600; color: var(--ink); font-size: 22px; }
  .fig .bar .x { margin-left: auto; font-family: var(--sans); font-size: 22px; color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; }
  .fig .view { flex: 1; min-height: 0; overflow: auto; display: grid; place-items: center; padding: 0 24px 24px; }
  .fig img { max-width: calc(100vw - 48px); max-height: calc(100vh - 80px); border-radius: 6px; background: #fff; cursor: zoom-in; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .fig.zoom .view { place-items: start; }
  .fig.zoom img { max-width: none; max-height: none; width: 2600px; cursor: zoom-out; }

  .fs {
    position: absolute; right: 130px; top: 20px;
    font-family: var(--sans); font-size: 17px; color: var(--ink-3); background: transparent;
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer;
    opacity: 0; transition: opacity .3s, color .3s;
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeout { to { opacity: 0; } }
  @keyframes ghost { from { opacity: 0; } to { opacity: .45; } }
  @keyframes back { to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes lit { to { stroke: var(--onc); stroke-width: 3; } }
  @keyframes lit-s { to { stroke: var(--onc); } }
  @keyframes lit-c { to { color: var(--onc); } }
  @keyframes lit-t { to { fill: var(--onc); } }
  @keyframes stopped { to { stroke: var(--bad); stroke-width: 3; } }
  @keyframes stop-s { to { stroke: var(--bad); stroke-width: 2.6; } }
  @keyframes stop-c { to { color: var(--bad); } }
  @keyframes pulse { 50% { transform: scale(1.3); } }
  @keyframes aimed { to { stroke: var(--bad); stroke-width: 3; stroke-dasharray: 10 6; } }
  @keyframes lane-lit { to { fill: color-mix(in srgb, var(--brand) 16%, var(--stage)); stroke: var(--brand); stroke-width: 3; } }
  @keyframes lane-t { to { fill: var(--glow); } }
  @keyframes ed-lit { to { stroke: var(--brand); stroke-width: 3; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; } }
</style>
<link rel="stylesheet" href="deck.css">
<script src="deck.js"></script>

<div class="stage" id="stage" data-step="0">
  <div class="head">
    <div class="l"><i aria-hidden="true"></i><span class="code">페일스톱</span>모의 거래소 운영 인프라</div>
    <div class="r"><span class="sec">주요 설계 및 구현</span>04-5</div>
  </div>
  <button class="fs" id="fs" type="button">전체 화면 (F)</button>

  <div class="title">
    <h1>AWS 구성도</h1>
    <button class="tag orig" id="open-fig" type="button" aria-haspopup="dialog"><img src="assets/aws/AWS-Cloud-logo_32_Dark.svg" alt="">최종 구성도<svg class="mx" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h5v5M9 20H4v-5M20 4l-6 6M4 20l6-6"/></svg></button>
    <span class="env"><img src="assets/tint/amazonwebservices-side.svg" alt="">AWS 배포 구성</span>
  </div>
  <p class="dek">개인 AWS의 두 AZ에 서버를 나누고 들어오는 길은 CloudFront와 SSM으로 좁혔습니다.</p>

<script>
(() => {
  const stage = document.getElementById('stage');
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; };
  fit(); addEventListener('resize', fit);
  const toggleFs = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} };
  document.getElementById('fs').addEventListener('click', toggleFs);
  addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F' || e.code === 'KeyF') toggleFs(); });

  // 원본 구성도 창(E 키 도구). 도구가 꺼져 있으면 숨은 단추를 눌러도 열지 않고, 닫을 때는 단추에서 초점을 빼
  // 스페이스 · 엔터로 다시 열리지 않게 한다. 그림을 누르면 누른 자리를 기준으로 키운다(키운 뒤 같은 점이 누른 자리에 오도록 스크롤을 맞춘다)
  const fig = document.getElementById('fig'), hint = document.getElementById('fig-hint'), openBtn = document.getElementById('open-fig');
  const view = fig.querySelector('.view'), figImg = document.getElementById('fig-img');
  const closeFig = () => { if (fig.open) fig.close(); };
  openBtn.addEventListener('click', e => { e.stopPropagation(); if (!document.body.classList.contains('tools')) return; try { fig.showModal(); } catch (err) { fig.setAttribute('open', ''); } });
  document.getElementById('close-fig').addEventListener('click', e => { e.stopPropagation(); closeFig(); });
  figImg.addEventListener('click', e => {
    e.stopPropagation();
    const r = figImg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    const zoom = fig.classList.toggle('zoom');
    hint.textContent = zoom ? '그림을 누르면 축소' : '그림을 누르면 확대';
    if (!zoom) return;

      const L = lenOf(l.r), T = Math.min(MAX, Math.max(MIN, L / SPEED)), start = l.with && prev ? prev.start : t;
      const p = { ...l, start, T, L };
      t = Math.max(t, start + T + (l.hold || 0));
      prev = p;
      return p;
    });
  };
  const doneAt = legs => Math.max(...legs.map(l => l.start + l.T));
  // 길이 장비에 닿는 시각. 상자가 있으면 길이 상자에 처음 들어가는 때, 없으면(사람 · 구름 · 글자표) 가장 가까운 자리를 지나는 때
  const arrive = (e, legs) => {
    const b = e.querySelector(':scope > .bx, :scope > rect');
    const box = b ? (b.tagName === 'circle' ? [+b.getAttribute('cx') - 26, +b.getAttribute('cy') - 26, 52, 52] : ['x', 'y', 'width', 'height'].map(a => +b.getAttribute(a))) : null;
    let first = null;
    if (box) for (const l of legs) { const s = hitAt(l.r, box); if (s != null) { const at = l.start + l.T * timeAt(s / l.L); if (first == null || at < first) first = at; } }
    if (first != null) return first;
    const bb = e.getBBox(), pt = [bb.x + bb.width / 2, bb.y + bb.height / 2];
    let best = null;
    for (const l of legs) { const [d, s] = nearAt(l.r, pt); if (!best || d < best[0]) best = [d, l.start + l.T * timeAt(s / l.L)]; }
    return best[1];
  };

  // 판정 칩은 글자 폭을 재서 상자를 맞춘다. 굵은 판정어의 글꼴은 늦게 올 수 있으니 미리 받아 두고 글꼴이 올 때마다 다시 맞춘다
  const layChip = g => {
    const c = g.chip, [r, a, b] = g.children, wa = a.getComputedTextLength(), wb = b.getComputedTextLength();
    const w = 16 + wa + 12 + wb + 16, x = c.a === 'end' ? c.x - w : c.x;
    r.setAttribute('x', x); r.setAttribute('width', w);
    a.setAttribute('x', x + 16); b.setAttribute('x', x + 16 + wa + 12);
  };
  const relay = () => document.querySelectorAll('#marks .chip').forEach(layChip);
  if (document.fonts) {
    document.fonts.load("700 24px 'IBM Plex Sans KR'", '허용차단엄격동기복제').then(relay, () => {});
    document.fonts.load("400 22px 'IBM Plex Sans KR'", '사용자CloudFront443로드밸런서서버8080만보안그룹에인터넷5432규칙없음관리는SSM으로만22닫힘예비DB가받아야커밋').then(relay, () => {});
    document.fonts.ready.then(relay);
    document.fonts.addEventListener('loadingdone', relay);
  }

  // 끝 표시. 화살촉은 마지막 꺾은선 방향으로 길이 24 · 밑변 30, 끝이 장비 가장자리에서 1px 앞에 온다. ✕는 반지름 19, 팔 ±8
  const arrow = (g, route) => {
    const [x, y] = route[route.length - 1], [px, py] = route[route.length - 2], n = Math.hypot(x - px, y - py), ux = (x - px) / n, uy = (y - py) / n;
    const bx = x - ux * 25, by = y - uy * 25;
    el('path', { class: 'arrow', d: `M${bx - uy * 15} ${by + ux * 15} L${bx + uy * 15} ${by - ux * 15} L${x - ux} ${y - uy} Z` }, g);
  };
  const xmark = (g, [x, y]) => {
    const m = el('g', { class: 'xm' }, g);
    el('circle', { cx: x, cy: y, r: 19 }, m);
    el('path', { d: `M${x - 8} ${y - 8} L${x + 8} ${y + 8} M${x + 8} ${y - 8} L${x - 8} ${y + 8}` }, m);
  };
  const dOf = pts => 'M' + pts.map(p => p.join(' ')).join(' L');

  // 흐름 하나의 길 · 끝 표시 · 칩을 놓는다. go 가 참이면 시간표(legs)대로 움직여 그리고, 거짓이면 끝 모습을 바로 놓는다.
  // 색은 무리마다 따로 박아, 다음 흐름으로 넘어가 사라지는 동안 색이 바뀌지 않게 한다
  let seq = 0;
  const paint = (f, legs, go, E) => {
    const group = (layer, v, cls) => { const n = el('g', { class: 'flow' + (cls ? ' ' + cls : '') }, $(layer)); n.style.setProperty('--v', COLOR[v]); if (TEXT[v]) n.style.setProperty('--vt', TEXT[v]); return n; };
    const later = (g, t) => { if (go) { g.classList.add('late'); g.style.setProperty('--e', t.toFixed(3) + 's'); } };
    const gt = group('trails', f.v), gm = group('marks', f.v);
    legs.forEach(l => {
      const tr = el('path', { class: 'trail', d: dOf(l.r) }, gt);
      if (go) {
        const id = 'rv' + ++seq, m = el('mask', { id, maskUnits: 'userSpaceOnUse', x: -20, y: -20, width: 1700, height: 740 }, gt);
        const rv = el('path', { class: 'rv', d: dOf(l.r), pathLength: 100 }, m);
        rv.style.setProperty('--d', l.start.toFixed(3) + 's'); rv.style.setProperty('--t', l.T.toFixed(3) + 's');
        tr.setAttribute('mask', `url(#${id})`);
      }
      if (!l.mark) return;
      const ga = group('marks', f.v);
      if (l.mark === 'arrow') arrow(ga, l.r); else xmark(ga, l.r[l.r.length - 1]);
      later(ga, l.start + l.T + LAG);
    });
    const c = el('g', { class: 'chip' }, gm); c.chip = f.chip;
    el('rect', { y: f.chip.y - 22, height: 44, rx: 8 }, c);
    el('text', { class: 'vd', y: f.chip.y + 8 }, c).textContent = f.chip.vd || (f.v === 'no' ? '차단' : '허용');
    el('text', { class: 'pl', y: f.chip.y + 8 }, c).textContent = f.chip.t;
    later(gm, E);
    layChip(c);
    // 결론 다시 깔기: 칩이 다 나타난 뒤(E + 0.3초) 앞 단계들의 길과 끝 표시를 0.45로. 칩은 다시 놓지 않는다
    for (const k of f.ghosts || []) {
      const h = FLOWS[k], hl = plan(h), gg = group('trails', h.v, 'ghost'), gk = group('marks', h.v, 'ghost');
      for (const l of hl) { el('path', { class: 'trail', d: dOf(l.r) }, gg); if (l.mark === 'arrow') arrow(gk, l.r); else if (l.mark === 'x') xmark(gk, l.r[l.r.length - 1]); }
      [gg, gk].forEach(g => g.style.setProperty('--g', (go ? E + GHOST : 0).toFixed(3) + 's'));
    }
  };

  // 흐름 하나를 화면에 놓는다. go 가 참이면 앞 흐름의 길 · 끝 표시 · 칩을 0.3초에 지우면서 흐림을 바꾸고 새 흐름을 움직여 그리고,
  // 거짓이면(← · #last · 움직임 줄이기 · 직접 누른 흐름에서 돌아올 때) 옮김 없이 끝 모습을 바로 놓는다.
  // 앞 흐름에서 아직 다 나타나지 않은 칩 · 화살촉은 지금 불투명도에서 줄여, → 를 연달아 눌러도 번쩍이지 않게 한다.
  // 켜기 표시(on · stop · aim · lit)는 모두 뗐다가 다시 붙여, 앞 흐름의 색이 남지 않고 정한 때(--at)부터 처음부터 켜지게 한다.
  // pick 은 직접 누른 출발지 · 경유지 · 도착지(도착지 테두리는 판정과 같은 때 허용 초록 · 차단 빨강으로)
  const render = (f, go, pick) => {
    [...$('trails').children, ...$('marks').children].forEach(g => {
      if (!go) { g.remove(); return; }
      if (g.classList.contains('gone')) return;   // 이미 사라지는 중인 무리는 그대로 둔다
      g.style.opacity = getComputedStyle(g).opacity; g.classList.remove('late', 'ghost'); g.classList.add('gone');
      setTimeout(() => g.remove(), OUT * 1000 + 20);
    });
    $('pick').replaceChildren(); $('rings').replaceChildren();
    map.classList.toggle('still', !go);
    if (f) map.dataset.v = f.v; else delete map.dataset.v;
    map.classList.toggle('nosg', !!f && f.sg === false);
    const legs = f ? plan(f) : [], arrived = legs.length ? doneAt(legs) : 0, E = arrived + LAG;
    const all = [...map.querySelectorAll('[data-k]')], eds = [...map.querySelectorAll('.ed')];
    all.forEach(e => e.classList.remove('on', 'stop', 'aim', 'back'));
    eds.forEach(e => e.classList.remove('lit'));
    void map.getBoundingClientRect();
    const has = (list, k) => !!f && !!list && list.includes(k);
    for (const e of all) {
      const k = e.dataset.k, now = has(f && f.now, k), on = now || has(f && f.on, k), stop = has(f && f.stop, k), aim = has(f && f.aim, k) && !pick;
      const at = !go ? 0 : on ? (now ? DIM : arrive(e, legs)) : E;
      e.style.setProperty('--at', at.toFixed(3) + 's');
      e.style.setProperty('--px', (go ? E + .1 : 0).toFixed(3) + 's');
      if (on) e.classList.add('on'); if (stop) e.classList.add('stop'); if (aim) e.classList.add('aim');
      if (has(f && f.back, k)) { e.style.setProperty('--g', (go ? E + GHOST : 0).toFixed(3) + 's'); e.classList.add('back'); }
      e.classList.toggle('hid', has(f && f.hide, k));
      e.classList.toggle('dim', !!f && !on && !stop && !aim && !has(f.keep, k) && !has(f.hide, k) && !(pick && pick.includes(k)));
    }
    // etcd 표식 셋(주 DB → 예비 DB → 관제 서버)을 화살촉이 닿은 때부터 0.15초 간격으로 켠다
    if (f && f.etcd) eds.forEach((e, i) => { e.style.setProperty('--et', (go ? arrived + i * .15 : 0).toFixed(3) + 's'); e.classList.add('lit'); });
    if (f) paint(f, legs, go, E);
    if (pick) rings(pick, f.v === 'ok', go ? E : null);
    // 바로 놓을 때는 켜기 · 끝 표시 움직임을 끝 모습으로 넘긴다(장이 열릴 때 쌓이는 움직임 rise 는 그대로 둔다)
    if (!go) { map.getAnimations({ subtree: true }).forEach(a => { if (a.animationName !== 'rise') a.finish(); }); void document.body.offsetWidth; map.classList.remove('still'); }
  };

  // 누른 장비 테두리(카드 바깥 6px, 두께 3). 사람 · 구름은 그림과 이름을 함께 덮는 투명 누름 상자 바깥 2px.
  // 테두리는 장비 층 아래(#rings)에 그려 카드 모서리 표식을 가로지르지 않는다
  const ring = (k, cls, parent) => {
    const g = map.querySelector(`[data-k="${k}"]`), r = g.querySelector(':scope > rect.bx') || g.querySelector(':scope > rect.hit');
    const b = { x: +r.getAttribute('x'), y: +r.getAttribute('y'), width: +r.getAttribute('width'), height: +r.getAttribute('height') }, p = r.classList.contains('bx') ? 6 : 2;
    return el('rect', { class: 'ring' + (cls ? ' ' + cls : ''), x: b.x - p, y: b.y - p, width: b.width + p * 2, height: b.height + p * 2, rx: 16 }, parent);
  };
  // 관리 접속의 차례 번호(운영자 1, SSM 2)는 테두리 왼쪽 위 모서리에, 테두리와 달리 맨 위 층(#pick)에 둔다
  const badge = (k, n) => {
    const r = ring(k, '', $('rings')), x = +r.getAttribute('x'), y = +r.getAttribute('y'), b = el('g', { class: 'badge' }, $('pick'));
    el('circle', { cx: x, cy: y, r: 15 }, b); el('text', { x, y: y + 8 }, b).textContent = n;
  };
  // 직접 누른 흐름의 테두리: 출발지 · 경유지는 하늘색(관리 접속이면 차례 번호까지), 도착지는 판정 때(E) 허용 초록 실선 · 차단 빨강 점선
  const rings = (pick, ok, E) => {
    pick.slice(0, -1).forEach((k, i) => pick[0] === 'opr' && pick.length === 3 ? badge(k, i + 1) : ring(k, '', $('rings')));
    const g = el('g', {}, $('rings')); ring(pick[pick.length - 1], ok ? 'ok' : 'no', g);
    if (E != null) { g.classList.add('late'); g.style.setProperty('--e', E.toFixed(3) + 's'); }
  };

  // ---- 단계와 직접 누르기. 출발 장비를 누르면 하늘색 테두리로 고르고, 도착 장비를 누르면 판정해 그린다(근거가 없으면 고른 표시만 푼다).
  //      운영자를 고른 뒤 SSM을 누르면 경유지(차례 2)로 잡고 세 번째를 기다린다. 같은 장비를 다시 누르거나 빈 곳을 누르면 푼다.
  //      그린 뒤 → · ← 나 도구 끄기(E)는 원래 단계의 끝 모습으로 바로 돌아온다 ----
  // picked 는 지금 그려 둔 직접 누른 흐름({ pick, ok }), sel 은 고르는 중인 장비들이다
  let step = 0, picked = null, sel = [];
  const drawSel = () => {
    $('pick').replaceChildren(); $('rings').replaceChildren();
    if (!sel.length) { if (picked) rings(picked.pick, picked.ok, null); return; }
    sel.forEach((k, i) => sel[0] === 'opr' ? badge(k, i + 1) : ring(k, '', $('rings')));
  };
  const unpick = () => { if (sel.length) { sel = []; drawSel(); } };
  const press = k => {
    if (sel.includes(k)) { unpick(); return; }
    if (!sel.length) { sel = [k]; drawSel(); return; }
    if (sel.length === 1 && sel[0] === 'opr' && k === 'ssm') { sel.push(k); drawSel(); return; }
    const chosen = [...sel, k], f = decide(sel[0], sel[1], k);
    sel = [];
    if (!f) { drawSel(); return; }
    picked = { pick: chosen, ok: f.v === 'ok' }; render(f, !reduce, chosen);
  };
  map.addEventListener('click', e => { const g = e.target.closest('[data-pick]'); if (g) press(g.dataset.k); else unpick(); });
  stage.addEventListener('click', e => { if (!map.contains(e.target)) unpick(); });
  map.addEventListener('keydown', e => {
    const g = e.target.closest && e.target.closest('[data-pick]');
    if (e.key === 'Enter' && g) { e.preventDefault(); press(g.dataset.k); }
    if (e.key === 'Escape') unpick();
  });
  const show = (n, go) => { step = n; picked = null; sel = []; stage.dataset.step = n; render(FLOWS[STEPS[n]], go); };
  // 도구를 끄면(E) 직접 누른 흐름을 접고 단계 화면으로 돌아온다
  new MutationObserver(() => { if (!document.body.classList.contains('tools') && picked) show(step, false); }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  show(location.hash === '#last' ? LAST : 0, false);
  if (location.hash === '#last') document.getAnimations().forEach(a => a.finish());   // 뒤 장에서 돌아오면 쌓이는 움직임 없이 끝 모습으로
  window.deckStep = d => {
    if (fig.open) { closeFig(); return true; }
    if (picked) { show(step, false); return true; }
    sel = []; $('pick').replaceChildren(); $('rings').replaceChildren();
    if (d > 0 && step < LAST) { show(step + 1, !reduce); return true; }
    if (d < 0 && step > 0) { show(step - 1, false); return true; }
    return false;
  };
  if (window.parent === window) addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') window.deckStep(1);
    if (e.key === 'ArrowLeft') window.deckStep(-1);
  });

  // ---- 글자 맞춤 ----
  // 글꼴을 받은 뒤, 카드 안 글자가 카드 오른쪽 여백 14를 넘으면 1px씩 줄인다(브라우저마다 글꼴 폭이 달라도 튀어나오지 않게).
  // 가운데 맞춤 글자는 양쪽 여백을 함께 본다. 청중이 보는 글자라 22px 아래로는 줄이지 않는다. 줄이기만 하므로 여러 번 불러도 같다
  const fitAll = () => {
    try {
      for (const t of map.querySelectorAll('.tile text')) {
        const r = t.closest('.tile').querySelector('.bx'), x0 = +r.getAttribute('x'), x1 = x0 + +r.getAttribute('width');
        const mid = t.getAttribute('text-anchor') === 'middle';
        let fs = parseFloat(getComputedStyle(t).fontSize), guard = 0;
        const over = () => { const b = t.getBBox(); return b.x + b.width > x1 - 14 || (mid && b.x < x0 + 14); };
        while (over() && fs > 22 && guard++ < 20) { fs -= 1; t.style.fontSize = fs + 'px'; }
      }
    } catch (e) {}
  };
  fitAll();
  if (document.fonts) { document.fonts.ready.then(fitAll); document.fonts.addEventListener('loadingdone', fitAll); }
  addEventListener('load', fitAll);
  setTimeout(fitAll, 900);
})();
</script>
<!-- 발표 노트(40초): 그다음 개인 AWS에 최종 구성을 올렸습니다. 서울 리전의 데이터센터 두 곳에 역할별로 서버를 나눴습니다.
→ 1 거래 서버와 DB를 두 곳에 한 대씩 두고, Patroni 자동 전환을 두 데이터센터에 걸쳐 적용했습니다.
→ 2 사용자는 CloudFront와 로드밸런서를 거쳐 서버의 8080에만 닿습니다.
→ 3 NAT 비용을 아끼려고 퍼블릭 서브넷을 썼지만, 보안 그룹에 DB로 오는 규칙이 없어 바로 들어올 수 없습니다.
→ 4 운영자도 SSH 없이 SSM으로만 관리합니다.
질문 때: 도면의 장비를 차례로 누르면 그 흐름만 다시 그린다(출발 → 도착, 관리 접속은 운영자 → SSM → 서버의 세 번). → 나 ← 를 누르면 원래 단계로 돌아온다.
조회 서버: 평소 0대이고, 조회 서버 CPU가 60%를 넘으면 AI가 다른 관제 지표도 함께 보고 판단해 1대를 늘린다. 기본은 수동 모드라 AI가 제안하고 운영자가 승인한 뒤 켜고, 자동 모드를 켜 두면 허용 목록과 한도 안에서 AI가 바로 켠다(04-6).
Patroni 엄격 동기 복제와 자동 전환은 개인 AWS에 적용했다.
NAT를 두지 않은 까닭: NAT 게이트웨이 두 대의 월 약 92달러를 아끼려고 서버를 퍼블릭 서브넷에 두고, 들어오는 길만 보안 그룹으로 좁혔다. 나가는 연결(SSM 에이전트, 이미지 내려받기, Teams 보고)은 서버의 공인 IP로 인터넷 게이트웨이를 지나 나간다. 고객사 운영이라면 서버를 프라이빗 서브넷에 두고 AZ별 NAT를 둔다.
AZ-c가 통째로 멈추면: 예비 DB와 etcd 두 표(예비 DB·관제 서버)를 함께 잃어, 주 DB가 과반도 예비 DB도 보지 못해 스스로 내려간다. DB 쓰기·조회가 모두 멈추지만 확인된 커밋은 잃지 않는다(유실 대신 멈춤을 택한 설계). 같은 AZ의 관제 서버도 함께 멈춘다.
AZ-a가 통째로 멈추면: 예비 DB가 자동 승격해 조회는 다시 되지만, 동기 예비가 없어 옛 주 DB가 예비로 돌아올 때까지 쓰기는 멈춘다.
로드밸런서 보안 그룹은 CloudFront 주소 목록 말고도 허용 목록 주소의 443·80과 관제 서버 공인 IP의 443(시장 봇)을 받는다. -->
