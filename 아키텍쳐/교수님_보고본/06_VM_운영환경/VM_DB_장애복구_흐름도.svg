<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2560" height="1600" viewBox="0 0 2560 1600"><title>Linux VM 운영 설계</title><desc>Linux 기반 AWS 인프라 구축 및 운영. VM 직접 설치 환경의 통신 정책과 DB 복구 절차 설계안.</desc>
<rect x="0" y="0" width="2560" height="1600" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<rect x="64" y="49" width="6" height="77" rx="0" fill="#2767A0" stroke="#2767A0" stroke-width="0"/>
<text x="90" y="90.12" font-family="Malgun Gothic" font-size="44" font-weight="700" fill="#19324B" text-anchor="start">VM DB 장애 복구 흐름</text>
<text x="93" y="137.52" font-family="Malgun Gothic" font-size="24" font-weight="400" fill="#61758A" text-anchor="start">비동기 복제 · 운영자 수동 승격 · 거래 재개 전 데이터 확인</text>
<rect x="2255" y="53" width="240" height="34" rx="2" fill="#EEF5FB" stroke="#EEF5FB" stroke-width="1.5"/>
<text x="2375" y="76.39" font-family="Malgun Gothic" font-size="18" font-weight="700" fill="#2767A0" text-anchor="middle">구축 설계안</text>
<text x="2495" y="129.455" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="end">Linux VM · 2026.09.19</text>
<rect x="64" y="177" width="744" height="77" rx="3" fill="#F2F6FB" stroke="#DBE3E9" stroke-width="1.1"/>
<text x="88" y="211.02" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#2767A0" text-anchor="start">장애 전</text>
<text x="88" y="242.6" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#61758A" text-anchor="start">DB01 Primary / DB02 Standby</text>
<rect x="844" y="177" width="872" height="77" rx="3" fill="#FCF5EE" stroke="#DBE3E9" stroke-width="1.1"/>
<text x="868" y="211.02" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#AE6E36" text-anchor="start">복구 중</text>
<text x="868" y="242.6" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#61758A" text-anchor="start">신규 접수 보류 · 격리 확인 · 운영자 판단</text>
<rect x="1756" y="177" width="740" height="77" rx="3" fill="#F2F8F4" stroke="#DBE3E9" stroke-width="1.1"/>
<text x="1780" y="211.02" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#438B58" text-anchor="start">복구 후</text>
<text x="1780" y="242.6" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#61758A" text-anchor="start">DB02 Primary / DB01은 Standby로 재구성</text>
<text x="828" y="226.49" font-family="Malgun Gothic" font-size="38" font-weight="700" fill="#61758A" text-anchor="middle">›</text>
<text x="1740" y="226.49" font-family="Malgun Gothic" font-size="38" font-weight="700" fill="#61758A" text-anchor="middle">›</text>
<text x="65" y="343.44" font-family="Malgun Gothic" font-size="28" font-weight="700" fill="#19324B" text-anchor="start">01  장애 확인부터 새 Primary 준비까지</text>
<text x="2495" y="342.455" font-family="Malgun Gothic" font-size="21" font-weight="700" fill="#AE6E36" text-anchor="end">격리가 확인되기 전에는 승격하지 않음</text>
<rect x="64" y="390" width="521" height="300" rx="3" fill="#FFFFFF" stroke="#BFCEDA" stroke-width="1.5"/>
<rect x="65" y="391" width="519" height="61" rx="0" fill="#F3F6F9" stroke="#F3F6F9" stroke-width="0"/>
<text x="85" y="430.795" font-family="Malgun Gothic" font-size="29" font-weight="700" fill="#2767A0" text-anchor="start">01</text>
<text x="162" y="430.23" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#19324B" text-anchor="start">장애 확인</text>
<text x="88" y="503.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#19324B" text-anchor="start">앱·DB·네트워크 상태 구분</text>
<text x="88" y="546.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">쓰기 요청·봇 주문 접수 보류</text>
<text x="88" y="589.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">장애 시각·외부 ACK 기록 보존</text>
<text x="88" y="659.89" font-family="Malgun Gothic" font-size="18" font-weight="400" fill="#2767A0" text-anchor="start">ACK: 클라이언트가 받은 접수 응답</text>
<rect x="701" y="390" width="521" height="300" rx="3" fill="#FFFFFF" stroke="#BFCEDA" stroke-width="1.5"/>
<rect x="702" y="391" width="519" height="61" rx="0" fill="#F3F6F9" stroke="#F3F6F9" stroke-width="0"/>
<text x="722" y="430.795" font-family="Malgun Gothic" font-size="29" font-weight="700" fill="#2767A0" text-anchor="start">02</text>
<text x="799" y="430.23" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#19324B" text-anchor="start">기존 Primary 격리</text>
<text x="725" y="503.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#19324B" text-anchor="start">서비스 중지 또는 VM 격리</text>
<text x="725" y="546.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">앱의 쓰기 경로 차단 확인</text>
<text x="725" y="589.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">재기동 후 재연결도 차단</text>
<rect x="720" y="628" width="483" height="45" rx="2" fill="#FCF3E9" stroke="#E5C8A7" stroke-width="1"/>
<text x="961.5" y="657.245" font-family="Malgun Gothic" font-size="19" font-weight="700" fill="#AE6E36" text-anchor="middle">격리 확인 불가 → 승격 중단</text>
<rect x="1338" y="390" width="521" height="300" rx="3" fill="#FFFFFF" stroke="#BFCEDA" stroke-width="1.5"/>
<rect x="1339" y="391" width="519" height="61" rx="0" fill="#F3F6F9" stroke="#F3F6F9" stroke-width="0"/>
<text x="1359" y="430.795" font-family="Malgun Gothic" font-size="29" font-weight="700" fill="#2767A0" text-anchor="start">03</text>
<text x="1436" y="430.23" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#19324B" text-anchor="start">복제·유실 범위 판단</text>
<text x="1362" y="503.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#19324B" text-anchor="start">수신 WAL 재생 완료·LSN 확인</text>
<text x="1362" y="546.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">미전송 WAL 유실 가능성 확인</text>
<text x="1362" y="589.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">유실 범위가 불명확하면 기록</text>
<rect x="1357" y="628" width="483" height="45" rx="2" fill="#FCF3E9" stroke="#E5C8A7" stroke-width="1"/>
<text x="1598.5" y="657.245" font-family="Malgun Gothic" font-size="19" font-weight="700" fill="#AE6E36" text-anchor="middle">운영자가 위험을 판단한 뒤 진행</text>
<rect x="1975" y="390" width="521" height="300" rx="3" fill="#FFFFFF" stroke="#BFCEDA" stroke-width="1.5"/>
<rect x="1976" y="391" width="519" height="61" rx="0" fill="#F3F6F9" stroke="#F3F6F9" stroke-width="0"/>
<text x="1996" y="430.795" font-family="Malgun Gothic" font-size="29" font-weight="700" fill="#2767A0" text-anchor="start">04</text>
<text x="2073" y="430.23" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#19324B" text-anchor="start">Standby 수동 승격</text>
<text x="1999" y="503.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#19324B" text-anchor="start">운영자가 DB02를 승격</text>
<text x="1999" y="546.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">pg_is_in_recovery() = false</text>
<text x="1999" y="589.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">쓰기 가능한 DB는 한 대</text>
<text x="1999" y="659.89" font-family="Malgun Gothic" font-size="18" font-weight="400" fill="#2767A0" text-anchor="start">DB 승격과 앱 리더 전환은 별개</text>
<path d="M 585,537 L 701,537" fill="none" stroke="#19324B" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="701,537 690.5,532.2 690.5,541.8" fill="#19324B"/>
<path d="M 1222,537 L 1338,537" fill="none" stroke="#19324B" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="1338,537 1327.5,532.2 1327.5,541.8" fill="#19324B"/>
<path d="M 1859,537 L 1975,537" fill="none" stroke="#19324B" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="1975,537 1964.5,532.2 1964.5,541.8" fill="#19324B"/>
<path d="M 2235.5,690 L 2235.5,766 L 40,766 L 40,1017 L 64,1017" fill="none" stroke="#19324B" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="64,1017 53.5,1012.2 53.5,1021.8" fill="#19324B"/>
<text x="1345" y="738.81" font-family="Malgun Gothic" font-size="22" font-weight="700" fill="#2767A0" text-anchor="middle">새 Primary를 기준으로 연결을 바꾸고 거래를 검증한다</text>
<text x="65" y="835.44" font-family="Malgun Gothic" font-size="28" font-weight="700" fill="#19324B" text-anchor="start">02  서비스 복구와 이중화 재구성</text>
<text x="2495" y="834.455" font-family="Malgun Gothic" font-size="21" font-weight="700" fill="#438B58" text-anchor="end">시험 거래 확인 후 일반 거래를 개방</text>
<rect x="64" y="870" width="521" height="300" rx="3" fill="#FFFFFF" stroke="#BFCEDA" stroke-width="1.5"/>
<rect x="65" y="871" width="519" height="61" rx="0" fill="#F3F6F9" stroke="#F3F6F9" stroke-width="0"/>
<text x="85" y="910.795" font-family="Malgun Gothic" font-size="29" font-weight="700" fill="#2767A0" text-anchor="start">05</text>
<text x="162" y="910.23" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#19324B" text-anchor="start">앱 연결·리더 복구</text>
<text x="88" y="983.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#19324B" text-anchor="start">모든 앱 DB 주소 변경·재기동</text>
<text x="88" y="1026.95" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">앱 리더 1대·저널 복구 확인</text>
<text x="88" y="1069.95" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">NGINX 경로·WS 재접속 확인</text>
<text x="88" y="1139.89" font-family="Malgun Gothic" font-size="18" font-weight="400" fill="#2767A0" text-anchor="start">일반 거래 접수는 계속 보류</text>
<rect x="701" y="870" width="521" height="300" rx="3" fill="#FFFFFF" stroke="#BFCEDA" stroke-width="1.5"/>
<rect x="702" y="871" width="519" height="61" rx="0" fill="#F3F6F9" stroke="#F3F6F9" stroke-width="0"/>
<text x="722" y="910.795" font-family="Malgun Gothic" font-size="29" font-weight="700" fill="#2767A0" text-anchor="start">06</text>
<text x="799" y="910.23" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#19324B" text-anchor="start">ACK 대조·시험 거래</text>
<text x="725" y="983.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#19324B" text-anchor="start">외부 ACK ↔ 명령 기록 대조</text>
<text x="725" y="1026.95" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">주문·취소·체결 확인</text>
<text x="725" y="1069.95" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">원장·잔고 일치 확인</text>
<rect x="720" y="1108" width="483" height="45" rx="2" fill="#FCF3E9" stroke="#E5C8A7" stroke-width="1"/>
<text x="961.5" y="1137.24" font-family="Malgun Gothic" font-size="19" font-weight="700" fill="#AE6E36" text-anchor="middle">불일치 미해결 → 거래 재개 보류</text>
<rect x="1338" y="870" width="521" height="300" rx="3" fill="#FFFFFF" stroke="#BFCEDA" stroke-width="1.5"/>
<rect x="1339" y="871" width="519" height="61" rx="0" fill="#F3F6F9" stroke="#F3F6F9" stroke-width="0"/>
<text x="1359" y="910.795" font-family="Malgun Gothic" font-size="29" font-weight="700" fill="#438B58" text-anchor="start">07</text>
<text x="1436" y="910.23" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#19324B" text-anchor="start">일반 거래 재개</text>
<text x="1362" y="983.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#19324B" text-anchor="start">복구·정합성 확인 후 개방</text>
<text x="1362" y="1026.95" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">오류율·지연·DB 연결 관찰</text>
<text x="1362" y="1069.95" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">장애 발생부터 거래 재개까지 기록</text>
<text x="1362" y="1139.89" font-family="Malgun Gothic" font-size="18" font-weight="400" fill="#438B58" text-anchor="start">승격 명령 시간 ≠ 전체 복구 시간</text>
<rect x="1975" y="870" width="521" height="300" rx="3" fill="#FFFFFF" stroke="#BFCEDA" stroke-width="1.5"/>
<rect x="1976" y="871" width="519" height="61" rx="0" fill="#F3F6F9" stroke="#F3F6F9" stroke-width="0"/>
<text x="1996" y="910.795" font-family="Malgun Gothic" font-size="29" font-weight="700" fill="#438B58" text-anchor="start">08</text>
<text x="2073" y="910.23" font-family="Malgun Gothic" font-size="26" font-weight="700" fill="#19324B" text-anchor="start">기존 DB 재구성</text>
<text x="1999" y="983.955" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#19324B" text-anchor="start">기존 자료·진단 근거 보존</text>
<text x="1999" y="1026.95" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">새 Primary의 전량 베이스백업</text>
<text x="1999" y="1069.95" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">DB01을 Standby로 재합류</text>
<text x="1999" y="1139.89" font-family="Malgun Gothic" font-size="18" font-weight="400" fill="#438B58" text-anchor="start">recovery = true · 복제 재개 확인</text>
<path d="M 585,1017 L 701,1017" fill="none" stroke="#19324B" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="701,1017 690.5,1012.2 690.5,1021.8" fill="#19324B"/>
<path d="M 1222,1017 L 1338,1017" fill="none" stroke="#19324B" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="1338,1017 1327.5,1012.2 1327.5,1021.8" fill="#19324B"/>
<path d="M 1859,1017 L 1975,1017" fill="none" stroke="#19324B" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter"/>
<polygon points="1975,1017 1964.5,1012.2 1964.5,1021.8" fill="#19324B"/>
<rect x="64" y="1225" width="2432" height="83" rx="3" fill="#FCF5EE" stroke="#E8D6C2" stroke-width="1.2"/>
<image x="89" y="1248" width="34" height="34" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%23AE6E36%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M16%202%2028%207v9c0%207-8%2012-12%2014C12%2028%204%2023%204%2016V7zM10%2016l4%204%208-9%22%2F%3E%3C%2Fsvg%3E" xlink:href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%23AE6E36%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M16%202%2028%207v9c0%207-8%2012-12%2014C12%2028%204%2023%204%2016V7zM10%2016l4%204%208-9%22%2F%3E%3C%2Fsvg%3E"/>
<text x="147" y="1262.38" font-family="Malgun Gothic" font-size="25" font-weight="700" fill="#AE6E36" text-anchor="start">복제 재개 전까지는 DB 한 대로 운영</text>
<text x="147" y="1296.1" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#61758A" text-anchor="start">새 Primary의 추가 장애에 대비하고, 복제 연결·지연까지 확인한 뒤 이중화 복구로 기록한다.</text>
<rect x="64" y="1350" width="782" height="138" rx="3" fill="#F6F8FA" stroke="#DFE6EC" stroke-width="1.1"/>
<text x="88" y="1389.52" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#19324B" text-anchor="start">유실 확인</text>
<text x="88" y="1428.45" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">지연 0이나 수신·재생 LSN 일치만으로</text>
<text x="88" y="1465.45" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">미전송 WAL의 무손실을 판정하지 않는다.</text>
<rect x="889" y="1350" width="782" height="138" rx="3" fill="#F6F8FA" stroke="#DFE6EC" stroke-width="1.1"/>
<text x="913" y="1389.52" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#19324B" text-anchor="start">증거 보존</text>
<text x="913" y="1428.45" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">ACK는 장애 DB 밖에 보존하고,</text>
<text x="913" y="1465.45" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">승격한 DB의 명령 기록과 대조한다.</text>
<rect x="1714" y="1350" width="782" height="138" rx="3" fill="#F6F8FA" stroke="#DFE6EC" stroke-width="1.1"/>
<text x="1738" y="1389.52" font-family="Malgun Gothic" font-size="24" font-weight="700" fill="#19324B" text-anchor="start">백업 복원</text>
<text x="1738" y="1428.45" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">복제본 재구성과 백업 복원은 별개다.</text>
<text x="1738" y="1465.45" font-family="Malgun Gothic" font-size="21" font-weight="400" fill="#61758A" text-anchor="start">격리된 복원 대상에서 백업도 확인한다.</text>
<text x="64" y="1551.6" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#61758A" text-anchor="start">실습 전 절차 설계안 · 실제 서비스 이름·설정 경로·차단 방법은 VM 구축 시 확정</text>
<text x="2496" y="1551.6" font-family="Malgun Gothic" font-size="20" font-weight="400" fill="#61758A" text-anchor="end">RTO·유실량은 실습 후 측정</text>
</svg>