# 앱 노드 1개분. 상시면 core 또는 증명면 app-2에 얹는다.
#
# 현행 compose.yaml과 다른 점 셋이다.
#   1. container_name을 쓰지 않는다. 고정하면 같은 호스트에서 청록 배포가 불가능하다.
#   2. DB 주소를 서비스명이 아니라 변수로 받는다. 로컬은 compose 서비스명, 클라우드는
#      프라이빗 IP를 같은 변수에 넣는다. 이 변수화가 다중 호스트 이식의 핵심이다.
#   3. 이미지를 digest로 고정한다. 태그는 재푸시로 내용이 바뀌어 롤백 대상이 확정되지 않는다.
#
# 미검증이다. 실제 다중 호스트에서 기동한 적이 없다.
services:
  app:
    image: ${APP_IMAGE}
    environment:
      # 상시면은 prod. 관리 포트가 8081로 분리된다(application.yml:127).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_APPLICATION_JSON: '{"management.metrics.distribution.percentiles-histogram.http.server.requests":true,"management.metrics.distribution.minimum-expected-value.http.server.requests":"1ms","management.metrics.distribution.maximum-expected-value.http.server.requests":"30s"}'
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME:-exchange}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # compose.migrate.yml을 별도 실행한 뒤 런타임 계정으로 시작한다.
      SPRING_FLYWAY_ENABLED: "false"
      EXCHANGE_ENGINE_ENABLED: ${EXCHANGE_ENGINE_ENABLED:-true}
      EXCHANGE_NODE_ROLE: engine
      EXCHANGE_TRUSTED_PROXIES: ${EXCHANGE_TRUSTED_PROXIES:-127\.0\.0\.1}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_DB_POOL_MAX:-32}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${APP_DB_POOL_IDLE:-8}
      EXCHANGE_ENGINE_APPENDDATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_APPEND_POOL_MAX:-14}
      EXCHANGE_ENGINE_LEASEDATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${APP_LEASE_POOL_MAX:-2}
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
      EXCHANGE_AUTH_MASTER_KEY_BASE64: ${MASTER_KEY_BASE64}
      EXCHANGE_MEMBER_PASSWORD_PEPPER_BASE64: ${PASSWORD_PEPPER_BASE64}
      EXCHANGE_MEMBER_SESSION_SEED_BASE64: ${SESSION_SEED_BASE64}
      # prod 부팅 필수. 실측(2026-08-30)으로 확인했다. 미지정이면 prodCorsFilter
      # 생성이 실패하고 WS는 기본 오리진이면 중단한다. prod가 저장소에서 한 번도
      # 켜진 적이 없어 배포 당일 처음 발견될 자리였다.
      EXCHANGE_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS}
      # 하네스 API는 상시면에 등록하지 않는다. 증명면에서만 true다.
      EXCHANGE_HARNESS_ENABLED: ${HARNESS_ENABLED:-false}
    ports:
      # 고객 평면과 관리 포트를 분리해 노출한다. 8081은 edge에서만 스크레이프한다.
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:8080"
      - "${MGMT_BIND_IP:-127.0.0.1}:${MGMT_PORT:-8081}:8081"
    stop_grace_period: 40s
    healthcheck:
      # liveness로 판정한다. readiness는 팔로워에서 설계상 503(REFUSING_TRAFFIC)이라
      # 정상 팔로워가 영구 unhealthy가 된다. 컨테이너 기동 여부와 트래픽 수용 여부는
      # 다른 질문이다.
      #
      # 포트를 변수로 받는 이유. 관리 포트 8081 분리는 prod 프로파일에서만 일어난다
      # (application.yml). SPRING_PROFILES_ACTIVE 를 dev 로 덮으면 actuator 가 8080 에
      # 남는데 종전 판은 8081 을 박아 두어 컨테이너가 영구 unhealthy 가 됐다. 프로파일은
      # 변수인데 그것에 따라 움직이는 포트가 상수였다. 실측으로 재현했다(2026-09-04).
      test: ["CMD-SHELL", "curl -fsS http://localhost:${MGMT_PORT_INTERNAL:-8081}/actuator/health/liveness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # JVM 힙은 이 값의 75%다(Dockerfile.app -XX:MaxRAMPercentage=75).
          memory: ${APP_MEMORY:-1g}
    logging:
      # 노드 디스크가 로그로 차는 것을 막는다. 상시면은 재기동이 드물어 무한 증가한다.
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
