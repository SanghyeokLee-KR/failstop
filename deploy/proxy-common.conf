# 프록시 공통 헤더와 재시도 정책. 카오스 스택 nginx.conf에서 검증된 값을 승계한다.
#
# proxy_next_upstream에 non_idempotent를 넣는 이유. 주문 생성은 POST라 기본값으로는
# 재시도되지 않는다. 그런데 client_order_id 멱등(uq_orders_client 강제)이 이중 접수를
# 막으므로 재시도가 안전하고, tries 2라 증폭도 2배로 상한된다.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_next_upstream error timeout http_502 http_503 non_idempotent;
proxy_next_upstream_tries 2;
proxy_connect_timeout 2s;
proxy_read_timeout 10s;
