global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    customer: exchange
    stack: operations
rule_files:
  - /etc/prometheus/exchange-rules/*.yml
  - /etc/prometheus/operations-rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels: {customer: exchange, service: observability}
  - job_name: linux-host
    file_sd_configs:
      - files: [/etc/prometheus/targets/hosts.json]
        refresh_interval: 30s
  - job_name: exchange-api
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: [/etc/prometheus/targets/apps.json]
        refresh_interval: 30s
  - job_name: postgres
    file_sd_configs:
      - files: [/etc/prometheus/targets/databases.json]
        refresh_interval: 30s
  - job_name: operations-reporter
    authorization:
      type: Bearer
      credentials_file: /run/secrets/reporter_token
    file_sd_configs:
      - files: [/etc/prometheus/targets/reporters.json]
        refresh_interval: 30s
  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    file_sd_configs:
      - files: [/etc/prometheus/targets/probes.json]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
