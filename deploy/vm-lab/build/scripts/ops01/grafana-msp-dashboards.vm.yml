# MSP 화면 프로비저닝. 원본은 deploy/linux/observability/grafana-msp-dashboards.yml이며
# 공급자 이름만 school-msp에서 vm-msp로 바꿨다. 갱신 간격 10초도 그대로 둔다.
# 배치 위치: /etc/grafana/provisioning/dashboards/vm-msp.yml (root:grafana 0640)
apiVersion: 1
providers:
  - name: vm-msp
    orgId: 1
    folder: MSP 운영
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/msp-dashboards
