# OPS01 수집 설정. 주소는 00-주소계획.md의 lab-lan 값만 사용한다.
# 원본은 failstop/deploy/linux/observability/prometheus.yml이며 다음만 바꿨다.
#  - 172.31.x 사설 주소를 192.168.10.x로 교체
#  - environment 라벨 aws -> vm-lab, account: school 제거
#  - 앱 지표를 Nginx 9101 프록시 대신 Actuator 8081에서 직접 수집
#  - 여섯 VM 전부를 linux-host 작업에 등록해 경보 규칙이 모두에 적용되게 함
#  - rule_files와 alerting을 처음부터 포함 (학교에서는 connect 단계에서 덧붙였다)
# 배치 위치: /etc/prometheus/prometheus.yml (root:prometheus 0640)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: vm-lab
    lab: virtualbox

rule_files:
  - /etc/prometheus/vm-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels: {customer: exchange, environment: vm-lab, role: observability, node: ops01, service: monitoring}

  # 여섯 VM의 node_exporter. 각 VM이 lab-lan 주소에만 바인딩한다.
  - job_name: linux-host
    static_configs:
      - targets: ['192.168.10.11:9100']
        labels: {customer: exchange, environment: vm-lab, role: edge, node: edge01, service: infra}
      - targets: ['192.168.10.21:9100']
        labels: {customer: exchange, environment: vm-lab, role: app, node: app01, service: infra}
      - targets: ['192.168.10.22:9100']
        labels: {customer: exchange, environment: vm-lab, role: app, node: app02, service: infra}
      - targets: ['192.168.10.31:9100']
        labels: {customer: exchange, environment: vm-lab, role: data, node: db01, service: infra}
      - targets: ['192.168.10.32:9100']
        labels: {customer: exchange, environment: vm-lab, role: standby, node: db02, service: infra}
      - targets: ['192.168.10.41:9100']
        labels: {customer: exchange, environment: vm-lab, role: observability, node: ops01, service: infra}

  # 앱 두 대의 Actuator. 접근제어도의 "앱 8081 Actuator" 정책을 따른다.
  # 앱은 MANAGEMENT_SERVER_ADDRESS를 자기 lab-lan 주소로 두고 노출 엔드포인트를 제한한다.
  - job_name: exchange-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['192.168.10.21:8081']
        labels: {customer: exchange, environment: vm-lab, role: app, node: app01, service: api}
      - targets: ['192.168.10.22:8081']
        labels: {customer: exchange, environment: vm-lab, role: app, node: app02, service: api}

  # DB 두 대의 postgres_exporter. 로컬 peer 인증으로 DB에 붙고 지표만 lab-lan에 연다.
  - job_name: postgres
    scrape_timeout: 10s
    static_configs:
      - targets: ['192.168.10.31:9187']
        labels: {customer: exchange, environment: vm-lab, role: data, node: db01, service: database}
      - targets: ['192.168.10.32:9187']
        labels: {customer: exchange, environment: vm-lab, role: standby, node: db02, service: database}

  # EDGE01 진입 경로의 합성 프로브. blackbox_exporter 가 OPS01 루프백 9115 에서 돈다.
  # MSP 화면의 '서비스 경로 · 계층별 상태' canvas 가 edge 계층을 probe_success{job="blackbox-http"}
  # 로 판정하므로 작업 이름을 바꾸지 않는다. role 은 02-정본결정.md 8절의 허용 값 안에 있어야
  # 그 패널의 정규식에 걸린다.
  #
  # 대상이 둘인 이유는 보는 것이 다르기 때문이다. / 는 EDGE01 의 정적 웹까지, /api/v1/markets 는
  # EDGE01 을 지나 앱까지 도달한다. 뒤엣것이 앱의 http_server_requests 히스토그램에 표본을 남겨
  # P95 응답시간 패널이 값을 갖게 한다. 15초 주기로 5분 창에 스무 표본이 들어온다.
  # 이 표본은 합성 프로브가 만든 것이다. 실제 사용자 부하가 아니라는 점을 판정에 반영한다.
  #
  # relabel 순서가 중요하다. __address__ 에 적은 URL 을 __param_target 으로 옮기고,
  # instance 를 그 URL 로 잡은 다음, 마지막에 __address__ 를 exporter 주소로 바꾼다.
  # 마지막 줄을 먼저 두면 Prometheus 가 URL 이 아니라 exporter 를 프로브 대상으로 넘긴다.
  - job_name: blackbox-http
    metrics_path: /probe
    scrape_timeout: 10s
    params:
      module: [https_2xx]
    static_configs:
      - targets: ['https://192.168.10.11/']
        labels: {customer: exchange, environment: vm-lab, role: edge, node: edge01, service: edge}
      - targets: ['https://192.168.10.11/api/v1/markets']
        labels: {customer: exchange, environment: vm-lab, role: edge, node: edge01, service: edge}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
