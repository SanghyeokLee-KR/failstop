# EDGE01 의 /etc/nginx/nginx.conf 원본. 배치 위치와 권한은 root:root 0644 다.
#
# 아래 네 자리의 값은 scripts/10-edge01-setup.sh 의 https 단계가 채운다.
# build-files 의 원본에는 자리표시자가 들어 있으므로 손으로 복사해 설치하지 않는다.
# 스크립트는 치환한 사본을 설치하고, 치환 뒤에도 __ 로 감싼 토큰이 남으면 멈춘다.
# 설치본에는 이 목록에 실제 값이 들어가 있다.
#   ENTRY_HOST   = __ENTRY_HOST__    정본 진입 주소. 프록시 Host 와 X-Forwarded-Host 에 쓴다
#   MGMT_IP      = __MGMT_IP__       host-only 바인딩 주소
#   LAN_IP       = __LAN_IP__        lab-lan 바인딩 주소
#   STATUS_PORT  = __STATUS_PORT__   stub_status 포트. 00-주소계획.md 포트 표와 같은 값이다
# 주소를 이 파일에 직접 적어 두면 스크립트의 ENTRY_HOST 를 바꿔도 프록시 Host 헤더만
# 옛 주소로 남는다. 앱의 CORS 와 WS 오리진 검사는 그 Host 값을 기준으로 동작한다.
#
# 원본은 failstop/deploy/linux/app/nginx-https.conf 다. 학교 AWS 전용 값만 VM 값으로 바꿨다.
#  - www.sang.it.kr          -> 자리표시자. 스크립트가 정본 진입 주소로 채운다
#  - Let's Encrypt 인증서    -> /etc/pki/tls 의 자체 서명 인증서
#  - /.well-known/acme-challenge 블록 제거. 자체 서명이라 발급·갱신 절차가 없다
#  - proxy_pass http://127.0.0.1:8080 -> upstream exchange_app (APP01 primary / APP02 backup)
#  - exchange-grafana.conf, exchange-reports.conf, exchange-admin.conf include 제거.
#    00-주소계획.md 이 Grafana 3000, Prometheus 9090, Alertmanager 9093 을 OPS01 루프백과
#    SSH 터널로만 열기로 했다. EDGE01 에서 /grafana, /admin, /operations/reports 를 공개하지 않는다
#  - exchange-metrics.conf include 제거. EDGE01 에는 앱이 없고 주소계획에 EDGE01 용 9101 이 없다
#  - limit_req_zone admin_login 제거. 관리 로그인 경로를 EDGE01 에서 받지 않는다
#
# 유지한 것은 server_tokens off, client_max_body_size 64k, map $http_upgrade,
# 80 default_server 404, 관리 경로 403, 점 파일 404, 보안 헤더 3종,
# try_files $uri $uri.html $uri/index.html, location /ws 404, 프록시 헤더 묶음이다.
#
# HTTP/2 는 켜지 않는다. nginx 는 HTTP/2 연결에서 Upgrade 프록시를 하지 않아
# = /ws/v1 의 WebSocket 핸드셰이크 경로가 달라진다. WS 를 먼저 확인한 뒤에 다룰 항목이다.
# HSTS 도 넣지 않는다. 자체 서명 인증서라 브라우저가 정책을 기억하면 되돌리기 번거롭다.

user nginx;

# EDGE01 은 vCPU 1 개다. 오픈소스 nginx 에서 업스트림 실패 표시(max_fails)는 워커마다
# 따로 관리되므로 워커를 하나로 고정해 APP01 장애 판단이 워커별로 갈리지 않게 한다.
worker_processes 1;

# reload 때 오래된 워커가 기존 WebSocket 연결을 무한정 붙잡지 않게 한다.
# 리더를 바꾼 뒤 클라이언트 재접속이 실제로 일어나야 시세가 다시 흐른다.
worker_shutdown_timeout 30s;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    types_hash_max_size 4096;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 64k;
    access_log /var/log/nginx/access.log;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # 업스트림은 별도 파일에 둔다. 장애 복구 때 primary 와 backup 순서를 바꾸는 대상이
    # 이 파일 하나로 좁혀지고, 10-edge01-setup.sh swap-upstream 이 그 파일만 고친다.
    include /etc/nginx/exchange-upstream.conf;

    # 허용 목록 밖의 Host 헤더는 default_server 가 먼저 받아 404 를 낸다.
    # default_server 는 listen 소켓마다 하나씩 필요하므로 두 주소를 여기에 함께 적는다.
    server {
        listen __LAN_IP__:80 default_server;
        listen __MGMT_IP__:80 default_server;
        server_name _;
        return 404;
    }

    # TLS 핸드셰이크가 성립해야 404 를 낼 수 있으므로 default_server 에도 인증서를 지정한다.
    server {
        listen __LAN_IP__:443 ssl default_server;
        listen __MGMT_IP__:443 ssl default_server;
        server_name _;
        ssl_certificate /etc/pki/tls/certs/edge01.crt;
        ssl_certificate_key /etc/pki/tls/private/edge01.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        return 404;
    }

    # 80 은 HTTPS 전환에만 쓴다. 본문을 내지 않는다.
    # 이동 주소를 $host 로 만들어 host-only 와 lab-lan 중 실제로 들어온 쪽을 유지한다.
    server {
        listen __LAN_IP__:80;
        listen __MGMT_IP__:80;
        server_name __MGMT_IP__ __LAN_IP__;
        location / { return 308 https://$host$request_uri; }
    }

    server {
        listen __LAN_IP__:443 ssl;
        listen __MGMT_IP__:443 ssl;
        server_name __MGMT_IP__ __LAN_IP__;

        ssl_certificate /etc/pki/tls/certs/edge01.crt;
        ssl_certificate_key /etc/pki/tls/private/edge01.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /opt/exchange-web/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        # 관리 경로는 EDGE01 에서 공개하지 않는다. 웹 번들에 admin 페이지가 들어 있어도 내보내지 않는다.
        # ^~ 접두 일치라 /admin, /admin.html, /admin/ 아래가 모두 걸린다.
        location ^~ /admin { return 403; }
        location ^~ /api/admin { return 403; }
        location ^~ /api/v1/admin { return 403; }
        location ^~ /actuator { return 403; }
        # .env, .git 같은 점으로 시작하는 경로는 존재 여부를 알리지 않는다.
        location ~ /\. { return 404; }

        location /api/ {
            proxy_pass http://exchange_app;
            # 앱의 CORS 와 WS 오리진 검사가 이 Host 값을 기준으로 동작한다.
            # 정본 진입 주소와 한 글자라도 다르면 브라우저 요청이 막힌다.
            proxy_set_header Host __ENTRY_HOST__;
            proxy_set_header X-Forwarded-Host __ENTRY_HOST__;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            # 클라이언트가 보낸 Forwarded 와 운영자 인증서 헤더는 지운다. 위조 입력을 앱에 넘기지 않는다.
            proxy_set_header Forwarded "";
            proxy_set_header X-Operator-Cn "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_buffering off;

            # APP01 이 멈추면 다음 업스트림(APP02)으로 넘긴다.
            # non_idempotent 는 넣지 않는다. 주문 POST 를 프록시가 자동 재전송하면
            # 저널 기록 뒤 응답만 끊긴 경우까지 다시 보내게 되고,
            # 재조회로 수렴하라는 API 계약(503 + Retry-After 1)의 판단을 프록시가 가져가 버린다.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        location = /ws/v1 {
            proxy_pass http://exchange_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host __ENTRY_HOST__;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            # STOMP 하트비트가 오가는 동안에는 이 시간이 지나도 연결이 끊기지 않는다.
            # 게시가 멈추고 하트비트만 남은 상태는 여기서 감지하지 못한다.
            proxy_read_timeout 75s;
            # keepalive 는 쓰지 않는다. upgrade 연결과 섞이고,
            # WS 와 API 가 같은 upstream 의 실패 표시를 공유해야 하기 때문이다.
        }

        # /ws/v1 외의 /ws 경로는 열지 않는다.
        location /ws { return 404; }

        location / { try_files $uri $uri.html $uri/index.html =404; }
    }

    # Nginx 자체 상태. 루프백에만 연다. 포트 값은 10-edge01-setup.sh 의 STATUS_PORT 에서 오고
    # 그 값은 00-주소계획.md 포트 표의 'EDGE01 TCP 8090 루프백만' 행과 같아야 한다.
    # 형태는 deploy/linux/app/nginx-metrics.conf 의 limit_except GET 과 allow/deny 를 가져왔다.
    # 확인은 EDGE01 에 SSH 로 들어가 curl http://127.0.0.1:8090/nginx_status 로 한다.
    # EDGE01 의 sshd 는 AllowTcpForwarding no 라 작업 PC 에서 터널로는 붙을 수 없다.
    server {
        listen 127.0.0.1:__STATUS_PORT__;
        server_name _;
        allow 127.0.0.1;
        deny all;

        location = /nginx_status {
            limit_except GET { deny all; }
            stub_status;
        }

        location / { return 404; }
    }
}
