# OPS01 Alertmanager 최종 설정. 비밀 파일 두 개를 만든 뒤에 적용한다.
#
# 설치 위치: /etc/failstop/alertmanager.yml (root:alertmanager 0640)
# 적용 명령: sudo scripts/40-ops01-observability.sh connect
#
# 원본은 failstop/deploy/linux/reporting/alertmanager.school.yml 이며 바꾼 자리는 두 곳이다.
#   1. 보고 수신 주소를 학교 사설 172.31.44.141:9088 에서 OPS01 루프백 127.0.0.1:9088 로 교체.
#      VM 에서는 보고 서비스가 같은 호스트에 있으므로 이 경로가 밖으로 나가지 않는다.
#   2. 카드 제목의 환경 표기에 vm-lab 분기 추가. aws·local-lab 분기는 원본 그대로 둔다.
# 묶음 조건(group_by, group_wait, group_interval, repeat_interval)과 억제 규칙은 원본과 같다.
#
# 필요한 비밀 파일 두 개는 OPS01 에서 직접 만든다. 값은 이 폴더 어디에도 넣지 않는다.
#   /etc/failstop/teams-webhook   (root:alertmanager 0640) Teams 수신 커넥터 주소
#   /etc/failstop/reporter-token  (root:alertmanager 0640) 보고 서비스 Bearer 토큰
# 두 파일이 없으면 Alertmanager 가 기동에 실패한다. 그때까지는 alertmanager.hold.yml 을 쓴다.
#
# 경보는 두 갈래로 나간다. teams 수신자가 기본 장애 알림을 바로 보내고, evidence-reporter 가
# 같은 경보를 보고 서비스로 넘겨 지표와 증거를 붙인 보고를 따로 만든다. 두 경로가 독립이라
# 보고 서비스나 AI 가 멈춰도 기본 알림은 계속 전달된다.
#
# 127.0.0.1:9088 은 보고 역할(41-ops01-reporting.sh)의 실제 바인딩과 대조한 뒤에 확정한다.
# 보고 역할이 이 파일을 자기 기준으로 다시 쓰면 그 파일이 정본이며, 설치 경로는 그대로다.
route:
  receiver: teams
  group_by: [customer, environment, alertname, component, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: teams
      continue: true
    - receiver: evidence-reporter
receivers:
  - name: teams
    msteamsv2_configs:
      - webhook_url_file: /etc/failstop/teams-webhook
        send_resolved: true
        http_config:
          follow_redirects: false
        title: >-
          {{ if eq .Status "firing" }}{{ printf "%c" 128308 }}{{ else }}{{ printf "%c" 128994 }}{{ end }}
          {{ if eq .Status "resolved" }}{{ if .CommonAnnotations.resolved_summary }}{{ .CommonAnnotations.resolved_summary }}{{ else }}경보 해제 · {{ .CommonAnnotations.summary }}{{ end }}{{ else }}{{ .CommonAnnotations.summary }}{{ end }}
        text: |-
          **{{ .CommonLabels.customer }} · {{ if eq .CommonLabels.environment "aws" }}AWS{{ else if eq .CommonLabels.environment "vm-lab" }}VM 실습{{ else if eq .CommonLabels.environment "local-lab" }}로컬 검증{{ else }}{{ .CommonLabels.environment }}{{ end }}**

          {{ range .Alerts -}}
          **대상** {{ if .Labels.node }}{{ .Labels.node }}{{ else }}{{ .Labels.instance }}{{ end }}{{ if .Labels.role }} · {{ if eq .Labels.role "standby" }}Standby DB{{ else if eq .Labels.role "data" }}Primary DB{{ else if eq .Labels.role "reader" }}조회 API{{ else if eq .Labels.role "app" }}Spring API{{ else }}{{ .Labels.role }}{{ end }}{{ end }}

          **감지** {{ .StartsAt | tz "Asia/Seoul" | date "2006-01-02 15:04:05" }} KST{{ if eq .Status "resolved" }} · **해제** {{ .EndsAt | tz "Asia/Seoul" | date "15:04:05" }} KST{{ end }}

          {{ if eq .Status "firing" }}{{ if .Annotations.description }}**확인 사항** {{ .Annotations.description }}{{ else }}**대응** 담당자 확인 필요{{ end }}{{ else }}**후속 확인** 서비스 응답·복제 상태 재점검 필요{{ end }}

          {{ end -}}
          **경보 코드** `{{ .CommonLabels.alertname }}`
  - name: evidence-reporter
    webhook_configs:
      - url: http://127.0.0.1:9088/alerts
        send_resolved: true
        max_alerts: 30
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials_file: /etc/failstop/reporter-token
inhibit_rules:
  # 호스트가 통째로 안 보이면 같은 호스트의 수집기 실패 경보는 중복이다.
  - source_matchers: [alertname="LinuxHostUnreachable"]
    target_matchers: [alertname=~"LinuxCollectorFailed|LinuxLogCollectionStale"]
    equal: [instance]
