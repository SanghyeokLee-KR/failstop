# 백업 보관 전용 계정의 SSH 허용. 배치 위치는 /etc/ssh/sshd_config.d/30-db-backup.conf 다.
# Databasus 예행에서 EDGE01 을 외부 보관 대상으로 쓰기 위해 둔다.
#
# 왜 별도 파일인가
#   공통 기반의 20-vm-lab.conf 는 AllowUsers 를 ops 하나로 좁혀 두었고 그 파일은
#   00-common-setup.sh 가 다시 만든다. 거기에 적으면 공통 절차를 다시 돌릴 때 사라진다.
#
# AllowUsers 는 여러 번 적으면 합쳐진다. 뒤 줄이 앞 줄을 덮어쓰지 않는다.
# 그래도 ops 를 함께 적어 두는 편이 안전하다. 20-vm-lab.conf 가 사라지거나 순서가 바뀌어도
# 관리 접속이 끊기지 않는다. 출발지는 OPS01 의 관리 주소 하나로 못박고 대역 전체를 열지 않는다.
#
# Match 블록의 적용 범위
#   sshd 는 Include 한 파일이 끝나면 전역 문맥으로 돌아온다. 그래서 이 파일 끝의 Match 가
#   주 설정 파일에서 Include 뒤에 오는 AuthorizedKeysFile 과 Subsystem 을 삼키지 않는다.
#   실제로 sshd -T 로 두 지시자가 전역에 남아 있는 것과 ops 계정의 scp 가 되는 것을 확인했다.
#   그래도 이 파일에는 Match 뒤에 아무것도 더 적지 않는다.
AllowUsers ops@192.168.56.0/24 dbbackup@192.168.56.41

Match User dbbackup
    ChrootDirectory /srv/db-backup
    ForceCommand internal-sftp
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no
    PubkeyAuthentication yes
