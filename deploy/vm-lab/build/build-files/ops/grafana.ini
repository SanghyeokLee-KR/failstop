# OPS01 의 Grafana 설정. 배치 위치는 /etc/grafana/grafana.ini 다.
# 배포판 기본값은 /etc/grafana/grafana.ini.rpm-original 로 보관돼 있고 여기 적은 값만 덮어쓴다.
#
# 비밀 값은 이 파일에 적지 않는다. secret_key 는 호스트마다 다르게 만들어야 하므로
# 저장소에 값을 두지 않고 40-ops01-observability.sh 가 각 호스트에서 생성해 넣는다.

[server]
http_addr = 127.0.0.1
http_port = 3000

[security]
disable_initial_admin_creation = true
# 사용자 아이콘을 gravatar.com 에서 받지 않는다(외부 발신 차단).
disable_gravatar = true
# secret_key 는 여기에 적지 않는다. 비어 있으면 Grafana 가 배포본에 들어 있는 고정 기본값을 쓰는데,
# 그 값은 공개 상수라서 grafana.db 만 얻으면 누구나 저장된 비밀을 복호화할 수 있다.
# 지금은 저장된 비밀이 없어 피해가 없지만 서비스 계정 토큰, DB 데이터 원본 비밀번호,
# Teams 웹훅을 넣는 순간부터 해당한다. 설치 절차가 호스트에서 만들어 이 절에 넣는다.

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false

[dashboards]
# 로그인 직후에 빈 Grafana 기본 홈이 아니라 관제 화면이 뜨게 한다.
# 이 값이 없으면 관리자가 로그인해서 폴더를 뒤져야 첫 화면에 닿는다.
default_home_dashboard_path = /var/lib/grafana/msp-dashboards/10-msp-overview.json

# 아래 세 절은 grafana.com 으로 나가는 요청을 끈다. pfSense 경계형에서는 OPS01 의 외부 443 이 막혀 있어
# 켜 두면 업데이트·플러그인 확인이 10초마다 시간 초과로 실패하고 방화벽 차단 로그를 채운다.
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false

[plugins]
# 기본 플러그인 자동 설치·갱신을 끈다. 필요한 플러그인은 배포본에 들어 있다.
preinstall_disabled = true
# 플러그인 서명 확인용 공개 키를 grafana.com 에서 받지 않고 배포본에 든 키를 쓴다.
public_key_retrieval_disabled = true

[log]
mode = console
level = info

[unified_alerting]
# 끈다. 경보는 Prometheus 규칙과 Alertmanager 가 담당하고 Grafana 경보는 쓰지 않는다.
# 근거는 00-주소계획.md 의 9093·9088 항목과 VM_네트워크_접근제어도의 경보 경로다.
# 이 값이 false 면 Grafana 좌측 메뉴에 Alerting 이 뜨지 않는다. 설정 오류가 아니다.
# 나중에 Teams 웹훅을 붙일 때도 Grafana 연락처가 아니라 Alertmanager 쪽에 붙인다.
enabled = false
