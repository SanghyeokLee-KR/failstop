# DB01 Primary의 PostgreSQL 접속 인증 규칙.
# 배치 위치는 PGDATA/pg_hba.conf, 소유자 postgres:postgres, 권한 0600이다.
# PGDATA 경로는 설치한 패키지가 정한다. PGDG의 postgresql17-server라면
# /var/lib/pgsql/17/data 이며, 실제 값은 systemctl show -p Environment 로 확인한다.
#
# 근거는 VM_네트워크_접근제어도.svg의 "DB01 TCP 5432, 앱 계정과 복제 계정 분리,
# pg_hba.conf도 출발지 제한"과 00-주소계획.md의 허용 출발지 표다.
# DB01에서는 방화벽에서 한 번 거르고 DB에서 다시 거른다. 둘 중 하나가 열려도 다른 하나가 막는다.
# 이 두 겹은 DB01에만 해당한다. DB02는 pg_basebackup 이 이 파일을 그대로 복사해 가므로
# 승격 전에도 앱 규칙을 갖고 있고, 5432를 막는 것은 nftables 한 겹이다.
#
# 규칙은 위에서 아래로 처음 일치하는 줄만 적용된다. 여기 없는 조합은 거부된다.
# initdb가 넣는 host 127.0.0.1/32, host ::1/128 줄은 지웠다. TLS 없는 TCP 접속을
# 만들지 않기 위해서다. 로컬 작업은 아래 peer 규칙의 유닉스 소켓으로 한다.
#
# hostssl만 쓰므로 앱과 Standby는 sslmode=verify-full 과
# sslrootcert=<DB01의 server.crt> 로 접속한다. 자체 서명 인증서라 신뢰 사슬이 없고,
# 인증서를 바꾸면 세 노드에 다시 배포해야 한다.

# TYPE    DATABASE        USER            ADDRESS                 METHOD

# 유닉스 소켓 로컬 접속. OS 계정과 DB 역할 이름이 같을 때만 통과한다.
# postgres(관리)와 failstop_monitor(관측)가 이 경로를 쓴다. 비밀번호가 필요 없다.
local     all             all                                     peer

# 앱 두 대의 거래 접속. 계정은 exchange_app 하나이며 주소를 /32로 고정한다.
hostssl   exchange        exchange_app    192.168.10.21/32        scram-sha-256
hostssl   exchange        exchange_app    192.168.10.22/32        scram-sha-256

# DB02의 복제 접속. replication은 실제 데이터베이스 이름이 아니라 복제 연결을 뜻한다.
# replicator에는 LOGIN과 REPLICATION만 있고 거래 데이터 조회 권한이 없다.
hostssl   replication     replicator      192.168.10.32/32        scram-sha-256

# Flyway 마이그레이션 계정 exchange_owner의 규칙은 이 파일에 넣지 않는다.
# 그 줄은 마이그레이션을 실행하는 동안에만 있어야 하므로 스크립트가 넣고 뺀다.
#
#   sudo /opt/vm-lab/scripts/30-db-primary-setup.sh migrate-open
#     이 파일 끝에 표식 구간을 만들고 그 안에 아래 한 줄을 넣은 뒤 reload 한다.
#       hostssl   exchange   exchange_owner   192.168.10.21/32   scram-sha-256
#     같은 단계가 ALTER ROLE exchange_owner LOGIN 도 실행한다.
#
#   sudo /opt/vm-lab/scripts/30-db-primary-setup.sh migrate-close
#     표식 구간을 지워 그 줄을 없애고 ALTER ROLE exchange_owner NOLOGIN 을 실행한다.
#
# 창을 열지 않으면 APP01의 Flyway는 여기서 막힌다. 열어 둔 채로 두면 마이그레이션
# 계정의 접속 경로가 남아 접근제어도와 어긋난다. 두 단계는 항상 짝으로 실행한다.
# 손으로 줄을 넣었다면 표식이 없으므로 migrate-close 가 경고만 내고 지우지 않는다.
# 그때는 그 줄을 직접 지우고 reload 한다.
