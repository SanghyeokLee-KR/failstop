# DB01 노드 전용 PostgreSQL 설정.
# 배치 위치는 /etc/postgresql/node.conf, 소유자 root:postgres, 권한 0640이다.
#
# 설정이 적용되는 순서는 다음과 같다.
#   1. PGDATA/postgresql.conf 맨 끝에서 include = '/etc/postgresql/exchange.conf'
#   2. exchange.conf 맨 끝에서 include = '/etc/postgresql/node.conf'
# 즉 이 파일의 값이 마지막에 읽혀 앞의 값을 덮는다.
#
# 공통 설정(exchange.conf)은 failstop 저장소의 deploy/linux/postgresql/exchange.conf를
# 고치지 않고 그대로 쓴다. 노드마다 달라지는 값만 이 파일로 분리한다.
# 그래서 exchange.conf 첫 줄에는 "학교 EC2의 PostgreSQL 17 공통 설정"이라는 원본의
# 머리말이 그대로 남아 있다. 사본이 한 글자도 다르지 않아야 30·31 스크립트의
# SHA-256 대조가 성립하므로 그 줄을 VM 표기로 고치지 않는다. 값 자체는 두 환경에서
# 같은 것을 쓰기로 한 것이며, VM에서 측정한 결과를 학교 EC2의 결과로 옮겨 적지 않는다.
#
# 이 파일을 PGDATA 밖에 두는 이유가 있다. 나중에 DB01을 Standby로 다시 넣을 때
# pg_basebackup이 PGDATA를 통째로 덮어쓰는데, 주소 설정이 PGDATA 안에 있으면
# 다른 노드의 주소가 그대로 따라 들어온다. 설정을 밖에 두면 그 사고가 생기지 않는다.

# 수신 주소. 루프백과 lab-lan 주소에만 연다.
# 관리 대역 192.168.56.31에는 DB를 열지 않는다. 관리는 SSH로만 들어온다.
# 0.0.0.0으로 여는 설정을 쓰지 않는다. ss -lntp로 실제 바인딩을 확인한다.
listen_addresses = 'localhost,192.168.10.31'

# 아래 값은 exchange.conf에 이미 있으므로 여기서 다시 지정하지 않는다.
#   port 5432, ssl on, ssl_cert_file, ssl_key_file
#   wal_level replica, max_wal_senders 4, max_replication_slots 4
#   synchronous_standby_names '' (비동기 복제)
# 값을 바꿔야 하면 여기에 한 줄을 더하지 말고 어느 파일을 고칠지 먼저 정한다.
# 공통 기준이 바뀌면 저장소의 exchange.conf를, 이 노드만의 사정이면 이 파일을 고친다.
