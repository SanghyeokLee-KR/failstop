# DB02 노드 전용 PostgreSQL 설정.
# 배치 위치는 /etc/postgresql/node.conf, 소유자 root:postgres, 권한 0640이다.
#
# 설정이 적용되는 순서는 DB01과 같다.
#   1. PGDATA/postgresql.conf 맨 끝에서 include = '/etc/postgresql/exchange.conf'
#   2. exchange.conf 맨 끝에서 include = '/etc/postgresql/node.conf'
# 이 파일의 값이 마지막에 읽혀 앞의 값을 덮는다.
#
# 이 파일을 PGDATA 밖에 두는 이유가 Standby에서는 더 직접적이다.
# DB02의 PGDATA는 pg_basebackup이 DB01에서 통째로 받아 만든다. 주소 설정이
# PGDATA 안에 있으면 DB01의 주소가 그대로 따라 들어와 DB02가 DB01 주소로
# 열려고 하다 기동에 실패한다. 설정을 밖에 두면 그 사고가 생기지 않는다.

# 수신 주소. 루프백과 lab-lan 주소에만 연다.
# 관리 대역 192.168.56.32에는 DB를 열지 않는다. 관리는 SSH로만 들어온다.
# 승격 전에는 방화벽이 5432를 어떤 출발지에도 열지 않으므로 이 주소로 붙을 수 있는
# 곳은 없다. 그래도 0.0.0.0으로 여는 설정은 쓰지 않는다. 승격 뒤에 그대로 남으면
# 열 생각이 없던 경로까지 열리기 때문이다. ss -lntp로 실제 바인딩을 확인한다.
listen_addresses = 'localhost,192.168.10.32'

# 유닉스 소켓 경로를 명시한다. postgres_exporter가 이 소켓으로 붙는다.
# 배포판 기본값과 같지만, PGDATA를 다른 노드에서 받아 오는 구성이라 값을 고정해 둔다.
unix_socket_directories = '/var/run/postgresql, /tmp'

# 아래 값은 exchange.conf에 이미 있으므로 여기서 다시 지정하지 않는다.
#   port 5432, ssl on, ssl_cert_file, ssl_key_file
#   wal_level replica, hot_standby on, wal_log_hints on
#   synchronous_standby_names '' (비동기 복제)
# 값을 바꿔야 하면 여기에 한 줄을 더하지 말고 어느 파일을 고칠지 먼저 정한다.
# 공통 기준이 바뀌면 저장소의 exchange.conf를, 이 노드만의 사정이면 이 파일을 고친다.
