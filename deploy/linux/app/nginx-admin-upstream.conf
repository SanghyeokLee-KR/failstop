proxy_pass https://172.31.44.141:8443;
proxy_ssl_certificate /etc/nginx/admin-pki/gateway.crt;
proxy_ssl_certificate_key /etc/nginx/admin-pki/gateway.key;
proxy_ssl_trusted_certificate /etc/nginx/admin-pki/ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_server_name on;
proxy_ssl_name school-bot-admin.internal;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_set_header Host www.sang.it.kr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Forwarded "";
proxy_set_header X-Operator-Cn "";
proxy_connect_timeout 3s;
proxy_read_timeout 30s;
proxy_buffering off;
