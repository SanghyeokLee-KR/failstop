user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /var/log/nginx/access.log;
    include /etc/nginx/exchange-metrics.conf;

    server {
        listen 80 default_server;
        server_name _;
        root /opt/exchange-web/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # HTTP 화면 확인 단계에서는 계정 정보와 주문을 받지 않는다.
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        location ^~ /api/admin { return 403; }
        location ^~ /admin { return 403; }
        location ^~ /actuator { return 403; }
        location ^~ /ws { return 403; }
        location ^~ /auth { return 403; }
        location ~ /\. { return 404; }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }

        location / {
            try_files $uri $uri.html $uri/index.html =404;
        }
    }
}
