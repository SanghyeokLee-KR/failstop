# HTTPS server 안에 포함한다. 로그인만 Basic 인증을 쓰고 이후에는 단기 Bearer 세션을 검증한다.
location = /admin/v1/session {
    limit_except POST { deny all; }
    limit_req zone=admin_login burst=3 nodelay;
    limit_req_status 429;
    auth_basic "Exchange bot operator";
    auth_basic_user_file /etc/nginx/admin.htpasswd;
    # 비밀번호를 봇 서버에 전달하지 않는다. 서버 신원은 별도 mTLS 인증서로 확인한다.
    proxy_set_header Authorization "";
    include /etc/nginx/exchange-admin-upstream.conf;
}
location ^~ /admin/v1/ {
    # 경로 변형으로 로그인 검사를 건너뛰지 못하게 한다.
    if ($uri ~ "^/admin/v1/session") { return 404; }
    include /etc/nginx/exchange-admin-upstream.conf;
}
location = /admin {
    return 308 https://www.sang.it.kr/admin/bots;
}
location ^~ /admin/ {
    try_files $uri $uri.html $uri/index.html =404;
}
