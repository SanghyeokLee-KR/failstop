# 학교 app-1의 사설 주소에서 관측 노드만 지표를 읽는다.
# 앱 SG도 TCP 9101의 소스를 bot-1 SG로 제한한다.
server {
    listen 172.31.2.86:9101;
    server_name _;
    allow 172.31.44.141;
    deny all;

    location = /metrics {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8081/actuator/prometheus;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / { return 404; }
}
