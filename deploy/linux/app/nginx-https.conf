user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    types_hash_max_size 4096;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_max_body_size 64k;
    access_log /var/log/nginx/access.log;
    limit_req_zone $binary_remote_addr zone=admin_login:1m rate=5r/m;
    include /etc/nginx/exchange-metrics.conf;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
    server {
        listen 80;
        server_name www.sang.it.kr;
        # 인증서 갱신은 앱과 무관하게 이 디렉터리만 사용한다.
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
            default_type text/plain;
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        location / { return 308 https://www.sang.it.kr$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name www.sang.it.kr;
        ssl_certificate /etc/letsencrypt/live/www.sang.it.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.sang.it.kr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        if ($host != www.sang.it.kr) { return 404; }
        root /opt/exchange-web/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        include /etc/nginx/exchange-grafana.conf;
        include /etc/nginx/exchange-reports.conf;
        include /etc/nginx/exchange-deck.conf;

        include /etc/nginx/exchange-admin.conf;
        location ^~ /api/admin { return 403; }
        location ^~ /api/v1/admin { return 403; }
        location ^~ /actuator { return 403; }
        location ~ /\. { return 404; }
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host www.sang.it.kr;
            proxy_set_header X-Forwarded-Host www.sang.it.kr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Operator-Cn "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
        location = /ws/v1 {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host www.sang.it.kr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_read_timeout 75s;
        }
        location /ws { return 404; }
        location / { try_files $uri $uri.html $uri/index.html =404; }
    }
}
