# HTTPS 서버 안에 포함한다. 발표 자료(정적 HTML·글꼴·이미지·시연 영상)를 /deck/ 에서 읽기 전용으로 낸다.
# 학교 계정의 표준 인스턴스 vCPU 한도(계정 전체 16개)가 차서 발표 전용 인스턴스를 켜지 못했고, 2026-09-28 사용자 결정으로
# 앱 서버의 공개 Nginx 에 함께 둔다. 발표가 끝나면 이 파일과 nginx.conf 의 include 한 줄을 지우고 /opt/exchange-deck 를 지운다.
location = /deck { return 308 /deck/; }
location ^~ /deck/ {
    alias /opt/exchange-deck/current/;
    index index.html;
    limit_except GET { deny all; }
    # 발표 화면은 같은 출처의 슬라이드를 iframe 하나로 싣는다. location 에 add_header 를 두면 서버의 머리글을 물려받지
    # 않으므로 서버의 세 머리글을 다시 적고 X-Frame-Options 만 SAMEORIGIN 으로 연다
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
