# HTTPS server 블록 안에 포함한다. /grafana 접두사는 Grafana가 처리한다.
location = /grafana {
    return 308 https://www.sang.it.kr/grafana/;
}
location ^~ /grafana/ {
    proxy_pass http://172.31.44.141:3000;
    proxy_http_version 1.1;
    proxy_set_header Host www.sang.it.kr;
    proxy_set_header X-Forwarded-Host www.sang.it.kr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-WEBAUTH-USER "";
    proxy_set_header X-Operator-Cn "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
    proxy_buffering off;
}
