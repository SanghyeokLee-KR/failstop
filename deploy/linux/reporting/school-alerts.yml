# Linux 규칙은 app·DB 호스트(job=linux-host)와 bot-1 자체(job=linux)를 함께 본다.
# bot-1의 Prometheus·Alertmanager가 멈추면 이 파일의 어떤 규칙도 알리지 못한다. 관측 노드 전체의
# 정지는 외부 감시가 따로 필요하다.
groups:
  - name: school.operations
    rules:
      - alert: LinuxHostUnreachable
        expr: up{job=~"linux|linux-host"} == 0
        for: 1m
        labels: {customer: exchange, environment: aws, severity: critical, component: linux}
        annotations:
          summary: Linux 호스트 수집 경로 장애 발생
      - alert: LinuxCollectorFailed
        expr: node_scrape_collector_success{job=~"linux|linux-host"} == 0
        for: 1m
        labels: {customer: exchange, environment: aws, severity: warning, component: monitoring}
        annotations:
          summary: Linux 수집기 부분 실패
      # 임계는 관제센터 임계값 레지스트리(host.disk_free_alert)의 마지막 수집값이고, 7일 동안 수집된 적이 없으면 0.15다.
      # 순간값이 아니라 마지막 값을 보는 이유는 용량 보호가 게이지를 내는 관리 JVM을 멈추는 조건이 디스크 부족이기 때문이다.
      # 순간값을 읽으면 디스크가 줄어드는 바로 그때 경보가 0.15로 돌아가 둔해진다. 요약에는 숫자를 싣지 않고 threshold가 지금 임계를 보인다.
      - alert: LinuxDiskSpaceLow
        expr: >-
          (node_filesystem_avail_bytes{job=~"linux|linux-host",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes
            < scalar(max(last_over_time(exchange_ops_threshold{key="host.disk_free_alert"}[7d])) or vector(0.15)))
          and on(instance,device,mountpoint) (node_filesystem_readonly == 0)
        for: 5m
        labels: {customer: exchange, environment: aws, severity: warning, component: storage}
        annotations:
          summary: 디스크 여유 공간 부족 · 임계 미만
          threshold: >-
            {{ with query "max(last_over_time(exchange_ops_threshold{key=\"host.disk_free_alert\"}[7d]))" }}{{ . | first | value | humanizePercentage }}{{ else }}15%{{ end }}
          threshold_key: host.disk_free_alert
      - alert: LinuxInodesLow
        expr: node_filesystem_files_free{job=~"linux|linux-host",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files < 0.10
        for: 5m
        labels: {customer: exchange, environment: aws, severity: warning, component: storage}
        annotations:
          summary: inode 여유 부족 · 10% 미만
      # 보고 서비스와 봇은 아래 전용 규칙이 멈춤까지 알리므로 여기서 빼 같은 장애를 두 번 보내지 않는다.
      # DB 백업(failstop-db-backup)도 뺀다. 한 번 실패하면 다음 날 실행까지 failed로 남아 백업 경보
      # (postgresql/backup/backup-alerts.yml)와 겹치므로, 지표로 기록되지 않은 실패만 DatabaseBackupServiceFailed가 맡는다.
      # 용량 보호(exchange-bot-capacity)는 봇을 멈추거나 수집 누락을 기록해도 정상 종료하므로
      # 이 유닛의 failed는 봇 중지·판정 기록을 끝내지 못한 스크립트 오류만 뜻한다. 관측 워치독(failstop-watchdog)의
      # failed는 웹훅 비밀을 읽지 못했거나 알림을 버린 실행이며, 워치독이 스스로 알릴 수 없어 여기서 알린다.
      - alert: LinuxServiceFailed
        expr: node_systemd_unit_state{job=~"linux|linux-host",state="failed",name!~"(failstop-reporting|exchange-bot|failstop-db-backup)[.]service"} == 1
        for: 30s
        labels: {customer: exchange, environment: aws, severity: critical, component: linux}
        annotations:
          summary: Linux 서비스 장애 발생
      # 경보 카드는 Alertmanager가 Teams로 직접 보내므로 보고 서비스가 멈춰도 이 경보는 도착한다.
      # 재시작 반복(activating)도 잡도록 active가 아닌 상태 전체를 본다. 수집 목록에 유닛이 없으면
      # 미수집을 정상으로 보지 않도록 absent로 알린다. absent 결과에는 대상 라벨이 없어 node·role을 적는다.
      # 보고 서비스가 멈추면 관측 워치독의 reporting·report_queue·daily_report 점검도 따로 알린다(의도한 겹침).
      - alert: OperationsReporterNotActive
        expr: (node_systemd_unit_state{job="linux",name="failstop-reporting.service",state="active"} == 0) or absent(node_systemd_unit_state{job="linux",name="failstop-reporting.service",state="active"})
        for: 2m
        labels: {customer: exchange, environment: aws, node: bot-1, role: observability, severity: warning, component: reporting}
        annotations:
          summary: 운영 보고 서비스 중지·미수집
          description: Teams 기본 경보는 계속 전달되지만 AI 근거 보고와 일일 보고가 멈춘 상태. failstop-reporting 서비스 상태와 journal 확인 필요
          resolved_summary: 운영 보고 서비스 경보 해제
      # 타이머가 서비스를 실행했는지만 본다. 보고가 Teams에 전달됐는지는 보고 서비스 지표가 필요하다.
      - alert: OperationsDailyReportNotTriggered
        expr: (time() - node_systemd_timer_last_trigger_seconds{job="linux",name="failstop-reporting-daily.timer"} > 93600) or absent(node_systemd_timer_last_trigger_seconds{job="linux",name="failstop-reporting-daily.timer"})
        for: 15m
        labels: {customer: exchange, environment: aws, node: bot-1, role: observability, severity: warning, component: reporting}
        annotations:
          summary: 일일 보고 예약 실행 없음 · 26시간 초과
          description: failstop-reporting-daily.timer 활성 상태와 마지막 실행 시각 확인 필요. 전달 성공 여부는 이 경보로 판정하지 않음
          resolved_summary: 일일 보고 예약 실행 경보 해제
      # 용량 보호가 봇을 멈추면 서비스는 failed가 아니라 inactive가 된다. 계획한 수동 중지도 여기에 걸린다.
      # 관측 워치독의 market_bot도 같은 중지를 Teams로 따로 알린다. Alertmanager 경로가 죽었을 때를 위한
      # 별도 경로라 두 카드가 함께 나가는 것은 의도한 겹침이다(deploy/linux/watchdog/README.md).
      - alert: MarketBotNotActive
        expr: (node_systemd_unit_state{job="linux",name="exchange-bot.service",state="active"} == 0) or absent(node_systemd_unit_state{job="linux",name="exchange-bot.service",state="active"})
        for: 5m
        labels: {customer: exchange, environment: aws, node: bot-1, role: observability, severity: warning, component: bot}
        annotations:
          summary: 시장 봇 서비스 중지·미수집
          description: 용량 보호 판정(/var/lib/exchange-bot-guard/state.json), systemd 시작 제한, 계획한 수동 중지 여부 확인 필요
          resolved_summary: 시장 봇 서비스 경보 해제
      # 관리 JVM은 수집되는데 임계값 게이지가 없다. 관제센터를 끈 채 수집 잡이 남았거나 relabel이 게이지를 떨어뜨린 경우다.
      # 수집 잡이 없으면 up이 없어 울리지 않으므로 prometheus.yml의 exchange-admin 잡과 함께 넣고 함께 뺀다.
      - alert: OpsThresholdGaugeMissing
        expr: max(up{job="exchange-admin"}) == 1 and on() absent(exchange_ops_threshold)
        for: 10m
        labels: {customer: exchange, environment: aws, node: bot-1, role: observability, severity: warning, component: monitoring}
        annotations:
          summary: 관제센터 임계값 지표 미수집
          description: 관리 JVM은 수집되지만 exchange_ops_threshold가 없음. 경보 규칙은 마지막 수집값(최대 7일) 또는 기본값으로 판정 중. exchange.msp.enabled와 수집 잡의 metric_relabel_configs 확인 필요
          resolved_summary: 관제센터 임계값 지표 경보 해제
      - alert: DatabaseReplicationUnknown
        expr: pg_wal_position_in_recovery{job="postgres"} == 0 unless on(instance) pg_replication_client_sent_replay_bytes{state="streaming"}
        for: 2m
        labels: {customer: exchange, environment: aws, severity: critical, component: database}
        annotations:
          summary: Primary·Standby 복제 연결 미확인
      # 값이 있을 때만 판정한다. 미설정 항목은 게이지가 NaN이고 한 번도 수집되지 않았으면 scalar()가 NaN이라 비교가 늘 거짓이다.
      # 실측 분포 없이 지연 임계를 적지 않는다는 원칙을 지키면서 값을 승인된 변경으로 넣게 한다(관제센터 설계 5-3).
      - alert: DatabaseReplicationLagHigh
        expr: >-
          max by (node, application_name) (pg_replication_client_replay_lag_seconds{job="postgres"})
          > scalar(max(last_over_time(exchange_ops_threshold{key="db.replication_lag_alert"}[7d])))
        for: 2m
        labels: {customer: exchange, environment: aws, severity: warning, component: database}
        annotations:
          summary: DB 복제 재생 지연 · 임계 초과
          description: Standby 재생 지연이 관제센터 임계를 2분 넘게 넘음. 지연만큼이 수동 승격 때 잃을 수 있는 범위. 복제 상태와 Standby의 디스크·네트워크 확인 필요
          threshold: >-
            {{ with query "max(last_over_time(exchange_ops_threshold{key=\"db.replication_lag_alert\"}[7d]))" }}{{ . | first | value | printf "%.0f" }}초{{ end }}
          threshold_key: db.replication_lag_alert
          resolved_summary: DB 복제 재생 지연 경보 해제
      - alert: DatabaseExporterUnavailable
        expr: (up{job="postgres"} == 0) or absent(up{job="postgres"}) or (up{job="postgres"} == 1 unless on(customer,environment,instance) pg_up{job="postgres"})
        for: 1m
        labels: {customer: exchange, environment: aws, severity: critical, component: monitoring}
        annotations:
          summary: DB 수집 경로 장애 발생
          description: 수집기 응답 또는 DB 접속 지표 누락. DB 프로세스 장애 여부 별도 확인 필요
          resolved_summary: DB 수집 경로 경보 해제
      - alert: DatabaseConnectionFailed
        expr: (pg_up{job="postgres",role=~"data|standby"} == 0) and on(customer,environment,instance) (up{job="postgres"} == 1)
        for: 1m
        labels: {customer: exchange, environment: aws, severity: critical, component: database}
        annotations:
          summary: '{{ if eq $labels.role "standby" }}Standby{{ else if eq $labels.role "data" }}Primary{{ else }}PostgreSQL{{ end }} DB 접속 장애 발생'
          description: 수집기 응답 정상 · DB 접속 실패. DB 프로세스·네트워크·인증 상태 확인 필요
          resolved_summary: '{{ if eq $labels.role "standby" }}Standby{{ else if eq $labels.role "data" }}Primary{{ else }}PostgreSQL{{ end }} DB 접속 장애 경보 해제'
      - alert: DatabaseMetricsMissing
        expr: (pg_exporter_last_scrape_error{job="postgres"} == 1) or (pg_up{job="postgres"} == 1 unless on(instance) pg_wal_position_in_recovery)
        for: 2m
        labels: {customer: exchange, environment: aws, severity: warning, component: monitoring}
        annotations:
          summary: DB 확장 지표 누락·질의 실패
      - alert: SpringMetricsUnavailable
        expr: up{job="exchange-api",role=~"app|reader"} == 0
        for: 1m
        labels: {customer: exchange, environment: aws, severity: critical, component: application}
        annotations:
          summary: Spring 수집 경로 장애 발생
          description: 관리 포트·Spring 프로세스·외부 접속 검사 대조 필요
      # 아래 세 규칙의 지표는 V47을 포함한 앱 판부터 나온다. 이전 판 앱에는 시계열이 없어 평가 결과가 비고 경보도 없다.
      # 정산이 일시 DB 오류(55P03·57014·40P01·40001)를 재시도 한도(4회 또는 5초) 안에서 흡수하지 못하면 그 마켓
      # 라이터가 멈추고 노드가 종신 강등된다. 카운터는 앱을 재기동해야 0이 되므로 1 이상인 동안 계속 발생 상태로 둔다.
      # 앱이 한 대인 학교 구성에서는 사람이 재기동할 때까지 주문 접수가 멈춘다.
      - alert: SettlementTransientRetryExhausted
        expr: exchange_settlement_transient_exhausted_total{job="exchange-api"} > 0
        labels: {customer: exchange, environment: aws, severity: critical, component: settlement}
        annotations:
          summary: 정산 일시 DB 오류 재시도 소진 · 노드 강등
          description: 이 노드의 정산 라이터가 멈추고 재기동 전까지 쓰기를 받지 않음. 앱이 한 대면 주문 접수 정지. 재기동 전 앱 로그의 sqlstate와 같은 시각의 DB 잠금·장기 쿼리 확인 필요
          resolved_summary: 정산 재시도 소진 경보 해제 · 앱 재기동으로 카운터 초기화
      # 주문 append가 예외로 끝난 뒤 저널 판정(V47)조차 DB에 닿지 못한 경우다. 멱등 키는 남기고 잔고 예약은
      # 30초 뒤 회수한다. 커밋돼 있었다면 그 주문은 같은 마켓의 다음 명령까지 정산되지 않는다.
      # 드문 경로라 한 번이라도 늘면 알리고, 10분 동안 더 늘지 않으면 해제한다.
      - alert: OrderIntakeUnresolved
        expr: increase(exchange_order_intake_unresolved_total{job="exchange-api"}[10m]) > 0
        labels: {customer: exchange, environment: aws, severity: warning, component: order}
        annotations:
          summary: 주문 접수 실패 뒤 저널 판정 불가 발생
          description: append 예외 뒤 저널 확인도 실패해 멱등 키 유지·잔고 예약 30초 지연 회수. 같은 시각의 DB 접속 경보와 앱 로그 확인 필요
          resolved_summary: 주문 접수 판정 불가 경보 해제 · 최근 10분 추가 발생 없음
      # 저널 커밋 뒤 응답만 잃은 경우다. 게이트웨이가 저널에서 이 요청의 NEW를 찾아 접수로 처리하고 라이터에
      # 회수를 요청했으므로 주문은 처리됐다. 앱과 DB 사이 연결이 불안정하다는 신호라 알린다.
      - alert: OrderIntakeCommitRecovered
        expr: increase(exchange_order_intake_commit_recovered_total{job="exchange-api"}[10m]) > 0
        labels: {customer: exchange, environment: aws, severity: warning, component: order}
        annotations:
          summary: 주문 커밋 응답 유실 회수 발생
          description: 저널 커밋 뒤 응답이 유실돼 접수로 회수함. 주문 처리는 완료. 반복되면 앱과 DB 사이 연결 끊김과 문장 시간 초과 확인 필요
          resolved_summary: 주문 커밋 응답 유실 경보 해제 · 최근 10분 추가 발생 없음
  # 관제센터 요약 칸의 기록 규칙(관제센터 설계 4-6). 화면 요청마다 rate·histogram을 다시 계산하지 않게 평가 주기마다
  # 한 번 계산하고 관제센터는 이 이름만 질의한다. 하네스 exchange-recording.yml의 exchange.msp.recording과 같은 식이다.
  - name: school.msp.recording
    rules:
      - record: exchange:msp_http_requests:rate5m
        expr: sum(rate(http_server_requests_seconds_count{job="exchange-api",uri!~"/actuator.*"}[5m]))
      # 5xx가 한 번도 없으면 분자 시계열이 없어 0으로 채운다. 요청이 없으면 비율을 만들지 않는다(무요청은 무오류가 아니다).
      - record: exchange:msp_http_5xx:ratio5m
        expr: >-
          (sum(rate(http_server_requests_seconds_count{job="exchange-api",uri!~"/actuator.*",status=~"5.."}[5m]))
            or (0 * sum(rate(http_server_requests_seconds_count{job="exchange-api",uri!~"/actuator.*"}[5m]))))
          / (sum(rate(http_server_requests_seconds_count{job="exchange-api",uri!~"/actuator.*"}[5m])) > 0)
      # 버킷은 앱이 http.server.requests 히스토그램을 내보낼 때만 있다. 요청이 없는 구간의 NaN은 싣지 않는다.
      - record: exchange:msp_http_p95:seconds5m
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="exchange-api",uri!~"/actuator.*"}[5m])))
          and on() (sum(rate(http_server_requests_seconds_count{job="exchange-api",uri!~"/actuator.*"}[5m])) > 0)
      # 학교에는 외부 프로브 수집 잡이 아직 없어 이 규칙의 결과는 비어 있다. 프로브를 붙일 때 바로 쓰도록 하네스와 같은 이름으로 둔다.
      - record: exchange:msp_probe_success:ratio5m
        expr: min(avg_over_time(probe_success{job="blackbox-http"}[5m]))
