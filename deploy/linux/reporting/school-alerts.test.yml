# 학교 경보 규칙이 bot-1(job=linux)을 포함하고 보고 서비스·봇 중지를 한 번씩만 알리는지 고정한다.
# 백업·워치독 유닛을 서비스 장애 규칙에서 어떻게 다루는지와 주문·정산 카운터 경보의 발생·해제도 함께 본다.
# 관제센터 임계값(exchange_ops_threshold)을 보는 규칙은 게이지가 없을 때의 기본값, 게이지 값, 게이지가 끊긴 뒤의 마지막 값으로 판정하는지 본다.
# 경보가 나야 하는 입력과 나지 않아야 하는 입력을 짝지어 두고, 지속 조건(for)이 지난 시각에 평가한다.
# 실행: docker run --rm --entrypoint promtool -v "<repo>/deploy/linux/reporting:/rules:ro" -w /rules prom/prometheus:v3.13.0 test rules school-alerts.test.yml
rule_files: [school-alerts.yml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: LinuxHostUnreachable
        exp_alerts:
          - exp_labels: {job: linux, instance: '127.0.0.1:9100', node: bot-1, role: observability, customer: exchange, environment: aws, severity: critical, component: linux}
            exp_annotations: {summary: Linux 호스트 수집 경로 장애 발생}
  - interval: 15s
    input_series:
      - series: 'node_filesystem_avail_bytes{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '10x40'
      - series: 'node_filesystem_readonly{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: LinuxDiskSpaceLow
        exp_alerts:
          - exp_labels: {job: linux, instance: '127.0.0.1:9100', node: bot-1, role: observability, device: /dev/nvme0n1p1, mountpoint: /, fstype: xfs, customer: exchange, environment: aws, severity: warning, component: storage}
            exp_annotations: {summary: 디스크 여유 공간 부족 · 임계 미만, threshold: 15%, threshold_key: host.disk_free_alert}
  # 레지스트리 게이지가 있으면 그 값이 임계다. 여유 20%는 기본값 15%로는 조용하지만 임계 25%에서는 경보다.
  # 게이지는 3분 뒤 끊긴다(stale). 규칙은 순간값이 아니라 마지막 수집값을 보므로 끊긴 뒤에도 25%로 판정을 유지한다.
  - interval: 15s
    input_series:
      - series: 'node_filesystem_avail_bytes{job="linux-host",instance="172.31.33.195:9100",node="db-primary",role="data",device="/dev/nvme1n1",mountpoint="/",fstype="xfs"}'
        values: '2x60'
      - series: 'node_filesystem_size_bytes{job="linux-host",instance="172.31.33.195:9100",node="db-primary",role="data",device="/dev/nvme1n1",mountpoint="/",fstype="xfs"}'
        values: '10x60'
      - series: 'node_filesystem_readonly{job="linux-host",instance="172.31.33.195:9100",node="db-primary",role="data",device="/dev/nvme1n1",mountpoint="/",fstype="xfs"}'
        values: '0x60'
      - series: 'exchange_ops_threshold{job="exchange-admin",instance="exchange-admin",key="host.disk_free_alert",unit="ratio"}'
        values: '0.25x12 stale'
    alert_rule_test:
      - eval_time: 6m
        alertname: LinuxDiskSpaceLow
        exp_alerts:
          - exp_labels: {job: linux-host, instance: '172.31.33.195:9100', node: db-primary, role: data, device: /dev/nvme1n1, mountpoint: /, fstype: xfs, customer: exchange, environment: aws, severity: warning, component: storage}
            exp_annotations: {summary: 디스크 여유 공간 부족 · 임계 미만, threshold: 25%, threshold_key: host.disk_free_alert}
      - eval_time: 14m
        alertname: LinuxDiskSpaceLow
        exp_alerts:
          - exp_labels: {job: linux-host, instance: '172.31.33.195:9100', node: db-primary, role: data, device: /dev/nvme1n1, mountpoint: /, fstype: xfs, customer: exchange, environment: aws, severity: warning, component: storage}
            exp_annotations: {summary: 디스크 여유 공간 부족 · 임계 미만, threshold: 25%, threshold_key: host.disk_free_alert}
  # 대조 시험: 게이지가 없으면 기본값 15%로 판정한다. 여유 20%는 조용하고 여유 10%만 경보다.
  - interval: 15s
    input_series:
      - series: 'node_filesystem_avail_bytes{job="linux-host",instance="172.31.33.195:9100",node="db-primary",role="data",device="/dev/nvme1n1",mountpoint="/",fstype="xfs"}'
        values: '2x40'
      - series: 'node_filesystem_size_bytes{job="linux-host",instance="172.31.33.195:9100",node="db-primary",role="data",device="/dev/nvme1n1",mountpoint="/",fstype="xfs"}'
        values: '10x40'
      - series: 'node_filesystem_readonly{job="linux-host",instance="172.31.33.195:9100",node="db-primary",role="data",device="/dev/nvme1n1",mountpoint="/",fstype="xfs"}'
        values: '0x40'
      - series: 'node_filesystem_avail_bytes{job="linux-host",instance="172.31.2.86:9100",node="app-1",role="app",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{job="linux-host",instance="172.31.2.86:9100",node="app-1",role="app",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '10x40'
      - series: 'node_filesystem_readonly{job="linux-host",instance="172.31.2.86:9100",node="app-1",role="app",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: LinuxDiskSpaceLow
        exp_alerts:
          - exp_labels: {job: linux-host, instance: '172.31.2.86:9100', node: app-1, role: app, device: /dev/nvme0n1p1, mountpoint: /, fstype: xfs, customer: exchange, environment: aws, severity: warning, component: storage}
            exp_annotations: {summary: 디스크 여유 공간 부족 · 임계 미만, threshold: 15%, threshold_key: host.disk_free_alert}
  # 임계를 8%로 낮추면 같은 여유 10%도 조용하다.
  - interval: 15s
    input_series:
      - series: 'node_filesystem_avail_bytes{job="linux-host",instance="172.31.2.86:9100",node="app-1",role="app",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '1x40'
      - series: 'node_filesystem_size_bytes{job="linux-host",instance="172.31.2.86:9100",node="app-1",role="app",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '10x40'
      - series: 'node_filesystem_readonly{job="linux-host",instance="172.31.2.86:9100",node="app-1",role="app",device="/dev/nvme0n1p1",mountpoint="/",fstype="xfs"}'
        values: '0x40'
      - series: 'exchange_ops_threshold{job="exchange-admin",instance="exchange-admin",key="host.disk_free_alert",unit="ratio"}'
        values: '0.08x40'
    alert_rule_test:
      - eval_time: 6m
        alertname: LinuxDiskSpaceLow
        exp_alerts: []
  # 관리 JVM이 수집되는데 게이지가 없으면 10분 뒤 경보다.
  - interval: 15s
    input_series:
      - series: 'up{job="exchange-admin",instance="exchange-admin",node="bot-1",role="observability"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 9m
        alertname: OpsThresholdGaugeMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: OpsThresholdGaugeMissing
        exp_alerts:
          - exp_labels: {customer: exchange, environment: aws, node: bot-1, role: observability, severity: warning, component: monitoring}
            exp_annotations:
              summary: 관제센터 임계값 지표 미수집
              description: 관리 JVM은 수집되지만 exchange_ops_threshold가 없음. 경보 규칙은 마지막 수집값(최대 7일) 또는 기본값으로 판정 중. exchange.msp.enabled와 수집 잡의 metric_relabel_configs 확인 필요
              resolved_summary: 관제센터 임계값 지표 경보 해제
  # 대조 시험: 게이지가 있거나, 수집 잡이 없거나, 관리 JVM이 내려가 있으면(up=0) 이 경보는 울리지 않는다.
  - interval: 15s
    input_series:
      - series: 'up{job="exchange-admin",instance="exchange-admin",node="bot-1",role="observability"}'
        values: '1x60'
      - series: 'exchange_ops_threshold{job="exchange-admin",instance="exchange-admin",key="host.disk_free_alert",unit="ratio"}'
        values: '0.15x60'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpsThresholdGaugeMissing
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'up{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpsThresholdGaugeMissing
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'up{job="exchange-admin",instance="exchange-admin",node="bot-1",role="observability"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 11m
        alertname: OpsThresholdGaugeMissing
        exp_alerts: []
  # 복제 지연 규칙은 값이 있을 때만 판정한다. 게이지가 없거나 미설정(NaN)이면 지연 100초에도 조용하다.
  - interval: 15s
    input_series:
      - series: 'pg_replication_client_replay_lag_seconds{job="postgres",instance="172.31.33.195:9187",node="db-primary",role="data",application_name="db_standby",state="streaming"}'
        values: '100x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: DatabaseReplicationLagHigh
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'pg_replication_client_replay_lag_seconds{job="postgres",instance="172.31.33.195:9187",node="db-primary",role="data",application_name="db_standby",state="streaming"}'
        values: '100x40'
      - series: 'exchange_ops_threshold{job="exchange-admin",instance="exchange-admin",key="db.replication_lag_alert",unit="seconds"}'
        values: 'NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 5m
        alertname: DatabaseReplicationLagHigh
        exp_alerts: []
  # 운영자가 30초를 넣으면 그때부터 판정한다. 지속 조건 2분이 지난 뒤 경보다.
  - interval: 15s
    input_series:
      - series: 'pg_replication_client_replay_lag_seconds{job="postgres",instance="172.31.33.195:9187",node="db-primary",role="data",application_name="db_standby",state="streaming"}'
        values: '100x40'
      - series: 'exchange_ops_threshold{job="exchange-admin",instance="exchange-admin",key="db.replication_lag_alert",unit="seconds"}'
        values: '30x40'
    alert_rule_test:
      - eval_time: 1m
        alertname: DatabaseReplicationLagHigh
        exp_alerts: []
      - eval_time: 3m
        alertname: DatabaseReplicationLagHigh
        exp_alerts:
          - exp_labels: {node: db-primary, application_name: db_standby, customer: exchange, environment: aws, severity: warning, component: database}
            exp_annotations:
              summary: DB 복제 재생 지연 · 임계 초과
              description: Standby 재생 지연이 관제센터 임계를 2분 넘게 넘음. 지연만큼이 수동 승격 때 잃을 수 있는 범위. 복제 상태와 Standby의 디스크·네트워크 확인 필요
              threshold: 30초
              threshold_key: db.replication_lag_alert
              resolved_summary: DB 복제 재생 지연 경보 해제
  # 게이지는 3분 뒤 끊긴다(stale). 규칙은 마지막 수집값 30초로 판정을 이어 간다. 순간값을 읽으면 끊긴 뒤 비교할 값이
  # 없어 경보가 풀린다. 스탠바이가 뒤처져 디스크가 줄고 용량 보호가 관리 JVM을 멈추는 경우다(설계 5-3).
  - interval: 15s
    input_series:
      - series: 'pg_replication_client_replay_lag_seconds{job="postgres",instance="172.31.33.195:9187",node="db-primary",role="data",application_name="db_standby",state="streaming"}'
        values: '100x40'
      - series: 'exchange_ops_threshold{job="exchange-admin",instance="exchange-admin",key="db.replication_lag_alert",unit="seconds"}'
        values: '30x12 stale'
    alert_rule_test:
      - eval_time: 3m
        alertname: DatabaseReplicationLagHigh
        exp_alerts:
          - exp_labels: {node: db-primary, application_name: db_standby, customer: exchange, environment: aws, severity: warning, component: database}
            exp_annotations:
              summary: DB 복제 재생 지연 · 임계 초과
              description: Standby 재생 지연이 관제센터 임계를 2분 넘게 넘음. 지연만큼이 수동 승격 때 잃을 수 있는 범위. 복제 상태와 Standby의 디스크·네트워크 확인 필요
              threshold: 30초
              threshold_key: db.replication_lag_alert
              resolved_summary: DB 복제 재생 지연 경보 해제
      - eval_time: 9m
        alertname: DatabaseReplicationLagHigh
        exp_alerts:
          - exp_labels: {node: db-primary, application_name: db_standby, customer: exchange, environment: aws, severity: warning, component: database}
            exp_annotations:
              summary: DB 복제 재생 지연 · 임계 초과
              description: Standby 재생 지연이 관제센터 임계를 2분 넘게 넘음. 지연만큼이 수동 승격 때 잃을 수 있는 범위. 복제 상태와 Standby의 디스크·네트워크 확인 필요
              threshold: 30초
              threshold_key: db.replication_lag_alert
              resolved_summary: DB 복제 재생 지연 경보 해제
  # 용량 보호는 판정 결과(봇 중지·수집 누락)를 정상 종료로 끝내므로 그 유닛의 failed는 스크립트 오류다.
  # 이 경우만 critical로 알리고, 보고 서비스와 봇의 failed는 전용 규칙이 맡아 여기서 빠지는지 본다.
  - interval: 15s
    input_series:
      - series: 'node_systemd_unit_state{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="exchange-bot-capacity.service",state="failed"}'
        values: '1x16'
      - series: 'node_systemd_unit_state{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="failstop-reporting.service",state="failed"}'
        values: '1x16'
      - series: 'node_systemd_unit_state{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="failstop-reporting.service",state="active"}'
        values: '0x16'
      - series: 'node_systemd_unit_state{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="exchange-bot.service",state="failed"}'
        values: '1x16'
      - series: 'node_systemd_unit_state{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="exchange-bot.service",state="active"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 1m
        alertname: LinuxServiceFailed
        exp_alerts:
          - exp_labels: {job: linux, instance: '127.0.0.1:9100', node: bot-1, role: observability, name: exchange-bot-capacity.service, state: failed, customer: exchange, environment: aws, severity: critical, component: linux}
            exp_annotations: {summary: Linux 서비스 장애 발생}
      - eval_time: 3m
        alertname: OperationsReporterNotActive
        exp_alerts:
          - exp_labels: {job: linux, instance: '127.0.0.1:9100', node: bot-1, role: observability, name: failstop-reporting.service, state: active, customer: exchange, environment: aws, severity: warning, component: reporting}
            exp_annotations:
              summary: 운영 보고 서비스 중지·미수집
              description: Teams 기본 경보는 계속 전달되지만 AI 근거 보고와 일일 보고가 멈춘 상태. failstop-reporting 서비스 상태와 journal 확인 필요
              resolved_summary: 운영 보고 서비스 경보 해제
  - interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 3m
        alertname: OperationsReporterNotActive
        exp_alerts:
          - exp_labels: {job: linux, name: failstop-reporting.service, state: active, node: bot-1, role: observability, customer: exchange, environment: aws, severity: warning, component: reporting}
            exp_annotations:
              summary: 운영 보고 서비스 중지·미수집
              description: Teams 기본 경보는 계속 전달되지만 AI 근거 보고와 일일 보고가 멈춘 상태. failstop-reporting 서비스 상태와 journal 확인 필요
              resolved_summary: 운영 보고 서비스 경보 해제
  # 봇 중지 경보는 지속 조건 5분을 넘긴 6분에 본다. 아래 대조 시험과 입력 값만 다르다.
  - interval: 15s
    input_series:
      - series: 'node_systemd_unit_state{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="exchange-bot.service",state="active"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: MarketBotNotActive
        exp_alerts:
          - exp_labels: {job: linux, instance: '127.0.0.1:9100', node: bot-1, role: observability, name: exchange-bot.service, state: active, customer: exchange, environment: aws, severity: warning, component: bot}
            exp_annotations:
              summary: 시장 봇 서비스 중지·미수집
              description: 용량 보호 판정(/var/lib/exchange-bot-guard/state.json), systemd 시작 제한, 계획한 수동 중지 여부 확인 필요
              resolved_summary: 시장 봇 서비스 경보 해제
  # 대조 시험: 봇과 보고 서비스가 계속 active면 두 규칙의 지속 조건이 지나도 경보가 없다.
  - interval: 15s
    input_series:
      - series: 'node_systemd_unit_state{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="exchange-bot.service",state="active"}'
        values: '1x30'
      - series: 'node_systemd_unit_state{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="failstop-reporting.service",state="active"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 6m
        alertname: MarketBotNotActive
        exp_alerts: []
      - eval_time: 6m
        alertname: OperationsReporterNotActive
        exp_alerts: []
  # 테스트 시각 0은 Unix 시각 0이다. 마지막 실행을 그보다 27시간 앞과 방금으로 두어 26시간 기준을 확인한다.
  - interval: 15s
    input_series:
      - series: 'node_systemd_timer_last_trigger_seconds{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="failstop-reporting-daily.timer"}'
        values: '-97200x80'
    alert_rule_test:
      - eval_time: 16m
        alertname: OperationsDailyReportNotTriggered
        exp_alerts:
          - exp_labels: {job: linux, instance: '127.0.0.1:9100', node: bot-1, role: observability, name: failstop-reporting-daily.timer, customer: exchange, environment: aws, severity: warning, component: reporting}
            exp_annotations:
              summary: 일일 보고 예약 실행 없음 · 26시간 초과
              description: failstop-reporting-daily.timer 활성 상태와 마지막 실행 시각 확인 필요. 전달 성공 여부는 이 경보로 판정하지 않음
              resolved_summary: 일일 보고 예약 실행 경보 해제
  - interval: 15s
    input_series:
      - series: 'node_systemd_timer_last_trigger_seconds{job="linux",instance="127.0.0.1:9100",node="bot-1",role="observability",name="failstop-reporting-daily.timer"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 16m
        alertname: OperationsDailyReportNotTriggered
        exp_alerts: []
  # DB 백업 유닛의 failed는 백업 경보(DatabaseBackupServiceFailed 등)가 맡아 여기서 빠지고,
  # 스스로 알릴 수 없는 워치독 유닛의 failed는 여기서 알린다.
  - interval: 15s
    input_series:
      - series: 'node_systemd_unit_state{job="linux-host",instance="172.31.33.195:9100",node="db-primary",role="data",name="failstop-db-backup.service",state="failed"}'
        values: '1x16'
      - series: 'node_systemd_unit_state{job="linux-host",instance="172.31.2.86:9100",node="app-1",role="app",name="failstop-watchdog.service",state="failed"}'
        values: '1x16'
    alert_rule_test:
      - eval_time: 1m
        alertname: LinuxServiceFailed
        exp_alerts:
          - exp_labels: {job: linux-host, instance: '172.31.2.86:9100', node: app-1, role: app, name: failstop-watchdog.service, state: failed, customer: exchange, environment: aws, severity: critical, component: linux}
            exp_annotations: {summary: Linux 서비스 장애 발생}
  # 정산 재시도 소진은 카운터가 1 이상인 동안 계속 발생하고, 재기동으로 카운터가 0이 되면 해제된다.
  - interval: 15s
    input_series:
      - series: 'exchange_settlement_transient_exhausted_total{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api"}'
        values: '0x4 1x20 0x10'
    alert_rule_test:
      - eval_time: 45s
        alertname: SettlementTransientRetryExhausted
        exp_alerts: []
      - eval_time: 2m
        alertname: SettlementTransientRetryExhausted
        exp_alerts:
          - exp_labels: {job: exchange-api, instance: '172.31.2.86:9101', node: app-1, role: app, service: api, customer: exchange, environment: aws, severity: critical, component: settlement}
            exp_annotations:
              summary: 정산 일시 DB 오류 재시도 소진 · 노드 강등
              description: 이 노드의 정산 라이터가 멈추고 재기동 전까지 쓰기를 받지 않음. 앱이 한 대면 주문 접수 정지. 재기동 전 앱 로그의 sqlstate와 같은 시각의 DB 잠금·장기 쿼리 확인 필요
              resolved_summary: 정산 재시도 소진 경보 해제 · 앱 재기동으로 카운터 초기화
      - eval_time: 8m
        alertname: SettlementTransientRetryExhausted
        exp_alerts: []
  # 판정 불가는 늘어난 뒤 10분 동안 발생하고 더 늘지 않으면 해제된다. 같은 앱의 커밋 회수 카운터는 그대로라 조용하다.
  - interval: 15s
    input_series:
      - series: 'exchange_order_intake_unresolved_total{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api"}'
        values: '0x8 1x60'
      - series: 'exchange_order_intake_commit_recovered_total{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api"}'
        values: '0x68'
    alert_rule_test:
      - eval_time: 2m
        alertname: OrderIntakeUnresolved
        exp_alerts: []
      - eval_time: 3m
        alertname: OrderIntakeUnresolved
        exp_alerts:
          - exp_labels: {job: exchange-api, instance: '172.31.2.86:9101', node: app-1, role: app, service: api, customer: exchange, environment: aws, severity: warning, component: order}
            exp_annotations:
              summary: 주문 접수 실패 뒤 저널 판정 불가 발생
              description: append 예외 뒤 저널 확인도 실패해 멱등 키 유지·잔고 예약 30초 지연 회수. 같은 시각의 DB 접속 경보와 앱 로그 확인 필요
              resolved_summary: 주문 접수 판정 불가 경보 해제 · 최근 10분 추가 발생 없음
      - eval_time: 3m
        alertname: OrderIntakeCommitRecovered
        exp_alerts: []
      - eval_time: 14m
        alertname: OrderIntakeUnresolved
        exp_alerts: []
  # 커밋 회수도 늘면 알린다. 앱 재기동으로 카운터가 0으로 돌아간 것은 증가로 보지 않는다.
  - interval: 15s
    input_series:
      - series: 'exchange_order_intake_commit_recovered_total{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api"}'
        values: '0x8 2x60'
      - series: 'exchange_order_intake_unresolved_total{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api"}'
        values: '3x8 0x60'
    alert_rule_test:
      - eval_time: 3m
        alertname: OrderIntakeCommitRecovered
        exp_alerts:
          - exp_labels: {job: exchange-api, instance: '172.31.2.86:9101', node: app-1, role: app, service: api, customer: exchange, environment: aws, severity: warning, component: order}
            exp_annotations:
              summary: 주문 커밋 응답 유실 회수 발생
              description: 저널 커밋 뒤 응답이 유실돼 접수로 회수함. 주문 처리는 완료. 반복되면 앱과 DB 사이 연결 끊김과 문장 시간 초과 확인 필요
              resolved_summary: 주문 커밋 응답 유실 경보 해제 · 최근 10분 추가 발생 없음
      - eval_time: 3m
        alertname: OrderIntakeUnresolved
        exp_alerts: []
  # 관제센터 기록 규칙. 입력 간격 1분·창 5분이면 rate의 외삽 배율이 1.25로 떨어져 기대값을 정확한 수로 적을 수 있다.
  # 주문 경로 초당 9건(200)과 1건(503)이고, 관리 경로와 다른 job의 요청·5xx는 섞이면 값이 달라지도록 크게 넣었다.
  # 버킷은 0.1초 이하 5건, 0.25초 이하 9건, 0.5초 이하 10건이라 p95는 0.375초이고 관리 경로 버킷이 섞이면 0.5가 된다.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200"}'
        values: '0+540x12'
      - series: 'http_server_requests_seconds_count{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="503"}'
        values: '0+60x12'
      - series: 'http_server_requests_seconds_count{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/actuator/prometheus",status="500"}'
        values: '0+6000x12'
      - series: 'http_server_requests_seconds_count{job="exchange-admin",instance="exchange-admin",node="bot-1",role="observability",service="admin",uri="/admin/v1/msp/overview",status="500"}'
        values: '0+6000x12'
      - series: 'http_server_requests_seconds_bucket{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200",le="0.1"}'
        values: '0+300x12'
      - series: 'http_server_requests_seconds_bucket{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200",le="0.25"}'
        values: '0+540x12'
      - series: 'http_server_requests_seconds_bucket{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200",le="0.5"}'
        values: '0+600x12'
      - series: 'http_server_requests_seconds_bucket{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200",le="+Inf"}'
        values: '0+600x12'
      - series: 'http_server_requests_seconds_bucket{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/actuator/prometheus",status="500",le="0.5"}'
        values: '0x12'
      - series: 'http_server_requests_seconds_bucket{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/actuator/prometheus",status="500",le="+Inf"}'
        values: '0+6000x12'
    promql_expr_test:
      - expr: exchange:msp_http_requests:rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'exchange:msp_http_requests:rate5m'
            value: 10
      - expr: exchange:msp_http_5xx:ratio5m
        eval_time: 10m
        exp_samples:
          - labels: 'exchange:msp_http_5xx:ratio5m'
            value: 0.1
      - expr: exchange:msp_http_p95:seconds5m
        eval_time: 10m
        exp_samples:
          - labels: 'exchange:msp_http_p95:seconds5m'
            value: 0.375
  # 5xx가 한 번도 없으면 분자 시계열이 없지만 비율은 0이다.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200"}'
        values: '0+600x12'
    promql_expr_test:
      - expr: exchange:msp_http_5xx:ratio5m
        eval_time: 10m
        exp_samples:
          - labels: 'exchange:msp_http_5xx:ratio5m'
            value: 0
  # 관리 경로만 긁히고 주문 요청이 없으면 요청률은 0이고 비율·p95는 만들지 않는다. 프로브 수집 잡이 없으면 가용성도 비어 있다.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200"}'
        values: '5x12'
      - series: 'http_server_requests_seconds_count{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/actuator/prometheus",status="200"}'
        values: '0+60x12'
      - series: 'http_server_requests_seconds_bucket{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200",le="0.5"}'
        values: '5x12'
      - series: 'http_server_requests_seconds_bucket{job="exchange-api",instance="172.31.2.86:9101",node="app-1",role="app",service="api",uri="/api/v1/orders",status="200",le="+Inf"}'
        values: '5x12'
    promql_expr_test:
      - expr: exchange:msp_http_requests:rate5m
        eval_time: 10m
        exp_samples:
          - labels: 'exchange:msp_http_requests:rate5m'
            value: 0
      - expr: exchange:msp_http_5xx:ratio5m
        eval_time: 10m
        exp_samples: []
      - expr: exchange:msp_http_p95:seconds5m
        eval_time: 10m
        exp_samples: []
      - expr: exchange:msp_probe_success:ratio5m
        eval_time: 10m
        exp_samples: []
  # 외부 프로브를 붙이면 창 5분 안의 표본 넷(75초 간격) 가운데 하나가 실패한 대상의 0.75가 가장 나쁜 값이다.
  - interval: 75s
    input_series:
      - series: 'probe_success{job="blackbox-http",instance="https://example.invalid/"}'
        values: '1x8'
      - series: 'probe_success{job="blackbox-http",instance="https://example.invalid/api/v1/health/read"}'
        values: '1 1 1 1 1 1 1 1 0'
    promql_expr_test:
      - expr: exchange:msp_probe_success:ratio5m
        eval_time: 10m
        exp_samples:
          - labels: 'exchange:msp_probe_success:ratio5m'
            value: 0.75
