# node_exporter textfile 수집기가 워치독 결과 파일을 읽도록 설정한 뒤에만 불러온다.
groups:
  - name: school.watchdog-checker
    rules:
      - alert: WatchdogCheckerStale
        expr: time() - failstop_watchdog_last_run_timestamp_seconds{customer="exchange",environment="aws"} > 300
        for: 2m
        labels: {severity: warning, component: watchdog}
        annotations:
          summary: 관측 감시 점검 중단
          description: '{{ $labels.node }}의 failstop-watchdog 결과가 5분 넘게 갱신되지 않음. timer와 서비스 로그 확인 필요'
      - alert: WatchdogCheckerMissing
        expr: up{job=~"linux|linux-host",customer="exchange",environment="aws",node=~"app-1|bot-1"} == 1 unless on(instance) failstop_watchdog_last_run_timestamp_seconds
        for: 10m
        labels: {severity: warning, component: watchdog}
        annotations:
          summary: 관측 감시 결과 미수집
          description: '{{ $labels.node }}의 node_exporter는 응답하지만 워치독 결과 지표가 없음. 설치와 textfile 수집기 설정 확인 필요'
