rule_files:
  - watchdog-rules.yml
  - checker-rules.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      # app-1 결과는 5분 동안 갱신된 뒤 멈춘다. bot-1은 node_exporter만 응답하고 결과 지표가 없다.
      - series: 'failstop_watchdog_last_run_timestamp_seconds{customer="exchange",environment="aws",instance="172.31.2.86:9100",job="linux-host",node="app-1",role="app"}'
        values: '0+15x20 300x60'
      - series: 'up{customer="exchange",environment="aws",instance="172.31.2.86:9100",job="linux-host",node="app-1",role="app"}'
        values: '1x80'
      - series: 'up{customer="exchange",environment="aws",instance="127.0.0.1:9100",job="linux",node="bot-1",role="observability"}'
        values: '1x80'
      - series: 'up{customer="exchange",environment="aws",instance="172.31.33.195:9100",job="linux-host",node="db-primary",role="data"}'
        values: '1x80'
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels: {customer: exchange, environment: aws, severity: none, component: watchdog, role: observability}
            exp_annotations:
              summary: 경보 경로 생존 신호
              description: 항상 발화한다. bot-1 워치독이 Alertmanager API에서 존재를 확인하며 Teams로 보내지 않는다.
      - eval_time: 4m
        alertname: WatchdogCheckerStale
        exp_alerts: []
      - eval_time: 11m
        alertname: WatchdogCheckerStale
        exp_alerts: []
      - eval_time: 14m
        alertname: WatchdogCheckerStale
        exp_alerts:
          - exp_labels: {customer: exchange, environment: aws, instance: '172.31.2.86:9100', job: linux-host, node: app-1, role: app, severity: warning, component: watchdog}
            exp_annotations:
              summary: 관측 감시 점검 중단
              description: 'app-1의 failstop-watchdog 결과가 5분 넘게 갱신되지 않음. timer와 서비스 로그 확인 필요'
      - eval_time: 9m
        alertname: WatchdogCheckerMissing
        exp_alerts: []
      - eval_time: 11m
        alertname: WatchdogCheckerMissing
        exp_alerts:
          - exp_labels: {customer: exchange, environment: aws, instance: '127.0.0.1:9100', job: linux, node: bot-1, role: observability, severity: warning, component: watchdog}
            exp_annotations:
              summary: 관측 감시 결과 미수집
              description: 'bot-1의 node_exporter는 응답하지만 워치독 결과 지표가 없음. 설치와 textfile 수집기 설정 확인 필요'
