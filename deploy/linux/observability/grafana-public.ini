[server]
protocol = http
http_addr = 172.31.44.141
http_port = 3000
domain = www.sang.it.kr
root_url = https://www.sang.it.kr/grafana/
serve_from_sub_path = true

[security]
disable_initial_admin_creation = true
cookie_secure = true
cookie_samesite = lax
allow_embedding = false

[auth.anonymous]
enabled = false

[auth.proxy]
enabled = false

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false

[log]
mode = console
level = info

[unified_alerting]
enabled = false
