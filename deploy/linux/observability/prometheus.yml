global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: aws
    account: school

# 다른 호스트는 접근 규칙과 수집 성공을 확인한 뒤 추가한다.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
        labels:
          node: bot-1
          customer: exchange
          environment: aws
          account: school
          role: observability
          service: monitoring
  - job_name: linux
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          node: bot-1
          customer: exchange
          environment: aws
          account: school
          role: observability
          service: infra

  - job_name: exchange-api
    metrics_path: /metrics
    static_configs:
      - targets: ['172.31.2.86:9101']
        labels:
          node: app-1
          customer: exchange
          environment: aws
          account: school
          role: app
          service: api

  # 관리 JVM(bot-1의 봇 JVM, 관리 포트는 루프백 8081)에서 관제센터 지표만 받는다. 봇 지표는 버려 bot-1의 저장량을 지킨다.
  # instance를 고정 이름으로 바꿔 수집 주소가 바뀌어도 시계열이 하나로 남게 한다. 규칙이 게이지의 마지막 값을 7일 쓰기 때문이다.
  # 서버에는 관리 JVM에 관제센터(exchange.msp.enabled)를 켠 뒤에 school-alerts.yml의 OpsThresholdGaugeMissing과 함께 넣고 함께 뺀다.
  # 먼저 넣으면 게이지가 없어 그 경보가 실제로 울린다.
  - job_name: exchange-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8081']
        labels: {customer: exchange, environment: aws, account: school, role: observability, node: bot-1, service: admin}
    relabel_configs:
      - target_label: instance
        replacement: exchange-admin
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'exchange_ops_threshold|exchange_msp_.*'
        action: keep

  - job_name: linux-host
    static_configs:
      - targets: ['172.31.2.86:9100']
        labels: {customer: exchange, environment: aws, account: school, role: app, node: app-1}
      - targets: ['172.31.33.195:9100']
        labels: {customer: exchange, environment: aws, account: school, role: data, node: db-primary}
      - targets: ['172.31.1.229:9100']
        labels: {customer: exchange, environment: aws, account: school, role: standby, node: db-standby}

  - job_name: postgres
    scrape_timeout: 10s
    static_configs:
      - targets: ['172.31.33.195:9187']
        labels: {customer: exchange, environment: aws, account: school, role: data, node: db-primary}
      - targets: ['172.31.1.229:9187']
        labels: {customer: exchange, environment: aws, account: school, role: standby, node: db-standby}

# 2026-09-20 connect-school-reporting.py가 서버 적용본 끝에 붙인 절에 백업·워치독 규칙 세 파일을 더한 최종형이다.
# 이 절이 빠진 파일을 다시 배치하면 경보 규칙과 Alertmanager 연결이 함께 사라지므로 저장소 원본에도 둔다.
# 규칙 파일의 원본은 reporting/school-alerts.yml, postgresql/backup/backup-alerts.yml, watchdog/watchdog-rules.yml,
# watchdog/checker-rules.yml이고 서버에서는 모두 /etc/prometheus에 0644로 둔다.
# 나열한 파일이 하나라도 없으면 promtool check config가 실패한다(Prometheus 자체는 없는 파일을 건너뛴다).
# 뒤의 세 파일은 선행 조건이 있어 서버에는 한 줄씩 파일과 함께 더한다. backup-alerts.yml은 DB 백업 지표가
# 수집된 뒤, watchdog-rules.yml은 Alertmanager의 watchdog-null 경로가 적용된 뒤, checker-rules.yml은
# app-1·bot-1의 워치독 결과 지표가 수집된 뒤에 더한다. 순서를 어기면 미수집·Watchdog 경보가 실제로 나간다.
rule_files:
  - /etc/prometheus/school-alerts.yml
  - /etc/prometheus/backup-alerts.yml
  - /etc/prometheus/watchdog-rules.yml
  - /etc/prometheus/checker-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]
