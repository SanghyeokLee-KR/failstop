# DB 백업 경보. db-backup.py가 node_exporter textfile 수집 디렉터리에 쓰는 failstop_db_backup_* 지표를 본다.
# 서버 위치는 bot-1의 /etc/prometheus/backup-alerts.yml이며 observability/prometheus.yml의 rule_files에 올라 있다.
# DB 호스트 node_exporter가 textfile 디렉터리(observability/node_exporter-textfile.env.db)를 읽어 백업 지표가
# 수집된 뒤에 배치한다. 먼저 배치하면 DatabaseBackupStale이 기록 없음으로 10분 뒤 발생한다.
groups:
  - name: school.backup
    rules:
      - alert: DatabaseBackupStale
        # 두 DB 중 어느 쪽이든 임계 시간 안에 검증된 백업이 있으면 정상이다. 승격 뒤에는 새 Primary의 백업이 이어 받는다.
        # 임계(초)는 관제센터 임계값 레지스트리(backup.delay_alert)의 마지막 수집값이고, 7일 동안 수집된 적이 없으면 93600(26시간)이다.
        expr: >-
          (time() - max by (customer, environment) (failstop_db_backup_last_success_timestamp_seconds{job="linux-host"})
            > scalar(max(last_over_time(exchange_ops_threshold{key="backup.delay_alert"}[7d])) or vector(93600)))
          or absent(failstop_db_backup_last_success_timestamp_seconds{job="linux-host"})
        for: 10m
        labels: {customer: exchange, environment: aws, severity: critical, component: backup}
        annotations:
          summary: 검증된 DB 백업 임계 시간 초과 또는 기록 없음
          description: 두 DB 모두 임계 시간 안에 검증을 통과한 백업이 없거나 백업 지표 미수집. 타이머·서비스 로그와 textfile 수집 경로 확인 필요
          threshold: >-
            {{ with query "max(last_over_time(exchange_ops_threshold{key=\"backup.delay_alert\"}[7d])) / 3600" }}{{ . | first | value | printf "%.4g" }}시간{{ else }}26시간{{ end }}
          threshold_key: backup.delay_alert
          resolved_summary: DB 백업 지연 경보 해제
      - alert: DatabaseBackupVerifyFailed
        expr: failstop_db_backup_last_verify_success{job="linux-host"} == 0
        for: 1m
        labels: {customer: exchange, environment: aws, severity: critical, component: backup}
        annotations:
          summary: DB 백업 검증 실패
          description: 새 베이스백업의 매니페스트·WAL 검증 실패. 이전 백업은 삭제하지 않음. failed 디렉터리와 서비스 로그 확인 필요
          resolved_summary: DB 백업 검증 실패 경보 해제
      - alert: DatabaseBackupRunFailed
        # 검증 실패는 위 경보가 알린다. 여기서는 디스크 부족·접속 실패 같은 나머지 실패만 본다.
        expr: failstop_db_backup_last_run_success{job="linux-host"} == 0 unless on(instance) failstop_db_backup_last_verify_success{job="linux-host"} == 0
        for: 1m
        labels: {customer: exchange, environment: aws, severity: warning, component: backup}
        annotations:
          summary: DB 백업 실행 실패
          description: 디스크 여유·DB 접속·베이스백업·논리 덤프 중 한 단계 실패. journalctl -u failstop-db-backup 확인 필요
          resolved_summary: DB 백업 실행 실패 경보 해제
      - alert: DatabaseBackupOffsiteFailed
        expr: failstop_db_backup_offsite_last_success{job="linux-host"} == 0
        for: 1m
        labels: {customer: exchange, environment: aws, severity: warning, component: backup}
        annotations:
          summary: DB 백업 외부 보관 실패
          description: 로컬 백업은 검증됐으나 S3 업로드 또는 원격 크기·SHA-256 대조 실패. 역할 권한과 offsite.json 확인 필요
          resolved_summary: DB 백업 외부 보관 실패 경보 해제
      - alert: DatabaseBackupOffsiteUnconfigured
        # 역할이 맞아 실제로 백업하는 호스트만 본다. 같은 설정의 Standby가 중복으로 울리지 않게 한다.
        expr: failstop_db_backup_offsite_configured{job="linux-host"} == 0 and on(instance) failstop_db_backup_role_eligible{job="linux-host"} == 1
        for: 30m
        labels: {customer: exchange, environment: aws, severity: warning, component: backup}
        annotations:
          summary: DB 백업 외부 보관 미설정
          description: 백업이 DB 서버 로컬 디스크에만 있음. 호스트·볼륨 상실 대비 아님. 반출 정책 확인 뒤 S3 설정 필요
          resolved_summary: DB 백업 외부 보관 설정 확인
      # 스크립트가 지표를 쓰지 못하고 끝난 실행만 본다. 설정 오류, 지표 쓰기 실패, 메모리 상한 초과(OOM)·SIGKILL이 여기에 든다.
      # 지표로 기록된 실행 실패와 외부 보관 실패는 위 경보가 알리므로 뺀다. 이 유닛은 LinuxServiceFailed에서 빠져 있다.
      # oneshot 유닛의 failed는 다음 실행까지 남으므로 지속 조건은 짧게 둔다.
      - alert: DatabaseBackupServiceFailed
        expr: >-
          node_systemd_unit_state{job="linux-host",name="failstop-db-backup.service",state="failed"} == 1
          unless on(instance) (failstop_db_backup_last_run_success{job="linux-host"} == 0)
          unless on(instance) (failstop_db_backup_offsite_last_success{job="linux-host"} == 0)
        for: 1m
        labels: {customer: exchange, environment: aws, severity: warning, component: backup}
        annotations:
          summary: DB 백업 서비스 실패 · 결과 지표 미기록
          description: failstop-db-backup이 실패했으나 실패 지표를 남기지 못함. 설정 파일 권한, 지표 디렉터리 쓰기, OOM·SIGKILL 여부를 systemctl status와 journalctl -u failstop-db-backup, journalctl -k로 확인 필요
          resolved_summary: DB 백업 서비스 실패 경보 해제
      # 백업 지표(DB 두 대)와 워치독 결과(app-1·bot-1)를 모두 textfile로 읽으므로 bot-1(job=linux)도 본다.
      - alert: LinuxTextfileMetricsInvalid
        expr: node_textfile_scrape_error{job=~"linux|linux-host"} == 1
        for: 5m
        labels: {customer: exchange, environment: aws, severity: warning, component: monitoring}
        annotations:
          summary: textfile 지표 파일 읽기 실패
          description: node_exporter가 textfile 디렉터리나 .prom 파일을 읽지 못함. 디렉터리 존재·권한과 /etc/node_exporter/textfile.env 확인 필요. 백업·워치독 지표가 비어 보일 수 있음
          resolved_summary: textfile 지표 읽기 실패 경보 해제
