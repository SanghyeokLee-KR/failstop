# promtool test rules backup-alerts.test.yml 로 경보 조건을 확인한다. 시각 0은 epoch 0이다.
rule_files:
  - backup-alerts.yml
evaluation_interval: 1m

tests:
  # 조회 lookback(5분)보다 촘촘하게 표본을 둔다. 표본이 비는 구간은 지표 미수집으로 판정된다.
  - name: 마지막 성공이 26시간을 넘으면 경보
    interval: 1m
    input_series:
      - series: 'failstop_db_backup_last_success_timestamp_seconds{job="linux-host",instance="db-a:9100",customer="exchange",environment="aws"}'
        values: '0x1700'
    alert_rule_test:
      - eval_time: 25h
        alertname: DatabaseBackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: DatabaseBackupStale
        exp_alerts:
          - exp_labels: {customer: exchange, environment: aws, severity: critical, component: backup}
            exp_annotations:
              summary: 검증된 DB 백업 26시간 초과 또는 기록 없음
              description: 두 DB 모두 26시간 안에 검증을 통과한 백업이 없거나 백업 지표 미수집. 타이머·서비스 로그와 textfile 수집 경로 확인 필요
              resolved_summary: DB 백업 지연 경보 해제

  - name: 한 DB라도 최근 성공이 있으면 조용
    interval: 1m
    input_series:
      - series: 'failstop_db_backup_last_success_timestamp_seconds{job="linux-host",instance="db-a:9100",customer="exchange",environment="aws"}'
        values: '0x1900'
      - series: 'failstop_db_backup_last_success_timestamp_seconds{job="linux-host",instance="db-c:9100",customer="exchange",environment="aws"}'
        values: '0x1200 86400x700'
    alert_rule_test:
      - eval_time: 30h
        alertname: DatabaseBackupStale
        exp_alerts: []

  - name: 백업 지표가 전혀 없으면 기록 없음으로 경보
    interval: 1m
    input_series:
      - series: 'up{job="linux-host",instance="db-a:9100"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: DatabaseBackupStale
        exp_alerts:
          - exp_labels: {job: linux-host, customer: exchange, environment: aws, severity: critical, component: backup}
            exp_annotations:
              summary: 검증된 DB 백업 26시간 초과 또는 기록 없음
              description: 두 DB 모두 26시간 안에 검증을 통과한 백업이 없거나 백업 지표 미수집. 타이머·서비스 로그와 textfile 수집 경로 확인 필요
              resolved_summary: DB 백업 지연 경보 해제

  - name: 검증 실패는 검증 경보만 울린다
    interval: 1m
    input_series:
      - series: 'failstop_db_backup_last_run_success{job="linux-host",instance="db-c:9100"}'
        values: '0x5'
      - series: 'failstop_db_backup_last_verify_success{job="linux-host",instance="db-c:9100"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DatabaseBackupVerifyFailed
        exp_alerts:
          - exp_labels: {job: linux-host, instance: 'db-c:9100', customer: exchange, environment: aws, severity: critical, component: backup}
            exp_annotations:
              summary: DB 백업 검증 실패
              description: 새 베이스백업의 매니페스트·WAL 검증 실패. 이전 백업은 삭제하지 않음. failed 디렉터리와 서비스 로그 확인 필요
              resolved_summary: DB 백업 검증 실패 경보 해제
      - eval_time: 2m
        alertname: DatabaseBackupRunFailed
        exp_alerts: []

  - name: 검증 전 단계 실패는 실행 실패로 울린다
    interval: 1m
    input_series:
      - series: 'failstop_db_backup_last_run_success{job="linux-host",instance="db-c:9100"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DatabaseBackupRunFailed
        exp_alerts:
          - exp_labels: {job: linux-host, instance: 'db-c:9100', customer: exchange, environment: aws, severity: warning, component: backup}
            exp_annotations:
              summary: DB 백업 실행 실패
              description: 디스크 여유·DB 접속·베이스백업·논리 덤프 중 한 단계 실패. journalctl -u failstop-db-backup 확인 필요
              resolved_summary: DB 백업 실행 실패 경보 해제

  - name: 외부 보관 실패
    interval: 1m
    input_series:
      - series: 'failstop_db_backup_offsite_last_success{job="linux-host",instance="db-c:9100"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DatabaseBackupOffsiteFailed
        exp_alerts:
          - exp_labels: {job: linux-host, instance: 'db-c:9100', customer: exchange, environment: aws, severity: warning, component: backup}
            exp_annotations:
              summary: DB 백업 외부 보관 실패
              description: 로컬 백업은 검증됐으나 S3 업로드 또는 원격 크기·SHA-256 대조 실패. 역할 권한과 offsite.json 확인 필요
              resolved_summary: DB 백업 외부 보관 실패 경보 해제

  - name: 외부 보관 미설정은 실제로 백업하는 호스트에서만 울린다
    interval: 1m
    input_series:
      - series: 'failstop_db_backup_offsite_configured{job="linux-host",instance="db-c:9100"}'
        values: '0x40'
      - series: 'failstop_db_backup_role_eligible{job="linux-host",instance="db-c:9100"}'
        values: '1x40'
      - series: 'failstop_db_backup_offsite_configured{job="linux-host",instance="db-a:9100"}'
        values: '0x40'
      - series: 'failstop_db_backup_role_eligible{job="linux-host",instance="db-a:9100"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: DatabaseBackupOffsiteUnconfigured
        exp_alerts: []
      - eval_time: 31m
        alertname: DatabaseBackupOffsiteUnconfigured
        exp_alerts:
          - exp_labels: {job: linux-host, instance: 'db-c:9100', customer: exchange, environment: aws, severity: warning, component: backup}
            exp_annotations:
              summary: DB 백업 외부 보관 미설정
              description: 백업이 DB 서버 로컬 디스크에만 있음. 호스트·볼륨 상실 대비 아님. 반출 정책 확인 뒤 S3 설정 필요
              resolved_summary: DB 백업 외부 보관 설정 확인

  - name: textfile 해석 실패
    interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{job="linux-host",instance="db-c:9100"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LinuxTextfileMetricsInvalid
        exp_alerts:
          - exp_labels: {job: linux-host, instance: 'db-c:9100', customer: exchange, environment: aws, severity: warning, component: monitoring}
            exp_annotations:
              summary: textfile 지표 파일 읽기 실패
              description: node_exporter가 textfile 디렉터리나 .prom 파일을 읽지 못함. 디렉터리 존재·권한과 /etc/node_exporter/textfile.env 확인 필요. 백업·워치독 지표가 비어 보일 수 있음
              resolved_summary: textfile 지표 읽기 실패 경보 해제

  - name: 지표를 남기지 못한 서비스 실패만 서비스 실패 경보로 울린다
    interval: 1m
    input_series:
      # db-c는 어제 성공한 뒤 오늘 실행이 OOM으로 끝나 성공 지표가 그대로다. db-a는 역할이 달라 실행 결과 지표가 없다.
      - series: 'node_systemd_unit_state{job="linux-host",instance="db-c:9100",name="failstop-db-backup.service",state="failed"}'
        values: '1x5'
      - series: 'failstop_db_backup_last_run_success{job="linux-host",instance="db-c:9100"}'
        values: '1x5'
      - series: 'node_systemd_unit_state{job="linux-host",instance="db-a:9100",name="failstop-db-backup.service",state="failed"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DatabaseBackupServiceFailed
        exp_alerts:
          - exp_labels: {job: linux-host, instance: 'db-a:9100', name: failstop-db-backup.service, state: failed, customer: exchange, environment: aws, severity: warning, component: backup}
            exp_annotations:
              summary: DB 백업 서비스 실패 · 결과 지표 미기록
              description: failstop-db-backup이 실패했으나 실패 지표를 남기지 못함. 설정 파일 권한, 지표 디렉터리 쓰기, OOM·SIGKILL 여부를 systemctl status와 journalctl -u failstop-db-backup, journalctl -k로 확인 필요
              resolved_summary: DB 백업 서비스 실패 경보 해제
          - exp_labels: {job: linux-host, instance: 'db-c:9100', name: failstop-db-backup.service, state: failed, customer: exchange, environment: aws, severity: warning, component: backup}
            exp_annotations:
              summary: DB 백업 서비스 실패 · 결과 지표 미기록
              description: failstop-db-backup이 실패했으나 실패 지표를 남기지 못함. 설정 파일 권한, 지표 디렉터리 쓰기, OOM·SIGKILL 여부를 systemctl status와 journalctl -u failstop-db-backup, journalctl -k로 확인 필요
              resolved_summary: DB 백업 서비스 실패 경보 해제
      - eval_time: 2m
        alertname: DatabaseBackupRunFailed
        exp_alerts: []

  - name: 지표로 기록된 실행 실패와 외부 보관 실패는 서비스 실패 경보를 내지 않는다
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{job="linux-host",instance="db-c:9100",name="failstop-db-backup.service",state="failed"}'
        values: '1x5'
      - series: 'failstop_db_backup_last_run_success{job="linux-host",instance="db-c:9100"}'
        values: '0x5'
      # 외부 보관 실패(종료 코드 2)는 로컬 백업이 끝났으므로 실행 성공 1과 외부 보관 0을 함께 쓴다.
      - series: 'node_systemd_unit_state{job="linux-host",instance="db-a:9100",name="failstop-db-backup.service",state="failed"}'
        values: '1x5'
      - series: 'failstop_db_backup_last_run_success{job="linux-host",instance="db-a:9100"}'
        values: '1x5'
      - series: 'failstop_db_backup_offsite_last_success{job="linux-host",instance="db-a:9100"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: DatabaseBackupServiceFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: DatabaseBackupRunFailed
        exp_alerts:
          - exp_labels: {job: linux-host, instance: 'db-c:9100', customer: exchange, environment: aws, severity: warning, component: backup}
            exp_annotations:
              summary: DB 백업 실행 실패
              description: 디스크 여유·DB 접속·베이스백업·논리 덤프 중 한 단계 실패. journalctl -u failstop-db-backup 확인 필요
              resolved_summary: DB 백업 실행 실패 경보 해제
      - eval_time: 2m
        alertname: DatabaseBackupOffsiteFailed
        exp_alerts:
          - exp_labels: {job: linux-host, instance: 'db-a:9100', customer: exchange, environment: aws, severity: warning, component: backup}
            exp_annotations:
              summary: DB 백업 외부 보관 실패
              description: 로컬 백업은 검증됐으나 S3 업로드 또는 원격 크기·SHA-256 대조 실패. 역할 권한과 offsite.json 확인 필요
              resolved_summary: DB 백업 외부 보관 실패 경보 해제

  - name: 워치독 결과를 읽는 bot-1의 textfile 해석 실패도 울린다
    interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{job="linux",instance="127.0.0.1:9100"}'
        values: '1x10'
      - series: 'node_textfile_scrape_error{job="linux-host",instance="db-a:9100"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: LinuxTextfileMetricsInvalid
        exp_alerts:
          - exp_labels: {job: linux, instance: '127.0.0.1:9100', customer: exchange, environment: aws, severity: warning, component: monitoring}
            exp_annotations:
              summary: textfile 지표 파일 읽기 실패
              description: node_exporter가 textfile 디렉터리나 .prom 파일을 읽지 못함. 디렉터리 존재·권한과 /etc/node_exporter/textfile.env 확인 필요. 백업·워치독 지표가 비어 보일 수 있음
              resolved_summary: textfile 지표 읽기 실패 경보 해제
