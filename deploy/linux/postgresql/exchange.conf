# 학교 EC2의 PostgreSQL 17 공통 설정. 노드 주소와 인증서는 node.conf에서 지정한다.
port = 5432
max_connections = 100
shared_buffers = '256MB'
effective_cache_size = '1GB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
autovacuum_work_mem = '64MB'
password_encryption = 'scram-sha-256'

# SQL 명령별 실행량과 누적 실행 시간 수집. MSP 화면의 'SQL 실행량'·'SQL 평균 시간'
# 패널 다섯 개가 pg_stat_statements 를 전제로 한다. 이 모듈이 없으면 postgres_exporter 의
# pg_ops_sql_collection_available 이 0 이 되고 관련 계열이 아예 나오지 않아 패널이 빈다.
# shared_preload_libraries 는 context=postmaster 라 reload 로는 안 바뀌고 재기동이 필요하다.
# 모듈을 올리는 것만으로는 수집이 시작되지 않는다. Primary 의 대상 DB 에서 확장을 한 번 만든다.
#   CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
# 다른 preload 모듈이 생기면 이 줄을 덮어쓰지 말고 쉼표로 덧붙인다.
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = auto
pg_stat_statements.max = 5000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off

# 비동기 복제라도 Primary의 로컬 WAL 기록은 기다린다.
wal_level = replica
synchronous_commit = on
synchronous_standby_names = ''
max_wal_senders = 4
max_replication_slots = 4
max_slot_wal_keep_size = '4GB'
wal_log_hints = on
wal_keep_size = 0
archive_mode = off
hot_standby = on
idle_in_transaction_session_timeout = '10s'
tcp_keepalives_idle = 5
tcp_keepalives_interval = 2
tcp_keepalives_count = 3

# systemd journal에서 서비스 로그를 관리한다. SQL 본문은 상시 기록하지 않는다.
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'none'
log_min_error_statement = 'panic'
log_lock_waits = on
log_checkpoints = on
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/etc/postgresql/server.crt'
ssl_key_file = '/etc/postgresql/server.key'
include = '/etc/postgresql/node.conf'
