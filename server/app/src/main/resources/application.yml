    taker:
      count: 1
      lambda: 2.0
      qty-step: "0.001"
      max-steps: 5
      market-ratio: 0.2
    markets:
      - symbol: KRW-BTC
        initial-price: "84320000"
        mm-count: 2
        taker-count: 1
        quote-size: "0.01"
        qty-step: "0.001"
        base-funding: "100"
      - symbol: KRW-ETH
        initial-price: "4512000"
        mm-count: 2
        taker-count: 1
        quote-size: "0.05"
        qty-step: "0.01"
        base-funding: "5000"
      - symbol: KRW-SOL
        initial-price: "246800"
        mm-count: 1
