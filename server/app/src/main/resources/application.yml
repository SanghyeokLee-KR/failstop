spring:
  application:
    name: exchange
  threads:
    virtual:
      enabled: true
  profiles:
    default: dev

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/exchange
    username: exchange
    password: exchange
  flyway:
    enabled: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: bots
# 데모용 봇 플릿. 4개 마켓(BTC·ETH·SOL·XRP)에 마켓당 MM 2 + TAKER 1.
# 파라미터 근거는 SimProperties 주석. initial-price·quote-size·qty-step은 web 시드가와
# 마켓 tick/lot/최소주문(5000)에 맞춰 마켓별로 지정한다(markets 리스트 우선, top-level은 폴백).
exchange:
  sim:
    base-url: http://localhost:8080
    seed: 42
    target-ops: 40
    market: KRW-BTC
    initial-price: "84320000"
    funding:
      quote: "1000000000"
      base: "100"
    market-maker:
      count: 2
      spread-ticks: 10
      drift-ticks: 3
      quote-size: "0.01"
      requote-ms: 1000
    taker:
      count: 1
      lambda: 2.0
      qty-step: "0.001"
      max-steps: 5
      market-ratio: 0.2
    markets:
      - symbol: KRW-BTC
        initial-price: "84320000"
        mm-count: 2
        taker-count: 1
        quote-size: "0.01"
        qty-step: "0.001"
        base-funding: "100"
      - symbol: KRW-ETH
        initial-price: "4512000"
        mm-count: 2
        taker-count: 1
        quote-size: "0.05"
        qty-step: "0.01"
        base-funding: "5000"
      - symbol: KRW-SOL
        initial-price: "246800"
        mm-count: 1
        taker-count: 1
        quote-size: "0.5"
        qty-step: "0.1"
        base-funding: "100000"
      - symbol: KRW-XRP
        initial-price: "742"
        mm-count: 1
        taker-count: 1
        quote-size: "10"
        qty-step: "8"
        base-funding: "10000000"
