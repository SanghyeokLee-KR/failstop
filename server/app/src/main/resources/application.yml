server:
  # LB·프록시 종단에서 X-Forwarded-* 를 신뢰 체인으로 처리한다. getRemoteAddr()가 원시
  # 최좌측 XFF 대신 검증된 클라이언트 IP를 반환해야 레이트리밋 IP 버킷 우회를 막는다.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # 신뢰 경계 명시 핀. RemoteIpValve 기본 internalProxies(전 RFC1918+loopback)는 사설 소켓피어
      # 배포에서 클라이언트가 보낸 단일 XFF를 rightmost-untrusted로 채택해 IP 레이트리밋 회전 우회를
      # 허용한다. 기본값은 루프백 전용으로 좁혀 프록시 없는 dev·데모·통합테스트에서만 루프백을 신뢰
      # 프록시로 처리한다(운영은 prod 프로파일이 LB VIP CIDR로 재정의). 배포 불변식: 인그레스는
      # 인바운드 XFF를 strip한 뒤 자신을 append한다.
      internal-proxies: '127\.\d\d?\d?\.\d\d?\d?\.\d\d?\d?|0:0:0:0:0:0:0:1|::1'

spring:
  application:
    name: exchange
  threads:
    virtual:
      enabled: true
  profiles:
    default: dev

# 고객 평면(8080) actuator 노출은 health·info로 한정한다. prometheus·metrics는 자산 보존
# 신호(ledger_imbalance)·내부 지표를 담아 외부 노출 대상이 아니다. dev는 하네스 스크레이프용으로
# 동일 포트에 재노출하고, 운영은 management.server.port로 내부망에 분리한다.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/exchange
    username: exchange
    password: exchange
  flyway:
    enabled: true
    locations: classpath:db/migration

# dev·하네스 chaos 스택은 8080에서 /actuator/prometheus를 스크레이프한다(harness prometheus.yml).
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

---
# 운영 프로파일. 명시 활성(SPRING_PROFILES_ACTIVE=prod)이 전제다. 시크릿 fail-fast를 켜고
# 커넥션 풀·타임아웃을 유계화하며 actuator를 내부 포트로 분리한다. 데이터소스 접속정보는
# 표준 SPRING_DATASOURCE_* 환경변수로 주입한다.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 3000
      # 장기 잠금 대기·폭주 질의가 스레드·커넥션을 무한 점유하지 못하게 세션 상한을 고정한다.
      # 초과는 Postgres가 취소하고 게이트웨이가 TransientDataAccessException으로 503 변환한다.
      connection-init-sql: "SET statement_timeout TO '3000ms'; SET lock_timeout TO '2000ms'"

exchange:
  # 운영 시크릿 fail-fast + WS 오리진 fail-closed 가드를 켜는 이중 스위치. StartupSecretValidator
  # (마스터키·페퍼·세션시드 미주입 시 기동 중단)와 WebSocketConfig(데모·localhost WS 오리진 차단)가
  # 각각 이 키를 소비한다. server.tomcat.remoteip 블록과 별개 top-level 키로 병기한다.
  require-secrets: true

server:
  tomcat:
    remoteip:
      # 운영 신뢰 경계. LB VIP CIDR만 신뢰 프록시로 등록한다(EXCHANGE_TRUSTED_PROXIES 주입).
      # 미주입 시 루프백 전용으로 fail-closed: 외부 클라이언트가 보낸 XFF를 신뢰하지 않아 소켓피어
      # (LB VIP)로 강등되고, 회전 스푸핑으로 IP 버킷을 우회하지 못한다(레이트리밋은 과대적용될 뿐).
      internal-proxies: '${EXCHANGE_TRUSTED_PROXIES:127\.\d\d?\d?\.\d\d?\d?\.\d\d?\d?|0:0:0:0:0:0:0:1|::1}'

management:
  # actuator 전량을 내부 포트로 이전한다. 고객 평면 8080은 actuator를 전혀 서빙하지 않는다.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

---
spring:
  config:
    activate:
      on-profile: bots
# 데모용 봇 플릿. 4개 마켓(BTC·ETH·SOL·XRP)에 마켓당 MM 2 + TAKER 1.
# 파라미터 근거는 SimProperties 주석. initial-price·quote-size·qty-step은 web 시드가와
# 마켓 tick/lot/최소주문(5000)에 맞춰 마켓별로 지정한다(markets 리스트 우선, top-level은 폴백).
exchange:
  sim:
    base-url: http://localhost:8080
    seed: 42
    target-ops: 40
    market: KRW-BTC
    initial-price: "84320000"
    funding:
      quote: "1000000000"
      base: "100"
    market-maker:
      count: 2
      spread-ticks: 10
      drift-ticks: 3
      quote-size: "0.01"
      requote-ms: 1000
    taker:
      count: 1
      lambda: 2.0
      qty-step: "0.001"
      max-steps: 5
      market-ratio: 0.2
    markets:
      - symbol: KRW-BTC
        initial-price: "84320000"
        mm-count: 2
        taker-count: 1
        quote-size: "0.01"
        qty-step: "0.001"
        base-funding: "100"
      - symbol: KRW-ETH
        initial-price: "4512000"
        mm-count: 2
        taker-count: 1
        quote-size: "0.05"
        qty-step: "0.01"
        base-funding: "5000"
      - symbol: KRW-SOL
        initial-price: "246800"
        mm-count: 1
        taker-count: 1
        quote-size: "0.5"
        qty-step: "0.1"
        base-funding: "100000"
      - symbol: KRW-XRP
        initial-price: "742"
        mm-count: 1
        taker-count: 1
        quote-size: "10"
        qty-step: "8"
        base-funding: "10000000"
