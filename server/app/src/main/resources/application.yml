server:
  # LB·프록시 종단에서 X-Forwarded-* 를 신뢰 체인으로 처리한다. getRemoteAddr()가 원시
  # 최좌측 XFF 대신 검증된 클라이언트 IP를 반환해야 레이트리밋 IP 버킷 우회를 막는다.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # 신뢰 경계 명시 핀. RemoteIpValve 기본 internalProxies(전 RFC1918+loopback)는 사설 소켓피어
      # 배포에서 클라이언트가 보낸 단일 XFF를 rightmost-untrusted로 채택해 IP 레이트리밋 회전 우회를
      # 허용한다. 기본값은 루프백 전용으로 좁혀 프록시 없는 dev·데모·통합테스트에서만 루프백을 신뢰
      # 프록시로 처리한다(운영은 prod 프로파일이 LB VIP CIDR로 재정의). 배포 불변식: 인그레스는
      # 인바운드 XFF를 strip한 뒤 자신을 append한다.
      internal-proxies: '127\.\d\d?\d?\.\d\d?\d?\.\d\d?\d?|0:0:0:0:0:0:0:1|::1'

spring:
  application:
    name: exchange
  threads:
    virtual:
      enabled: true
  profiles:
    default: dev

# 고객 평면(8080) actuator 노출은 health·info로 한정한다. prometheus·metrics는 자산 보존
# 신호(ledger_imbalance)·내부 지표를 담아 외부 노출 대상이 아니다. dev는 하네스 스크레이프용으로
# 동일 포트에 재노출하고, 운영은 management.server.port로 내부망에 분리한다.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/exchange
    username: exchange
    password: exchange
    hikari:
      # 커넥션 획득 대기 상한. 기본값 30초가 E1 라이브에서 리더를 죽인 직접 원인이다. pg 지연
      # 주입 중 요청마다 가상 스레드가 생겨 30초씩 커넥션을 기다렸고, 대기 스레드가 무한히 쌓여
      # cpu 463%·전 경로 타임아웃·자력 회복 불가로 이어졌다. 3초는 prod와 동일 값이다. 초과 시
      # CannotGetJdbcConnectionException이 나고, 인증 필터(ApiAuthFilter)와 컨트롤러 어드바이스
      # (ApiExceptionHandler)가 각각 503+Retry-After로 매핑한다. 두 계층 모두 매핑해야 같은 사유가
      # 경로에 따라 500과 503으로 갈리지 않는다. 카오스 스택이 dev를 쓰므로 곧 라이브 적용값이다.
      connection-timeout: 3000
      # statement_timeout은 dev에 걸지 않는다(prod 전용). 걸면 수용 슬롯 점유 시간이 유계가 되어
      # 유리하지만, 같은 풀을 쓰는 Flyway 마이그레이션과 불변식 검증기의 대용량 집계가 슬로 윈도에서
      # 취소된다. 검증기는 E1의 판정 오라클이라 그것을 지연에 취약하게 만드는 교환은 받지 않는다.
      # 대신 슬롯 점유가 길어질 수 있음을 전제로 수용 상한의 합을 풀보다 작게 잡아(AdmissionLimits)
      # 커넥션 대기 자체가 생기지 않게 한다.
      #
      # 풀 크기는 Hikari 기본(10)을 유지한다. 카오스는 SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE로,
      # 운영은 prod 문서로 32를 준다. dev를 32로 고정하지 않는 이유는 통합테스트가 캐시된 스프링
      # 컨텍스트마다 풀을 하나씩 띄우는데 Hikari minimumIdle 기본값이 maximumPoolSize와 같아
      # 컨테이너 max_connections를 압박하기 때문이다. 수용 제한 상한은 실제 풀 크기에서 유도되므로
      # (AdmissionLimits) 배포별 차이를 자동 추종한다.
      #
      # 세션 TZ를 연결 계층에서 UTC로 고정한다. pgjdbc는 미고정 시 JVM 기본 zone(배포 KST)을
      # 세션 TimeZone으로 전파하고, Flyway는 이 풀 커넥션을 빌리므로 시간 파티션 경계 리터럴이
      # 배포 TZ에 의존해 증분 배포에서 overlap으로 부팅이 막힌다. UTC 고정으로 마이그레이션·런타임을
      # 배포 zone과 무관하게 결정적으로 만든다.
      connection-init-sql: "SET TIME ZONE 'UTC'"
  flyway:
    enabled: true
    locations: classpath:db/migration

# 리스 하트비트 전용 풀(§5.4). 접속 좌표는 spring.datasource를 재사용하고 여기서는 크기·타임아웃·
# 세션 init만 지정한다. 소형 유지가 목적이라 요청 풀 포화와 무관하게 renew가 커넥션을 얻는다.
# 카오스 스택은 dev 프로파일을 쓰므로 이 블록이 E1 하드닝의 적용점이다.
exchange:
  engine:
    # 좀비 리더 자발적 강등 시간 임계(§5.4). 누적 쓰기 커밋률(커밋/수요)이 5% 미만인 상태가 이 기간
    # 지속되면 리스 갱신을 포기한다. 원인은 묻지 않는다(커넥션 고갈·CPU 폭주·스레드 기아 모두
    # 같은 증상이고, 완전 정지가 아니라 간헐 처리만 남은 상태도 비율로 잡힌다). 기본 TTL 10s의
    # 4.5배, 카오스 TTL 6s의 7.5배라 정상 갱신 주기와 겹치지 않는다. 일시 지연은 완료율이,
    # 무주문 유휴 구간은 누적 수요 하한이 걸러낸다.
    lease-standdown-after: 45s
    lease-datasource:
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1
        connection-timeout: 2000
        pool-name: exchange-lease
        connection-init-sql: "SET TIME ZONE 'UTC'"

# dev·하네스 chaos 스택은 8080에서 /actuator/prometheus를 스크레이프한다(harness prometheus.yml).
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

---
# 운영 프로파일. 명시 활성(SPRING_PROFILES_ACTIVE=prod)이 전제다. 시크릿 fail-fast를 켜고
# 커넥션 풀·타임아웃을 유계화하며 actuator를 내부 포트로 분리한다. 데이터소스 접속정보는
# 표준 SPRING_DATASOURCE_* 환경변수로 주입한다.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 3000
      # 세션 TZ를 UTC로 고정(dev와 동일 근거)한 뒤 세션 상한을 건다. 장기 잠금 대기·폭주 질의가
      # 스레드·커넥션을 무한 점유하지 못하게 하고, 초과는 Postgres가 취소해 게이트웨이가
      # TransientDataAccessException으로 503 변환한다. 이 상한은 Flyway 마이그레이션 세션에도
      # 상속되므로, 데이터 무거운 마이그레이션(V8·V10)은 트랜잭션 한정 SET LOCAL로 상한을 해제한다.
      connection-init-sql: "SET TIME ZONE 'UTC'; SET statement_timeout TO '3000ms'; SET lock_timeout TO '2000ms'"

exchange:
  # 운영 시크릿 fail-fast + WS 오리진 fail-closed 가드를 켜는 이중 스위치. StartupSecretValidator
  # (마스터키·페퍼·세션시드 미주입 시 기동 중단)와 WebSocketConfig(데모·localhost WS 오리진 차단)가
  # 각각 이 키를 소비한다. server.tomcat.remoteip 블록과 별개 top-level 키로 병기한다.
  require-secrets: true
  engine:
    # 좀비 리더 자발적 강등 시간 임계(§5.4). dev와 동일 근거이며 운영에서도 같은 값을 쓴다. 누적
    # 수요 하한이 무주문 구간을 걸러내므로 주문이 뜸한 시간대를 위한 별도 임계가 필요 없다. 총
    # 페일오버 시간은 이 값 + 리스 TTL이며, kill·pause 페일오버(RTO<30s 게이트)와 다른 경로다.
    lease-standdown-after: 45s
    # 리스 하트비트 전용 풀(§5.4). 접속 좌표는 spring.datasource(SPRING_DATASOURCE_* 주입)를
    # 재사용한다. statement_timeout은 걸지 않는다. 기본 풀과 달리 단일 행 renew가 슬로 윈도에서
    # 취소돼 리더십을 잃는 것을 막기 위함이다.
    lease-datasource:
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1
        connection-timeout: 2000
        pool-name: exchange-lease
        connection-init-sql: "SET TIME ZONE 'UTC'"

server:
  tomcat:
    remoteip:
      # 운영 신뢰 경계. LB VIP CIDR만 신뢰 프록시로 등록한다(EXCHANGE_TRUSTED_PROXIES 주입).
      # 미주입 시 루프백 전용으로 fail-closed: 외부 클라이언트가 보낸 XFF를 신뢰하지 않아 소켓피어
      # (LB VIP)로 강등되고, 회전 스푸핑으로 IP 버킷을 우회하지 못한다(레이트리밋은 과대적용될 뿐).
      internal-proxies: '${EXCHANGE_TRUSTED_PROXIES:127\.\d\d?\d?\.\d\d?\d?\.\d\d?\d?|0:0:0:0:0:0:0:1|::1}'

management:
  # actuator 전량을 내부 포트로 이전한다. 고객 평면 8080은 actuator를 전혀 서빙하지 않는다.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

---
spring:
  config:
    activate:
      on-profile: bots
# 봇 노드도 /actuator/prometheus를 노출한다. 기본 노출은 health·info뿐이라 harness prometheus.yml의
# chaos-bots 스크레이프 타깃이 상시 404(up=0)였다. bots 노드는 내부 카오스 스택 전용이라 고객 평면과
# 달리 동일 포트 노출이 안전하다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
# 데모용 봇 플릿. 12개 마켓(웹 SSG 로스터 동형). 주력 2종(BTC·ETH)은 MM 2, 나머지는 MM 1 + TAKER 1.
# 파라미터 근거는 SimProperties 주석. initial-price·quote-size·qty-step은 web 시드가와
# 마켓 tick/lot/최소주문(5000)에 맞춰 마켓별로 지정한다(markets 리스트 우선, top-level은 폴백).
exchange:
  # 데모 봇 플릿은 계정당 다봇 고빈도라 계약 주문 버킷(100토큰/10s÷weight5=20req/10s)에 429로 걸려
  # MM 백오프가 플릿을 정지시킨다. bots 프로파일에서만 capacity를 상향해 데모 활성을 유지한다.
  # 운영·통합테스트 프로파일은 기본 100(계약)으로, 레이트리밋 계약·회귀 테스트에 영향이 없다.
