server:
  # LB·프록시 종단에서 X-Forwarded-* 를 신뢰 체인으로 처리한다. getRemoteAddr()가 원시
  # 최좌측 XFF 대신 검증된 클라이언트 IP를 반환해야 레이트리밋 IP 버킷 우회를 막는다.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # 신뢰 경계 명시 핀. RemoteIpValve 기본 internalProxies(전 RFC1918+loopback)는 사설 소켓피어
      # 배포에서 클라이언트가 보낸 단일 XFF를 rightmost-untrusted로 채택해 IP 레이트리밋 회전 우회를
      # 허용한다. 기본값은 루프백 전용으로 좁혀 프록시 없는 dev·데모·통합테스트에서만 루프백을 신뢰
      # 프록시로 처리한다(운영은 prod 프로파일이 LB VIP CIDR로 재정의). 배포 불변식: 인그레스는
      # 인바운드 XFF를 strip한 뒤 자신을 append한다.
      internal-proxies: '127\.\d\d?\d?\.\d\d?\d?\.\d\d?\d?|0:0:0:0:0:0:0:1|::1'

spring:
  application:
    name: exchange
  threads:
    virtual:
      enabled: true
  profiles:
    default: dev

# 고객 평면(8080) actuator 노출은 health·info로 한정한다. prometheus·metrics는 자산 보존
# 신호(ledger_imbalance)·내부 지표를 담아 외부 노출 대상이 아니다. dev는 하네스 스크레이프용으로
# 동일 포트에 재노출하고, 운영은 management.server.port로 내부망에 분리한다.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        # 조회 전용 노드용 헬스 경로(/actuator/health/read).
        #
        # readiness 는 쓰기를 받을 수 있는가를 답한다. 팔로워·승격 대기·강등 노드는 REFUSING 이라
        # 503 이고 그것이 맞다(DB 설계 §5.4). 단일 라이터 구조에서 팔로워로 쓰기를 보내면 순서가
        # 깨지므로 인그레스가 쓰기를 그쪽으로 보내면 안 된다.
        #
        # 그런데 팔로워는 조회를 정상으로 낸다(2026-09-07 실측: 팔로워 직접 호출 orderbook 200).
        # 그 노드를 조회 분산 대상에 넣으려면 로드밸런서가 볼 헬스가 따로 있어야 한다. readiness
        # 를 그대로 쓰면 ALB 가 팔로워를 대상 그룹에서 빼 조회 분산 자체가 성립하지 않는다
        # (증거 scenario-20260907 남은 위험).
        #
        # 그래서 이 그룹은 리더 여부를 보지 않고 조회에 필요한 것만 본다. db 는 조회가 DB 를
        # 타므로 필요하고, ping 은 프로세스 응답 여부다. livenessState 는 넣지 않는다. 그 축은
        # 재기동 판단용이고 여기 섞으면 조회 가능 여부와 재기동 필요 여부가 한 신호가 된다.
        read:
          include: db, ping

# 리더 리스 보관소(2026-09-08). 거래 데이터는 PostgreSQL 에 그대로 있고 리스 한 항목만 갈린다.
#
# 왜 갈랐나. 리스가 leader_lease 행이면 갱신이 곧 커밋이다. synchronous_standby_names 가 지목한
# standby 를 전부 잃으면 그 커밋이 멈추고, 갱신도 멈추고, 리스가 만료되고, standby 가 돌아와
# 커밋이 풀리는 순간 fencing 이 리더를 끌어내린다. 복제가 streaming 으로 복귀해도 readiness 는
# 503 에 머물고 복구에 앱 재기동이 필요했다. 근거는 harness/evidence/replication-fault-20260908/.
#
# 기본값이 postgres 인 이유는 비교 가능성이다. 옮기기 전과 옮긴 뒤를 같은 조건에서 재야 하고,
# 기존 통합 검증 전량이 종전 경로를 전제한다. dynamodb 는 명시 설정으로만 켜진다.
#
# dynamodb 로 켤 때 함께 정해야 하는 것.
#   endpoint  비우면 AWS SDK 기본 해석 사슬. 로컬 주소는 이 키로만 들어오고 코드에는 없다
#   region    비우면 AWS SDK 기본 해석 사슬
#   create-table-if-missing  로컬 검증 전용. 운영은 거짓으로 두고 테이블을 미리 만든다.
#                            참이면 앱 롤에 CreateTable 이 필요해 권한 경계가 넓어진다
#
# 되돌릴 때 주의. dynamodb 로 돌린 뒤 postgres 로 되돌리려면 앱을 전부 내린 상태에서
# SELECT expire_leader_lease_now() 를 한 번 부른다. 게시가 leader_lease.lease_until 을 먼 미래로
# 밀어 두므로 그대로 두면 try_acquire_leader 의 만료 조건이 영원히 거짓이다(V33).
exchange:
  leader:
    lease:
      provider: postgres
      table: exchange-leader-lease
      cluster-id: exchange-main
      create-table-if-missing: false

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/exchange
    username: exchange
    password: exchange
    hikari:
      # 커넥션 획득 대기 상한. 기본값 30초가 E1 라이브에서 리더를 죽인 직접 원인이다. pg 지연
      # 주입 중 요청마다 가상 스레드가 생겨 30초씩 커넥션을 기다렸고, 대기 스레드가 무한히 쌓여
      # cpu 463%·전 경로 타임아웃·자력 회복 불가로 이어졌다. 3초는 prod와 동일 값이다. 초과 시
      # CannotGetJdbcConnectionException이 나고, 인증 필터(ApiAuthFilter)와 컨트롤러 어드바이스
      # (ApiExceptionHandler)가 각각 503+Retry-After로 매핑한다. 두 계층 모두 매핑해야 같은 사유가
      # 경로에 따라 500과 503으로 갈리지 않는다. 카오스 스택이 dev를 쓰므로 곧 라이브 적용값이다.
      connection-timeout: 3000
      # statement_timeout은 dev에 걸지 않는다(prod 전용). 걸면 수용 슬롯 점유 시간이 유계가 되어
      # 유리하지만, 같은 풀을 쓰는 Flyway 마이그레이션과 불변식 검증기의 대용량 집계가 슬로 윈도에서
      # 취소된다. 대신 슬롯 점유가 길어질 수 있음을 전제로 수용 상한의 합을 풀보다 작게 잡아
      # (AdmissionLimits) 커넥션 대기 자체가 생기지 않게 한다.
      #
      # prod와의 비대칭이 의도적인 이유. 운영에서 3초를 넘는 질의는 그 자체로 결함이라 상한이 조기
      # 경보로 작동하고, 취소는 재시도 가능한 503으로 신호된다. dev는 카오스 스택이 쓰는 프로파일이고
      # 거기서는 200ms 지연 주입이 정상 상태라, 같은 상한이 '주입이 곧 전면 취소'가 된다. 운영에서는
      # 상한이 이상을 잡고 dev에서는 실험 자체를 지운다. 마이그레이션도 운영은 배포 창의 통제된
      # 1회지만 dev는 매 통합테스트 기동마다 돈다. E1의 무결성 판정 자체는 지연 없는 스탠바이에서
      # 도므로(harness/scripts/e1-pg-latency.ps1) 리더 상한이 판정 오라클을 위협하는 경로는 아니다.
      #
      # 풀 16·유휴 4를 명시한다. 카오스·운영은 각각 SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE와
      # prod 문서로 32를 준다. dev를 32로 올리지 않는 이유는 통합테스트가 캐시된 스프링 컨텍스트마다
      # 풀을 하나씩 띄우기 때문이고, 그럼에도 Hikari 기본값(최대 10·유휴 10)을 두지 않는 이유는
      # minimumIdle 기본값이 maximumPoolSize와 같아 오히려 유휴 10개를 붙들기 때문이다. 16/4는 유휴
      # 점유를 10에서 4로 줄이면서 수용 상한 유도(6/6/2 + 예비 2)에 필요한 여유를 남긴다.
      maximum-pool-size: 16
      minimum-idle: 4
      #
      # 세션 TZ를 연결 계층에서 UTC로 고정한다. pgjdbc는 미고정 시 JVM 기본 zone(배포 KST)을
      # 세션 TimeZone으로 전파하고, Flyway는 이 풀 커넥션을 빌리므로 시간 파티션 경계 리터럴이
      # 배포 TZ에 의존해 증분 배포에서 overlap으로 부팅이 막힌다. UTC 고정으로 마이그레이션·런타임을
      # 배포 zone과 무관하게 결정적으로 만든다.
      connection-init-sql: "SET TIME ZONE 'UTC'"
  flyway:
    enabled: true
    locations: classpath:db/migration

# 리스 하트비트 전용 풀(§5.4). 접속 좌표는 spring.datasource를 재사용하고 여기서는 크기·타임아웃·
# 세션 init만 지정한다. 소형 유지가 목적이라 요청 풀 포화와 무관하게 renew가 커넥션을 얻는다.
# 카오스 스택은 dev 프로파일을 쓰므로 이 블록이 E1 하드닝의 적용점이다.
exchange:
  engine:
    # 좀비 리더 자발적 강등 시간 임계(§5.4). 누적 쓰기 커밋률(커밋/수요)이 5% 미만인 상태가 이 기간
    # 지속되면 리스 갱신을 포기한다. 원인은 묻지 않는다(커넥션 고갈·CPU 폭주·스레드 기아 모두
    # 같은 증상이고, 완전 정지가 아니라 간헐 처리만 남은 상태도 비율로 잡힌다). 기본 TTL 10s의
    # 4.5배, 카오스 TTL 6s의 7.5배라 정상 갱신 주기와 겹치지 않는다. 일시 지연은 완료율이,
    # 무주문 유휴 구간은 누적 수요 하한이 걸러낸다.
    lease-standdown-after: 45s
    lease-datasource:
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1
        connection-timeout: 2000
        pool-name: exchange-lease
        connection-init-sql: "SET TIME ZONE 'UTC'"

# dev·하네스 chaos 스택은 8080에서 /actuator/prometheus를 스크레이프한다(harness prometheus.yml).
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, admission

---
# 운영 프로파일. 명시 활성(SPRING_PROFILES_ACTIVE=prod)이 전제다. 시크릿 fail-fast를 켜고
# 커넥션 풀·타임아웃을 유계화하며 actuator를 내부 포트로 분리한다. 데이터소스 접속정보는
# 표준 SPRING_DATASOURCE_* 환경변수로 주입한다.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 3000
      # 세션 TZ를 UTC로 고정(dev와 동일 근거)한 뒤 세션 상한을 건다. 장기 잠금 대기·폭주 질의가
      # 스레드·커넥션을 무한 점유하지 못하게 하고, 초과는 Postgres가 취소해 게이트웨이가
      # TransientDataAccessException으로 503 변환한다. 이 상한은 Flyway 마이그레이션 세션에도
      # 상속되므로, 데이터 무거운 마이그레이션(V8·V10)은 트랜잭션 한정 SET LOCAL로 상한을 해제한다.
      connection-init-sql: "SET TIME ZONE 'UTC'; SET statement_timeout TO '3000ms'; SET lock_timeout TO '2000ms'"

exchange:
  # 운영 시크릿 fail-fast + WS 오리진 fail-closed 가드를 켜는 이중 스위치. StartupSecretValidator
  # (마스터키·페퍼·세션시드 미주입 시 기동 중단)와 WebSocketConfig(데모·localhost WS 오리진 차단)가
  # 각각 이 키를 소비한다. server.tomcat.remoteip 블록과 별개 top-level 키로 병기한다.
  require-secrets: true
  engine:
    # 좀비 리더 자발적 강등 시간 임계(§5.4). dev와 동일 근거이며 운영에서도 같은 값을 쓴다. 누적
    # 수요 하한이 무주문 구간을 걸러내므로 주문이 뜸한 시간대를 위한 별도 임계가 필요 없다. 총
    # 페일오버 시간은 이 값 + 리스 TTL이며, kill·pause 페일오버(RTO<30s 게이트)와 다른 경로다.
    lease-standdown-after: 45s
    # 리스 하트비트 전용 풀(§5.4). 접속 좌표는 spring.datasource(SPRING_DATASOURCE_* 주입)를
    # 재사용한다. statement_timeout은 걸지 않는다. 기본 풀과 달리 단일 행 renew가 슬로 윈도에서
    # 취소돼 리더십을 잃는 것을 막기 위함이다.
    lease-datasource:
      hikari:
        maximum-pool-size: 2
        minimum-idle: 1
        connection-timeout: 2000
        pool-name: exchange-lease
        connection-init-sql: "SET TIME ZONE 'UTC'"

server:
  tomcat:
    remoteip:
      # 운영 신뢰 경계. LB VIP CIDR만 신뢰 프록시로 등록한다(EXCHANGE_TRUSTED_PROXIES 주입).
      # 미주입 시 루프백 전용으로 fail-closed: 외부 클라이언트가 보낸 XFF를 신뢰하지 않아 소켓피어
      # (LB VIP)로 강등되고, 회전 스푸핑으로 IP 버킷을 우회하지 못한다(레이트리밋은 과대적용될 뿐).
      internal-proxies: '${EXCHANGE_TRUSTED_PROXIES:127\.\d\d?\d?\.\d\d?\d?\.\d\d?\d?|0:0:0:0:0:0:0:1|::1}'

management:
  # actuator 전량을 내부 포트로 이전한다. 고객 평면 8080은 actuator를 전혀 서빙하지 않는다.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, admission

---
spring:
  config:
    activate:
      on-profile: bots
# 봇 노드도 /actuator/prometheus를 노출한다. 기본 노출은 health·info뿐이라 harness prometheus.yml의
# chaos-bots 스크레이프 타깃이 상시 404(up=0)였다. bots 노드는 내부 카오스 스택 전용이라 고객 평면과
# 달리 동일 포트 노출이 안전하다.
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, admission
# 데모용 봇 플릿. 12개 마켓(웹 SSG 로스터 동형). 주력 2종(BTC·ETH)은 MM 2, 나머지는 MM 1 + TAKER 1.
# 파라미터 근거는 SimProperties 주석. initial-price·quote-size·qty-step은 web 시드가와
# 마켓 tick/lot/최소주문(5000)에 맞춰 마켓별로 지정한다(markets 리스트 우선, top-level은 폴백).
exchange:
  # 데모 봇 플릿은 계정당 다봇 고빈도라 계약 주문 버킷(100토큰/10s÷weight5=20req/10s)에 429로 걸려
  # MM 백오프가 플릿을 정지시킨다. bots 프로파일에서만 capacity를 상향해 데모 활성을 유지한다.
  # 운영·통합테스트 프로파일은 기본 100(계약)으로, 레이트리밋 계약·회귀 테스트에 영향이 없다.
  order:
    rate-limit:
      capacity: 100000
  # 공개 조회 IP 버킷(§2-5 300토큰/10s)도 같은 사유로 상향한다. 데모는 봇 플릿과 웹이 한 JVM·한
  # 호스트를 공유해 전부 127.0.0.1 한 버킷에 계상되고, 봇의 시장 데이터 조회는 OPS 거버너 대상이
  # 아니라 target-ops를 낮춰도 줄지 않는다(주문·취소만 거버닝). 계약 기본값이면 봇이 예산을 상시
  # 고갈시켜 브라우저가 첫 화면부터 429다. 운영·통합테스트는 기본 300(계약)을 그대로 쓴다.
  #
  # 100000은 이 프로파일에서 IP 버킷을 사실상 해제한다는 뜻이다(실측 수요는 약 970토큰/10s).
  # 값을 수요 근처로 조이지 않는 이유: 데모 트래픽은 전부 자체 봇·자체 웹이라 신뢰 경계 안이고,
  # 여기서 잘못 조이면 시연 중 브라우저가 죽는데 그 손실이 방벽 이득보다 크다. 데모에서 노드
  # 생존을 지키는 것은 IP 버킷이 아니라 수용 제한(scope=query)이다.
  public:
    rate-limit:
      capacity: 100000
  sim:
    base-url: http://localhost:8080
    seed: 42
    target-ops: 60
    market: KRW-BTC
    initial-price: "84320000"
    funding:
      quote: "1000000000"
      base: "100"
    market-maker:
      count: 2
      spread-ticks: 10
      drift-ticks: 3
      quote-size: "0.01"
      # MM 호가 갱신 주기. 이 값이 상시면의 지배적 부하원이다.
      #
      # 1000 에서 3000 으로 올린 근거는 둘이고 둘 다 실측이다.
      #   1. CPU. t4g.small 은 버스터블이고 기저가 2 vCPU x 20% = 0.4 vCPU 다.
      #      1000 에서 Postgres 가 0.74~0.81 vCPU 를 써 기저의 약 2배였다. 이 소비면
      #      크레딧이 약 26시간에 고갈된다. 고갈 뒤 기저 0.4 vCPU 로 스로틀되는지는
      #      기획안이 미확인으로 둔다(13.5 한계 21). 크레딧 모드를 지정하는 설정은
      #      기획안에도 저장소에도 없다(.tf 0개, deploy/ 는 compose 4종). 종전 판 9.6 의
      #      cpu-credits standard 는 폐기본 서술이라 근거로 쓰지 않는다.
      #      스로틀 상태는 직접 재현했고(docker update --cpus 0.4)
      #      주문이 14.1/s 에서 4.85/s 로 떨어졌다. 붕괴는 아니지만 상시 스로틀은 관측
      #      대상이 아니라 상시 상태가 된다.
      #   2. 디스크. 주문 1건이 저널·원장·인덱스까지 약 3.93 KB 를 쓴다. 1000 에서
      #      연속 가동 환산 약 4.4 GB/일이고 노드 디스크는 20 GiB 다(기획안 9.2).
      #      OS·WAL 몫을 빼면 수명이 약 3일이라 발표까지 38일을 덮지 못한다.
      #
      # 변경 후 실측(재기동 뒤 90초 창, 5회 CPU 표본).
      #   주문        14.1/s  ->  4.92/s
      #   증가율   4.4 GB/일  ->  1.59 GB/일
      #   CPU    0.74~0.81    ->  0.385~0.405 vCPU (평균 약 0.396)
      #
      # 여유가 얇다. 기저 0.4 에 평균 0.396 이라 사실상 손익분기이고 표본 하나는 넘겼다.
      # 카오스 창·관리 질의·마켓 추가 중 무엇이든 얹히면 기저를 넘는다. 더 내리려면 5000 이
      # 다음 후보다. 이 값은 x86 로컬 컨테이너 측정이라 Graviton2 에서 그대로는 아니다.
      #
      # 디스크는 이 값으로도 닫히지 않는다. 1.59 GB/일이면 가용 14 GiB 수명이 약 9일이고
      # 발표까지 38일에 못 미친다. 보존 정책이 별도로 필요하다(DB 설계 3-2-a).
      #
      # 호가는 3초마다 갱신되지만 마켓당 MM 이 2대이고 봇별 반응 지터(r17, 봇_방향성 설계)가
      # 주기를 [0.6, 1.6] 배로 흩으므로 화면상 갱신 간격은 3초보다 짧다. 테이커·트렌드·
      # 노이즈는 이 값과 무관하게 주문한다.
      #
      # 이 값은 부하 상한이 아니라 기저다. 카오스 창의 부하 배수는 효과 프리셋이 λ·OPS 로
      # 따로 싣고 MM 주기를 건드리지 않는다(API 설계 6-A 효과 프리셋).
      requote-ms: 3000
    taker:
      count: 1
      lambda: 2.0
      qty-step: "0.001"
      max-steps: 5
      market-ratio: 0.2
    markets:
      # 상시면 활성 마켓은 3종이다. 스키마의 12종은 그대로 두고 봇이 매매하는 마켓만 줄인다.
      # 근거 셋. WebSocket 팬아웃과 메모리가 4분의 1로 내려가 pg-standby 동거가 성립하고,
      # C01 자산 보존 판정이 KRW 포함 4자산에 걸려 판별력을 유지하며, 되돌리기가 이 목록 한 곳이다.
      # KRW-MATIC 은 수집 시점 이후 KRW-POL 로 개명돼 seed-data 산출물과 어긋나 활성 목록에서 뺀다.
      - symbol: KRW-BTC
        initial-price: "84320000"
        mm-count: 2
        taker-count: 1
        quote-size: "0.01"
        qty-step: "0.001"
        base-funding: "100"
      - symbol: KRW-ETH
        initial-price: "4512000"
        mm-count: 2
        taker-count: 1
        quote-size: "0.05"
        qty-step: "0.01"
        base-funding: "5000"
      - symbol: KRW-XRP
        initial-price: "742"
        mm-count: 1
        taker-count: 1
        quote-size: "10"
        qty-step: "8"
        base-funding: "10000000"

---
# 카오스 매트릭스 E8 프로파일. 격리 chaos 스택의 서빙 노드만 dev,chaos-monkey로 활성화한다.
# 이 문서가 dev 문서 뒤에 와 exposure.include를 chaosmonkey 포함으로 재정의한다(last-active-wins).
# chaos-monkey 자동설정은 ChaosMonkeyCondition으로 이 프로파일에서만 로드되고, 어셀트는 chaos.monkey.enabled
# (기본 false, 스크립트가 /actuator/chaosmonkey/enable로 무장)와 watcher.beans 단일 대상으로 이중 게이트된다.
spring:
  config:
    activate:
      on-profile: chaos-monkey

management:
  endpoint:
    chaosmonkey:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, admission, chaosmonkey

chaos:
  monkey:
    # 기본 비무장. 로드는 프로파일로 되지만 어셀트 발사는 스크립트가 런타임에 enable한 뒤에만 일어난다.
    enabled: false
    watcher:
      # 광역 스테레오타입 워처는 전부 끈다. 오직 프로브 다운스트림 빈 하나만 위빙해 assault를
      # 게이트웨이 평면에 국한한다(주문·원장·엔진 write 경로 빈 미접촉).
      controller: false
      rest-controller: false
      service: false
      repository: false
      component: false
      rest-template: false
      web-client: false
      beans:
        - chaosProbeDownstream
    assaults:
      # level 1 = 매 호출 주입(결정적 트립). 실제 지연·예외 값은 스크립트가 /assaults로 지정한다.
      level: 1
      latency-active: false
      exceptions-active: false
      latency-range-start: 1000
      latency-range-end: 3000

resilience4j:
  circuitbreaker:
    instances:
      chaosProbe:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 500ms
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # health indicator를 끈다. CB open이 /actuator/health를 DOWN으로 만들어 컨테이너 헬스체크·
        # 레디니스에 개입하는 것을 막는다(readiness 그룹은 readinessState 한정이지만 이중 방어).
        register-health-indicator: false

---
# 관리 평면 로컬 동거 프로파일. 명시 활성(--spring.profiles.active=dev,bots,admin-local)이 전제다.
#
# 왜 dev 블록이 아니라 별도 프로파일인가. spring.profiles.default가 dev라 프로파일을 지정하지
# 않는 기동은 전부 dev 블록을 읽는다. 통합테스트가 그 경우다. dev에 관리 평면을 켜 두면
# 관리 평면이 없다고 전제한 테스트(AdminSplitPlaneIntegrationTest의 큐 경로 단언 등)가
# 의도치 않게 다른 배선을 보게 된다. 켜는 쪽이 명시하도록 문을 좁힌다.
#
# 왜 필요한가. SimAdminController의 start·stop·pause는 같은 JVM의 BotFleet 빈에만 닿는다
# (botFleet.getIfAvailable()). 플릿이 없는 JVM이면 applied:false로 정직하게 미반영을 보고하고
# 끝이라, 관리 평면을 별도 프로세스로 띄우면 정지 버튼이 실제 호가 공급을 못 멈춘다.
# bots와 같은 프로세스에 올려야 apply_path=local이 되어 즉시 반영된다.
#
# trusted-forwarding은 mTLS 종단을 게이트웨이가 하는 토폴로지용 스위치다(관리자 설계 §1-3).
# 로컬에는 그 게이트웨이가 없으므로 브라우저가 직접 X-Operator-Cn을 싣는다. 즉 이 기동에서
# 관리 신원은 검증된 것이 아니라 자가신고다. 8080에 닿을 수 있으면 관리 평면에 닿을 수 있다.
#
# 이 설정이 운영으로 새지 않는 근거는 세 겹이고, 마지막 겹만 프로파일과 무관하다.
#   1. 이 프로파일은 명시 활성이 아니면 로드되지 않는다. 운영은 SPRING_PROFILES_ACTIVE=prod다.
#   2. StartupSecretValidator가 운영 기동에서 trusted-forwarding=true를 발견하면 기동을
#      중단한다. 다만 RequireSecretsCondition이 dev가 낀 조합에서 꺼지므로 이 겹은 조건부다.
#   3. AdminConfig의 adminForwardingBindingGuard가 trusted-forwarding 기동의 바인딩 주소가
#      루프백인지 검사하고 아니면 중단한다. 프로파일 조합과 무관하게 발화한다(관리자 설계 1-3-a).
# 배포 토폴로지는 바뀌지 않는다. 클라우드는 여전히 8443·client-auth: need로 물리 분리한다.
spring:
  config:
    activate:
      on-profile: admin-local
# 이 프로파일은 루프백에만 뜬다. 위 3번 겹이 검사하는 값이 이것이다.
server:
  address: 127.0.0.1
exchange:
  admin:
    enabled: true
    mtls:
      trusted-forwarding: true
      forward-header: "X-Operator-Cn"
    # 관리 버킷 실효 한도는 capacity/weight(10)다. 계약값 60이면 60초에 6요청인데 콘솔 한 화면이
    # 폴링만으로 그 이상을 쓴다. 화면 확인용 기동이라 상향한다. 운영 기본값은 손대지 않는다.
    rate-limit:
      capacity: 6000
  # 용량 콘솔이 보는 노드 인벤토리(ADR 0015). 계약면이고 관측면이 아니다.
  # 여기 적힌 것은 "있을 수 있는 노드" 전부이고, 그중 몇 대가 떠 있어야 하는지는
  # capacity_plan 표가 정하며, 실제로 몇 대가 떠 있는지는 NodeProbe 가 잰다.
  #
  # 이 프로파일은 server.address 가 127.0.0.1 이라 호스트에서 돈다. 그래서 노드 주소가
  # 컨테이너 이름이 아니라 호스트 포트다. 클라우드에서는 이 목록을 Auto Scaling group
  # 조회로 갈아 끼우고 화면과 API 는 그대로 둔다.
  capacity:
    probe-timeout: 2s
    nodes:
      - id: app-1
        az: ap-northeast-2a
        instance-type: t4g.small
        base-url: http://localhost:8080
        # 매칭엔진 보유. 리더가 될 수 있는 유일한 노드다.
        engine: true
        # 확장 대상이 아니다. 단일 라이터라 늘려도 주문 천장이 오르지 않는다.
        scalable: false
      - id: app-2
        az: ap-northeast-2c
        instance-type: t4g.small
        base-url: http://localhost:8081
        engine: false
      - id: app-3
        az: ap-northeast-2c
        instance-type: t4g.small
        base-url: http://localhost:8082
        engine: false
